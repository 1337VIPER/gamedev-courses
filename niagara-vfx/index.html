  cards:[
    ["What's the difference between a Niagara System and an emitter?","The <b>System</b> is the effect you place in the level. Each <b>emitter</b> inside it is one layer with its own stack of modules."],
    ["Why do Gravity, Drag and Collision show red errors on a Minimal emitter?","They need <b>Solve Forces and Velocity</b> after them (Niagara: <i>&ldquo;unmet dependencies&rdquo;</i>). Minimal doesn't include it. Click <b>Fix issue</b> to add it."],
    ["How do you make an emitter fire once instead of looping?","Emitter State: <b>Life Cycle Mode → Self</b>, then <b>Loop Behavior → Once</b>, plus a <b>Spawn Burst Instantaneous</b>."],
    ["How do you make the dust arrive a beat after the hit?","Spawn Burst Instantaneous → <b>Spawn Time</b> (e.g. 0.03 s)."],
    ["Which two settings lay a sprite flat on the ground?","Sprite Facing and Alignment (Facing 0,0,1 + Alignment 1,0,0) <b>and</b> the Sprite Renderer's Facing Mode = Custom Facing Vector, Alignment = Custom Alignment."],
    ["Why must Scale Sprite Size by Speed sit below Solve Forces and Velocity?","It reads the particle's velocity, which is only final <b>after</b> the solver runs."],
    ["What makes a Niagara light's Radius setting work?","Untick <b>Use Inverse Squared Falloff</b> on the Light Renderer (the module's own tooltip says so), then Light Attributes: Radius → Apply."],
    ["Why Additive for flashes and sparks?","Additive adds light: black is invisible, overlaps get brighter, which is how hot, glowing things behave."],
    ["What does Depth Fade do?","Fades a translucent sprite out over the last N cm before it meets geometry, so there's no hard edge where it cuts the floor."],
    ["Name the four layering steps used here.","Huge & instant (flash), big & fast (ring), tiny & fast (sparks), big & slow (dust), plus debris in its own time slot."]

  cards:[
    ["How do you make a sprite that spawns once and never dies?","Spawn Burst Instantaneous with <b>Loop Count Limit 1</b>, emitter looping Infinite, and Particle State <b>Kill Particles When Lifetime Has Elapsed</b> off."],
    ["What does Local Space do?","Particles live in the actor's space, so they move and rotate with it. That's why the rift can stand upright as a wall portal."],
    ["Why must a GPU emitter use fixed bounds?","The CPU can't read GPU particle positions, so it can't size the bounds. UE 5.8 warns <i>&ldquo;Missing fixed bounds&rdquo;</i>; wrong bounds get the effect culled."],
    ["Which two forces make the swirl-and-drain?","<b>Vortex Force</b> (spin around the axis) + <b>Point Attraction Force</b> (pull to the centre, Kill Within Radius)."],
    ["Why add Drag when you already have forces?","It caps the speed so the motion stays slow and readable instead of whipping off."],
    ["What does VectorToRadialValue give you?","Radial Coordinates: <b>angle</b> around the centre (R) and <b>distance</b> (G), so you can draw arms and spirals."],
    ["How do the spiral arms turn?","Add Time × a speed inside the sine. The material moves, the particle doesn't."],
    ["Why a black disc with a thin rim instead of a big glowing circle?","The edge is the brightest thing with little glowing area: it reads as a hole in the world, not a lamp, and costs little overdraw."]
  ],

{
  id:"l4", num:4, short:"Dissolve tool + budgets",
  title:"Dissolve anything into embers, as a reusable tool",
  kick:"Lesson 4 · User Parameters, Blueprints, mesh sampling, Effect Types",
  time:"90–110 min",
  intro:`Any mesh burns away from a glowing edge while embers in a colour you choose stream off its surface. Drop three on a level, give each its own colour and speed in the Details panel, press Play. This is where an effect becomes a tool: the outside world sets its knobs (User Parameters), a Blueprint drives it, a material reacts per object, and an Effect Type keeps the engine from running too many.`,
  use:`<b>Used for:</b> enemy deaths, teleports, item pickups, despawning loot, "melt into shadow" abilities. Any gameplay event that needs the same effect on many different meshes.`,

      `Double-click <b>Emberfall</b>. Make six folders the same way: <code>Blueprints</code>, <code>FX</code>, <code>Maps</code>, <code>Materials</code>, <code>Meshes</code>, <code>Textures</code>. Inside <b>Materials</b> make <code>Functions</code>, <code>Master</code>, <code>Instances</code>. Inside <b>FX</b> make <code>EffectTypes</code>.`,
      `Go back to <b>Content</b> and make one more folder <u>next to</u> Emberfall (not inside it): <code>BakeSources</code>. Lesson 6 puts its source simulations here.`
    ], see:`Content › Emberfall with six sub-folders, and BakeSources beside it.`,
    why:`When you migrate the pack later, only <code>/Emberfall</code> is copied. Anything outside it (BakeSources) stays home, so buyers never get your scratch files.`,
    shots:[SH("l5-s01","The pack folder with its six sub-folders. BakeSources sits beside it, outside the pack.")]},

    {t:"Material function 1: a soft round dot (MF_Ember_SoftDot)", goal:"A function with one input (Density) and one output (Mask): a soft circle that fades to the sprite's edge.", do:[
      `Open <b>Materials › Functions</b>. Right-click empty space → <b>Material</b> → <b>Material Function</b> → name it <code>MF_Ember_SoftDot</code> → ${K("Enter")}, then double-click it.`,
      MN("Function Input","function input","on the left") + ` In <b>Details</b> set <b>Input Name</b> to <code>Density</code> and <b>Input Type</b> to <b>Function Input Scalar</b>.`,
      MN("RadialGradientExponential","radialgradientexponential","in the middle"),
      MW("Density (Function Input)","Output","RadialGradientExponential","Density"),
      `Click the <b>Output Result</b> node that is already in the graph. In <b>Details</b> set <b>Output Name</b> to <code>Mask</code>.`,
      MW("RadialGradientExponential","Result","Mask (Output)","Input") + ` Click <b>Save</b> (top-left).`
    ], see:`Three nodes in a row: Density → RadialGradientExponential → Mask.`,
    why:`RadialGradientExponential is an engine function: 1 in the middle of the sprite, fading to 0 at the edge. Density controls how hard the edge is (higher = smaller, sharper dot). Wrapping it in your own function means the master and any later material call the same thing.`,
    shots:[SH("l5-s02","MF_Ember_SoftDot: one input, one engine function, one output.")]},

    {t:"Material function 2: erosion (MF_Ember_Erode)", goal:"A function that eats a mask away as Erode goes from 0 to 1, with a soft edge (Opacity) and a thin edge band (Edge).", do:[
      `In <b>Functions</b> make another Material Function named <code>MF_Ember_Erode</code> and open it.`,
      `Add three <b>Function Input</b> nodes down the left (all <b>Function Input Scalar</b>), named <code>Mask</code>, <code>Erode</code> and <code>Softness</code>.`,
      MN("Subtract","subtract","to the right of the inputs") + ` ` + MW("Mask","Output","Subtract","A") + ` ` + MW("Erode","Output","Subtract","B"),
      MN("Divide","divide","to the right of Subtract") + ` ` + MW("Subtract","Result","Divide","A") + ` ` + MW("Softness","Output","Divide","B"),
      MN("Saturate","saturate","to the right of Divide") + ` ` + MW("Divide","Result","Saturate","Input") + ` Click the existing <b>Output Result</b> node, set its <b>Output Name</b> to <code>Opacity</code>, and wire Saturate into it.`,
      `Now the edge band, in a second row underneath: add <b>Abs</b> (wire Subtract's result into it) → <b>Divide</b> (B = Softness) → <b>Saturate</b> → <b>OneMinus</b>. Add a second <b>Function Output</b> (search <code>function output</code>), name it <code>Edge</code>, and wire OneMinus into it. Save.`
    ], see:`Two rows: the top ends in Opacity, the bottom in Edge. Numbered boxes in the picture match the node names.`,
    why:`<b>Opacity = saturate((Mask − Erode) ÷ Softness).</b> Where the mask is thinner than the Erode value, the pixel disappears; Softness blurs the cut. Thin wisps vanish first and the thick core last, which is exactly how real smoke thins out. Edge is 1 right on the cut line (useful for a burning rim).`,
    shots:[SH("l5-s03","MF_Ember_Erode: Opacity on the top row, Edge on the bottom row.")]},

    {t:"The master material, part 1: masks and switches (M_Ember_Particle)", goal:"A translucent, unlit master that can use either the soft dot or a flipbook, with optional erosion.", do:[
      `In <b>Materials › Master</b> right-click → <b>Material</b> → <code>M_Ember_Particle</code> → open it. Click empty graph space and in <b>Details</b> set <b>Blend Mode</b> = <b>Translucent</b>, <b>Shading Model</b> = <b>Unlit</b>. Scroll to <b>Usage</b> and tick <b>Used with Niagara Sprites</b>, <b>Used with Niagara Ribbons</b> and <b>Used with Niagara Mesh Particles</b>.`,
      `Hold ${K("S")} and click empty space to add a <b>Scalar Parameter</b>; name it <code>SoftDotDensity</code>, Default Value <code>2</code>. Drag <b>MF_Ember_SoftDot</b> from the Content Browser into the graph and wire SoftDotDensity → its <b>Density</b>.`,
      MN("TextureSampleParameterSubUV","subuv","above the soft dot") + ` Name it <code>Flipbook</code>. In Details tick <b>Blend</b> (it cross-fades between frames).`,
      `Right-click → search <code>static switch parameter</code> → add <b>StaticSwitchParameter</b>, name it <code>UseFlipbook</code>. Wire Flipbook's <b>A</b> into its <b>True</b>, MF_Ember_SoftDot's <b>Mask</b> into its <b>False</b>. This is the <b>shape</b> switch.`,
      `Add a second StaticSwitchParameter with the <u>same name</u> <code>UseFlipbook</code> (same name = same switch). Wire Flipbook's <b>RGB</b> into True. Hold ${K("3")} and click to add a <b>Constant3Vector</b>, set it to white (1,1,1), wire it into False. This is the <b>colour</b> switch.`,
      `Right-click → <code>dynamic parameter</code> → <b>Dynamic Parameter</b>. In Details open <b>Param Names</b> and rename index 0 to <code>Erode</code>, index 1 to <code>EdgeGlow</code>. Set its <b>Default Value</b> R to <code>0</code> (so Erode is 0 unless a particle says otherwise).`,
      `Add a Scalar Parameter <code>ErodeSoftness</code> (default <code>0.15</code>). Drag in <b>MF_Ember_Erode</b>. Wire the shape switch → <b>Mask</b>, Dynamic Parameter <b>Erode</b> → <b>Erode</b>, ErodeSoftness → <b>Softness</b>.`,
      `Add a third StaticSwitchParameter <code>UseErosion</code>: True = MF_Ember_Erode <b>Opacity</b>, False = the shape switch.`
    ], see:`The left half of the graph, as in the picture: soft dot and flipbook feeding UseFlipbook, then the erosion function and UseErosion.`,
    why:`<b>Static switches</b> are decided when the shader compiles, so an instance that turns a feature off pays nothing for it. That's why one master can serve sparks (no flipbook, no erosion) and smoke (both) without the sparks getting slower.`,
    shots:[SH("l5-s04a","Left half of M_Ember_Particle after Graph → Auto Layout. Numbers match the parameter names.")]},

    {t:"The master material, part 2: colour, depth fade and output", goal:"Particle colour × flipbook colour × Tint × EmissiveBoost into Emissive, and a soft opacity that fades where it meets walls and floors.", do:[
      `Add <b>Particle Color</b> (search <code>particle color</code>). ` + MN("Multiply","multiply","to the right of UseErosion") + ` Wire UseErosion → A and Particle Color <b>A</b> (alpha) → B. This is the opacity before depth fade.`,
      `Add a Scalar Parameter <code>DepthFadeDistance</code> (default <code>40</code>) and a <b>Depth Fade</b> node. Wire the Multiply → Depth Fade <b>Opacity</b>, DepthFadeDistance → <b>Fade Distance</b>.`,
      `Add StaticSwitchParameter <code>UseDepthFade</code>: True = Depth Fade's output, False = the Multiply. Wire UseDepthFade into the result node's <b>Opacity</b>.`,
      `Colour chain: Multiply (Particle Color <b>RGB</b> × the colour switch) → Multiply (× a <b>Vector Parameter</b> named <code>Tint</code>, default white; hold ${K("V")} and click) → Multiply (× Scalar Parameter <code>EmissiveBoost</code>, default <code>1</code>) → Multiply (× UseDepthFade) → <b>Emissive Color</b>.`,
      `Click <b>Apply</b>, then <b>Save</b>. Tidy with right-click empty graph → <b>Auto Layout</b> if you like.`
    ], see:`Emissive Color and Opacity both wired, no errors in the Stats panel.`,
    why:`The last Multiply puts the opacity into the colour too. For <b>Additive</b> instances (which ignore Opacity) that's what makes them fade; for translucent ones it keeps edges clean. <b>Depth Fade</b> removes the hard line where a big sprite cuts into the floor.`,
    shots:[SH("l5-s04b","Right half: Tint, EmissiveBoost, Depth Fade and the result node.")]},

    {t:"Instances: one master, nine looks", goal:"Material instances for glow, sparks, dust, floor glow, smoke and fire, each with its own switches and numbers.", do:[
      `Right-click <b>M_Ember_Particle</b> → <b>Create Material Instance</b>. Rename it <code>MI_Ember_Glow</code> and drag it into <b>Materials › Instances</b>.`,
      `Open it. Tick a parameter's checkbox to override it, then type the value. For MI_Ember_Glow: SoftDotDensity <code>2.3</code>, UseFlipbook off, UseErosion off, UseDepthFade off. Under <b>Material Property Overrides</b> tick <b>Blend Mode</b> and choose <b>Additive</b>.`,
      `Make the rest the same way (values from the table). Smoke and Fire get their flipbook textures in Lesson 6; leave Flipbook empty for now.` + TABLE(["Instance","Blend","Switches on","Numbers"],[
        ["MI_Ember_Glow","Additive","–","SoftDotDensity 2.3"],
        ["MI_Ember_Spark","Additive","–","SoftDotDensity 4.5, EmissiveBoost 3"],
        ["MI_Ember_Dust","(Translucent)","UseDepthFade","SoftDotDensity 1.4, DepthFadeDistance 60"],
        ["MI_Ember_FloorGlow","(Translucent)","UseDepthFade","SoftDotDensity 1.6"],
        ["MI_Ember_Smoke","(Translucent)","UseFlipbook, UseErosion, UseDepthFade","ErodeSoftness 0.25, DepthFadeDistance 60"],
        ["MI_Ember_Fire","Additive","UseFlipbook, UseDepthFade","EmissiveBoost 1.4, Tint (1, 0.6, 0.35)"]])
    ], see:`Six instances in Materials › Instances. Changing a number in one updates its preview instantly, without a shader compile.`,
    pro:`The pack also has special-purpose masters for rings, ribbons, the rift core, the dissolve and props (M_Ember_Ring, M_Ember_Trail, M_Ember_RiftCore, M_Ember_Dissolve, M_Ember_Prop). They're the Module 1 maths materials, renamed and moved into the pack.`,
    shots:[SH("l5-s05","MI_Ember_Smoke: the switches and numbers that turn the master into flipbook smoke.")]}
  ],
  check:`<b>You should have:</b> /Content/Emberfall with its sub-folders, two material functions, the master M_Ember_Particle (Translucent, Unlit, three Niagara usage boxes ticked, three static switches) and six instances. Nothing in the pack folder that a buyer wouldn't need.`,
  cards:[
    ["What does Fab want the top of your Content folder to look like?","One folder named after the product (here <code>Emberfall</code>) holding everything, and no empty or unused folders or assets."],
    ["Name the prefixes for a Niagara system, a material instance, a material function and a texture.","<code>NS_</code> (community convention; Epic's naming page uses <code>FXS_</code>), <code>MI_</code>, <code>MF_</code>, <code>T_</code>. Whichever you choose, be consistent."],
    ["Why use static switches in the master instead of separate materials?","Each instance compiles only the branches it switches on, so a cheap spark doesn't pay for flipbook or erosion code, and one master stays the single place to fix things."],
    ["What does the Dynamic Parameter node do?","Reads up to four per-particle numbers that Niagara writes with the <b>Dynamic Material Parameters</b> module, e.g. Erode."],
    ["Write the erosion formula.","Opacity = saturate((Mask − Erode) ÷ Softness)."],
    ["Why set the Dynamic Parameter's default Erode to 0?","Without the Niagara module the default is used. A default of 1 would erode every sprite to nothing."],
    ["Why multiply opacity into the emissive colour?","Additive materials ignore Opacity, so the fade has to be in the colour."],
    ["Where do bake sources and test maps go?","In a folder beside the pack (e.g. BakeSources), never inside it."]
  ],
  boss:{
    title:"Boss fight: a master from memory",
    brief:`Memory mode on, timer running. In a fresh folder, rebuild MF_Ember_Erode and a cut-down master with UseFlipbook and UseErosion, then make two instances: a soft additive glow and an eroding flipbook.`,
    goal:25,
    items:[["Both material functions rebuilt and saved",""],["Master is Translucent + Unlit with the Niagara usage boxes ticked",""],["Two static switches and the Dynamic Parameter wired correctly",""],["Two instances that look different without recompiling","Change a number: no shader compile bar."]],
    stretch:[["Burning rim","Use MF_Ember_Erode's Edge output × EdgeGlow (Dynamic Parameter index 1) to add a hot rim where smoke erodes."],["Soft particles on ribbons","Check the master works on a ribbon too (Used with Niagara Ribbons)."]]
  }
},

/* ---------------------------------------------------------------- L6 */
{
  id:"l6", num:6, mod:2, short:"Bake flipbooks",
  title:"Bake your own smoke and fire flipbooks with the Niagara Baker",
  kick:"Lesson 6 · Source simulations, Niagara Baker, 8×8 atlases",
  time:"60–80 min",
  intro:`Hero smoke and fire in games are usually <b>flipbooks</b>: a grid of 64 frames of a real simulation, played back on a few sprites. You'll make yours inside Unreal: a heavy source effect with hundreds of particles, rendered frame by frame by the <b>Niagara Baker</b> into one 2048 × 2048 texture. Your effects then show 64 baked frames of rich motion while drawing just a handful of sprites.`,
  use:`<b>Used for:</b> smoke, fire, explosions, magic puffs, dust clouds: anything too expensive to simulate live, but that should look rich.`,
  learn:["Bake sources","Fake lighting in colour","Niagara Baker","Scene Capture binding","Orthographic framing","8×8 atlas","Texture settings"],
  concepts:[
    {h:"Expensive once, cheap forever", p:"The source effect can use 260 particles and slow forces; it only runs while baking. The game effect shows the result with 3–16 sprites. That trade is the whole point of flipbooks."},
    {h:"Bake the light in", p:"Unlit smoke looks flat. The smoke source colours particles brighter the higher (and further right) they sit, so the bake has a lit top and a shadowed underside. That shading survives into the texture for free."},
    {h:"Alpha comes from opacity", p:"Source Binding <b>SceneColor (HDR) in RGB, Inv Opacity in A</b> records colour in RGB and how solid each pixel is in alpha. That alpha is exactly the Mask your master material erodes."},
    {h:"Frames × size = texture", p:"8 × 8 frames of 256 × 256 px = a 2048 × 2048 atlas. 64 frames is smooth at the 2–3 s lifetimes used here; the SubUV Animation module plays them across each particle's life."}
  ],
  graphs:[],
  steps:[
    {t:"Build the smoke source simulation (NS_Bake_Smoke)", goal:"A one-shot puff of 260 particles that billows out and rises over about 2.3 s, in the BakeSources folder.", do:[
      NEWSYS("BakeSources","NS_Bake_Smoke","Puffs") + ` ` + ES("Once"),
      AM("Spawn Burst Instantaneous","Emitter Update","spawn burst") + ` ` + SV("Spawn Burst Instantaneous","Spawn Count","260"),
      AM("Shape Location","Particle Spawn","shape location") + ` ` + SD("Shape Location","Shape Primitive","Box / Plane","Sphere") + ` ` + SV("Shape Location","Sphere Radius","35"),
      `In <b>Initialize Particle</b>: Lifetime Mode <b>Random</b>, Lifetime Min <code>2.1</code>, Max <code>2.4</code>; Sprite Size Mode <b>Random Uniform</b>, Min <code>15</code>, Max <code>32</code>; Sprite Rotation Mode <b>Random</b>.`,
      AM("Add Velocity","Particle Spawn","add velocity") + ` ` + EXPR("Add Velocity","Velocity","normalize(Particles.Position + float3(0.001,0.002,0.003)) * (50.0 + 2.8 * length(Particles.Position)) + float3(0, 0, 40)"),
      `Particle Update: add <b>Curl Noise Force</b> (Noise Strength <code>90</code>), <b>Acceleration Force</b> (0, 0, <code>45</code>), <b>Drag</b> (<code>1.4</code>). ${SOLVE}`,
      AM("Color","Particle Update","color") + ` ` + EXPR("Color","Color","float4(float3(1,1,1) * (0.30 + 0.70 * saturate(0.45 + Particles.Position.z / 170.0 + Particles.Position.y / 380.0)), 0.5)"),
      AM("Scale Sprite Size","Particle Update","scale sprite size") + ` Its <b>Uniform Curve Sprite Scale</b> is already a curve: set keys (time, value) (0, 1), (0.35, 1.8), (1, 2.3).`,
      AM("Scale Color","Particle Update","scale color") + ` ` + CURVE("Scale Color","Scale Alpha","(0, 0), (0.08, 1), (0.55, 0.75), (1, 0)")
    ], see:`In the preview, a white puff that bursts out, swells and fades in about 2.3 s, brighter on top.`,
    why:`The Velocity expression pushes each particle straight out from the centre, faster the further out it starts, so the puff grows from inside like a real billow. The Color expression is the "baked light": brighter with height.`,
    shots:[SH("l6-s01","The smoke source stack. Add Velocity is selected; its expression is in the Details panel.")]},

    {t:"Give the source a plain soft material", goal:"A translucent unlit material just for baking: soft dot shape × particle colour, alpha from particle alpha.", do:[
      `In <b>BakeSources</b> make a Material <code>M_Bake_Source</code>: Blend Mode <b>Translucent</b>, Shading Model <b>Unlit</b>, tick <b>Used with Niagara Sprites</b>.`,
      `Drag in <b>MF_Ember_SoftDot</b> (Density: a Constant <code>1.6</code>). Particle Color <b>RGB</b> → <b>Emissive Color</b>. Particle Color <b>A</b> × SoftDot <b>Mask</b> → <b>Opacity</b>. Save.`,
      `Back in NS_Bake_Smoke click <b>Sprite Renderer</b> and set <b>Material</b> to <code>M_Bake_Source</code>.`
    ], see:`The puff looks like soft cotton wool in the preview, no square sprite edges.`,
    why:`This material lives in BakeSources, not in the pack: buyers get the baked texture, not the tool you made it with.`,
    shots:[SH("l6-s02","Sprite Renderer selected: M_Bake_Source on the bake source.")]},

    {t:"Open the Niagara Baker", goal:"The Baker tab open next to System Overview, showing Live Sim and Baked Sim previews.", do:[
      `In the Niagara editor's toolbar click <b>Baker</b>. A <b>Baker</b> tab opens beside <b>System Overview</b>.`,
      `The left preview is <b>Live Sim</b> (your effect now); the right one, <b>Baked Sim</b>, stays a checkerboard until you bake. Below them is the Baker's <b>Settings</b> panel and a small timeline.`
    ], see:`Two square previews and a Settings panel underneath.`,
    shots:[SH("l6-s03","The Baker button and tab. Live Sim on the left, Baked Sim on the right.")]},

    {t:"Record colour and opacity: Source Binding", goal:"The Baker captures colour into RGB and solidity into alpha.", do:[
      `In the Baker's <b>Settings</b> click the <b>Source Binding</b> dropdown (it says <i>None</i>).`,
      `Click the small arrow beside <b>Scene Capture Source</b> to open that group, then pick <b>SceneColor (HDR) in RGB, Inv Opacity in A</b>.`
    ], see:`Source Binding reads <i>SceneCaptureSource - SceneColor (HDR) in RGB, Inv Opacity in A</i>.`,
    why:`The other groups record a single particle attribute or a G-buffer channel (normals, depth): useful for other jobs, like baking normal maps for lit smoke.`,
    shots:[SH("l6-s04","Source Binding → Scene Capture Source → SceneColor (HDR) in RGB, Inv Opacity in A.")]},

    {t:"Frame the camera: Front view and Orthographic Width", goal:"A straight side-on orthographic view where the whole puff fills the frame without touching the edges.", do:[
      `Above the Live Sim preview click the view dropdown (it says <i>Perspective</i>) → <b>Front</b>.`,
      `Click the <b>eye</b> icon next to it. The panel that drops down holds the camera: <b>Location</b>, <b>Rotation</b> and <b>Orthographic Width</b>.`,
      `Scrub the Baker timeline to the frame where the effect is biggest. Lower <b>Orthographic Width</b> until the effect almost touches the frame, then raise it a little. Move <b>Location Z</b> so the effect sits centred. (The fire in the picture uses width <code>140</code>, Z <code>46</code>.)`
    ], see:`At the biggest frame the effect fills about 90% of the Live Sim square, with dark margin all round.`,
    pro:`Any part of the effect that leaves the frame gets cut off with a hard straight edge in the flipbook. Check the biggest frame, not the first one.`,
    shots:[SH("l6-s05","Front view; the eye menu holds the camera settings.")]},

    {t:"Size, atlas and time range", goal:"64 frames of 256 px in a 2048 atlas, covering exactly the life of the puff.", do:[
      `In <b>Settings</b>: <b>Frame Size</b> <code>256</code> × <code>256</code>; tick <b>Atlas Texture Size</b> and set <code>2048</code> × <code>2048</code>.`,
      `In the Baker timeline row: <b>Time Range</b> <code>0.0</code> to <code>2.3</code> (smoke). <b>Frames Per Dimension</b> <code>8</code> × <code>8</code>.`
    ], see:`The counter beside Playback Rate reads <i>… / 64 f</i>.`,
    why:`The Baker's defaults are 8 × 8 frames in a 1024 atlas; 2048 gives each frame 256 px, enough for close-up fire. The time range should start when the effect appears and end just as it has faded. Baking empty frames wastes texture space; ending too early makes the puff pop off.`,
    shots:[SH("l6-s06","Frame Size 256, Atlas 2048, Frames Per Dimension 8 × 8. This picture is the fire bake, which uses Time Range 2.0–4.0.")]},

    {t:"Bake, then check the Baked Sim", goal:"A baked texture asset next to the system, and Baked Sim playing it back.", do:[
      `Click <b>Bake</b> (the first button in the Baker's toolbar). It takes a few seconds.`,
      `Watch the <b>Baked Sim</b> preview: it now plays your flipbook. Compare it with Live Sim: same motion, same shape.`,
      `A texture named like <code>NS_Bake_Smoke_BakedAtlas_Texture2D_0</code> appears in BakeSources.`
    ], see:`Baked Sim shows the puff animating, on a black background.`,
    shots:[SH("l6-s07a","After Bake: Baked Sim plays the 64 frames back.")]},

    {t:"Move it into the pack and name it", goal:"T_Ember_Smoke_8x8 in Emberfall › Textures, set up as an effects texture.", do:[
      `Drag the baked texture from BakeSources onto <b>Emberfall › Textures</b> → <b>Move Here</b>. Rename it <code>T_Ember_Smoke_8x8</code>.`,
      `Double-click it. In Details check <b>sRGB</b> is ticked and <b>Compression Settings</b> is <i>Default (DXT1/5, BC1/3 on DX11)</i>. Set <b>Texture Group</b> to <b>Effects</b>. Save.`,
      `Open <b>MI_Ember_Smoke</b> and set <b>Flipbook</b> to T_Ember_Smoke_8x8.`
    ], see:`The texture editor shows the 8 × 8 grid: puffs growing and thinning frame by frame, 2048 × 2048, DXT5.`,
    why:`The <code>_8x8</code> suffix tells you (and buyers) the grid size you must type into the SubUV settings. DXT5 keeps the alpha channel.`,
    shots:[SH("l6-s08","The baked smoke atlas in the texture editor: 2048², DXT5, sRGB.")]},

    {t:"Repeat for fire (NS_Bake_Fire → T_Ember_Fire_8x8)", goal:"A looping flame source baked into a second atlas.", do:[
      NEWSYS("BakeSources","NS_Bake_Fire","Flames") + ` Build it like the smoke source, but <b>Loop Behavior Infinite</b>, <b>Spawn Rate</b> <code>420</code>, Sphere Radius <code>12</code>, Lifetime 0.6–1.1, Sprite Size 9–20, Curl Noise <code>220</code>, Acceleration (0, 0, <code>420</code>), Drag <code>2.2</code>, Scale Sprite Size curve 1 → 0.9 (35%) → 0.25.`,
      EXPR("Color","Color","float4(lerp(lerp(float3(4.0,2.4,0.9), float3(2.2,0.7,0.12), saturate(Particles.NormalizedAge*2.5)), float3(0.5,0.08,0.02), saturate(Particles.NormalizedAge*2.0-0.8)), saturate(Particles.NormalizedAge*12.0)*(1.0-Particles.NormalizedAge))"),
      `Baker: same Source Binding, Front view, Orthographic Width <code>140</code>, Location Z <code>46</code>, Frame Size 256, Atlas 2048, <b>Time Range 2.0 to 4.0</b>, 8 × 8. Bake.`,
      `Move and rename the result to <code>T_Ember_Fire_8x8</code> in Textures and plug it into <b>MI_Ember_Fire</b>.`
    ], see:`Baked Sim shows a flickering flame; the atlas has 64 different flame shapes.`,
    why:`Fire is baked from 2 s in, once the loop is already running; baking from 0 would show it starting up. The colour goes white-yellow → orange → dark red as each tongue ages, and fades in fast and out slowly.`,
    shots:[SH("l6-s07","The fire bake: Baked Sim plays back after clicking Bake.")]}
  ],
  check:`<b>You should have:</b> NS_Bake_Smoke and NS_Bake_Fire in BakeSources (not in the pack), and T_Ember_Smoke_8x8 and T_Ember_Fire_8x8 (2048², 8 × 8, Effects group) in Emberfall › Textures, used by MI_Ember_Smoke and MI_Ember_Fire.`,
  cards:[
    ["Why bake a flipbook instead of simulating smoke live?","The source can use hundreds of particles and slow forces once; the game shows 64 baked frames on a handful of sprites."],
    ["Which Source Binding gives colour plus usable alpha?","Scene Capture Source → <b>SceneColor (HDR) in RGB, Inv Opacity in A</b>."],
    ["Frame Size 256 and 8 × 8 frames: what atlas size?","2048 × 2048 (8 × 256)."],
    ["How do you stop the effect being clipped by the frame edge?","Front view, check the <b>biggest</b> frame, then set Orthographic Width (eye menu) with a margin."],
    ["Why bake fire from 2.0 s instead of 0?","So the loop is already running; frame 1 shouldn't be the fire starting up."],

/* ---------------------------------------------------------------- L7 */
{
  id:"l7", num:7, mod:2, short:"Flipbook effects",
  title:"Fire, smoke and an explosion built on your flipbooks",
  kick:"Lesson 7 · SubUV Animation, User parameters, erosion over life, the full pack",
  time:"90–120 min",
  intro:`Now the textures earn their keep. A fire loop for torches and braziers, a tall smoke column bent by wind, and a one-shot explosion that stacks seven layers. You'll drive the flipbooks with <b>SubUV Animation</b>, expose <b>Tint</b> and <b>Scale</b> so buyers can restyle each effect without opening it, and make smoke <b>erode</b> away as it ages instead of just fading.`,
  use:`<b>Used for:</b> environment fire and smoke, destruction, spell impacts. These are the three effects buyers look for first in a fire pack.`,
  learn:["SubUV Animation","Sub UV on the renderer","User.Tint and User.Scale","Flicker with sine","Wind as a User vector","Erode over life","Layered explosion"],
  concepts:[
    {h:"Two places must agree", p:"The <b>SubUV Animation</b> module picks which frame each particle shows. The <b>Sprite Renderer</b>'s <b>Sub UV</b> section tells the GPU how the texture is split. Both say 8 × 8, or the frames come out wrong."},
    {h:"Few, big, slow", p:"Flipbook fire works with <b>16–24 big sprites</b>, not hundreds of small ones: each sprite already contains a whole flame. A small glow sprite with a flickering light sells the heat."},
    {h:"Expose what buyers change", p:"<code>User.Tint</code> and <code>User.Scale</code> appear in the Details panel of every placed effect. Multiply sizes, radii and speeds by Scale, and colours by Tint, so one asset becomes many."},
    {h:"Erode, don't just fade", p:"Fading alpha makes smoke go see-through evenly. Raising <b>Erode</b> over life eats the thin parts first and leaves the dense core, which looks like real smoke dispersing."}
  ],
  graphs:[
    {kind:"stack", title:"NS_Ember_FireLoop: four emitters", hint:"a torch / brazier fire", emitters:[
      {id:"fl", name:"Flames", tag:"CPU · local space · 24 / s", sections:[
        {s:"Emitter Update", mods:[{id:"es",n:"Emitter State",v:[["Life Cycle","Self"],["Loop","Infinite"]]},{id:"sr",n:"Spawn Rate",v:[["SpawnRate","24"]]}]},
        {s:"Particle Spawn", mods:[{id:"ip",n:"Initialize Particle",v:[["Lifetime","0.8–1.1"],["Color","User.Tint"],["Size","110–160 × Scale"],["Position Offset","0, 0, 55"]]},{id:"sl",n:"Shape Location",v:[["Sphere Radius","20 × Scale"]]},{id:"av",n:"Add Velocity",v:[["Velocity","(0,0,45) × Scale"]]}]},
        {s:"Particle Update", mods:[{id:"so",n:"Solve Forces and Velocity"},{id:"sub",n:"SubUV Animation",v:[["Mode","Linear"],["Setup","Manual 8 × 8"]]},{id:"sc",n:"Scale Color",v:[["Scale Alpha","0 → 1 → 1 → 0"]]}]},
        {s:"Render", mods:[{id:"rn",n:"Sprite Renderer",v:[["Material","MI_Ember_Fire"],["Sub Image Size","8 × 8"],["Sub UV Blending","on"]]}]}]},
      {id:"gl", name:"Glow", tag:"1 immortal sprite + light", sections:[
        {s:"Emitter Update", mods:[{id:"sb",n:"Spawn Burst Instantaneous",v:[["Count","1"],["Loop Count Limit","on"]]}]},
        {s:"Particle Spawn", mods:[{id:"ip",n:"Initialize Particle",v:[["Size","170 × Scale"]]},{id:"la",n:"Light Attributes",v:[["Light Radius","650 × Scale"]]}]},
        {s:"Particle Update", mods:[{id:"ps",n:"Particle State",v:[["Kill when lifetime elapsed","off"]]},{id:"co",n:"Color",v:[["Color","Tint × flicker (sin)"]]}]},
        {s:"Render", mods:[{id:"rn",n:"Sprite + Light Renderer",v:[["Material","MI_Ember_Glow"]]}]}]},
      {id:"em", name:"Embers", tag:"tiny, fast, rising", sections:[
        {s:"Particle Update", mods:[{id:"cn",n:"Curl Noise Force",v:[["Strength","120"]]},{id:"ac",n:"Acceleration Force",v:[["Z","110"]]},{id:"dr",n:"Drag",v:[["Drag","1"]]}]}]},
      {id:"sm", name:"Smoke", tag:"3 / s · flipbook + erosion", sections:[
        {s:"Particle Spawn", mods:[{id:"ip",n:"Initialize Particle",v:[["Lifetime","2.5–3.5"],["Size","50–80"],["Position Offset","0, 0, 110"]]}]},
        {s:"Particle Update", mods:[{id:"co",n:"Color",v:[["Color","orange → grey"]]},{id:"sz",n:"Scale Sprite Size",v:[["Curve","1 → 2.2"]]},{id:"sub",n:"SubUV Animation"},{id:"dmp",n:"Dynamic Material Parameters",v:[["Erode","curve 0 → 0.85"]]}]},
        {s:"Render", mods:[{id:"rn",n:"Sprite Renderer",v:[["Material","MI_Ember_Smoke"]]}]}]}

  steps:[
    {t:"Create NS_Ember_FireLoop and its User parameters", goal:"An empty system in Emberfall › FX with User.Tint (white) and User.Scale (1), set to the Loop effect type with a 1 s warmup.", do:[
      NEWSYS("Emberfall › FX","NS_Ember_FireLoop","Flames") + ` ` + ES("Infinite"),
      UP("Tint","Linear Color","1, 1, 1, 1") + ` ` + UP("Scale","Float","1.0"),
      `Click the system's <b>Properties</b> row (top-left box in System Overview). In Details set <b>Warmup Time</b> to <code>1</code> so the fire is already burning when the level starts. (Effect Types come in Lesson 8.)`,
      AE("Glow") + ` Add <code>Embers</code> and <code>Smoke</code> the same way, and set each one's Emitter State to Self / Infinite.`
    ], see:`Four emitter boxes in System Overview and two User parameters in the bottom-left tab.`,
    shots:[SH("l7-s01","NS_Ember_FireLoop: Flames, Glow and Embers (Smoke is off to the right). Each column is the stack diagram above."), SH("l7-s04","User Parameters: Tint and Scale.")]},

    {t:"Flames: big flipbook sprites", goal:"About 20 tall flame sprites rising slowly from a point, each playing all 64 frames over its life.", hl:{g:0,n:["fl.es","fl.sr","fl.ip","fl.sl","fl.av","fl.so","fl.sub","fl.sc"]}, do:[
      `Click <b>Properties</b> in the Flames box and tick <b>Local Space</b> (the fire moves with whatever it's attached to).`,
      AM("Spawn Rate","Emitter Update","spawn rate") + ` ` + SV("Spawn Rate","SpawnRate","24"),
      AM("Shape Location","Particle Spawn","shape location") + ` Shape Primitive <b>Sphere</b>. ` + EXPR("Shape Location","Sphere Radius","20.0 * User.Scale"),
      `<b>Initialize Particle:</b> Lifetime Mode Random, 0.8 to 1.1. ` + LINK("Initialize Particle","Color","Tint") + ` Sprite Size Mode <b>Random Uniform</b>; make <b>Uniform Sprite Size Min</b> and <b>Max</b> expressions (▾ → New Expression): <code>110.0 * User.Scale</code> and <code>160.0 * User.Scale</code>. Tick <b>Use Position Offset</b> and type (0, 0, <code>55</code>).`,
      AM("Add Velocity","Particle Spawn","add velocity") + ` ` + EXPR("Add Velocity","Velocity","float3(0, 0, 45) * User.Scale") + ` ${SOLVE}`,
      AM("SubUV Animation","Particle Update","subuv animation") + ` ` + `Leave <b>SubUV Animation Mode</b> on <b>Linear</b>. ` + SD("SubUV Animation","Define SubUV Setup Manually","Automatic (From Renderer SubImage Size)","Manual") + ` Then set <b>Manual SubImage Size</b> to <code>8</code>, <code>8</code> and tick <b>Is SubUV Blending Enabled On Renderer</b>.`,
      AM("Scale Color","Particle Update","scale color") + ` ` + CURVE("Scale Color","Scale Alpha","(0, 0), (0.12, 1), (0.7, 1), (1, 0)")
    ], see:`Grey-white squares at first (no material yet), playing frames as they rise.`,
    why:`Linear mode maps each particle's normalized age to frames 0–63, so every flame plays the whole bake once over its life. <b>Manual</b> setup means the module doesn't need to read the renderer, so its warning goes away.`,
    shots:[SH("l7-s02","SubUV Animation in Flames: Manual, 8 × 8, blending on.")]},

    {t:"Flames renderer: MI_Ember_Fire and Sub UV", goal:"The flipbook shows correctly, cross-fading between frames.", do:[
      `Click <b>Sprite Renderer</b> in Flames. Set <b>Material</b> to <code>MI_Ember_Fire</code>.`,
      `Scroll Details to <b>Sub UV</b>: set <b>Sub Image Size</b> to <code>8</code>, <code>8</code> and tick <b>Sub UV Blending Enabled</b>.`
    ], see:`Real flame shapes licking upward in the preview.`,
    shots:[SH("l7-s03","Sprite Renderer → Material = MI_Ember_Fire, Sub UV 8 × 8 with blending.")]},

    {t:"Glow, Embers and Smoke", goal:"A flickering glow that lights the floor, sparks drifting up, and a few puffs of flipbook smoke on top.", hl:{g:0,n:["gl.sb","gl.ip","gl.la","gl.ps","gl.co","gl.rn","em.cn","em.ac","em.dr","sm.ip","sm.co","sm.sz","sm.sub","sm.rn"]}, do:[
      `<b>Glow:</b> ` + AM("Spawn Burst Instantaneous","Emitter Update","spawn burst") + ` Count <code>1</code>, tick <b>Use Loop Count Limit</b>. In <b>Particle State</b> untick <b>Kill Particles When Lifetime Has Elapsed</b> (the sprite lives forever). Initialize Particle: Uniform size <code>170.0 * User.Scale</code>, Position Offset (0, 0, 45).`,
      `<b>Glow colour flicker:</b> ` + AM("Color","Particle Update","color") + ` ` + EXPR("Color","Color","User.Tint * float4(2.2, 0.75, 0.18, 0.22) * (0.82 + 0.18 * sin(Engine.Time * 23.0) * sin(Engine.Time * 7.3))"),
      `<b>Glow light:</b> add <b>Light Attributes</b> (Particle Spawn), Radius → <b>Apply</b>, Light Radius <code>650.0 * User.Scale</code>. Add a <b>Light Renderer</b> (the <b>+</b> on the Render group) and untick <b>Use Inverse Squared Falloff</b>. Sprite material: <code>MI_Ember_Glow</code>.`,
      `<b>Embers:</b> Spawn Rate <code>14</code>, Sphere Radius <code>18</code>, Lifetime 1–2, size 1.8–3.6, Color <code>User.Tint * float4(7.0, 2.4, 0.6, 1.0)</code>, Position Offset (0,0,40). Update: Curl Noise <code>120</code>, Acceleration (0, 0, 110), Drag <code>1</code>, Solve, Scale Color fade. Material <code>MI_Ember_Spark</code>.`,
      `<b>Smoke:</b> Spawn Rate <code>3</code>, Lifetime 2.5–3.5, size 50–80, Random rotation, Position Offset (0,0,110), Add Velocity (0,0,70) × Scale. Update: Color = <code>float4(lerp(float3(0.85, 0.40, 0.16), float3(0.15, 0.14, 0.14), saturate(Particles.NormalizedAge * 3.0)) * User.Tint.rgb, 1.0)</code>, Curl Noise <code>25</code>, Scale Sprite Size 1 → 2.2, SubUV Animation (as Flames), Scale Color alpha 0 → 0.35 (0.3) → 0. Renderer: <code>MI_Ember_Smoke</code>, Sub UV 8 × 8.`
    ], see:`In a level: flames, a warm pool of flickering light on the floor, embers drifting up, a little smoke above.`,
    why:`Two sines multiplied at different speeds (23 and 7.3) never line up, so the flicker never visibly repeats. The light is on <b>one immortal</b> sprite: one light instead of twenty is a big saving.`,
    shots:[SH("l7-s05","NS_Ember_FireLoop on its pedestal in the showcase map: flames, floor light, embers.")]},

    {t:"NS_Ember_SmokeColumn with a wind User parameter", goal:"A tall, slow smoke column that leans with User.Wind.", do:[

      `In the Smoke emitter: Spawn Rate <code>7</code>; Sphere Radius <code>35 × Scale</code>; Lifetime 6.5–8.5; size 110–170 × Scale, Random rotation; Add Velocity <code>float3(0, 0, 230) * User.Scale</code>.`,
      AM("Acceleration Force","Particle Update","acceleration force") + ` ` + LINK("Acceleration Force","Acceleration","Wind") + ` Add Curl Noise (<code>30</code>) and Drag (<code>0.12</code>), then fix the Solve error.`,
      `Same Color expression as the fire's smoke, Scale Sprite Size 1 → 3.4, SubUV Animation, Scale Color alpha 0 → 0.6 (0.15) → 0.45 (0.6) → 0, material MI_Ember_Smoke with Sub UV 8 × 8.`,
      `Click the emitter's <b>Properties</b> and set <b>Calculate Bounds Mode</b> to <b>Fixed</b>, Fixed Bounds Min (−500, −500, −100), Max (1400, 500, 2200).`

    {t:"Erode the smoke over its life", goal:"Smoke that breaks up and thins from its edges as it ages, not just fades out.", hl:{g:0,n:["sm.dmp"]}, do:[
      `In the Smoke emitter: ` + AM("Dynamic Material Parameters","Particle Update","dynamic material") + ` Because MI_Ember_Smoke has a Dynamic Parameter, the module shows its names: <b>Erode</b>, <b>EdgeGlow</b>…`,
      `Untick everything except <b>Erode</b>. ` + CURVE("Dynamic Material Parameters","Erode","(0, 0), (0.35, 0.15), (1, 0.85)"),

    why:`The Dynamic Material Parameters module writes into the material's <b>Dynamic Parameter</b> node per particle. Erode compares against the flipbook's alpha, so thin wisps (low alpha) disappear long before the dense middle.`,
    shots:[SH("l7-s08","Dynamic Material Parameters on Smoke: the Erode curve rising over normalized age.")]},

    {t:"NS_Ember_Explosion: seven layers in one second", goal:"A one-shot explosion: flash + light, flipbook fireball, eroding smoke, sparks, a ground ring and rock debris.", do:[
      NEWSYS("Emberfall › FX","NS_Ember_Explosion","Flash") + ` Add User.Tint and User.Scale. Every emitter: Life Cycle Self, Loop <b>Once</b>, Spawn Burst Instantaneous.`,
      `<b>Flash</b>: 1 sprite, life 0.18 s, size 900 × Scale, Color <code>User.Tint * float4(8.0, 4.0, 1.4, 1.0)</code>, Scale Color fade, MI_Ember_Glow, Light Attributes (radius 1400 × Scale) + Light Renderer.`,

      `<b>Smoke</b>: 14 sprites at Spawn Time <code>0.08</code>, life 2.5–3.5, size 220–320 × Scale, outward velocity 220 (+160 up), drag 2, the smoke Color expression, SubUV, the Erode curve, <b>MI_Ember_Smoke</b>.`,
      `<b>Sparks</b> (90, Add Velocity in Cone 1400 × Scale, cone 80°, Gravity, Drag 1.2, Scale Sprite Size by Speed up to 7, velocity-aligned MI_Ember_Spark), <b>Ring</b> (1 flat sprite, 1800 × Scale growing 0.05 → 1, MI_Ember_Ring, laid flat as in Lesson 1) and <b>Debris</b> (10 <b>SM_Ember_RockChunk</b> mesh particles, Collision, MI_Ember_Rock).`
    ], see:`In Play: a white flash that lights the floor, a fireball that blooms and rolls upward into dark smoke, sparks raining down, a ring racing out and rocks bouncing.`,
    why:`The same layering rules as Lesson 1 (huge-instant, big-fast, tiny-fast, big-slow), but now the big layers are flipbooks: 30 sprites total that read like hundreds.`,
    shots:[SH("l7-s07","NS_Ember_Explosion in Play, about 0.3 s after the hit.",1280,720)]},

    {t:"Bring the rest of the pack in", goal:"All eleven effects in Emberfall › FX, renamed to the pack convention and using pack materials only.", do:[

      `Add the four small ones, built the same way: <code>NS_Ember_HitSpark</code> (flash, sparks, puff), <code>NS_Ember_Fireball</code> (looping core + light, flames, ribbon trail, embers), <code>NS_Ember_FireballImpact</code> (flash, fire burst, smoke), <code>NS_Ember_AmbientEmbers</code> (GPU, box spawn, User.Density).`,
      `Open every renderer and check its material is an <code>MI_Ember_…</code> or <code>M_Ember_…</code> asset from <b>your</b> pack folder, never one from Module 1's old folders or the engine.`,

  cards:[
    ["Which two places must both say 8 × 8 for a flipbook?","The <b>SubUV Animation</b> module (Manual SubImage Size) and the <b>Sprite Renderer</b>'s Sub UV → Sub Image Size."],
    ["What does SubUV Animation Mode Linear do?","Plays frames 0–63 across each particle's normalized age, once."],
    ["Why use one immortal sprite for the fire's light?","One light instead of one per flame: lights are expensive."],
    ["How does a buyer bend the smoke column?","Change the <b>Wind</b> User parameter on the placed effect; Acceleration Force is linked to User.Wind."],

/* ---------------------------------------------------------------- L8 */
{
  id:"l8", num:8, mod:2, short:"Performance & hook-ups",
  title:"Make it cheap, safe and easy to use",
  kick:"Lesson 8 · CPU vs GPU, bounds, Effect Types, pooling, Blueprints, profiling",
  time:"60–75 min",
  intro:`A pack that looks great but tanks a buyer's frame rate gets refunded. This lesson adds what separates a professional pack from a hobby one: the right simulation target per emitter, fixed bounds, an <b>Effect Type</b> budget on every system, pooling for effects that fire often, ready-made Blueprints that show how to trigger everything, and a measured cost you can write on the product page.`,
  use:`<b>Used for:</b> every shipped effect. Budgets and pooling are what let a game run forty impacts in one fight.`,
  learn:["CPU vs GPU","Local space","Fixed bounds","Effect Types","Scalability tiers","Warmup","Pooling","Trigger Blueprint","Projectile Blueprint","stat Niagara"],
  concepts:[
    {h:"CPU or GPU?", p:"<b>CPU</b> for few-particle gameplay effects (impacts, fire, trails): cheap to start, can do collision and lights easily, can be read by Blueprints. <b>GPU</b> for thousands of particles (ambient embers, rift wisps, dissolve): huge counts, but they need <b>fixed bounds</b>. Epic notes a 1-particle GPU sim costs about as much as a 64-particle one, so tiny emitters belong on the CPU. Profile when unsure."},
    {h:"Bounds decide visibility", p:"Unreal hides an effect when its bounding box leaves the screen. Dynamic bounds are recalculated every frame (CPU cost); GPU emitters can't calculate them at all. A fixed box that covers the whole effect is cheaper and always correct."},
    {h:"Effect Types are budgets", p:"An <b>Effect Type</b> asset says, per quality level (Low → Cinematic), how far away an effect may be and how many copies may run. Excess copies are culled automatically. Three types cover this pack: Impact, Loop, Ambient."},
    {h:"Pool what fires often", p:"Spawning a new component each hit costs time. <b>Pooling</b> keeps finished effects and reuses them. <b>Pool Prime Size</b> makes them up front, so the first hit doesn't hitch."}
  ],
  graphs:[],
  steps:[
    {t:"Pick CPU or GPU and fix the bounds", goal:"Every emitter on the right Sim Target; every GPU emitter (and the big smoke) with fixed bounds.", do:[
      `In NS_Ember_FireLoop click the <b>Properties</b> row of <b>Flames</b>. In Details you'll see <b>Local Space</b>, <b>Sim Target</b> (CPUSim / GPUComputeSim) and <b>Calculate Bounds Mode</b>.`,
      `Flames stays <b>CPUSim</b> with Local Space ticked. Set <b>Calculate Bounds Mode</b> to <b>Fixed</b> and open <b>Fixed Bounds</b>: Min (−150, −150, −50), Max (150, 150, 400).`,
      `Go through every system with this table:` + TABLE(["Emitter","Sim Target","Bounds"],[["Ambient embers","GPU","Fixed ±1600 XY, −100…1400 Z"],["Rift wisps","GPU","Fixed"],["Dissolve embers","GPU","Fixed ±300, up to 400"],["Smoke column","CPU","Fixed (−500…1400, ±500, −100…2200)"],["Everything else","CPU","Dynamic is fine for short one-shots"]])
    ], see:`No <i>"Missing fixed bounds"</i> warnings anywhere in the pack.`,
    why:`Local Space makes particles move with the actor (a torch on a moving cart). The ambient embers fill a whole room, which is exactly what the GPU is good at.`,
    shots:[SH("l8-s01","Flames → Properties: Local Space, CPUSim and Fixed bounds.")]},

    {t:"Make three Effect Types", goal:"NET_Ember_Impact, NET_Ember_Loop and NET_Ember_Ambient in FX › EffectTypes, with limits per quality level.", do:[
      `In <b>FX › EffectTypes</b> right-click → <b>FX</b> → <b>Niagara Effect Type</b>. Name it <code>NET_Ember_Impact</code> and open it.`,
      `Set <b>Update Frequency</b> to <b>Low</b> and <b>Cull Reaction</b> to <b>Kill and Clear</b>.`,
      `Open <b>System Scalability Settings</b> → <b>Settings</b>. Click <b>+</b> twice for two entries. Open <b>Index [0]</b>: click <b>Low</b> and <b>Medium</b> in the quality bar so only those are blue. Tick <b>Max Distance</b> <code>3000</code>, <b>Max Effect Type Instances</b> <code>12</code>, <b>Max System Instances</b> <code>6</code>.`,
      `Open <b>Index [1]</b>: select <b>High</b>, <b>Epic</b>, <b>Cinematic</b>. Max Distance <code>6000</code>, Max Effect Type Instances <code>32</code>, Max System Instances <code>12</code>. Save.`,
      `Make the other two the same way:` + TABLE(["Effect Type","Update Frequency","Cull Reaction","Low–Medium","High–Cinematic"],[
        ["NET_Ember_Impact","Low","Kill and Clear","3000 · 12 · 6","6000 · 32 · 12"],
        ["NET_Ember_Loop","Medium","Asleep and Clear","2500 · 6 · 4","5000 · 16 · 8"],
        ["NET_Ember_Ambient","Medium","Asleep","3500 · 2 · 1","8000 · 4 · 2"]]) + `<small>Numbers are Max Distance · Max Effect Type Instances · Max System Instances.</small>`
    ], see:`Two scalability entries, one for Low–Medium and one for High–Cinematic.`,
    why:`On a low-end PC a fight spawning 40 impacts now draws at most 12, and nothing over 30 m away. A culled loop (Asleep and Clear) drops its particles and starts again when you come back. Plain <b>Asleep</b> keeps old particles, so an effect with one immortal glow sprite would come back with two.`,
    shots:[SH("l8-s03","NET_Ember_Impact: Low and Medium selected in Index [0], with the distance and instance caps.")]},

    {t:"Assign Effect Types and warmups", goal:"Every system points at one of the three Effect Types; loops warm up so they never pop in.", do:[
      `Open each system, click its <b>Properties</b> row. In <b>System Properties → System</b> set <b>Effect Type</b>:` + TABLE(["Effect Type","Systems","Warmup"],[["NET_Ember_Impact","HitSpark, GroundSlam, FireballImpact, Explosion","0"],["NET_Ember_Loop","FireLoop, SmokeColumn, Rift, BladeTrail, Fireball, Dissolve","FireLoop 1 s, SmokeColumn 4 s, Rift 1 s"],["NET_Ember_Ambient","AmbientEmbers","3 s"]]),
      `Set <b>Warmup Time</b> as in the table. Unreal shows the tick count and delta under it.`
    ], see:`Effect Type filled in on all eleven systems.`,
    pro:`Epic's Niagara best-practice page says to <b>avoid warmup</b> where you can: it simulates all those ticks in one frame when the effect activates. Keep it short and only on loops that are placed in the level and must not visibly start up (fire, smoke). Never warm up one-shots or anything spawned during gameplay.`,
    shots:[SH("l8-s02","NS_Ember_FireLoop → System Properties: Effect Type NET_Ember_Loop, warmup about 1 s.")]},

    {t:"LODs: fewer particles on lower quality levels", goal:"Every multi-particle emitter spawns 40% on Low, 65% on Medium, 85% on High and 100% on Epic/Cinematic; detail-only emitters are off on Low.", do:[
      `Open <b>NS_Ember_FireLoop</b>. Click <b>Scalability</b> in the toolbar: the editor switches to Scalability mode (the toolbar now shows only a blue <b>Scalability</b> button, and a <b>Preview Low / Medium / High / Epic / Cinematic</b> bar appears over the graph).`,
      `Click the <b>Flames</b> box. The <b>Scalability Context</b> panel (right) shows a quality bar and <b>Scalability Overrides</b>. Open <b>Scalability Overrides</b> and click the <b>+</b> next to <b>Overrides</b> three times.`,
      `Open <b>Index [0]</b>. In its quality bar click <b>Medium</b>, <b>High</b>, <b>Epic</b> and <b>Cinematic</b> so only <b>Low</b> stays blue. Tick <b>Override Spawn Count Scale</b>, then tick <b>Spawn Count Scale</b> and type <code>0.4</code>.`,
      `<b>Index [1]</b>: only <b>Medium</b> blue, the same ticks, <code>0.65</code>. <b>Index [2]</b>: only <b>High</b> blue, <code>0.85</code>. Epic and Cinematic get no override, so they keep 100%. Click <b>Scalability</b> again to go back to the normal toolbar, and save.`,
      `Repeat on every emitter that spawns more than one particle (sparks, dust, fire, smoke, wisps, ambient embers). Leave single sprites, lights and ribbons alone: 40% of one particle is zero.` + TABLE(["System","Scaled emitters","Off on Low"],[
        ["HitSpark","Sparks, Puff","–"],["GroundSlam","Sparks, Dust","Debris"],["FireballImpact","Fire, Smoke, Sparks","–"],["Explosion","Fireball, Smoke, Sparks","Debris"],
        ["Fireball","Flames","Embers"],["BladeTrail","–","Embers"],["Rift","Wisps","–"],["FireLoop","Flames, Smoke","Embers"],
        ["SmokeColumn","Smoke","–"],["AmbientEmbers","Embers","–"],["Dissolve","Embers","–"]]),
      `<b>Off on Low:</b> still in Scalability mode, click the detail emitter (here <b>Embers</b>). In the top quality bar of <b>Scalability Context</b> click <b>Low</b> so it turns grey; the other four stay blue. The emitter now doesn't exist at all on Low.`,
      `Test it: Play (${K("Alt","P")}), open the console (${K("`")}) and type <code>sg.EffectsQuality 0</code> (Low). Then type <code>fx.Niagara.DumpComponents</code> and read the counts in the Output Log. Repeat with <code>1</code>, <code>2</code>, <code>3</code>. Finish with <code>sg.EffectsQuality 3</code> so the editor goes back to Epic.`
    ], see:`Particle counts drop with the quality level. In the worked example: Rift wisps 524 → 436 → 335 → 207, ambient embers 667 → 569 → 431 → 271 (Epic → High → Medium → Low), and debris and fire embers show <i>Disabled</i> on Low.`,
    why:`Fab's VFX rule 4.3.3.6 asks that effects seen at several distances have <b>LODs</b>. The Effect Type decides <i>whether</i> an effect runs; scalability overrides decide <i>how much</i> of it runs. <code>sg.EffectsQuality</code> is the player's Effects setting: 0 Low, 1 Medium, 2 High, 3 Epic.`,
    shots:[SH("l8-s08","Scalability mode, Flames selected: Index [0] is Low only with Spawn Count Scale 0.4."), SH("l8-s08b","Embers selected: Low is grey, so the emitter is off on Low.")]},

    {t:"Pool the effects that fire often", goal:"HitSpark, FireballImpact and Explosion reuse finished components instead of creating new ones.", do:[
      `Open <b>NS_Ember_HitSpark</b>, click <b>Properties</b>, and type <code>pool</code> in the Details search box.`,
      `Under <b>Performance</b> leave <b>Max Pool Size</b> at <code>32</code> and set <b>Pool Prime Size</b> to <code>8</code>.`,
      `Do the same with Pool Prime Size <code>4</code> on FireballImpact and <code>2</code> on Explosion.`,
      `In Blueprints, spawn them with <b>Spawn System at Location</b> and leave <b>Pooling Method</b> on <b>Auto Release</b>.`
    ], see:`Max Pool Size 32, Pool Prime Size 8 on HitSpark.`,
    why:`Priming makes 8 hit sparks while the level loads, so the first eight hits in a fight cost nothing extra. That avoids the classic hitch on the very first impact.`,
    shots:[SH("l8-s07","Searching \"pool\" in System Properties: Max Pool Size and Pool Prime Size.")]},

    {t:"A trigger pedestal Blueprint (BP_Ember_FXPedestal)", goal:"A display pedestal that plays its effect, and re-fires it when the player walks in.", do:[
      `In <b>Blueprints</b> make a Blueprint Class → <b>Actor</b> → <code>BP_Ember_FXPedestal</code>. Add components: <b>Static Mesh</b> <code>Pedestal</code> (SM_Ember_Pedestal), <b>Niagara Particle System</b> <code>FX</code>, <b>Text Render</b> <code>Label</code>, <b>Box Collision</b> <code>Trigger</code>.`,
      `Add a float variable <code>RetriggerInterval</code> (default 3), click the eye icon to make it editable per instance.`,
      `In the Event Graph right-click → <code>add custom event</code> → <b>Add Custom Event…</b> → name it <code>Retrigger</code>. Drag <b>FX</b> from the Components list into the graph (Get FX), drag off its pin → <code>reset system</code> → <b>Reset System</b>. Wire Retrigger → Reset System.`,
      `Right-click → <b>Event ActorBeginOverlap</b>. Drag off its white pin → type <code>retrigger</code> → <b>Retrigger</b>. Click <b>Compile</b>, then <b>Save</b>.`,
      `On BeginPlay, a <b>Set Timer by Function Name</b> (Function Name <code>Retrigger</code>, Time = RetriggerInterval, Looping) replays one-shots every few seconds when RetriggerInterval is above 0.`
    ], see:`Compile succeeds with no warnings. In Play, walking onto a pedestal replays its effect.`,
    pro:`Watch for a greyed-out event node with <i>"This node is disabled and will not be called"</i>: that's a placeholder, not your event. Delete it and add a real Custom Event.`,
    shots:[SH("l8-s04","Overlap → Retrigger → Reset System, compiled successfully.")]},

    {t:"A projectile that spawns its impact (BP_Ember_ProjectileLauncher)", goal:"A launcher that fires BP_Ember_Projectile on a timer; the projectile carries NS_Ember_Fireball and spawns NS_Ember_FireballImpact where it hits.", do:[
      `<b>BP_Ember_Projectile</b>: a Sphere Collision root, a <b>Niagara Particle System</b> (NS_Ember_Fireball) and a <b>Projectile Movement</b> component (Initial Speed <code>1800</code>, Gravity Scale <code>0</code>).`,
      `In its graph: <b>Event Hit</b> → <b>Spawn System at Location</b> (System Template <code>NS_Ember_FireballImpact</code>, Location = Hit Location) → <b>Destroy Actor</b>.`,
      `<b>BP_Ember_ProjectileLauncher</b>: a Scene Component <code>Muzzle</code>, float <code>Interval</code> = 2. BeginPlay → <b>Set Timer by Function Name</b> (<code>Fire</code>, Interval, Looping). Custom event <b>Fire</b> → <b>Get World Transform</b> (Muzzle) → <b>SpawnActor BP_Ember_Projectile</b>. Compile, save.`
    ], see:`In Play, a fireball flies from the launcher every 2 s and bursts on the wall.`,
    why:`Buyers learn fastest from a working example they can copy. The projectile pattern (looping effect on the actor, one-shot spawned at the hit) is the one most games need.`,
    shots:[SH("l8-s05","BP_Ember_ProjectileLauncher: BeginPlay timer → Fire → spawn the projectile at the Muzzle.")]},

    {t:"Measure it: stat Niagara", goal:"A real number for the product page.", do:[
      `Open your showcase map (Lesson 9) or any level with all effects running. Press ${K("Alt","P")} to Play.`,
      `Press ${K("`")} (the key under Esc) to open the console, type <code>stat Niagara</code>, ${K("Enter")}.`,
      `Read <b>InclusiveAvg</b> for <b>System Simulation Tick [CNC]</b> and <b>Niagara Manager Tick [GT]</b>, and add the top lines up. Type <code>stat none</code> to hide it.`,
      `For a per-effect breakdown open <b>Tools → Debug → Niagara Debugger</b> while playing.`
    ], see:`A green table of Niagara timings. With all eleven effects running here, the busiest lines are well under 1 ms.`,
    why:`"Runs at about 0.5 ms of Niagara game-thread time with everything playing" is a statement buyers trust, as long as you say on what hardware.`,
    pro:`<b>Scaling up later:</b> for hundreds of identical hits (bullets on walls), look at <b>Niagara Data Channels</b>: gameplay writes hit positions into a channel and <u>one</u> system draws them all, instead of one component per hit. They're a 5.x feature built for exactly that.`,
    shots:[SH("l8-s06","stat Niagara in Play with the whole showcase running.")]}
  ],
  check:`<b>You should have:</b> right Sim Targets and fixed bounds on GPU emitters, three Effect Types assigned to all eleven systems, warmups on the loops, pooling primed on the frequent one-shots, two working example Blueprints, and a measured stat Niagara number.`,
  cards:[
    ["When do you choose GPU simulation?","Large counts (hundreds to thousands) that don't need collision with complex logic or Blueprint reads: ambient embers, wisps."],
    ["Why do GPU emitters need fixed bounds?","The GPU can't report particle positions back to calculate bounds, so Unreal needs a box to know when the effect is on screen."],
    ["What do Effect Type scalability settings limit?","Per quality level: max distance, max instances of this effect type, max instances of this system (plus visibility culling and budgets)."],
    ["Kill and Clear vs Asleep and Clear?","Kill and Clear removes culled one-shots for good; Asleep and Clear clears a culled loop and restarts it when it's back in range (plain Asleep keeps old particles, which duplicates immortal sprites)."],
    ["How do you give a Niagara effect LODs?","Toolbar <b>Scalability</b> mode, then each emitter's <b>Scalability Overrides</b>: Spawn Count Scale per quality level (e.g. Low 0.4, Medium 0.65, High 0.85), and the emitter's quality bar with Low greyed out for detail-only emitters."],
    ["What does Pool Prime Size do?","Creates that many pooled components in advance so the first uses don't hitch."],
    ["Which console command shows Niagara timings?","<code>stat Niagara</code> (in Play)."],
    ["What are Niagara Data Channels for?","Sending many gameplay events (e.g. hit positions) to one system that draws them all, instead of a component per event."],
    ["What does Local Space do?","Particles move with the component, e.g. fire on a moving cart."]
  ],

    stretch:[["Significance","Add a Significance Handler (Distance) and limit to the 4 closest loops."],["Insights","Capture a Trace and find the Niagara tracks in Unreal Insights."]]
  }

let S = {done:{}, notes:{}, memory:false, timers:{}};
const API = "/api/progress";
let serverOK = false, saveT = null;
const saveEl = document.getElementById("save");
function setSave(cls, txt){ saveEl.className = "save " + cls; saveEl.querySelector("span").textContent = txt; }
async function load(){
  try{
    // only a local serve.py has the progress API; on a static host skip the request
    if(!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) throw 0;
    const r = await fetch(API, {cache:"no-store"});
    if(!r.ok) throw 0;
    const j = await r.json();
    S = Object.assign(S, j || {});
    serverOK = true; setSave("ok","Saved to progress.json");
  }catch(e){
    try{ const l = localStorage.getItem("nvfx-fast-track"); if(l) S = Object.assign(S, JSON.parse(l)); }catch(_){}
    setSave("ok","Progress saves in this browser");
  }
  S.done ||= {}; S.notes ||= {}; S.timers ||= {};
}
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(async ()=>{
    try{ localStorage.setItem("nvfx-fast-track", JSON.stringify(S)); }catch(_){}
    if(!serverOK){ setSave("ok","Saved in this browser · " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})); return; }
    try{
      const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(S)});
      if(!r.ok) throw 0;
      setSave("ok","Saved to progress.json · " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}));
    }catch(e){ setSave("local","Server lost: saved in browser"); }
  }, 300);
}

function keysFor(L){
  const k = [];
  L.steps.forEach((_,i)=>k.push(`${L.id}.s${i}`));
  L.cards.forEach((_,i)=>k.push(`${L.id}.c${i}`));
  L.boss.items.forEach((_,i)=>k.push(`${L.id}.b${i}`));
  return k;
}
function pct(L){ const k = keysFor(L); return k.filter(x=>S.done[x]).length / k.length; }
const packKeys = ()=> hasPack() ? PACK.sections.flatMap((sec,si)=>sec.items.map((_,i)=>`pack.${si}.${i}`)) : [];
function refreshProgress(){
  let all = [], got = 0;
  LESSONS.forEach(L=>{ const k = keysFor(L); all = all.concat(k); });
  all = all.concat(packKeys());
  const pa = document.querySelector(`nav a[data-l="pack"]`);
  if(pa){ const pk = packKeys(), pq = pk.filter(x=>S.done[x]).length / pk.length; pa.querySelector(".bar i").style.width = (pq*100)+"%"; pa.classList.toggle("done", pq===1); }
  got = all.filter(x=>S.done[x]).length;
  const p = all.length ? got/all.length : 0;
  document.getElementById("ringArc").style.strokeDashoffset = 138.2 * (1 - p);
  document.getElementById("ringTxt").textContent = Math.round(p*100) + "%";
  document.getElementById("ringCount").textContent = `${got} / ${all.length}`;
  document.getElementById("mtopPct").textContent = Math.round(p*100) + "% complete";
  LESSONS.forEach(L=>{
    const a = document.querySelector(`nav a[data-l="${L.id}"]`); if(!a) return;
    const q = pct(L);
    a.querySelector(".bar i").style.width = (q*100) + "%";
    a.classList.toggle("done", q === 1);
    a.querySelector(".nb").textContent = q === 1 ? "✓" : L.num;
  });
  const sp = document.getElementById("stepPct");
  if(sp){ const L = LESSONS.find(x=>x.id===sp.dataset.l); sp.textContent = Math.round(pct(L)*100) + "% of this lesson"; }
}

const TYPE = {geo:"--geo",float:"--float",int:"--int",vec:"--vec",bool:"--bool",rot:"--rot",menu:"--menu",obj:"--obj",str:"--str",mat:"--mat",col:"--col",shd:"--shd",pin:"--pin",exec:"--exec",bfloat:"--bfloat",bobj:"--bobj",bcol:"--bcol",bname:"--bname"};
const CAT = {input:"--h-input",geo:"--h-geo",util:"--h-util",tex:"--h-tex",group:"--h-group",shader:"--h-shader",curve:"--h-curve",func:"--h-func",part:"--h-part",mathm:"--h-math",result:"--h-result",param:"--h-param",event:"--h-event",bfunc:"--h-bfunc",bpure:"--h-bpure",tl:"--h-tl",var:"--h-var"};
const lab = s => s.startsWith("~") ? "" : esc(s);
const sk = t => t === "exec" ? "x" : "";
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
function nodeHTML(n){
  if(n.note) return `<div class="node note" style="left:${n.x}px;top:${n.y}px;width:${n.w||140}px">${n.note}</div>`;
  let h = `<div class="node" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px;width:${n.w||150}px"><div class="nh" style="background:var(${CAT[n.c]||"--h-group"})">${esc(n.t)}</div><div class="nb">`;
  (n.o||[]).forEach(o=>{ h += `<div class="row out" data-n="${n.id}" data-s="${esc(o[0])}"><span>${lab(o[0])}</span><i class="s ${o[3]||sk(o[1])}" style="--c:var(${TYPE[o[1]]})"></i></div>`; });
  (n.p||[]).forEach(p=>{ h += `<div class="prop"><span>${esc(p)}</span></div>`; });
  (n.i||[]).forEach(i=>{
    const v = i[2] ? `<em class="${i[2]==="✓"?"ok":""}">${esc(i[2])}</em>` : "";
    h += `<div class="row in" data-n="${n.id}" data-s="${esc(i[0])}"><i class="s ${i[3]||sk(i[1])}" style="--c:var(${TYPE[i[1]]})"></i><span>${lab(i[0])}</span>${v}</div>`;
  });
  return h + `</div></div>`;
}
const SECCOL = {"Properties":"#555a63","Emitter Spawn":"#a35718","Emitter Update":"#a35718","Particle Spawn":"#3b7a3b","Particle Update":"#3b7a3b","Render":"#8f3550","User":"#2c5a8c"};
function stackHTML(g, gi){
  const ems = g.emitters.map(em=>`<div class="sem"><div class="semh"><b>${esc(em.name)}</b><span>${em.tag||""}</span></div>${
    em.sections.map(sec=>`<div class="ssec"><div class="ssech" style="--sc:${SECCOL[sec.s]||"#555"}">${sec.s}</div>${
      sec.mods.map(m=>`<div class="smod" data-id="${em.id}.${m.id}"><div class="smn">${esc(m.n)}</div>${(m.v||[]).map(v=>`<div class="smv"><span>${esc(v[0])}</span><em>${esc(v[1])}</em></div>`).join("")}</div>`).join("")
    }</div>`).join("")}</div>`).join("");
  return `<div class="graphwrap"><div class="graphhead"><b>${g.title}</b><span class="hint">${g.hint||""}</span></div>
  <div class="graphscroll mem"><div class="graph stackg" data-g="${gi}">${ems}</div></div>
  <div class="legend">${Object.entries({"Emitter Spawn / Update":"#a35718","Particle Spawn / Update":"#3b7a3b","Render":"#8f3550"}).map(([k,c])=>`<span><i style="background:${c};border-radius:2px"></i>${k}</span>`).join("")}<span>Each column = one emitter; modules run top to bottom</span></div></div>
  <p class="cap">${g.cap||""}</p>`;
}
function graphHTML(g, gi){
  if(g.kind === "stack") return stackHTML(g, gi);
  return `<div class="graphwrap"><div class="graphhead"><b>${g.title}</b><span class="hint">${g.hint||""}</span></div>
  <div class="graphscroll mem"><div class="graph" data-g="${gi}" style="width:${g.w}px;height:${g.h||300}px"><svg class="links"></svg>${g.nodes.map(nodeHTML).join("")}</div></div>
  <div class="legend">${g.legend||""}</div></div>
  <p class="cap">${g.cap||""}</p>`;
}
function findSock(graph, ref, dir){
  let [id, rest] = [ref.slice(0, ref.indexOf(".")), ref.slice(ref.indexOf(".")+1)];
  let nth = 0; const at = rest.lastIndexOf("@");
  if(at > -1){ nth = +rest.slice(at+1); rest = rest.slice(0, at); }
  const rows = [...graph.querySelectorAll(`.row.${dir}[data-n="${id}"]`)].filter(r=>r.dataset.s === rest);
  return rows[nth] ? rows[nth].querySelector(".s") : null;
}
function drawLinks(el, g){
  if(!g || g.kind === "stack") return;
  const svg = el.querySelector("svg.links");
  // size the canvas to fit its nodes, whatever the fonts did to their heights
  let mw = 0, mh = 0;
  el.querySelectorAll(".node").forEach(n=>{ mw = Math.max(mw, n.offsetLeft + n.offsetWidth); mh = Math.max(mh, n.offsetTop + n.offsetHeight); });
  const W = Math.max(g.w, mw + 20), H = mh + 24;
  el.style.width = W + "px"; el.style.height = H + "px";
  const base = el.getBoundingClientRect();
  const cs = getComputedStyle(document.documentElement);
  let paths = "";
  g.links.forEach(([a,b])=>{
    const s1 = findSock(el, a, "out"), s2 = findSock(el, b, "in");
    if(!s1 || !s2){ console.warn("missing socket", a, b); return; }
    const r1 = s1.getBoundingClientRect(), r2 = s2.getBoundingClientRect();
    const x1 = r1.left + r1.width/2 - base.left, y1 = r1.top + r1.height/2 - base.top;
    const x2 = r2.left + r2.width/2 - base.left, y2 = r2.top + r2.height/2 - base.top;
    const dx = Math.max(40, Math.abs(x2-x1) * .5);
    const col = s1.style.getPropertyValue("--c");
    const c = cs.getPropertyValue(col.replace(/var\(|\)/g,"").trim()) || "#aaa";
    paths += `<path d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" stroke="#111" stroke-width="4.5" fill="none" opacity=".6"/><path d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" stroke="${c.trim()}" stroke-width="2" fill="none"/>`;
  });
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.innerHTML = paths;
}
