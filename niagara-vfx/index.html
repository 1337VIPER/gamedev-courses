<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Niagara VFX Fast Track</title>
<style>
:root{
  --bg:#17181b;--panel:#1f2125;--card:#25272c;--card2:#2c2f35;--line:#363941;--ink:#e8e9ec;--mut:#9a9ea8;--dim:#6d717b;
  --acc:#ff8a3d;--acc2:#4fb3ff;--warn:#f0a35a;--good:#5fd38d;--bad:#ef6b6b;
  --geo:#00d6a3;--float:#a1a1a1;--int:#598c5c;--vec:#6363c7;--bool:#cca6d6;--rot:#a663c7;--menu:#7c7c7c;--obj:#ed9e5c;--str:#70b2ff;--mat:#eb7582;--col:#c7c729;--shd:#63c763;
  --h-input:#83314a;--h-geo:#1d725e;--h-util:#2f4f86;--h-tex:#7a4a1f;--h-group:#3d3f45;--h-shader:#2b652b;--h-curve:#1d725e;
  --pin:#d0d3d8;--exec:#ffffff;--bfloat:#9fe34a;--bobj:#2fa6f0;--bcol:#3f6fd8;--bname:#c787f0;
  --h-func:#2a4f7a;--h-part:#5b3a7a;--h-math:#3a3d42;--h-result:#6b4a2a;--h-param:#2e6b3f;--h-event:#8c2323;--h-bfunc:#2c5a8c;--h-bpure:#3a6e3a;--h-tl:#8a5a10;--h-var:#454850;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc2)}
kbd{font:600 .78em/1 ui-monospace,Consolas,monospace;background:#0f1012;border:1px solid #444851;border-bottom-width:2px;border-radius:4px;padding:.18em .42em;color:#f1f1f1;white-space:nowrap}
code{font:.88em ui-monospace,Consolas,monospace;background:#0f1012;border:1px solid #33363d;border-radius:4px;padding:.05em .35em;color:#d9f7ee}
b.n{color:var(--acc);font-weight:600}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:20px 16px}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.brand svg{flex:none}
.brand h1{font-size:1.02rem;margin:0;line-height:1.2}
.brand small{display:block;color:var(--mut);font-weight:400;font-size:.78rem}
.ring{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:16px 0}
.ring svg{flex:none}
.ring .t{font-size:.82rem;color:var(--mut);line-height:1.35}
.ring .t b{display:block;color:var(--ink);font-size:1rem}
nav .grp{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:18px 4px 6px}
nav a.l{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);padding:8px 8px;border-radius:8px;font-size:.9rem;line-height:1.25}
nav a.l:hover{background:var(--card)}
nav a.l.on{background:var(--card2);box-shadow:inset 3px 0 0 var(--acc)}
nav a.l .nb{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;background:#2d3036;color:var(--mut)}
nav a.l.done .nb{background:var(--acc);color:#2a1203}
nav a.l .bar{height:3px;background:#30333a;border-radius:2px;margin-top:5px;overflow:hidden}
nav a.l .bar i{display:block;height:100%;background:var(--acc);width:0}
nav .lock{display:flex;gap:10px;align-items:center;color:var(--dim);padding:6px 8px;font-size:.85rem;line-height:1.25}
nav .lock .nb{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;border:1px dashed #444851}
.tools{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font:600 .85rem system-ui,sans-serif;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{border-color:#50545e;background:var(--card2)}
a.btn{text-decoration:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#2a1203}
.btn.pri:hover{filter:brightness(1.08)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.85rem;cursor:pointer;user-select:none}
.toggle .sw{width:34px;height:20px;border-radius:10px;background:#3a3d44;position:relative;flex:none;transition:.2s}
.toggle .sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#cfd2d8;transition:.2s}
.toggle.on .sw{background:var(--acc)}.toggle.on .sw::after{left:17px;background:#2a1203}
.save{font-size:.75rem;color:var(--dim);margin-top:10px;display:flex;gap:6px;align-items:center}
.save i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.save.ok i{background:var(--good)}.save.local i{background:var(--warn)}
main{min-width:0;padding:34px 40px 120px;max-width:1180px}
.hero{border:1px solid var(--line);border-radius:14px;padding:26px 28px;background:radial-gradient(1200px 300px at 0% 0%,rgba(255,138,61,.13),transparent 60%),var(--panel);margin-bottom:26px;position:relative;overflow:hidden}
.hero .kick{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:700}
.hero h2{font-size:2rem;line-height:1.15;margin:6px 0 10px}
.hero p{color:#c9ccd3;max-width:760px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:.76rem;border:1px solid #3d4048;border-radius:999px;padding:3px 10px;color:#cdd0d6;background:#1b1d20}
.chip.g{border-color:rgba(255,138,61,.45);color:#ffd2a8}
.use{margin-top:14px;font-size:.88rem;color:var(--mut)}
.use b{color:var(--ink)}
h3.sec{font-size:1.2rem;margin:38px 0 12px;display:flex;align-items:center;gap:10px}
h3.sec .tag{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;background:#2b2e34;color:var(--mut);border-radius:4px;padding:2px 7px}
.concepts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.concept{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.concept h4{margin:0 0 6px;font-size:.95rem;color:#fff}
.concept p{margin:0;color:#c3c6cd;font-size:.9rem}
.graphwrap{background:#1d1e21;border:1px solid var(--line);border-radius:12px;margin:14px 0 6px;overflow:hidden}
.graphhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.88rem}
.graphhead b{color:#fff}
.graphhead .hint{color:var(--dim);font-size:.78rem}
.graphscroll{overflow:auto;position:relative}
.graph{position:relative;background-color:#1d1e21;background-image:radial-gradient(#2a2c31 1px,transparent 1px);background-size:22px 22px}
.graph svg.links{position:absolute;inset:0;pointer-events:none;overflow:visible}
.node{position:absolute;background:#303236;border:1px solid #17181a;border-radius:7px;box-shadow:0 6px 18px rgba(0,0,0,.35);font-size:12px;line-height:1;color:#e6e6e6}
.node .nh{padding:6px 10px;border-radius:6px 6px 0 0;font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.node .nb{padding:4px 0 6px}
.node .prop{margin:3px 10px 4px;background:#222326;border:1px solid #3c3e43;border-radius:4px;padding:3px 7px;font-size:11px;color:#d7d7d7;display:flex;justify-content:space-between}
.node .prop::after{content:"▾";color:#888;margin-left:6px}
.node .row{position:relative;height:22px;display:flex;align-items:center;padding:0 12px;gap:6px}
.node .row.out{justify-content:flex-end}
.node .row span{white-space:nowrap}
.node .row em{font-style:normal;margin-left:auto;background:#545659;border-radius:4px;padding:2px 6px;font-size:11px;color:#f2f2f2;white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.node .row em.ok{background:#4772b3}
.node .s{position:absolute;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;border:1px solid #111;background:var(--c)}
.node .row.in .s{left:-6px}.node .row.out .s{right:-6px}
.node .s.f{border-radius:2px;transform:rotate(45deg) scale(.88)}
.node .s.m{height:20px;margin-top:-10px;border-radius:6px}
.node.note{background:transparent;border:1px dashed #4a4d55;box-shadow:none;color:var(--mut);font-size:11.5px;line-height:1.35;padding:8px 10px;white-space:normal}
.cap{font-size:.85rem;color:var(--mut);margin:0 2px 18px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--mut);padding:8px 14px;border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid #111}
.legend i.f{border-radius:1px;transform:rotate(45deg)}
.steps{counter-reset:st;display:flex;flex-direction:column;gap:10px}
.step{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px 14px 14px;display:grid;grid-template-columns:30px 1fr;gap:10px;transition:border-color .2s,background .2s}
.step.done{border-color:rgba(255,138,61,.4);background:linear-gradient(90deg,rgba(255,138,61,.07),transparent 40%),var(--card)}
.cb{appearance:none;width:22px;height:22px;border-radius:6px;border:2px solid #555963;background:#1a1b1e;cursor:pointer;margin:1px 0 0;display:grid;place-items:center;transition:.15s}
.cb:checked{background:var(--acc);border-color:var(--acc)}
.cb:checked::after{content:"";width:6px;height:11px;border:solid #2a1203;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cb:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.step .st{font-weight:650;color:#fff;cursor:pointer}
.step .st small{color:var(--acc);font-weight:700;margin-right:8px}
.step .sd{color:#c6c9d0;font-size:.92rem;margin-top:6px}
.step .sd p{margin:.4em 0}
.step .sd ul{margin:.3em 0;padding-left:20px}
.why{margin-top:8px;border-left:3px solid var(--acc2);background:rgba(79,179,255,.07);padding:7px 10px;border-radius:0 6px 6px 0;font-size:.87rem;color:#c9dcef}
.why b{color:#8fcbff}
.pro{margin-top:8px;border-left:3px solid var(--warn);background:rgba(240,163,90,.07);padding:7px 10px;border-radius:0 6px 6px 0;font-size:.87rem;color:#ecd9c6}
.pro b{color:#ffc58f}
.check{background:linear-gradient(135deg,rgba(255,138,61,.1),rgba(79,179,255,.06));border:1px solid rgba(255,138,61,.3);border-radius:10px;padding:14px 16px;color:#f1e1d4;font-size:.92rem}
.check b{color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fc{perspective:900px;min-height:150px;cursor:pointer}
.fc .in{position:relative;width:100%;height:100%;min-height:150px;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;font-size:.9rem}
.fc .front{background:var(--card)}
.fc .back{background:#2a1f17;border-color:rgba(255,138,61,.35);transform:rotateY(180deg);color:#f6e2d2}
.fc .q{font-weight:600;color:#fff}
.fc .lab{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.fc .back .lab{color:#f0a36b}
.fc .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.76rem;color:var(--dim);padding-top:8px}
.fc .knew{display:flex;gap:6px;align-items:center;color:#ffc896;cursor:pointer}
.fc .knew .cb{width:18px;height:18px}
.fc.known .front{border-color:rgba(255,138,61,.45)}
.boss{background:radial-gradient(600px 200px at 100% 0%,rgba(240,163,90,.14),transparent 60%),var(--card);border:1px solid rgba(240,163,90,.4);border-radius:12px;padding:18px 18px 8px}
.boss h4{margin:0 0 4px;color:#ffd2a6;font-size:1.05rem}
.boss .brief{color:#d8cfc6;font-size:.92rem;margin-bottom:10px}
.ck{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:7px 0;border-top:1px solid #3a3530;font-size:.92rem;color:#e8e1da}
.ck:first-of-type{border-top:0}
.ck label{cursor:pointer}
.ck small{display:block;color:#a89e93;font-size:.82rem;margin-top:2px}
.timer{display:flex;align-items:center;gap:10px;margin:6px 0 12px;flex-wrap:wrap}
.timer .clock{font:700 1.3rem ui-monospace,Consolas,monospace;color:#ffd2a6;min-width:84px}
textarea.notes{width:100%;min-height:110px;background:#141518;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:14px/1.5 system-ui,sans-serif;resize:vertical}
textarea.notes:focus{outline:none;border-color:var(--acc)}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.road{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.mod .mk{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);font-weight:700}
.mod.lockd .mk{color:var(--dim)}
.mod h4{margin:4px 0 6px;font-size:1rem}
.mod ul{margin:0;padding-left:18px;color:#c3c6cd;font-size:.88rem}
.mod.lockd{opacity:.78;border-style:dashed}
.mod a{text-decoration:none}
table.keys{width:100%;border-collapse:collapse;font-size:.9rem}
table.keys td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
table.keys td:first-child{white-space:nowrap;width:1%}
table.keys tr:first-child td{border-top:0}
.loop{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.loop div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.88rem;color:#c3c6cd}
.loop b{display:block;color:#fff;margin-bottom:3px}
.loop i{font-style:normal;color:var(--acc);font-weight:800;margin-right:6px}
/* literal steps */
.goal{color:#e9ebef;margin:2px 0 8px}
.goal b{color:var(--acc)}
ol.do{margin:6px 0 4px;padding-left:24px;display:flex;flex-direction:column;gap:7px}
ol.do li{padding-left:4px;line-height:1.55}
ol.do li::marker{color:var(--acc);font-weight:700}
ol.do li > b:first-child{color:#fff}
ol.do u{text-decoration:none;border-bottom:1px dashed #8fcbff;color:#d7ebff}
.so,.si{display:inline-block;border-radius:4px;padding:0 6px;font-size:.86em;font-weight:600;line-height:1.5}
.so{background:#20302c;color:#9ff3dc;border:1px solid #2f5a4f}
.si{background:#262a3a;color:#c3c9ff;border:1px solid #3d4466}
ol.do small{color:var(--dim)}
.see{margin-top:8px;border-left:3px solid var(--good);background:rgba(95,211,141,.07);padding:7px 10px;border-radius:0 6px 6px 0;font-size:.87rem;color:#d3efdd}
.see b{color:#8fe6b0}
.btn.where{font-size:.78rem;padding:5px 10px;margin:2px 0 6px;font-weight:600}
.node.hl{outline:3px solid #ffd166;outline-offset:2px;box-shadow:0 0 0 8px rgba(255,209,102,.18),0 6px 18px rgba(0,0,0,.35);z-index:3;animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(255,209,102,.05),0 6px 18px rgba(0,0,0,.35)}}
.backbtn{position:fixed;right:20px;bottom:20px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.4)}
details.basics{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 14px;padding:0 14px}
details.basics summary{cursor:pointer;padding:12px 0;font-weight:650;color:#fff}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:0 0 14px}
.bcard{background:#1d1f23;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.88rem;color:#c6c9d0}
.bcard b{display:block;color:#fff;margin-bottom:4px}
.bcard b i{font-style:normal;color:var(--acc);margin-right:6px}
/* stack diagrams (Niagara) */
.stackg{display:flex;gap:14px;padding:16px;align-items:flex-start;width:max-content;min-width:100%}
.sem{width:260px;flex:none;background:#2a2c31;border:1px solid #121315;border-radius:8px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.semh{background:#3a3e46;padding:8px 10px;border-bottom:1px solid #121315}
.semh b{display:block;color:#fff;font-size:13px}
.semh span{font-size:11px;color:#b9bdc6}
.ssech{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;color:#fff;background:var(--sc,#555)}
.smod{padding:6px 10px 7px;border-top:1px solid #35383e;font-size:12px;transition:background .2s}
.smn{font-weight:600;color:#eee}
.smv{display:flex;justify-content:space-between;gap:8px;color:#a9adb7;font-size:11px;margin-top:3px;line-height:1.3}
.smv em{font-style:normal;background:#4a4d53;border-radius:4px;padding:1px 6px;color:#f2f2f2;text-align:right;max-width:62%}
.smod.hl{outline:3px solid #ffd166;outline-offset:-3px;background:rgba(255,209,102,.13)}
.node .s.x{border:none;border-radius:0;width:12px;height:12px;margin-top:-6px;clip-path:polygon(0 0,100% 50%,0 100%)}
.legend i.x{border:none;border-radius:0;clip-path:polygon(0 0,100% 50%,0 100%)}
/* memory mode */
body.memory .mem{filter:blur(7px) saturate(.4);opacity:.55;cursor:pointer;transition:filter .25s,opacity .25s;user-select:none}
body.memory .mem.peek{filter:none;opacity:1;user-select:auto}
body.memory .graphwrap .mem{pointer-events:auto}
.memnote{display:none;background:#2a2433;border:1px solid #574a6b;color:#dccbf3;border-radius:10px;padding:10px 14px;font-size:.88rem;margin:0 0 18px}
body.memory .memnote{display:block}
/* review modal */
.modal{position:fixed;inset:0;background:rgba(5,6,8,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;padding:22px}
.mbox .from{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.mbox .q{font-size:1.15rem;font-weight:650;margin:8px 0 14px}
.mbox .a{background:#2a1f17;border:1px solid rgba(255,138,61,.35);border-radius:10px;padding:12px 14px;color:#f6e2d2;display:none}
.mbox.show .a{display:block}
.mbox .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.mbox .cnt{font-size:.8rem;color:var(--dim);margin-right:auto;align-self:center}
.mtop{display:none;position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;justify-content:space-between;gap:10px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:290px;z-index:40;transform:translateX(-100%);transition:transform .25s}
  aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  .mtop{display:flex}
  main{padding:20px 16px 100px}
  .hero{padding:20px}.hero h2{font-size:1.55rem}
  .grid2,.loop{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="mtop"><button class="btn" id="menuBtn">☰ Lessons</button><span id="mtopPct" style="font-size:.85rem;color:var(--mut)"></span></div>
<div class="app">
<aside id="side">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="8" fill="#3a1d0c"/><circle cx="17" cy="20" r="5" fill="#ff8a3d"/><circle cx="17" cy="20" r="2.2" fill="#fff3e6"/><path d="M17 13 L15 6 M21 15 L26 9 M13 15 L8 10 M23 20 L29 19 M11 21 L5 22" stroke="#ffb066" stroke-width="2" stroke-linecap="round"/></svg>
    <h1>Niagara VFX<small>Fast Track · Unreal Engine 5.8</small></h1>
  </div>
  <div class="ring">

    <div class="t"><b id="ringCount">0 / 0</b>tasks, cards and challenges ticked</div>

<script>
/* ===================== DATA ===================== */
/* ===================== LITERAL STEP HELPERS ===================== */
const K = (...k)=>k.map(x=>`<kbd>${x}</kbd>`).join("");
// Niagara: add a module to a stack group
function AM(mod, group, search){
  return `<b>Add ${mod}:</b> in the emitter's stack (right-hand panel), find the <b>${group}</b> group and click the <b>+</b> at the right end of its header row → type <code>${search}</code> → click <b>${mod}</b>. It is added at the bottom of ${group}.`;
}
// Niagara: type a value into a module input
function SV(mod, inp, val, was){
  return `<b>Type:</b> in <b>${mod}</b>, click the <b>${inp}</b> box${was!==undefined?` (it shows <i>${was}</i>)`:""}, type <code>${val}</code>, press ${K("Enter")}.`;
}
// Niagara: XYZ input
function SX(mod, inp, x, y, z, was){
  return `<b>Type:</b> in <b>${mod}</b>, the <b>${inp}</b> row has three boxes X, Y, Z${was?` (now <i>${was}</i>)`:""}. Click each one and type <code>${x}</code>, <code>${y}</code>, <code>${z}</code>, pressing ${K("Enter")} after each.`;
}
// Niagara: dropdown on a module input
function SD(mod, inp, cur, pick){
  return `<b>Dropdown:</b> in <b>${mod}</b>, click the <b>${inp}</b> box (it says <i>${cur}</i>) and choose <b>${pick}</b>. New rows appear under it.`;
}
// Niagara: curve via dynamic input
function SC(mod, inp, tpl){
  return `<b>Curve:</b> in <b>${mod}</b>, click the small <b>▾</b> at the right end of the <b>${inp}</b> row → type <code>float from curve</code> → click <b>Float from Curve</b>. A small curve appears under it. Below the curve is a row of tiny curve pictures (templates): hover them until the tooltip says <b>${tpl}</b> and click it.`;
}
// Material editor: add node
function MN(node, search, where){
  return `<b>Add ${node}:</b> right-click empty graph space <u>${where}</u> → in the search box type <code>${search}</code> → click <b>${node}</b>. It appears where you right-clicked.`;
}
// Material / Blueprint: wire
function MW(fn, fp, tn, tp){
  return `<b>Wire:</b> press and hold on <b>${fn}</b> › <span class="so">${fp}</span> <small>(pin on its right side)</small>, drag to <b>${tn}</b> › <span class="si">${tp}</span> <small>(pin on its left side)</small>, let go.`;
}
// Details panel value
function DV(what, field, val, was){
  return `<b>Details:</b> click <b>${what}</b> once. In the <b>Details</b> panel set <b>${field}</b>${was!==undefined?` (it shows <i>${was}</i>)`:""} to <code>${val}</code> and press ${K("Enter")}.`;
}
// Add an emitter to the open system
function AE(name){
  return `<b>New emitter:</b> right-click empty space in the <b>System Overview</b> graph (the middle panel) → <b>Add Emitter</b> → in the window that opens type <code>minimal</code> in its search box → pick <b>Minimal</b> → confirm with the add/create button at the bottom-right. A new emitter box appears. Double-click its name and type <code>${name}</code>, ${K("Enter")}. Click the box once so its stack shows on the right.`;
}
// Emitter state one-shot / loop
function ES(loop){
  return `<b>Emitter State:</b> in the <b>Emitter Update</b> group click <b>Emitter State</b>. Set <b>Life Cycle Mode</b> from <i>System</i> to <b>Self</b>. A <b>Loop Behavior</b> row appears: set it to <b>${loop}</b>.`;
}
// Solve forces fix
const SOLVE = `<b>Fix the red error:</b> a red <b>!</b> appears on the force/velocity modules: <i>"The module has unmet dependencies… SolveForcesAndVelocity"</i>. Click the error line and press its <b>Fix issue</b> button (<i>Add new dependency module SolveForcesAndVelocity</i>). A <b>Solve Forces and Velocity</b> module appears near the bottom of Particle Update, and the errors clear.`;

const BASICS = [
  ["Mouse first, then key","Unreal sends a shortcut to whichever panel the <b>mouse is over</b>. Hover the graph or viewport you mean before pressing a key."],
  ["Content Browser","The bottom panel (open it with "+K("Ctrl","Space")+" if it's hidden). Right-click empty space to make anything: <b>New Folder</b>, <b>Material</b>, <b>FX → Niagara System</b>, <b>Blueprint Class</b>. Double-click an asset to open it."],
  ["Save","Every editor window has a <b>Save</b> button top-left, or press "+K("Ctrl","S")+" with the mouse over that window. An asterisk * on a tab means unsaved."],
  ["Material editor layout","<b>Viewport</b> preview top-left, <b>Details</b> bottom-left, the <b>graph</b> in the middle, <b>Palette</b> on the right. The big node with your material's name is the <b>result node</b>: whatever you wire into it is the final look."],
  ["Add a material node","Right-click empty graph space → type in the search box → click the node. Or hold a hotkey and left-click: "+K("M")+" Multiply, "+K("A")+" Add, "+K("1")+" Constant, "+K("2")+" Constant2Vector, "+K("3")+" Constant3Vector, "+K("U")+" TexCoord, "+K("S")+" Scalar Parameter, "+K("V")+" Vector Parameter, "+K("O")+" One Minus, "+K("E")+" Power, "+K("P")+" Panner, "+K("L")+" Lerp."],
  ["Wire pins","Outputs are on a node's <b>right</b> side, inputs on its <b>left</b>. Press and hold on an output pin, drag to an input pin, let go. Drag from a pin into empty space to get a search menu that only lists nodes that fit. "+K("Alt")+"+click a pin cuts its wires."],
  ["Constants on math nodes","A Multiply, Add or Subtract with nothing wired into <b>B</b> uses the <b>Const B</b> number in the Details panel. Power uses <b>Const Exponent</b>. That saves a Constant node."],
  ["Material settings","Click empty graph space (nothing selected): the Details panel shows the material itself. That's where <b>Blend Mode</b>, <b>Shading Model</b> and <b>Two Sided</b> live."],
  ["Niagara editor layout","<b>Preview</b> top-left, <b>System Overview</b> graph in the middle (one box per emitter), the <b>stack</b> (Selection panel) on the right, <b>Parameters</b> / <b>User Parameters</b> on the left, the <b>timeline</b> along the bottom with play and loop buttons."],
  ["The stack","Click an emitter box: its stack shows on the right, top to bottom: <b>Properties</b>, <b>Emitter Spawn</b>, <b>Emitter Update</b>, <b>Particle Spawn</b>, <b>Particle Update</b>, <b>Render</b>. Modules run top to bottom. Drag a module by its name to reorder it. Its checkbox turns it off without deleting it."],
  ["Module inputs","Click a value to type. The small <b>▾</b> at a row's right end swaps the value for something smarter: a curve, a random range, or a link to a parameter (<b>Link Inputs</b>)."],
  ["Red and yellow marks","A red <b>!</b> is an error and a yellow one a warning. Click the message: many come with a <b>Fix issue</b> button that does the right thing for you."],
  ["Blueprint graph","In a Blueprint, the <b>Event Graph</b> tab is the canvas. Right-click empty space → search → click. White pins with arrows are <b>execution</b> (the order things happen): wire them left to right. Coloured pins carry values."],
  ["Viewport moves","Hold the right mouse button + "+K("W")+" "+K("A")+" "+K("S")+" "+K("D")+" to fly. "+K("F")+" frames the selected thing. In the Niagara editor, the timeline's buttons (bottom) play, pause and restart the preview."]
];

const STEPS = {
/* ============================== L1 ============================== */
l1:[
 {t:"Make a folder for the effect", goal:"An empty Content Browser folder called FX_Slam.", do:[
   `Open your Unreal project in UE 5.8 (any project works; a blank one is fine).`,
   `In the <b>Content Browser</b> (bottom panel; ${K("Ctrl","Space")} if hidden) click the <b>Content</b> folder on the left.`,
   `Right-click empty space in the asset area → <b>New Folder</b> → type <code>FX_Slam</code> → ${K("Enter")}. Double-click the folder to go inside.`
 ]},

 {t:"Material 1: a soft glowing dot (M_FX_Glow)", goal:"An additive, unlit material: a soft round glow, coloured by each particle.", hl:{g:1,n:["rge","pc","m1","m2","res"]}, do:[
   `Right-click empty space in FX_Slam → <b>Material</b> → type <code>M_FX_Glow</code> → ${K("Enter")}. Double-click it to open the material editor.`,
   `Click empty graph space once (so nothing is selected). In the <b>Details</b> panel (bottom-left) set <b>Blend Mode</b> from <i>Opaque</i> to <b>Additive</b>, and <b>Shading Model</b> from <i>Default Lit</i> to <b>Unlit</b>.`,
   MN("RadialGradientExponential","radial gradient exponential","on the left of the graph"),
   MN("Particle Color","particle color","below it"),
   `Hold ${K("M")} and left-click to the right of the gradient: a <b>Multiply</b> appears. Do it again further right for a second <b>Multiply</b>.`,
   MW("RadialGradientExponential","(its only output)","first Multiply","A"),
   MW("Particle Color","RGB","first Multiply","B"),
   MW("first Multiply","(output)","second Multiply","A"),
   MW("Particle Color","A","second Multiply","B"),
   MW("second Multiply","(output)","M_FX_Glow result node","Emissive Color"),
   `Click <b>Save</b> (top-left of the material editor).`
 ], see:`The preview sphere shows a soft white glow. It looks bright and blown out on its own: that's fine, particles tint and fade it.`,
 why:`<b>Additive</b> adds light to the screen, so black = invisible and overlapping glows get brighter. That's exactly how flashes, sparks and energy behave. <b>Particle Color</b> lets every particle carry its own colour and fade (its A channel) into this one material.`},

 {t:"Material 2: a shockwave ring (M_FX_Ring)", goal:"A thin glowing circle drawn by maths, with no texture.", hl:{g:2,n:["tc","c2","dist","sub","abs","mul","om","sat","pw","pc","m1","m2","res"]}, do:[
   `Right-click in FX_Slam → <b>Material</b> → <code>M_FX_Ring</code> → open it. Set <b>Blend Mode</b> = <b>Additive</b>, <b>Shading Model</b> = <b>Unlit</b> (same as before).`,
   `Hold ${K("U")} and click on the far left: a <b>TexCoord</b> node (the sprite's UVs, 0 to 1 across).`,
   `Hold ${K("2")} and click below it: a <b>Constant2Vector</b>. In its Details set <b>R</b> <code>0.5</code> and <b>G</b> <code>0.5</code> (the centre of the sprite).`,
   MN("Distance","distance","to the right of both"),
   MW("TexCoord","(output)","Distance","A"), MW("Constant2Vector","(output)","Distance","B"),
   MN("Subtract","subtract","to the right of Distance"),
   MW("Distance","(output)","Subtract","A"), DV("Subtract","Const B","0.42","0.0"),
   MN("Abs","abs","to the right"), MW("Subtract","(output)","Abs","(input)"),
   `Hold ${K("M")} + click to the right → <b>Multiply</b>. Wire Abs into its <b>A</b>. Set its <b>Const B</b> to <code>14</code>.`,
   `Hold ${K("O")} + click to the right → <b>One Minus</b>. Wire Multiply into it.`,
   MN("Saturate","saturate","to the right"), `Wire One Minus into Saturate.`,
   `Hold ${K("E")} + click to the right → <b>Power</b>. Wire Saturate into <b>Base</b>. Set <b>Const Exponent</b> to <code>3</code>.`,
   MN("Particle Color","particle color","below the Power node"),
   `Add two <b>Multiply</b> nodes (${K("M")}+click). First: Power → <b>A</b>, Particle Color <b>RGB</b> → <b>B</b>. Second: first Multiply → <b>A</b>, Particle Color <b>A</b> → <b>B</b>.`,
   MW("second Multiply","(output)","M_FX_Ring result node","Emissive Color"),
   `<b>Save</b>.`
 ], see:`The preview shows a thin bright circle near the edge of a square (switch the preview shape to a plane with the buttons under the preview if the sphere makes it hard to read).`,
 why:`<b>Distance from the centre</b> is a gradient from 0 to about 0.7. Subtracting 0.42 and taking <b>Abs</b> makes a V that is 0 exactly on a circle of radius 0.42. Multiply sharpens it, One Minus flips it so the circle is bright, Power makes the edge crisp.`},

 {t:"Material 3: soft dust (M_FX_Dust)", goal:"A see-through, unlit puff that fades out where it touches the floor.", hl:{g:3,n:["rge","pc","m1","df","res"]}, do:[
   `New material <code>M_FX_Dust</code>, open it. <b>Blend Mode</b> = <b>Translucent</b>, <b>Shading Model</b> = <b>Unlit</b>.`,
   MN("RadialGradientExponential","radial gradient exponential","on the left"),
   MN("Particle Color","particle color","below it"),
   `${K("M")}+click → <b>Multiply</b>. Gradient → <b>A</b>, Particle Color <b>A</b> → <b>B</b>.`,
   MN("DepthFade","depth fade","to the right of Multiply"),
   MW("Multiply","(output)","DepthFade","Opacity"), DV("DepthFade","Fade Distance","60"),
   MW("DepthFade","(output)","M_FX_Dust result node","Opacity"),
   MW("Particle Color","RGB","M_FX_Dust result node","Emissive Color"),
   `<b>Save</b>.`
 ], why:`<b>Depth Fade</b> fades the sprite out over the last 60 cm before it meets the floor, so dust never shows a hard straight line where the flat card cuts the ground.`},

 {t:"Create the system and the Flash emitter", goal:"NS_GroundSlam with one emitter called Flash that fires once.", hl:{g:0,n:["flash.state","flash.burst"]}, do:[
   `In FX_Slam right-click → <b>FX</b> → <b>Niagara System</b>. The <b>Create Niagara System</b> window opens.`,
   `Use its search box: type <code>minimal</code> and pick <b>Minimal</b> (the emitter template). Click the create/finish button at the bottom-right. Name it <code>NS_GroundSlam</code>, ${K("Enter")}, and double-click it to open.`,
   `In the <b>System Overview</b> (middle) double-click the emitter's name (<i>Minimal</i>) and type <code>Flash</code>, ${K("Enter")}. Click the box once so its stack shows on the right.`,
   ES("Once"),
   AM("Spawn Burst Instantaneous","Emitter Update","spawn burst"),
   SV("Spawn Burst Instantaneous","Spawn Count","1","1"),
 ], see:`Nothing visible yet, or a single default sprite blinking in the preview.`,
 why:`<b>Self</b> lets this emitter run its own clock instead of the system's. <b>Once</b> makes it a one-shot: impacts happen once, they don't loop.`},

 {t:"Flash: bright, big, and gone in 0.15 s", goal:"A 5 m warm flash that fades out fast.", hl:{g:0,n:["flash.init","flash.scol","flash.spr"]}, do:[
   `In <b>Particle Spawn</b> click <b>Initialize Particle</b>.`,
   SV("Initialize Particle","Lifetime","0.15","5.0"),
   SD("Initialize Particle","Color Mode","Unset","Direct Set"),
   `A <b>Color</b> row appears. Click the small <b>▸</b> in front of it to show <b>R G B A</b> boxes and type R <code>6</code>, G <code>3.5</code>, B <code>1.5</code>, A <code>1</code>. Values above 1 are HDR: they glow.`,
   SD("Initialize Particle","Sprite Size Mode","Unset","Uniform"),
   SV("Initialize Particle","Uniform Sprite Size","500"),
   AM("Scale Color","Particle Update","scale color"),
   SC("Scale Color","Scale Alpha","Linear Ramp Down"),
   `In <b>Render</b> click <b>Sprite Renderer</b>. Click its <b>Material</b> box and pick <b>M_FX_Glow</b>.`
 ], see:`In the preview, a large warm flash that pops and fades each time the timeline restarts.`},

 {t:"Flash: a real light that hits the floor", goal:"The flash lights the ground and walls for one beat.", hl:{g:0,n:["flash.light","flash.lr"]}, do:[
   `On the <b>Render</b> group header click <b>+</b> → <b>Light Renderer</b>.`,
   `Click the new <b>Light Renderer</b>. <u>Untick</u> <b>Use Inverse Squared Falloff</b>. Tick <b>Alpha Scales Brightness</b> (so the light fades with the flash).`,
   AM("Light Attributes","Particle Spawn","light attributes"),
   SD("Light Attributes","Radius","Unset","Apply"),
   SV("Light Attributes","Light Radius","800","100")
 ], why:`The module's own tooltip says Radius <i>"only works when Inverse Squared Falloff is Disabled"</i>, which is why you untick it first. A flash with no light looks pasted on: the floor lighting up is what sells an impact.`},

 {t:"Ring: a shockwave that grows flat on the ground", goal:"A ring that expands to 12 m wide in 0.6 s.", hl:{g:0,n:["ring.state","ring.burst","ring.init","ring.size","ring.scol"]}, do:[
   AE("Ring"),
   ES("Once"),
   AM("Spawn Burst Instantaneous","Emitter Update","spawn burst"),
   `<b>Initialize Particle</b>: Lifetime <code>0.6</code>; Color Mode <b>Direct Set</b>, Color R <code>3</code> G <code>1.6</code> B <code>0.6</code> A <code>1</code>; Sprite Size Mode <b>Uniform</b>, Uniform Sprite Size <code>1200</code>.`,
   `Still in Initialize Particle: tick the checkbox in front of <b>Position Offset</b>, then type X <code>0</code>, Y <code>0</code>, Z <code>2</code> (lifts it 2 cm so it never flickers into the floor).`,
   AM("Scale Sprite Size","Particle Update","scale sprite size"),
   `In <b>Scale Sprite Size</b> the mode already says <i>Uniform Curve</i>. Under its curve click the template whose tooltip is <b>Smooth Ramp Up</b>.`,
   AM("Scale Color","Particle Update","scale color"), SC("Scale Color","Scale Alpha","Linear Ramp Down"),
   `<b>Sprite Renderer</b> → Material <b>M_FX_Ring</b>.`
 ]},

 {t:"Ring: lay it flat on the floor", goal:"The ring faces straight up instead of turning to face the camera.", hl:{g:0,n:["ring.face","ring.spr"]}, do:[
   AM("Sprite Facing and Alignment","Particle Update","sprite facing"),
   SX("Sprite Facing and Alignment","Sprite Facing","0","0","1","1, 0, 0"),
   `Tick the checkbox in front of <b>Sprite Alignment</b>, then type X <code>1</code>, Y <code>0</code>, Z <code>0</code> (it was 0, 1, 0).`,
   `Click <b>Sprite Renderer</b>. Set <b>Facing Mode</b> from <i>Automatic</i> to <b>Custom Facing Vector</b>, and <b>Alignment</b> from <i>Automatic</i> to <b>Custom Alignment</b>.`
 ], see:`A flat ring racing outward across the preview floor.`,
 why:`Facing alone isn't enough: with only a facing vector the sprite borrows its other axis from the camera, and from a level, player's-eye view the quad can collapse to a line. Setting the alignment too fixes both axes.`},

 {t:"Sparks: 60 hot streaks thrown up and out", goal:"Fast sparks in a wide upward cone.", hl:{g:0,n:["sparks.burst","sparks.init","sparks.shape","sparks.cone"]}, do:[
   AE("Sparks"), ES("Once"),
   AM("Spawn Burst Instantaneous","Emitter Update","spawn burst"), SV("Spawn Burst Instantaneous","Spawn Count","60","1"),
   `<b>Initialize Particle</b>: <b>Lifetime Mode</b> <i>Direct Set</i> → <b>Random</b>; Lifetime Min <code>0.4</code>, Lifetime Max <code>0.9</code>. Color Mode <b>Direct Set</b>: R <code>8</code> G <code>3</code> B <code>0.8</code> A <code>1</code>. Sprite Size Mode <b>Random Uniform</b>: Min <code>4</code>, Max <code>9</code>.`,
   AM("Shape Location","Particle Spawn","shape location"), SV("Shape Location","Sphere Radius","15","100"),
   AM("Add Velocity in Cone","Particle Spawn","velocity in cone"),
   SV("Add Velocity in Cone","Velocity Strength","900","0"),
   SV("Add Velocity in Cone","Cone Angle","70","45"),
   SX("Add Velocity in Cone","Cone Axis","0","0","1","1, 0, 0")
 ], why:`Cone Axis defaults to <b>X</b> (sideways). Pointing it at <b>Z</b> throws the sparks up out of the ground.`},

 {t:"Sparks: gravity, drag, bouncing and stretch", goal:"Sparks arc, slow down, bounce off the floor and stretch with speed.", hl:{g:0,n:["sparks.grav","sparks.drag","sparks.col","sparks.solve","sparks.ssbs","sparks.spr"]}, do:[
   AM("Gravity Force","Particle Update","gravity"), `(It already says Z <i>-980</i>, real gravity in cm/s².)`,
   AM("Drag","Particle Update","drag"), SV("Drag","Drag","1.5","1.0"),
   AM("Collision","Particle Update","collision"), `(Defaults are fine: <i>Ray Traced</i>, Restitution <i>0.6</i>, Friction <i>0.25</i>.)`,
   SOLVE,
   AM("Scale Sprite Size by Speed","Particle Update","size by speed"),
   `Make sure <b>Scale Sprite Size by Speed</b> sits <u>below</u> Solve Forces and Velocity (drag it by its name if not). Set its <b>Max Scale Factor</b> to X <code>1</code>, Y <code>6</code>.`,
   AM("Scale Color","Particle Update","scale color"), SC("Scale Color","Scale Alpha","Linear Ramp Down"),
   `<b>Sprite Renderer</b>: Material <b>M_FX_Glow</b>, <b>Alignment</b> <i>Automatic</i> → <b>Velocity Aligned</b>.`
 ], see:`Streaks that fly up, stretch while fast, shrink to dots as they slow, and bounce on the preview floor.`,
 why:`Checked in UE 5.8: the Minimal template has no solver, so every force shows <i>"unmet dependencies"</i> until <b>Solve Forces and Velocity</b> is in. Scale Sprite Size by Speed reads the solved velocity, so it must come <i>after</i> it.`},

 {t:"Dust: a ring of slow, rolling smoke", goal:"Dust pushed out along the ground, churning, swelling and fading.", hl:{g:0,n:["dust.burst","dust.init","dust.shape","dust.vel","dust.drag","dust.curl","dust.size","dust.scol"]}, do:[
   AE("Dust"), ES("Once"),
   AM("Spawn Burst Instantaneous","Emitter Update","spawn burst"),
   SV("Spawn Burst Instantaneous","Spawn Count","30","1"), SV("Spawn Burst Instantaneous","Spawn Time","0.03","0"),
   `<b>Initialize Particle</b>: Lifetime Mode <b>Random</b>, Min <code>1.5</code> Max <code>2.5</code>. Color Mode <b>Direct Set</b>: R <code>0.35</code> G <code>0.3</code> B <code>0.25</code> A <code>0.6</code>. Sprite Size Mode <b>Random Uniform</b>: Min <code>120</code> Max <code>220</code>. <b>Sprite Rotation Mode</b> <i>Unset</i> → <b>Random</b>.`,
   AM("Shape Location","Particle Spawn","shape location"),
   SD("Shape Location","Shape Primitive","Sphere","Ring / Disc"),
   SV("Shape Location","Ring Radius","60","100"),
   AM("Add Velocity from Point","Particle Spawn","velocity from point"), SV("Add Velocity from Point","Velocity Strength","500","100"),
   AM("Drag","Particle Update","drag"), SV("Drag","Drag","3","1.0"),
   AM("Curl Noise Force","Particle Update","curl noise"), SV("Curl Noise Force","Noise Strength","60","10"),
   SOLVE,
   AM("Scale Sprite Size","Particle Update","scale sprite size"), `Click its curve template <b>Linear Ramp Up</b>.`,
   AM("Scale Color","Particle Update","scale color"), SC("Scale Color","Scale Alpha","Ramp Up Down"),
   `<b>Sprite Renderer</b> → Material <b>M_FX_Dust</b>.`
 ], why:`Each layer gets its own <b>size and speed step</b>: flash = huge and instant, ring = big and fast, sparks = tiny and fast, dust = big and slow. Two layers at the same size and speed would just be one muddier layer. <b>Spawn Time 0.03</b> lets dust arrive a beat after the hit.`},

 {t:"Debris: chunks that tumble and bounce", goal:"14 small rock chunks (mesh particles) thrown up, spinning, landing.", hl:{g:0,n:["debris.burst","debris.init","debris.cone","debris.orient","debris.grav","debris.col","debris.solve","debris.spin","debris.mesh"]}, do:[
   AE("Debris"), ES("Once"),
   AM("Spawn Burst Instantaneous","Emitter Update","spawn burst"), SV("Spawn Burst Instantaneous","Spawn Count","14","1"), SV("Spawn Burst Instantaneous","Spawn Time","0.02","0"),
   `<b>Initialize Particle</b>: Lifetime <code>2.5</code>. <b>Mesh Scale Mode</b> <i>Unset</i> → <b>Random Uniform</b>: Mesh Uniform Scale Min <code>0.05</code>, Max <code>0.15</code>.`,
   AM("Add Velocity in Cone","Particle Spawn","velocity in cone"), `Velocity Strength <code>700</code>, Cone Angle <code>35</code>, Cone Axis X <code>0</code> Y <code>0</code> Z <code>1</code>.`,
   AM("Initial Mesh Orientation","Particle Spawn","initial mesh orientation"), `(Mode already says <i>Random</i>.)`,
   AM("Gravity Force","Particle Update","gravity"),
   AM("Collision","Particle Update","collision"), SD("Collision","Radius Calculation Type","Sprite","Mesh"),
   SOLVE,
   AM("Update Mesh Orientation","Particle Update","update mesh orientation"), SV("Update Mesh Orientation","Rotation Rate","3","1"),
   `<b>Render</b> + → <b>Mesh Renderer</b>. In it open <b>Meshes</b> → <b>Index [0]</b> → <b>Mesh</b>: pick <b>Cube</b> (Engine › BasicShapes) or a rock you modelled yourself (your Geometry Nodes rock exported as FBX works well).`,
   `Untick the checkbox on the old <b>Sprite Renderer</b> so only the meshes draw.`
 ], why:`<b>Same material as the world:</b> debris reads as "made of the ground" only if it looks like the ground. Real productions reuse the level's own rock meshes and materials for debris.`},

 {t:"Fire it in a level", goal:"The full slam playing in a lit level, landing on real geometry.", do:[
   `Press <b>Save</b> in the Niagara editor.`,
   `Open a level with a floor (or <b>File → New Level → Basic</b>).`,
   `Drag <b>NS_GroundSlam</b> from the Content Browser onto the floor in the viewport.`,
   `Press <b>Play</b> (the green ▶ in the main toolbar, or ${K("Alt","P")}). The slam fires once as the game starts. Press ${K("Esc")} and Play again to watch it again.`,
   `Look for: flash lights the floor, ring races outward flat, sparks bounce, dust rolls out a beat later, chunks tumble and settle.`
 ], pro:`<b>Timing is the effect.</b> Everything at 0.00 s feels like one hit. Try moving dust to 0.08 s and debris to 0.05 s and feel the difference: a tiny delay reads as weight.`}
],

/* ============================== L2 ============================== */
l2:[
 {t:"Material: a hot ribbon core (M_FX_TrailCore)", goal:"A ribbon material that's brightest along its centre line and fades to its edges.", hl:{g:1,n:["tc","cm","om","mul","m4","pw","pc","m1","m2","res"]}, do:[
   `Content Browser → <b>Content</b> → right-click → <b>New Folder</b> <code>FX_Trail</code>, go inside.`,
   `Right-click → <b>Material</b> → <code>M_FX_TrailCore</code> → open. Click empty graph: <b>Blend Mode</b> <b>Additive</b>, <b>Shading Model</b> <b>Unlit</b>, and tick <b>Two Sided</b> (ribbons twist, so their back must draw too).`,
   `${K("U")}+click on the left → <b>TexCoord</b>.`,
   MN("ComponentMask","mask","to its right"), `In the Mask's Details tick only <b>G</b> (untick R, B, A if they're ticked). G is the coordinate across the ribbon.`,
   MW("TexCoord","(output)","ComponentMask","(input)"),
   `${K("O")}+click → <b>One Minus</b>; wire the Mask into it.`,
   `${K("M")}+click → <b>Multiply</b>: Mask → <b>A</b>, One Minus → <b>B</b>.`,
   `${K("M")}+click → another <b>Multiply</b>: previous Multiply → <b>A</b>, <b>Const B</b> <code>4</code>.`,
   `${K("E")}+click → <b>Power</b>: wire the ×4 into <b>Base</b>, <b>Const Exponent</b> <code>3</code>.`,
   MN("Particle Color","particle color","below"),
   `Two more <b>Multiply</b> nodes: Power × Particle Color <b>RGB</b>, then that × Particle Color <b>A</b>.`,
   MW("last Multiply","(output)","M_FX_TrailCore result","Emissive Color"), `<b>Save</b>.`
 ], why:`<b>x × (1 − x) × 4</b> is a little hill: 0 at both edges (x = 0 and x = 1), exactly 1 in the middle. Power 3 squeezes it into a thin hot line. Ribbons put V across their width, so this works on any ribbon.`},

 {t:"Material: a wider churning glow (M_FX_TrailGlow)", goal:"Same shape as the core but softer, with noise flowing along the trail.", hl:{g:1,n:["tc2","pan","app","c0","noise","mn"]}, do:[
   `In the Content Browser right-click <b>M_FX_TrailCore</b> → <b>Duplicate</b> → name <code>M_FX_TrailGlow</code> → open it.`,
   DV("Power node","Const Exponent","1.2","3"),
   `${K("U")}+click below the graph → a second <b>TexCoord</b>. In its Details set <b>UTiling</b> <code>3</code>.`,
   `${K("P")}+click → <b>Panner</b>. Wire the new TexCoord into <b>Coordinate</b>. In Details set <b>Speed X</b> <code>-2.5</code>, Speed Y <code>0</code>.`,
   `${K("1")}+click → <b>Constant</b> (value 0).`,
   MN("Append","append","to the right of the Panner"), `Panner → <b>A</b>, Constant → <b>B</b> (turns the 2D UV into a 3D point).`,
   MN("Noise","noise","to the right"), MW("Append","(output)","Noise","World Position"),
   DV("Noise","Scale","4","1.0"), `In the same Details set <b>Output Min</b> <code>0</code> and <b>Output Max</b> <code>1</code>.`,
   `${K("M")}+click → <b>Multiply</b> between Power and the colour Multiply: Power → <b>A</b>, Noise → <b>B</b>, and wire its output into the Multiply that used to take Power.`,
   `<b>Save</b>.`
 ], why:`Panning noise along U (the ribbon's length) makes the glow look like it's streaming off the blade. The ribbon itself stays still. Only the material moves, and that costs almost nothing.`},

 {t:"A spinning test rig (BP_SpinTest)", goal:"A Blueprint that swings a blade in a circle, so a trail has something to follow.", do:[
   `In FX_Trail right-click → <b>Blueprint Class</b> → <b>Actor</b> → name <code>BP_SpinTest</code> → open it.`,
   `In the <b>Components</b> panel (top-left) click <b>+ Add</b> → type <code>static mesh</code> → <b>Static Mesh</b>. Name it <code>Blade</code>. In Details: <b>Static Mesh</b> → <b>Cube</b>; <b>Location</b> X <code>60</code>; <b>Scale</b> X <code>1.2</code>, Y <code>0.05</code>, Z <code>0.02</code>.`,
   `<b>+ Add</b> → type <code>rotating</code> → <b>Rotating Movement</b>. In Details set <b>Rotation Rate</b> Z (yaw) <code>540</code>.`,
   `<b>+ Add</b> → type <code>niagara</code> → click the <b>Niagara</b> particle system component. Name it <code>TipFX</code>, <b>Location</b> X <code>120</code> (the blade tip). You'll set its system in step 6.`,
   `Click <b>Compile</b>, then <b>Save</b>.`
 ]},

 {t:"Create NS_BladeTrail and its Core emitter", goal:"An emitter that drops a particle every 4 cm the tip moves.", hl:{g:0,n:["core.state","core.spu","core.init"]}, do:[
   `In FX_Trail right-click → <b>FX</b> → <b>Niagara System</b> → pick <b>Minimal</b> → create → name <code>NS_BladeTrail</code> → open.`,
   `Rename the emitter <code>Core</code> (double-click its name in the System Overview).`,
   ES("Infinite"),
   AM("Spawn Per Unit","Emitter Update","spawn per unit"), SV("Spawn Per Unit","Spawn Spacing","4","20"),
   `<b>Initialize Particle</b>: Lifetime <code>0.18</code>; Color Mode <b>Direct Set</b>: R <code>10</code> G <code>6</code> B <code>3</code> A <code>1</code>.`,
   SD("Initialize Particle","Ribbon Width Mode","Unset","Direct Set"), SV("Initialize Particle","Ribbon Width","6","5")
 ], why:`<b>Spawn Per Unit</b> spawns by distance travelled, not by time: a fast swing gets the same smooth trail as a slow one. A standing blade spawns nothing.`},

 {t:"Swap the sprite for a ribbon", goal:"The particles are joined into one continuous strip.", hl:{g:0,n:["core.rib"]}, do:[
   `In <b>Render</b> right-click <b>Sprite Renderer</b> → <b>Delete</b> (or untick it).`,
   `<b>Render</b> + → <b>Ribbon Renderer</b>. Set its <b>Material</b> to <b>M_FX_TrailCore</b>.`,
   `Leave <b>Facing Mode</b> on <i>Screen</i> and the UV settings as they are (<i>Non-Uniform Scale (By Total Length)</i>).`
 ]},

 {t:"Taper and fade the tail", goal:"Thick at the blade, thin and dim at the old end.", hl:{g:0,n:["core.srw","core.scol"]}, do:[
   AM("Scale Ribbon Width","Particle Update","scale ribbon width"), SC("Scale Ribbon Width","Ribbon Width Scale","Linear Ramp Down"),
   AM("Scale Color","Particle Update","scale color"), SC("Scale Color","Scale Alpha","Linear Ramp Down"),
   `<b>Save</b>. Open <b>BP_SpinTest</b>, click <b>TipFX</b>, set its <b>Niagara System Asset</b> to <b>NS_BladeTrail</b>, <b>Compile</b>, <b>Save</b>.`
 ], see:`Drop BP_SpinTest in a level and press Play: a thin white-hot arc follows the blade tip, tapering away behind it.`},

 {t:"Glow layer: copy the core, make it wide and soft", goal:"A second, wider ribbon behind the core.", hl:{g:0,n:["glow.init","glow.rib"]}, do:[
   `In the System Overview click the <b>Core</b> box, press ${K("Ctrl","C")}, click empty space, press ${K("Ctrl","V")}. Rename the copy <code>Glow</code>.`,
   `Glow's <b>Initialize Particle</b>: Lifetime <code>0.35</code>; Color R <code>2</code> G <code>0.6</code> B <code>0.15</code> A <code>0.6</code>; Ribbon Width <code>40</code>.`,
   `Glow's <b>Ribbon Renderer</b> → Material <b>M_FX_TrailGlow</b>.`
 ], why:`<b>Core + glow</b> is the oldest trick in energy VFX: a thin over-bright line sells heat, a wide dim halo sells size. Neither works alone.`},

 {t:"Embers shed from the blade", goal:"Small sparks flicking off the tip and drifting away.", hl:{g:0,n:["emb.state","emb.spu","emb.init","emb.vel","emb.curl","emb.drag","emb.solve","emb.scol","emb.spr"]}, do:[
   AE("Embers"), ES("Infinite"),
   AM("Spawn Per Unit","Emitter Update","spawn per unit"), SV("Spawn Per Unit","Spawn Spacing","25","20"),
   `<b>Initialize Particle</b>: Lifetime Mode <b>Random</b>, Min <code>0.3</code> Max <code>0.7</code>; Color Mode <b>Direct Set</b> R <code>6</code> G <code>2</code> B <code>0.5</code> A <code>1</code>; Sprite Size Mode <b>Random Uniform</b> Min <code>2</code> Max <code>5</code>.`,
   AM("Add Velocity from Point","Particle Spawn","velocity from point"), SV("Add Velocity from Point","Velocity Strength","60","100"),
   AM("Curl Noise Force","Particle Update","curl noise"), SV("Curl Noise Force","Noise Strength","40","10"),
   AM("Drag","Particle Update","drag"), SV("Drag","Drag","2","1.0"),
   SOLVE,
   AM("Scale Color","Particle Update","scale color"), SC("Scale Color","Scale Alpha","Linear Ramp Down"),
   `<b>Sprite Renderer</b>: Material <b>M_FX_Glow</b> (from FX_Slam), <b>Alignment</b> <b>Velocity Aligned</b>.`
 ]},

 {t:"Watch it at speed and tune", goal:"A trail that stays smooth at any swing speed.", do:[
   `<b>Save</b>, then Play the level with BP_SpinTest in it.`,
   `In BP_SpinTest's <b>Rotating Movement</b> try Rotation Rate Z <code>1440</code>. If the arc turns into straight chords, lower Core's <b>Spawn Spacing</b> to <code>2</code>.`,
   `If the glow looks like a flat card from the side, that's Screen facing doing its job. It always turns to the camera.`
 ], pro:`<b>Real weapons:</b> put TipFX on a socket at the blade tip of your weapon mesh and switch it on and off with an Animation Notify for the swing frames only. It's the same system, driven by the animation.`}
]
};

/* ============================== L3 ============================== */
STEPS.l3 = [
 {t:"Material: the rift's black disc and burning rim", goal:"A dark round hole with a razor-bright edge.", hl:{g:1,n:["tc","c2","dist","cmin","cmax","ss","om1","sub","abs","m25","sat","om2","res"]}, do:[
   `Content Browser → <b>Content</b> → new folder <code>FX_Rift</code>. Inside: right-click → <b>Material</b> → <code>M_FX_RiftCore</code> → open.`,
   `Click empty graph: <b>Blend Mode</b> <b>Translucent</b>, <b>Shading Model</b> <b>Unlit</b>.`,
   `${K("U")}+click → <b>TexCoord</b>. ${K("2")}+click below → <b>Constant2Vector</b> with R <code>0.5</code>, G <code>0.5</code>.`,
   MN("Distance","distance","to their right"), `TexCoord → <b>A</b>, Constant2Vector → <b>B</b>. Call this output <b>d</b>: 0 at the centre, 0.5 at the sprite's edge.`,
   MN("SmoothStep","smoothstep","to the right of Distance"),
   `${K("1")}+click twice → two <b>Constant</b> nodes. Set one to <code>0.40</code> and wire it to SmoothStep <b>Min</b>; set the other to <code>0.46</code> and wire it to <b>Max</b>. Wire Distance into <b>Value</b>.`,
   `${K("O")}+click → <b>One Minus</b>; wire SmoothStep into it. Wire One Minus into the result node's <b>Opacity</b>. (Inside the circle = 1, outside = 0.)`,
   MN("Subtract","subtract","below SmoothStep"), `Distance → <b>A</b>, <b>Const B</b> <code>0.43</code>.`,
   MN("Abs","abs","to its right"), `${K("M")}+click → <b>Multiply</b>, Abs → <b>A</b>, Const B <code>25</code>.`,
   MN("Saturate","saturate","to its right"), `${K("O")}+click → <b>One Minus</b> after Saturate. This is the <b>rim</b>: a thin ring of 1 at radius 0.43.`
 ], see:`Opacity alone makes a dark disc on the preview. The rim isn't wired to anything yet.`},

 {t:"Material: spiral arms turning inside the rift", goal:"Faint spiral bands rotating into the hole, plus the hot rim.", hl:{g:1,n:["vtr","msk","m6","m8","add1","time","mt","add2","sin","sat2","mdisc","mrim","addc","pc","mpc","res"]}, do:[
   MN("VectorToRadialValue","vector to radial","below everything, on the left"),
   `Wire the first <b>TexCoord</b> into its <b>Vector or UVs</b> input.`,
   MN("ComponentMask","mask","to its right"), `Wire <b>Radial Coordinates</b> into it; in Details tick only <b>R</b> (the angle around the centre, 0 to 1).`,
   `${K("M")}+click → <b>Multiply</b>: Mask → A, Const B <code>6</code> (six arms).`,
   `${K("M")}+click → another <b>Multiply</b>: <b>Distance</b> (d) → A, Const B <code>8</code> (twist the arms into spirals).`,
   `${K("A")}+click → <b>Add</b>: the two Multiplies → A and B.`,
   MN("Time","time","below the Add"), `${K("M")}+click → <b>Multiply</b>: Time → A, Const B <code>-0.6</code>.`,
   `${K("A")}+click → <b>Add</b>: previous Add → A, Time Multiply → B.`,
   MN("Sine","sine","to the right"), `Wire the Add in. Its <b>Period</b> in Details stays <i>1</i> (one full wave per 1.0).`,
   MN("Saturate","saturate","to the right"), `Wire Sine into it: these are the spiral bands.`,
   `${K("M")}+click → <b>Multiply</b>: bands → A, the disc's <b>One Minus</b> (the one wired to Opacity) → B. This keeps the bands inside the hole.`,
   `${K("M")}+click → <b>Multiply</b>: <b>rim</b> (second One Minus) → A, Const B <code>15</code>.`,
   `${K("A")}+click → <b>Add</b>: rim ×15 → A, bands → B.`,
   MN("Particle Color","particle color","nearby"), `${K("M")}+click → <b>Multiply</b>: Add → A, Particle Color <b>RGB</b> → B. Wire it into <b>Emissive Color</b>. <b>Save</b>.`
 ], why:`<b>Black disc, thin bright rim:</b> the edge is the brightest thing in view and there's almost no glowing area, so it reads as a hole in the world, not a lamp. <b>Angle × 6 + distance × 8 − time</b> is the whole spiral: angle makes arms, distance bends them, time turns them.`},

 {t:"Material: a soft floor glow with Depth Fade (M_FX_FloorGlow)", goal:"A big glow pool that melts into the ground instead of showing a hard card edge.", hl:{g:2,n:["rge","pc","m1","df","res"]}, do:[
   `New material <code>M_FX_FloorGlow</code>. <b>Blend Mode</b> <b>Translucent</b>, <b>Shading Model</b> <b>Unlit</b>.`,
   MN("RadialGradientExponential","radial gradient exponential","on the left"), MN("Particle Color","particle color","below"),
   `${K("M")}+click → <b>Multiply</b>: gradient → A, Particle Color <b>A</b> → B.`,
   MN("DepthFade","depth fade","to the right"), MW("Multiply","(output)","DepthFade","Opacity"), DV("DepthFade","Fade Distance","40"),
   `DepthFade → result <b>Opacity</b>. Particle Color <b>RGB</b> → <b>Emissive Color</b>. <b>Save</b>.`
 ]},

 {t:"System NS_Rift: the Core disc that lives forever", goal:"One sprite that appears once and never dies, lying flat, local to the actor.", hl:{g:0,n:["core.props","core.state","core.burst","core.init","core.pst","core.face","core.spr"]}, do:[
   `In FX_Rift right-click → <b>FX</b> → <b>Niagara System</b> → <b>Minimal</b> → name <code>NS_Rift</code> → open. Rename the emitter <code>Core</code>.`,
   `At the very top of Core's stack click <b>Properties</b> and tick <b>Local Space</b> (the rift turns and moves with its actor).`,
   ES("Infinite"),
   AM("Spawn Burst Instantaneous","Emitter Update","spawn burst"),
   `In it tick the checkbox in front of <b>Loop Count Limit</b> and leave the value at <code>1</code>. The burst fires on the first loop only.`,
   `<b>Particle Update</b> → <b>Particle State</b>: untick <b>Kill Particles When Lifetime Has Elapsed</b>.`,
   `<b>Initialize Particle</b>: Color Mode <b>Direct Set</b> R <code>1.2</code> G <code>0.35</code> B <code>3</code> A <code>1</code>; Sprite Size Mode <b>Uniform</b>, <code>400</code>; tick <b>Position Offset</b> and set Z <code>2</code>.`,
   AM("Sprite Facing and Alignment","Particle Update","sprite facing"),
   `Sprite Facing X <code>0</code> Y <code>0</code> Z <code>1</code>; tick <b>Sprite Alignment</b> and set X <code>1</code> Y <code>0</code> Z <code>0</code>.`,
   `<b>Sprite Renderer</b>: Material <b>M_FX_RiftCore</b>, Facing Mode <b>Custom Facing Vector</b>, Alignment <b>Custom Alignment</b>.`
 ], why:`<b>A long-lived single particle</b> is the cheap way to draw a looping body: one sprite, no respawning, the material does all the motion. <b>Loop Count Limit 1</b> plus "don't kill when lifetime ends" means it's spawned once and stays.`},

 {t:"FloorGlow: the pool of light under it", goal:"A 9 m glow pool around the rift.", hl:{g:0,n:["floor.init","floor.spr"]}, do:[
   `Copy the Core emitter (${K("Ctrl","C")} / ${K("Ctrl","V")} in the System Overview) and rename the copy <code>FloorGlow</code>.`,
   `FloorGlow's <b>Initialize Particle</b>: Color R <code>0.6</code> G <code>0.15</code> B <code>1.6</code> A <code>1</code>; Uniform Sprite Size <code>900</code>; Position Offset Z <code>1</code>.`,
   `FloorGlow's <b>Sprite Renderer</b> → Material <b>M_FX_FloorGlow</b>.`
 ]},

 {t:"Wisps: a GPU emitter with fixed bounds", goal:"A GPU emitter that won't get culled by mistake.", hl:{g:0,n:["wisps.props","wisps.state","wisps.rate","wisps.init","wisps.shape"]}, do:[
   AE("Wisps"), ES("Infinite"),
   `Click Wisps' <b>Properties</b>: tick <b>Local Space</b>; set <b>Sim Target</b> to <b>GPUCompute Sim</b>.`,
   `A yellow warning appears: <i>"The emitter is GPU and is using dynamic bounds mode… Missing fixed bounds."</i> In the same Properties set <b>Calculate Bounds Mode</b> to <b>Fixed</b>, then <b>Fixed Bounds</b> Min X <code>-400</code> Y <code>-400</code> Z <code>-50</code>, Max X <code>400</code> Y <code>400</code> Z <code>500</code>.`,
   AM("Spawn Rate","Emitter Update","spawn rate"), SV("Spawn Rate","SpawnRate","300","1"),
   `<b>Initialize Particle</b>: Lifetime Mode <b>Random</b> Min <code>1.2</code> Max <code>2.2</code>; Color Mode <b>Direct Set</b> R <code>2</code> G <code>0.6</code> B <code>6</code> A <code>1</code>; Sprite Size Mode <b>Random Uniform</b> Min <code>3</code> Max <code>7</code>.`,
   AM("Shape Location","Particle Spawn","shape location"), SD("Shape Location","Shape Primitive","Sphere","Ring / Disc"), SV("Shape Location","Ring Radius","170","100")
 ], why:`Checked in UE 5.8: a GPU emitter on dynamic bounds raises exactly this warning. The CPU can't see GPU particles, so it can't measure where they are. Wrong bounds make the effect vanish when its centre leaves the screen.`},

 {t:"Wisps: get sucked in, swirling", goal:"Wisps born on the rim spiral inward and die at the centre.", hl:{g:0,n:["wisps.vortex","wisps.attr","wisps.curl","wisps.acc","wisps.drag","wisps.solve","wisps.ssbs","wisps.spr"]}, do:[
   AM("Vortex Force","Particle Update","vortex"), SV("Vortex Force","Vortex Force Amount","500","200"), `(Vortex Axis is already 0, 0, 1.)`,
   AM("Point Attraction Force","Particle Update","point attraction"),
   SV("Point Attraction Force","Attraction Strength","80","1"), SV("Point Attraction Force","Attraction Radius","400","100"),
   `Tick <b>Kill Within Radius</b> and set <b>Kill Radius</b> <code>25</code> (it was 4).`,
   AM("Curl Noise Force","Particle Update","curl noise"), SV("Curl Noise Force","Noise Strength","120","10"),
   AM("Acceleration Force","Particle Update","acceleration force"), SX("Acceleration Force","Acceleration","0","0","60","0, 0, 0"),
   AM("Drag","Particle Update","drag"), SV("Drag","Drag","1.5","1.0"),
   SOLVE,
   AM("Scale Sprite Size by Speed","Particle Update","size by speed"), `Keep it below Solve; Max Scale Factor X <code>1</code> Y <code>4</code>.`,
   `<b>Sprite Renderer</b>: Material <b>M_FX_Glow</b>, Alignment <b>Velocity Aligned</b>.`
 ], see:`Violet streaks peel off the rim, curl, and spiral into the hole, where they vanish.`,
 why:`<b>Several weak forces plus drag:</b> vortex alone is a merry-go-round and attraction alone is a drain. Together, with curl noise breaking the symmetry and drag keeping speeds readable, it looks alive.`},

 {t:"Light it and place it", goal:"The rift lights the floor around it, sitting in a real level.", hl:{g:0,n:["core.light","core.lr"]}, do:[
   `Click the <b>Core</b> emitter. <b>Render</b> + → <b>Light Renderer</b>; untick <b>Use Inverse Squared Falloff</b>.`,
   AM("Light Attributes","Particle Spawn","light attributes"), SD("Light Attributes","Radius","Unset","Apply"), SV("Light Attributes","Light Radius","700","100"),
   `<b>Save</b>. Drag <b>NS_Rift</b> onto a floor in a level. Rotate the actor 90° (Rotation Y <code>90</code>) to stand it upright as a wall portal: it all turns together, because every emitter is in Local Space.`
 ], pro:`Turn the level's lights down. A rift is a light source, and in a bright room it looks like a sticker.`}
];

/* ============================== L4 ============================== */
STEPS.l4 = [
 {t:"Material: a mesh that burns away (M_Dissolve)", goal:"A Masked material whose Dissolve value (0 to 1) eats the mesh away with a glowing edge.", hl:{g:1,n:["noise","dis","mdis","sub1","sub2","res"]}, do:[
   `New folder <code>FX_Dissolve</code>. New material <code>M_Dissolve</code>, open it. Click empty graph: <b>Blend Mode</b> <b>Masked</b> (Shading Model stays <b>Default Lit</b>). Set <b>Opacity Mask Clip Value</b> from <i>0.3333</i> to <code>0</code>.`,
   MN("Noise","noise","on the left"), `In its Details: <b>Scale</b> <code>0.02</code>, <b>Output Min</b> <code>0</code>, <b>Output Max</b> <code>1</code>.`,
   `${K("S")}+click → <b>Scalar Parameter</b>. Name it <code>Dissolve</code>, Default Value <code>0</code>. In its Details tick <b>Use Custom Primitive Data</b>, <b>Primitive Data Index</b> <code>0</code>.`,
   `${K("M")}+click → <b>Multiply</b>: Dissolve → A, Const B <code>1.2</code>. Then <b>Subtract</b> (right-click → subtract): Multiply → A, Const B <code>0.1</code>. Call this <b>t</b> (the burn line).`,
   MN("Subtract","subtract","to the right of Noise"), `Noise → <b>A</b>, t → <b>B</b>. Wire it into the result's <b>Opacity Mask</b>.`
 ], why:`<b>Custom Primitive Data</b> lets each placed mesh carry its own Dissolve number without making a separate material instance per object, so a whole crowd can dissolve at different times on one material.`},

 ], why:`<b>Attach Parent</b>: when a Blueprint spawns this system attached to a mesh component, the embers sample that mesh. One effect works for a chair, a robot or a rock.`},

 {t:"Effect Type: a budget the engine enforces", goal:"NET_Gameplay culls far or excess copies automatically.", do:[
   `In FX_Dissolve right-click → <b>FX</b> → <b>Niagara Effect Type</b> → name <code>NET_Gameplay</code> → open.`,
   `<b>Cull Reaction</b> already says <i>Deactivate Immediate</i>. Set <b>Update Frequency</b> from <i>Spawn Only</i> to <b>Low</b>.`,
   `Under <b>System Scalability Settings</b> click <b>+</b> to add an entry, then open it. Tick <b>Cull By Distance</b> and set <b>Max Distance</b> <code>5000</code>. Tick <b>Cull Max Instance Count</b> and set <b>Max Instances</b> <code>10</code>. <b>Save</b>.`,
   `Open <b>NS_Dissolve</b>. In the System Overview click the <b>system box</b> (the one with the system's name, not an emitter). In its <b>System Properties</b> set <b>Effect Type</b> to <b>NET_Gameplay</b>. <b>Save</b>. Do the same for NS_GroundSlam and NS_Rift.`
 ], why:`Without an Effect Type nothing stops 40 copies of this effect running behind the camera. Even good marketplace packs skip this step. On a mid-range graphics card you can't afford to.`},

 {t:"Blueprint: BP_Dissolver's parts", goal:"A Blueprint holding the mesh, with Duration and EmberColor settable per copy.", hl:{g:2,n:["ev","spawn"]}, do:[
   `In FX_Dissolve right-click → <b>Blueprint Class</b> → <b>Actor</b> → <code>BP_Dissolver</code> → open.`,
   `<b>Components</b> → <b>+ Add</b> → <b>Static Mesh</b>, name <code>Body</code>. In Details: Static Mesh <b>Sphere</b> (or your own model), Materials › Element 0 → <b>M_Dissolve</b>.`,
   `In <b>My Blueprint</b> (left) click <b>+</b> next to <b>Variables</b>: name <code>EmberColor</code>, type <b>Linear Color</b>, default R <code>4</code> G <code>1.2</code> B <code>0.3</code> A <code>1</code>. Click the <b>eye</b> icon so it's editable per placed copy.`,
   `Another variable <code>Duration</code>, type <b>Float</b>, default <code>2.0</code>, eye on. A third <code>FX</code> of type <b>Niagara System Component</b> → <b>Object Reference</b> (no eye).`,

 ]},

 {t:"Blueprint: spawn, colour and play", goal:"StartDissolve spawns the embers on Body, colours them, and starts a timeline.", hl:{g:2,n:["ev","spawn","setfx","setcol","div","rate","tl"]}, do:[
   `In the <b>Event Graph</b> right-click empty space → type <code>custom event</code> → <b>Add Custom Event</b> → name it <code>StartDissolve</code>.`,
   `Drag from StartDissolve's white exec pin into empty space → type <code>spawn system attached</code> → click <b>Spawn System Attached</b>. Set its <b>System Template</b> to <b>NS_Dissolve</b>.`,
   `Drag <b>Body</b> from the Components panel into the graph (a <i>Get Body</i> node) and wire it into <b>Attach to Component</b>.`,
   `Drag from the spawn node's exec out → type <code>set fx</code> → <b>Set FX</b>; wire <b>Return Value</b> into its value pin.`,
   `From Set FX's exec out → type <code>set niagara variable linearcolor</code> → <b>Set Niagara Variable (LinearColor)</b>. Target ← <b>FX</b>; <b>In Variable Name</b> <code>EmberColor</code>; <b>In Value</b> ← drag the <b>EmberColor</b> variable in (Get).`,
   `Right-click empty space → <code>add timeline</code> → <b>Add Timeline…</b> → name <code>DissolveTL</code>. Double-click it: click <b>+ Track</b> → <b>Add Float Track</b>, name it <code>Alpha</code>. ${K("Shift")}+click the curve twice to add two keys; set the first to Time <code>0</code> Value <code>0</code> and the second to Time <code>1</code> Value <code>1</code>. Set <b>Length</b> to <code>1</code>. Close the tab.`,
   `Drag <b>DissolveTL</b> (the component, from My Blueprint › Components) into the graph → from it drag → <b>Set Play Rate</b>. Wire Set Niagara Variable's exec into it. New Rate = <b>1 ÷ Duration</b> (right-click → <code>divide</code> → float ÷ float: A <code>1</code>, B ← Duration).`,
   `From Set Play Rate's exec → wire into the timeline node's <b>Play from Start</b> input.`
 ]},

 {t:"Blueprint: drive the material and the embers every frame", goal:"While the timeline runs, Dissolve and SpawnRate follow Alpha.", hl:{g:2,n:["tl","cpd","mulr","setr","zero","begin","delay","call"]}, do:[
   `From the timeline's <b>Update</b> exec → type <code>set scalar parameter for custom primitive data</code> → click it. Target ← <b>Body</b>; <b>Parameter Name</b> <code>Dissolve</code>; <b>Value</b> ← <b>Alpha</b>.`,
   `From its exec → <b>Set Niagara Variable (Float)</b>: Target ← FX; In Variable Name <code>SpawnRate</code>; In Value ← <b>Alpha × 3000</b> (right-click → <code>multiply</code>).`,
   `From the timeline's <b>Finished</b> exec → another <b>Set Niagara Variable (Float)</b>: FX, <code>SpawnRate</code>, value <code>0</code>.`,
   `From <b>Event BeginPlay</b> → <b>Delay</b> (Duration <code>1.0</code>) → right-click → <code>startdissolve</code> → call <b>Start Dissolve</b>.`,
   `<b>Compile</b>, <b>Save</b>. Drag three BP_Dissolvers into a level. Give each a different <b>EmberColor</b> and <b>Duration</b> in the Details panel. Press <b>Play</b>.`
 ], see:`One second after Play, each sphere burns away from a glowing edge while embers in its own colour stream off it. The slow one takes longest.`},

 {t:"Check the budget", goal:"Know what your effects cost before they ship.", do:[
   `During Play press ${K("`")} (the key under Esc) to open the console, type <code>stat Niagara</code>, ${K("Enter")}. Read the particle counts and times while the dissolves run. Type it again to hide it.`,
   `Targets for a gameplay effect on a mid-range graphics card at 1080p (aims, not measurements): <b>GroundSlam</b> ≤ 250 particles at peak, CPU; <b>BladeTrail</b> ≤ 150 live; <b>Rift</b> ≤ 800 GPU wisps; <b>Dissolve</b> ≤ 3,000 GPU embers per copy, Max Instances 10.`,
   `If a number is over: lower the spawn first, then lifetime, and only then particle size. Overdraw (big see-through sprites stacked up) is the usual killer, so thin out the near, large sprites first.`
 ], pro:`<b>Overdraw first:</b> one 900 cm translucent FloorGlow costs more pixels than 300 tiny wisps. Measure with the camera close, where the effect fills the screen.`}

/* shorthand for material / blueprint nodes */
const OUT = [["~","pin"]];
const MUL = (id,x,y,b)=>({id,t:"Multiply",c:"mathm",x,y,w:110,o:OUT,i:[["A","pin"],["B","pin",b||""]]});
const ADD = (id,x,y)=>({id,t:"Add",c:"mathm",x,y,w:100,o:OUT,i:[["A","pin"],["B","pin"]]});
const ONE = (id,t,x,y,w)=>({id,t,c:"mathm",x,y,w:w||110,o:OUT,i:[["~","pin"]]});
const PC  = (id,x,y)=>({id,t:"Particle Color",c:"part",x,y,w:140,o:[["RGB","pin"],["R","pin"],["G","pin"],["B","pin"],["A","pin"]]});
const RGE = (id,x,y)=>({id,t:"RadialGradientExponential",c:"func",x,y,w:210,o:OUT,i:[["UVs","pin"],["CenterPosition","pin"],["Radius","pin"],["Density","pin"]]});
const RES = (id,name,x,y,pins)=>({id,t:name,c:"result",x,y,w:180,i:pins.map(p=>[p,"pin"])});
const MATLEG = `<span><i style="background:var(--pin)"></i>Material pin</span><span><b style="color:#fff">Big right-hand node</b> = the material's result</span><span>Values in grey pills are typed in the Details panel</span>`;
const BPLEG = `<span><i class="x" style="background:#fff"></i>Execution (order)</span><span><i style="background:var(--bfloat)"></i>Float</span><span><i style="background:var(--bobj)"></i>Object</span><span><i style="background:var(--bcol)"></i>Linear Color</span><span><i style="background:var(--bname)"></i>Name</span>`;

    ["What's the difference between a Niagara System and an emitter?","The <b>System</b> is the effect you place in the level. Each <b>emitter</b> inside it is one layer with its own stack of modules."],
    ["Why do Gravity, Drag and Collision show red errors on a Minimal emitter?","They need <b>Solve Forces and Velocity</b> after them (Niagara: <i>&ldquo;unmet dependencies&rdquo;</i>). Minimal doesn't include it. Click <b>Fix issue</b> to add it."],
    ["How do you make an emitter fire once instead of looping?","Emitter State: <b>Life Cycle Mode → Self</b>, then <b>Loop Behavior → Once</b>, plus a <b>Spawn Burst Instantaneous</b>."],
    ["How do you make the dust arrive a beat after the hit?","Spawn Burst Instantaneous → <b>Spawn Time</b> (e.g. 0.03 s)."],
    ["Which two settings lay a sprite flat on the ground?","Sprite Facing and Alignment (Facing 0,0,1 + Alignment 1,0,0) <b>and</b> the Sprite Renderer's Facing Mode = Custom Facing Vector, Alignment = Custom Alignment."],
    ["Why must Scale Sprite Size by Speed sit below Solve Forces and Velocity?","It reads the particle's velocity, which is only final <b>after</b> the solver runs."],
    ["What makes a Niagara light's Radius setting work?","Untick <b>Use Inverse Squared Falloff</b> on the Light Renderer (the module's own tooltip says so), then Light Attributes: Radius → Apply."],
    ["Why Additive for flashes and sparks?","Additive adds light: black is invisible, overlaps get brighter, which is how hot, glowing things behave."],
    ["What does Depth Fade do?","Fades a translucent sprite out over the last N cm before it meets geometry, so there's no hard edge where it cuts the floor."],
    ["Name the four layering steps used here.","Huge & instant (flash), big & fast (ring), tiny & fast (sparks), big & slow (dust), plus debris in its own time slot."]
  ],

  cards:[
    ["How do you make a sprite that spawns once and never dies?","Spawn Burst Instantaneous with <b>Loop Count Limit 1</b>, emitter looping Infinite, and Particle State <b>Kill Particles When Lifetime Has Elapsed</b> off."],
    ["What does Local Space do?","Particles live in the actor's space, so they move and rotate with it. That's why the rift can stand upright as a wall portal."],
    ["Why must a GPU emitter use fixed bounds?","The CPU can't read GPU particle positions, so it can't size the bounds. UE 5.8 warns <i>&ldquo;Missing fixed bounds&rdquo;</i>; wrong bounds get the effect culled."],
    ["Which two forces make the swirl-and-drain?","<b>Vortex Force</b> (spin around the axis) + <b>Point Attraction Force</b> (pull to the centre, Kill Within Radius)."],
    ["Why add Drag when you already have forces?","It caps the speed so the motion stays slow and readable instead of whipping off."],
    ["What does VectorToRadialValue give you?","Radial Coordinates: <b>angle</b> around the centre (R) and <b>distance</b> (G), so you can draw arms and spirals."],
    ["How do the spiral arms turn?","Add Time × a speed inside the sine. The material moves, the particle doesn't."],
    ["Why a black disc with a thin rim instead of a big glowing circle?","The edge is the brightest thing with little glowing area: it reads as a hole in the world, not a lamp, and costs little overdraw."]
  ],

{
  id:"l4", num:4, short:"Dissolve tool + budgets",
  title:"Dissolve anything into embers, as a reusable tool",
  kick:"Lesson 4 · User Parameters, Blueprints, mesh sampling, Effect Types",
  time:"90–110 min",
  intro:`Any mesh burns away from a glowing edge while embers in a colour you choose stream off its surface. Drop three on a level, give each its own colour and speed in the Details panel, press Play. This is where an effect becomes a tool: the outside world sets its knobs (User Parameters), a Blueprint drives it, a material reacts per object, and an Effect Type keeps the engine from running too many.`,
  use:`<b>Used for:</b> enemy deaths, teleports, item pickups, despawning loot, "melt into shadow" abilities. Any gameplay event that needs the same effect on many different meshes.`,
  learn:["User Parameters","Link Inputs","Static Mesh Location","Attach Parent","GPU + fixed bounds","Masked dissolve material","Custom Primitive Data","Spawn System Attached","Set Niagara Variable","Timelines","Effect Types","stat Niagara"],
  concepts:[
    {h:"User Parameters are the knobs", p:"Anything starting with <b>User.</b> can be set from outside the effect, by a Blueprint, a level designer or code. Link module inputs to them, and one system becomes a hundred variants."},
    {h:"Born on the shape", p:"<b>Static Mesh Location</b> samples points on the triangles of the mesh the system is attached to. Embers come off the object itself, not out of an invisible box."},
    {h:"Custom Primitive Data", p:"Each placed mesh carries its own small array of numbers that its material reads. Every object dissolves at its own pace on one shared material, with no extra material instances."},
    {h:"Effect Types are budgets", p:"An <b>Effect Type</b> tells the engine when to cull or throttle an effect: too far, too many copies, not visible. Every shipped effect should have one."}
  ],
  graphs:[
    {kind:"stack", title:"NS_Dissolve: one GPU emitter + two knobs", hint:"User Parameters on the left", emitters:[
      {id:"user", name:"User Parameters", tag:"set from outside", sections:[
        {s:"User", mods:[{id:"rate",n:"User.SpawnRate",v:[["Float","0"]]},{id:"color",n:"User.EmberColor",v:[["Linear Color","4, 1.2, 0.3, 1"]]}]}
