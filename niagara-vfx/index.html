/* ===================== STATE + SAVE ===================== */
let S = {done:{}, notes:{}, memory:false, timers:{}};
const API = "/api/progress";
let serverOK = false, saveT = null;
const saveEl = document.getElementById("save");
function setSave(cls, txt){ saveEl.className = "save " + cls; saveEl.querySelector("span").textContent = txt; }
async function load(){
  try{
    // only a local serve.py has the progress API; on a static host skip the request
    if(!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) throw 0;
    const r = await fetch(API, {cache:"no-store"});
    if(!r.ok) throw 0;
    const j = await r.json();
    S = Object.assign(S, j || {});
    serverOK = true; setSave("ok","Saved to progress.json");
  }catch(e){
    try{ const l = localStorage.getItem("nvfx-fast-track"); if(l) S = Object.assign(S, JSON.parse(l)); }catch(_){}
    setSave("ok","Progress saves in this browser");
  }
  S.done ||= {}; S.notes ||= {}; S.timers ||= {};
}
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(async ()=>{
    try{ localStorage.setItem("nvfx-fast-track", JSON.stringify(S)); }catch(_){}
    if(!serverOK){ setSave("ok","Saved in this browser · " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})); return; }
    try{
      const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(S)});
      if(!r.ok) throw 0;
      setSave("ok","Saved to progress.json · " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}));
    }catch(e){ setSave("local","Server lost: saved in browser"); }
  }, 300);
}

/* ===================== PROGRESS ===================== */
function keysFor(L){
  const k = [];
  L.steps.forEach((_,i)=>k.push(`${L.id}.s${i}`));
  L.cards.forEach((_,i)=>k.push(`${L.id}.c${i}`));
  L.boss.items.forEach((_,i)=>k.push(`${L.id}.b${i}`));
  return k;
}
function pct(L){ const k = keysFor(L); return k.filter(x=>S.done[x]).length / k.length; }
function refreshProgress(){
  let all = [], got = 0;
  LESSONS.forEach(L=>{ const k = keysFor(L); all = all.concat(k); });
  got = all.filter(x=>S.done[x]).length;
  const p = all.length ? got/all.length : 0;
  document.getElementById("ringArc").style.strokeDashoffset = 138.2 * (1 - p);
  document.getElementById("ringTxt").textContent = Math.round(p*100) + "%";
  document.getElementById("ringCount").textContent = `${got} / ${all.length}`;
  document.getElementById("mtopPct").textContent = Math.round(p*100) + "% complete";
  LESSONS.forEach(L=>{
    const a = document.querySelector(`nav a[data-l="${L.id}"]`); if(!a) return;
    const q = pct(L);
    a.querySelector(".bar i").style.width = (q*100) + "%";
    a.classList.toggle("done", q === 1);
    a.querySelector(".nb").textContent = q === 1 ? "✓" : L.num;
  });
  const sp = document.getElementById("stepPct");
  if(sp){ const L = LESSONS.find(x=>x.id===sp.dataset.l); sp.textContent = Math.round(pct(L)*100) + "% of this lesson"; }
}

const lab = s => s.startsWith("~") ? "" : esc(s);
const sk = t => t === "exec" ? "x" : "";
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
function nodeHTML(n){
  if(n.note) return `<div class="node note" style="left:${n.x}px;top:${n.y}px;width:${n.w||140}px">${n.note}</div>`;
  let h = `<div class="node" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px;width:${n.w||150}px"><div class="nh" style="background:var(${CAT[n.c]||"--h-group"})">${esc(n.t)}</div><div class="nb">`;
  (n.o||[]).forEach(o=>{ h += `<div class="row out" data-n="${n.id}" data-s="${esc(o[0])}"><span>${lab(o[0])}</span><i class="s ${o[3]||sk(o[1])}" style="--c:var(${TYPE[o[1]]})"></i></div>`; });
  (n.p||[]).forEach(p=>{ h += `<div class="prop"><span>${esc(p)}</span></div>`; });
  (n.i||[]).forEach(i=>{
    const v = i[2] ? `<em class="${i[2]==="✓"?"ok":""}">${esc(i[2])}</em>` : "";
    h += `<div class="row in" data-n="${n.id}" data-s="${esc(i[0])}"><i class="s ${i[3]||sk(i[1])}" style="--c:var(${TYPE[i[1]]})"></i><span>${lab(i[0])}</span>${v}</div>`;
  });
  return h + `</div></div>`;
}
const SECCOL = {"Properties":"#555a63","Emitter Spawn":"#a35718","Emitter Update":"#a35718","Particle Spawn":"#3b7a3b","Particle Update":"#3b7a3b","Render":"#8f3550","User":"#2c5a8c"};
function stackHTML(g, gi){

  <p class="cap">${g.cap||""}</p>`;

function graphHTML(g, gi){
  if(g.kind === "stack") return stackHTML(g, gi);
  return `<div class="graphwrap"><div class="graphhead"><b>${g.title}</b><span class="hint">${g.hint||""}</span></div>
  <div class="graphscroll mem"><div class="graph" data-g="${gi}" style="width:${g.w}px;height:${g.h||300}px"><svg class="links"></svg>${g.nodes.map(nodeHTML).join("")}</div></div>
  <div class="legend">${g.legend||""}</div></div>
  <p class="cap">${g.cap||""}</p>`;
}
function findSock(graph, ref, dir){
  let [id, rest] = [ref.slice(0, ref.indexOf(".")), ref.slice(ref.indexOf(".")+1)];
  let nth = 0; const at = rest.lastIndexOf("@");
  if(at > -1){ nth = +rest.slice(at+1); rest = rest.slice(0, at); }
  const rows = [...graph.querySelectorAll(`.row.${dir}[data-n="${id}"]`)].filter(r=>r.dataset.s === rest);
  return rows[nth] ? rows[nth].querySelector(".s") : null;
}
function drawLinks(el, g){
  if(!g || g.kind === "stack") return;
  const svg = el.querySelector("svg.links");
  // size the canvas to fit its nodes, whatever the fonts did to their heights
  let mw = 0, mh = 0;
  el.querySelectorAll(".node").forEach(n=>{ mw = Math.max(mw, n.offsetLeft + n.offsetWidth); mh = Math.max(mh, n.offsetTop + n.offsetHeight); });
  const W = Math.max(g.w, mw + 20), H = mh + 24;
  el.style.width = W + "px"; el.style.height = H + "px";
  const base = el.getBoundingClientRect();
  const cs = getComputedStyle(document.documentElement);
  let paths = "";
  g.links.forEach(([a,b])=>{
    const s1 = findSock(el, a, "out"), s2 = findSock(el, b, "in");
    if(!s1 || !s2){ console.warn("missing socket", a, b); return; }
    const r1 = s1.getBoundingClientRect(), r2 = s2.getBoundingClientRect();
    const x1 = r1.left + r1.width/2 - base.left, y1 = r1.top + r1.height/2 - base.top;
    const x2 = r2.left + r2.width/2 - base.left, y2 = r2.top + r2.height/2 - base.top;
    const dx = Math.max(40, Math.abs(x2-x1) * .5);
    const col = s1.style.getPropertyValue("--c");
    const c = cs.getPropertyValue(col.replace(/var\(|\)/g,"").trim()) || "#aaa";
    paths += `<path d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" stroke="#111" stroke-width="4.5" fill="none" opacity=".6"/><path d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" stroke="${c.trim()}" stroke-width="2" fill="none"/>`;
  });
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.innerHTML = paths;
}

  </div>
  <p class="cap" style="margin-top:12px">🧠 <b>Memory mode</b> (sidebar) blurs every graph and step detail. Click a blurred block to peek at just that one. Lesson 2 and 3 reuse the M_FX_Glow material from Lesson 1, so do them in order. Your ticks, notes and boss times save automatically: in this browser, or to <code>progress.json</code> when you run the page with <code>serve.py</code>.</p>

  <h3 class="sec">Module 1 <span class="tag">foundations by real projects</span></h3>
  <div class="road">
    ${LESSONS.map(L=>`<a class="mod" href="#${L.id}" style="color:inherit"><div class="mk">Lesson ${L.num} · ${Math.round(pct(L)*100)}%</div><h4>${L.title}</h4><ul>${L.learn.slice(0,4).map(x=>`<li>${x}</li>`).join("")}</ul></a>`).join("")}
  </div>

  <h3 class="sec">Coming next <span class="tag">ask for the next module when you finish</span></h3>
  <div class="road">${ROADMAP.map(r=>`<div class="mod lockd"><div class="mk">${r.m.split("·")[0].trim()}</div><h4>${r.m.split("·")[1].trim()}</h4><ul>${r.items.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>

  <h3 class="sec">The basic moves <span class="tag">read once before Lesson 1</span></h3>
  ${basicsHTML()}

  <h3 class="sec">Shortcuts you'll use every minute <span class="tag">material, Niagara, Blueprint</span></h3>
  <div class="concept"><table class="keys">${KEYS.map(k=>`<tr><td>${k[0]}</td><td>${k[1]}</td></tr>`).join("")}</table></div>

  <h3 class="sec">How to read the diagrams</h3>
  <div class="concepts">
    <div class="concept"><h4>Stack diagrams</h4><p>One column per emitter, exactly as it appears in the Niagara stack: <span style="color:#ffb066">orange</span> Emitter groups, <span style="color:#7fd17f">green</span> Particle groups, <span style="color:#ff8aa6">red</span> Render. Grey pills are the values you type.</p></div>
    <div class="concept"><h4>Material graphs</h4><p>Wires run left to right into the big result node. A grey pill on an input means "type this in the Details panel" (Const B, Const Exponent…).</p></div>
    <div class="concept"><h4>Blueprint graphs</h4><p>White ▶ pins are the order things happen; coloured pins carry values (green float, blue object, purple name).</p></div>
    <div class="concept"><h4>📍 Show where</h4><p>Each step's button lights up exactly the modules or nodes that step adds, in the diagram above it.</p></div>
  </div>`;
}

function lessonView(L){
  const idx = LESSONS.indexOf(L);
  const prev = LESSONS[idx-1], next = LESSONS[idx+1];
  const ck = (k)=> S.done[k] ? "checked" : "";
  return `
  <section class="hero">
    <div class="kick">${L.kick} · ${L.time}</div>
    <h2>${L.title}</h2>
    <p>${L.intro}</p>
    <div class="chips">${L.learn.map(x=>`<span class="chip g">${x}</span>`).join("")}</div>
    <div class="use">${L.use}</div>
    <div class="use" id="stepPct" data-l="${L.id}"></div>
  </section>
  <div class="memnote">🧠 Memory mode is on. Graphs and step details are blurred. Try to recall each step from its title, then click to check yourself.</div>

  <h3 class="sec">Core ideas <span class="tag">read first</span></h3>
  <div class="concepts">${L.concepts.map(c=>`<div class="concept"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}</div>

  <h3 class="sec">The diagrams <span class="tag">what you're building</span></h3>
  ${L.graphs.map((g,i)=>graphHTML(g,i)).join("")}

  <h3 class="sec">Build it <span class="tag">tick when it works in Unreal</span></h3>
  <details class="basics" ${L.num===1?"open":""}><summary>🖱️ The basic moves: Content Browser, material editor, Niagara stack, Blueprints (read once)</summary>${basicsHTML()}</details>
  <div class="steps">
  ${L.steps.map((s,i)=>{const k=`${L.id}.s${i}`; return `
    <div class="step ${S.done[k]?"done":""}" data-k="${k}">
      <input type="checkbox" class="cb" data-k="${k}" ${ck(k)} aria-label="Step ${i+1} done">
      <div><div class="st" data-tog="${k}"><small>${String(i+1).padStart(2,"0")}</small>${s.t}</div>
      <div class="sd mem">
        ${s.goal?`<div class="goal"><b>Goal:</b> ${s.goal}</div>`:""}
        ${s.hl?`<button class="btn where" data-hl="${s.hl.g}|${s.hl.n.join(",")}">📍 Show where this goes</button>`:""}
        <ol class="do">${s.do.map(x=>`<li>${x}</li>`).join("")}</ol>
        ${s.see?`<div class="see"><b>You should see:</b> ${s.see}</div>`:""}
        ${s.why?`<div class="why">${s.why}</div>`:""}${s.pro?`<div class="pro">${s.pro}</div>`:""}
      </div></div>
    </div>`;}).join("")}
  </div>

  <h3 class="sec">Check yourself</h3>
  <div class="check">${L.check}</div>

  <h3 class="sec">Recall drill <span class="tag">answer out loud, then flip</span></h3>
  <div class="cards">
  ${L.cards.map((c,i)=>{const k=`${L.id}.c${i}`; return `
    <div class="fc ${S.done[k]?"known":""}" data-k="${k}"><div class="in">
      <div class="face front"><div class="lab">Card ${i+1}</div><div class="q">${c[0]}</div><div class="foot"><span>click to flip</span>${S.done[k]?'<span style="color:#7fe3c6">✓ known</span>':""}</div></div>
      <div class="face back"><div class="lab">Answer</div><div>${c[1]}</div><div class="foot"><label class="knew" onclick="event.stopPropagation()"><input type="checkbox" class="cb" data-k="${k}" ${ck(k)}> I knew it</label><span>click to flip back</span></div></div>
    </div></div>`;}).join("")}
  </div>

  <h3 class="sec">${L.boss.title}</h3>
  <div class="boss">
    <div class="brief">${L.boss.brief}</div>
    <div class="timer"><span class="clock" id="clock">00:00</span><button class="btn" id="tStart">▶ Start</button><button class="btn" id="tReset">Reset</button><span style="font-size:.82rem;color:#a89e93">Target: under ${L.boss.goal} min · Best: <b id="best" style="color:#ffd2a6">${S.timers[L.id+".best"]?fmt(S.timers[L.id+".best"]):"–"}</b></span></div>
    ${L.boss.items.map((b,i)=>{const k=`${L.id}.b${i}`; return `<div class="ck"><input type="checkbox" class="cb" id="${k}" data-k="${k}" ${ck(k)}><label for="${k}">${b[0]}${b[1]?`<small>${b[1]}</small>`:""}</label></div>`;}).join("")}
    <div style="margin:14px 0 4px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:#a89e93">Stretch goals (optional, not counted)</div>
    ${L.boss.stretch.map((b,i)=>{const k=`${L.id}.x${i}`; return `<div class="ck"><input type="checkbox" class="cb" id="${k}" data-k="${k}" ${ck(k)}><label for="${k}"><b>${b[0]}</b><small>${b[1]}</small></label></div>`;}).join("")}
  </div>

  <h3 class="sec">My notes <span class="tag">saved automatically</span></h3>
  <textarea class="notes" id="notes" placeholder="What tripped you up? What would you do differently? Write it in your own words. That's what makes it stick.">${esc(S.notes[L.id]||"")}</textarea>

  <div class="navrow">
    ${prev?`<a class="btn" href="#${prev.id}">← Lesson ${prev.num}: ${prev.short}</a>`:`<a class="btn" href="#home">← Overview</a>`}
    ${next?`<a class="btn pri" href="#${next.id}">Lesson ${next.num}: ${next.short} →</a>`:`<a class="btn pri" href="#home">Module 1 done → Overview</a>`}
  </div>`;
}

function basicsHTML(){
  return `<div class="bgrid">${BASICS.map((b,i)=>`<div class="bcard"><b><i>${i+1}</i>${b[0]}</b><div>${b[1]}</div></div>`).join("")}</div>`;
}
let hlT = null;
function showWhere(btn){
  const [g, ids] = btn.dataset.hl.split("|");
  const graph = document.querySelector(`.graph[data-g="${g}"]`); if(!graph) return;
  document.querySelectorAll(".node.hl,.smod.hl").forEach(n=>n.classList.remove("hl"));
  const nodes = ids.split(",").map(id=>graph.querySelector(`[data-id="${id}"]`)).filter(Boolean);
  nodes.forEach(n=>n.classList.add("hl"));
  const sc = graph.closest(".graphscroll"); sc.classList.add("peek");
  const wrap = graph.closest(".graphwrap");
  wrap.scrollIntoView({block:"center", behavior:"smooth"});
  if(nodes[0]){ const left = Math.min(...nodes.map(n=>n.offsetLeft)); sc.scrollTo({left:Math.max(0,left-40), behavior:"smooth"}); }
  let back = document.getElementById("backBtn");
  if(!back){ back = document.createElement("button"); back.id = "backBtn"; back.className = "btn pri backbtn"; document.body.appendChild(back); }
  back.textContent = "↩ Back to step " + btn.closest(".step").querySelector(".st small").textContent;
  back.onclick = ()=>{ btn.closest(".step").scrollIntoView({block:"center", behavior:"smooth"}); back.remove(); };
  clearTimeout(hlT); hlT = setTimeout(()=>nodes.forEach(n=>n.classList.remove("hl")), 6000);
}

/* ===================== TIMER ===================== */
let tInt = null, tStart = 0, tLesson = null;
function fmt(ms){ const s = Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function wireTimer(L){
  const clock = document.getElementById("clock"), bS = document.getElementById("tStart"), bR = document.getElementById("tReset");
  const run = S.timers[L.id+".run"];
  const tick = ()=>{ clock.textContent = fmt(Date.now() - S.timers[L.id+".run"]); };
  if(run){ bS.textContent = "■ Finish"; tick(); tInt = setInterval(tick, 500); }
  bS.onclick = ()=>{
    if(S.timers[L.id+".run"]){
      const t = Date.now() - S.timers[L.id+".run"];
      delete S.timers[L.id+".run"]; clearInterval(tInt);
      const best = S.timers[L.id+".best"];
      if(!best || t < best){ S.timers[L.id+".best"] = t; document.getElementById("best").textContent = fmt(t); }
      clock.textContent = fmt(t); bS.textContent = "▶ Start"; save();
    } else {
      S.timers[L.id+".run"] = Date.now(); bS.textContent = "■ Finish"; tInt = setInterval(tick, 500); save();
    }
  };
  bR.onclick = ()=>{ delete S.timers[L.id+".run"]; clearInterval(tInt); clock.textContent = "00:00"; bS.textContent = "▶ Start"; save(); };
}

/* ===================== ROUTER ===================== */
function route(){
  clearInterval(tInt);
  const bb = document.getElementById("backBtn"); if(bb) bb.remove();
  const id = (location.hash || "#home").slice(1);
  const L = LESSONS.find(x=>x.id===id);
  main.innerHTML = L ? lessonView(L) : homeView();
  document.querySelectorAll("nav a.l").forEach(a=>a.classList.toggle("on", a.dataset.l === (L?L.id:"home")));
  document.getElementById("side").classList.remove("open");
  if(L){
    document.title = `L${L.num} ${L.short} · Niagara VFX Fast Track`;
    setTimeout(redraw, 0);
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
    wireTimer(L);
    document.getElementById("notes").addEventListener("input", e=>{ S.notes[L.id] = e.target.value; save(); });
  } else document.title = "Niagara VFX Fast Track";
  window.scrollTo(0,0);
  refreshProgress();
}
function redraw(){
  const id = (location.hash || "#home").slice(1); const L = LESSONS.find(x=>x.id===id);
  if(L) document.querySelectorAll(".graph").forEach(el=>drawLinks(el, L.graphs[+el.dataset.g]));
}

/* ===================== EVENTS ===================== */
document.addEventListener("change", e=>{
  const t = e.target; if(!t.classList.contains("cb") || !t.dataset.k) return;
  const k = t.dataset.k;
  if(t.checked) S.done[k] = true; else delete S.done[k];
  const st = t.closest(".step"); if(st) st.classList.toggle("done", t.checked);
  const fc = t.closest(".fc"); if(fc) fc.classList.toggle("known", t.checked);
  document.querySelectorAll(`.cb[data-k="${k}"]`).forEach(c=>{ if(c!==t) c.checked = t.checked; });
  save(); refreshProgress();
  if(t.checked && st){ const n = st.nextElementSibling; if(n && !n.classList.contains("done")) n.scrollIntoView({block:"nearest", behavior:"smooth"}); }
});
document.addEventListener("click", e=>{
  const wb = e.target.closest(".where");
  if(wb && (!document.body.classList.contains("memory") || wb.closest(".mem.peek"))){ showWhere(wb); return; }
  const mem = e.target.closest(".mem");
  if(document.body.classList.contains("memory") && mem && !mem.classList.contains("peek")){ mem.classList.add("peek"); e.preventDefault(); return; }
  const tog = e.target.closest("[data-tog]");
  if(tog){ const cb = document.querySelector(`.cb[data-k="${tog.dataset.tog}"]`); cb.checked = !cb.checked; cb.dispatchEvent(new Event("change", {bubbles:true})); return; }
  const fc = e.target.closest(".fc");
  if(fc && !e.target.closest(".knew")) fc.classList.toggle("flip");
});
const memT = document.getElementById("memToggle");
function applyMem(){ document.body.classList.toggle("memory", !!S.memory); memT.classList.toggle("on", !!S.memory); memT.setAttribute("aria-checked", !!S.memory); document.querySelectorAll(".mem.peek").forEach(m=>m.classList.remove("peek")); }
memT.onclick = ()=>{ S.memory = !S.memory; applyMem(); save(); };
memT.onkeydown = e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); memT.click(); } };
document.getElementById("menuBtn").onclick = ()=>document.getElementById("side").classList.toggle("open");
document.getElementById("resetBtn").onclick = ()=>{
  if(confirm("Clear every tick, note and best time? This can't be undone.")){ S = {done:{}, notes:{}, memory:S.memory, timers:{}}; save(); route(); }
};
window.addEventListener("hashchange", route);
let rT; window.addEventListener("resize", ()=>{ clearTimeout(rT); rT = setTimeout(redraw, 120); });

/* ===================== REVIEW DECK ===================== */
let deck = [], di = 0;
function openReview(){
  const started = LESSONS.filter(L=>pct(L) > 0);
  const pool = (started.length ? started : [LESSONS[0]]);
  deck = [];
  pool.forEach(L=>L.cards.forEach((c,i)=>deck.push({L, i, q:c[0], a:c[1], k:`${L.id}.c${i}`})));
  // weakest first: unknown cards ahead of known ones, shuffled within
  deck.sort(()=>Math.random()-.5).sort((a,b)=>(S.done[a.k]?1:0)-(S.done[b.k]?1:0));
  di = 0; showCard(); document.getElementById("modal").classList.add("on");
}
window.openReview = openReview;
function showCard(){
  const box = document.getElementById("mbox"); box.classList.remove("show");
  if(di >= deck.length){
    document.getElementById("mfrom").textContent = "Deck finished";
    document.getElementById("mq").textContent = `Done: ${deck.filter(c=>S.done[c.k]).length} of ${deck.length} marked as known.`;
    document.getElementById("ma").innerHTML = ""; ["mshow","magain","mgot"].forEach(id=>document.getElementById(id).style.display="none");
    document.getElementById("mcnt").textContent = ""; return;
  }
  const c = deck[di];
  document.getElementById("mfrom").textContent = `Lesson ${c.L.num} · ${c.L.short}${S.done[c.k]?" · known before":""}`;
  document.getElementById("mq").innerHTML = c.q; document.getElementById("ma").innerHTML = c.a;
  document.getElementById("mcnt").textContent = `${di+1} / ${deck.length}`;
  document.getElementById("mshow").style.display = ""; document.getElementById("magain").style.display = "none"; document.getElementById("mgot").style.display = "none";
}
function reveal(){ document.getElementById("mbox").classList.add("show"); document.getElementById("mshow").style.display="none"; document.getElementById("magain").style.display=""; document.getElementById("mgot").style.display=""; }
document.getElementById("mshow").onclick = reveal;
document.getElementById("mgot").onclick = ()=>{ S.done[deck[di].k] = true; save(); refreshProgress(); di++; showCard(); };
document.getElementById("magain").onclick = ()=>{ delete S.done[deck[di].k]; deck.push(deck[di]); save(); refreshProgress(); di++; showCard(); };
document.getElementById("mclose").onclick = ()=>{ document.getElementById("modal").classList.remove("on"); route(); };
document.getElementById("reviewBtn").onclick = openReview;
document.addEventListener("keydown", e=>{
  if(!document.getElementById("modal").classList.contains("on")) return;
  if(e.key===" "){ e.preventDefault(); if(!document.getElementById("mbox").classList.contains("show")) reveal(); else document.getElementById("mgot").click(); }
  if(e.key==="Escape") document.getElementById("mclose").click();
});

/* ===================== BOOT ===================== */
(async()=>{ buildNav(); await load(); applyMem(); route(); })();
</script>
