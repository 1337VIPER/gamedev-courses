    let cage = cubeCage(s.method === "loops" ? s.d : 0), C = new Map();
    if(s.method === "crease"){ const ek=(a,b)=>a<b?a+"_"+b:b+"_"+a; const sharp = 10*s.c*s.c; cage.F.forEach(f=>f.forEach((a,j)=>C.set(ek(a, f[(j+1)%4]), sharp))); }
    let V = cage.V, F = cage.F;
    for(let i=0; i<s.lv; i++){ const r = ccSubdivide(V, F, C); V = r.V; F = r.F; C = r.C; }
    const m = meshArrays(V, F, s.lv > 0);
    v.setMesh({pos:m.pos, nrm:m.nrm, wire: s.cage==="on" ? wireArrays(cage.V, cage.F) : null, wire2: s.wire==="on" ? wireArrays(V, F) : null,

    say.innerHTML = s.lv === 0 ? "<b>Level 0:</b> this is the cage you model. Subdivision builds the smooth surface from it." :
      s.method === "none" ? "<b>No support:</b> Catmull-Clark averages every corner with its neighbours, so a plain cube melts into a blob. Every hard-surface beginner meets this." :
      s.method === "loops" ? (s.d < 0.06 ? "<b>Very close loops:</b> nearly razor-sharp. Too tight and the highlight vanishes again (and it pinches when baked). Real products sit around 5–15%." : s.d > 0.3 ? "<b>Far loops:</b> soft, pillowy edges. Good for a toy or a phone, not a machined part." : "<b>Holding loops:</b> the extra loop near each edge stops the averaging from spreading. Closer loop = tighter radius. That's Law 5.") :

/* ===================== LAB: COUNT BEFORE YOU CUT (patch -> branch) ===================== */
LAB.edgecount = function(body){
  body.innerHTML = `<div class="lb"><div class="stage" style="min-height:300px"><canvas class="ec"></canvas></div><div class="ctl"></div></div>`;
  const cv = body.querySelector("canvas"), ctl = body.querySelector(".ctl"), g = cv.getContext("2d");
  const s = {N:16, w:2, h:2, round:0};
  const say = document.createElement("div"); say.className = "say";
  let anim = null;
  function drawIt(){
    const dpr = Math.min(2, window.devicePixelRatio||1), W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W*dpr; cv.height = H*dpr; g.setTransform(dpr,0,0,dpr,0,0);
    g.fillStyle = "#141518"; g.fillRect(0,0,W,H);
    const rows = 6, cols = s.N, pad = 18, cw = Math.min((W-pad*2)/cols, (H-pad*2-20)/rows), ox = (W-cw*cols)/2, oy = pad+16;
    g.font = "600 11px system-ui"; g.fillStyle = "#6d717b"; g.fillText(`main pipe unrolled: ${cols} faces around × ${rows} along`, ox, oy-6);
    const c0 = Math.floor((cols - s.w)/2), r0 = Math.floor((rows - s.h)/2);
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const inP = c>=c0 && c<c0+s.w && r>=r0 && r<r0+s.h;
      g.fillStyle = inP ? "rgba(0,214,163,.22)" : "#1f2125"; g.fillRect(ox+c*cw+1, oy+r*cw+1, cw-2, cw-2);
    }
    // border vertices of the patch, morphing toward a circle
    const pts = [];
    for(let i=0;i<s.w;i++) pts.push([c0+i, r0]);
    for(let i=0;i<s.h;i++) pts.push([c0+s.w, r0+i]);
    for(let i=0;i<s.w;i++) pts.push([c0+s.w-i, r0+s.h]);
    for(let i=0;i<s.h;i++) pts.push([c0, r0+s.h-i]);
    const cx = c0 + s.w/2, cy = r0 + s.h/2, rad = Math.max(s.w, s.h)/2 * 0.92;
    const P = pts.map(([x,y])=>{ const a = Math.atan2(y-cy, x-cx), sx = cx + Math.cos(a)*rad, sy = cy + Math.sin(a)*rad; return [ox + (x + (sx-x)*s.round)*cw, oy + (y + (sy-y)*s.round)*cw]; });
    g.strokeStyle = "#00d6a3"; g.lineWidth = 2.5; g.beginPath(); P.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p)); g.closePath(); g.stroke();
    g.fillStyle = "#ffd166"; P.forEach(p=>{ g.beginPath(); g.arc(p[0], p[1], 3.5, 0, 7); g.fill(); });
    const n = 2*(s.w+s.h);
    g.fillStyle = "#e8e9ec"; g.font = "700 13px system-ui"; g.fillText(`${n} border edges → ${n}-sided branch`, ox, oy + rows*cw + 16);
    const round = s.w === s.h, power = n % 4 === 0;
    say.innerHTML = `<b>${s.w} × ${s.h} patch = ${n} border edges.</b> Add a Cylinder with <b>Vertices ${n}</b> for the branch so every edge of the hole meets one edge of the pipe. ` +
      (!round ? `<br><br>⚠ Not square: To Sphere still makes a circle, but the border points bunch up along the short sides (press the button and watch the spacing). The branch comes out lumpy and too wide, and the pipe dents around it. Use the same number of faces both ways.` : `<br><br>✓ Square patch: To Sphere turns it into a clean circle.`) +
      (!power ? `<br>⚠ ${n} isn't a multiple of 4, so the branch can't line up with the X and Y axes. Stick to 8, 12, 16…` : "") +
      (s.w > s.N/4 ? `<br>⚠ The patch wraps more than a quarter of the way round the pipe, so the branch is nearly as wide as the main pipe. That needs a different approach (a T-junction with matching counts).` : "");
  }
  ctl.append(
    segCtl("Main pipe segments", [[8,"8"],[12,"12"],[16,"16"],[24,"24"],[32,"32"]].map(o=>[String(o[0]),o[1]]), "16", x=>{ s.N = +x; s.w = Math.min(s.w, s.N/2); drawIt(); }),
    rangeCtl("Patch width (faces around)", 1, 6, 1, s.w, x=>String(x), x=>{ s.w = x; drawIt(); }),
    rangeCtl("Patch height (faces along)", 1, 4, 1, s.h, x=>String(x), x=>{ s.h = x; drawIt(); }),
    (()=>{ const b = document.createElement("button"); b.className = "btn pri"; b.type = "button"; b.textContent = "▶ To Sphere (Shift+Alt+S, 1)";
      b.onclick = ()=>{ cancelAnimationFrame(anim); const from = s.round, to = from > 0.5 ? 0 : 1, t0 = performance.now();
        const step = t=>{ const k = Math.min(1, (t-t0)/700); s.round = from + (to-from)*(k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2); drawIt(); if(k<1) anim = requestAnimationFrame(step); else b.textContent = to ? "◀ Back to square" : "▶ To Sphere (Shift+Alt+S, 1)"; };
        anim = requestAnimationFrame(step); setTimeout(()=>{ s.round = to; drawIt(); b.textContent = to ? "◀ Back to square" : "▶ To Sphere (Shift+Alt+S, 1)"; }, 760); };
      return b; })(),
    say);
  new ResizeObserver(drawIt).observe(cv);
  drawIt();
};

/* ===================== LAB: MODIFIER STACK ORDER ===================== */
LAB.stack = function(body, cfg){
  const items = cfg.items; // [{n:"Mirror", ic:"M", why:"…"}] in the correct order
  let order = items.map((_,i)=>i);
  do { order.sort(()=>Math.random()-.5); } while(order.every((v,i)=>v===i));
  body.innerHTML = `<div class="stack"></div><div style="padding:0 14px 14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" type="button" data-a="check">Check my order</button><button class="btn" type="button" data-a="shuffle">Shuffle</button></div><div class="say" style="margin:0 14px 14px;display:none"></div>`;
  const list = body.querySelector(".stack"), say = body.querySelector(".say");
  let checked = false;
  function render(){
    list.innerHTML = order.map((ix,pos)=>{ const it = items[ix]; const cls = checked ? (ix===pos?"ok":"no") : "";
      return `<div class="mc ${cls}"><span class="ic" style="background:${it.col||"#4fb3ff"}">${it.ic}</span><div><b>${pos+1}. ${it.n}</b>${checked?`<small>${it.why}</small>`:""}</div><div class="mv"><button type="button" data-u="${pos}" aria-label="Move up">▲</button><button type="button" data-d="${pos}" aria-label="Move down">▼</button></div></div>`; }).join("");
    list.querySelectorAll("[data-u]").forEach(b=>b.onclick = ()=>{ const p = +b.dataset.u; if(p>0){ [order[p-1],order[p]] = [order[p],order[p-1]]; checked = false; say.style.display="none"; render(); } });
    list.querySelectorAll("[data-d]").forEach(b=>b.onclick = ()=>{ const p = +b.dataset.d; if(p<order.length-1){ [order[p+1],order[p]] = [order[p],order[p+1]]; checked = false; say.style.display="none"; render(); } });
  }
  body.querySelector('[data-a="check"]').onclick = ()=>{ checked = true; render(); const ok = order.every((v,i)=>v===i);
    say.style.display = ""; say.innerHTML = ok ? `<b>Perfect.</b> ${cfg.win}` : `<b>${order.filter((v,i)=>v===i).length} of ${order.length} in the right place.</b> Read why each one goes where it does (green = right), fix the red ones and check again. Hint: ${cfg.hint}`; };
  body.querySelector('[data-a="shuffle"]').onclick = ()=>{ do { order.sort(()=>Math.random()-.5); } while(order.every((v,i)=>v===i)); checked = false; say.style.display="none"; render(); };
  render();
};

  function show(){
    const c = cfg.cases[ci]; img.src = c.src; doc.querySelectorAll(".hs").forEach(h=>h.remove());
    c.spots.forEach((sp,i)=>{ const h = document.createElement("div"); h.className = "hs" + (found[ci][i]?" found":""); h.style.cssText = `left:${sp.x-sp.r}%;top:${sp.y-sp.r*sp.ar}%;width:${sp.r*2}%;height:${sp.r*2*sp.ar}%`; doc.append(h); });
    say.innerHTML = `<b>${c.q}</b> Click on the image where you think the problem is. ${found[ci].filter(Boolean).length} of ${c.spots.length} found.` + c.spots.map((sp,i)=>found[ci][i]?`<br>✓ <b>${sp.name}:</b> ${sp.why}`:"").join("");
    tabs();
  }
  doc.addEventListener("click", e=>{
    const r = img.getBoundingClientRect(), x = (e.clientX-r.left)/r.width*100, y = (e.clientY-r.top)/r.height*100, c = cfg.cases[ci];
    const hit = c.spots.findIndex(sp=>{ const dx = (x-sp.x)/sp.r, dy = (y-sp.y)/(sp.r*sp.ar); return dx*dx+dy*dy <= 1; });
    if(hit > -1){ found[ci][hit] = true; show(); }
    else { const m = document.createElement("div"); m.className = "miss"; m.style.left = x+"%"; m.style.top = y+"%"; doc.append(m); setTimeout(()=>m.remove(), 1000); }
  });
  show();
};

/* ===================== STATE + SAVE ===================== */
let S = {done:{}, notes:{}, memory:false, timers:{}};
const API = "/api/progress";
let serverOK = false, saveT = null;
const saveEl = document.getElementById("save");
function setSave(cls, txt){ saveEl.className = "save " + cls; saveEl.querySelector("span").textContent = txt; }
async function load(){
  try{
    // only a local serve.py has the progress API; on a static host skip the request
    if(!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) throw 0;
    const r = await fetch(API, {cache:"no-store"});
    if(!r.ok) throw 0;
    const j = await r.json();
    S = Object.assign(S, j || {});
    serverOK = true; setSave("ok","Saved to progress.json");
  }catch(e){
    try{ const l = localStorage.getItem("hs-fast-track"); if(l) S = Object.assign(S, JSON.parse(l)); }catch(_){}
    setSave("ok","Progress saves in this browser");
  }
  S.done ||= {}; S.notes ||= {}; S.timers ||= {};
}
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(async ()=>{
    try{ localStorage.setItem("hs-fast-track", JSON.stringify(S)); }catch(_){}
    if(!serverOK){ setSave("ok","Saved in this browser · " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})); return; }
    try{
      const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(S)});
      if(!r.ok) throw 0;
      setSave("ok","Saved to progress.json · " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}));
    }catch(e){ setSave("local","Server lost: saved in browser"); }
  }, 300);
}

/* ===================== PROGRESS ===================== */
function keysFor(L){
  const k = [];
  L.steps.forEach((_,i)=>k.push(`${L.id}.s${i}`));
  L.cards.forEach((_,i)=>k.push(`${L.id}.c${i}`));
  L.boss.items.forEach((_,i)=>k.push(`${L.id}.b${i}`));
  return k;
}
function pct(L){ const k = keysFor(L); return k.filter(x=>S.done[x]).length / k.length; }
const packKeys = ()=> false && hasPack() ? PACK.sections.flatMap((sec,si)=>sec.items.map((_,i)=>`pack.${si}.${i}`)) : [];
function refreshProgress(){
  let all = [], got = 0;
  LESSONS.forEach(L=>{ const k = keysFor(L); all = all.concat(k); });
  all = all.concat(packKeys());
  const pa = document.querySelector(`nav a[data-l="pack"]`);
  if(pa){ const pk = packKeys(), pq = pk.filter(x=>S.done[x]).length / pk.length; pa.querySelector(".bar i").style.width = (pq*100)+"%"; pa.classList.toggle("done", pq===1); }
  got = all.filter(x=>S.done[x]).length;
  const p = all.length ? got/all.length : 0;
  document.getElementById("ringArc").style.strokeDashoffset = 138.2 * (1 - p);
  document.getElementById("ringTxt").textContent = Math.round(p*100) + "%";
  document.getElementById("ringCount").textContent = `${got} / ${all.length}`;
  document.getElementById("mtopPct").textContent = Math.round(p*100) + "% complete";
  LESSONS.forEach(L=>{
    const a = document.querySelector(`nav a[data-l="${L.id}"]`); if(!a) return;
    const q = pct(L);
    a.querySelector(".bar i").style.width = (q*100) + "%";
    a.classList.toggle("done", q === 1);
    a.querySelector(".nb").textContent = q === 1 ? "✓" : L.num;
  });
  const sp = document.getElementById("stepPct");
  if(sp){ const L = LESSONS.find(x=>x.id===sp.dataset.l); sp.textContent = Math.round(pct(L)*100) + "% of this lesson"; }
}

/* ===================== TIMER ===================== */
let tInt = null, tStart = 0, tLesson = null;
function fmt(ms){ const s = Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function wireTimer(L){
  const clock = document.getElementById("clock"), bS = document.getElementById("tStart"), bR = document.getElementById("tReset");
  const run = S.timers[L.id+".run"];
  const tick = ()=>{ clock.textContent = fmt(Date.now() - S.timers[L.id+".run"]); };
  if(run){ bS.textContent = "■ Finish"; tick(); tInt = setInterval(tick, 500); }
  bS.onclick = ()=>{
    if(S.timers[L.id+".run"]){
      const t = Date.now() - S.timers[L.id+".run"];
      delete S.timers[L.id+".run"]; clearInterval(tInt);
      const best = S.timers[L.id+".best"];
      if(!best || t < best){ S.timers[L.id+".best"] = t; document.getElementById("best").textContent = fmt(t); }
      clock.textContent = fmt(t); bS.textContent = "▶ Start"; save();
    } else {
      S.timers[L.id+".run"] = Date.now(); bS.textContent = "■ Finish"; tInt = setInterval(tick, 500); save();
    }
  };
  bR.onclick = ()=>{ delete S.timers[L.id+".run"]; clearInterval(tInt); clock.textContent = "00:00"; bS.textContent = "▶ Start"; save(); };
}

  if(t.checked) S.done[k] = true; else delete S.done[k];
  const st = t.closest(".step"); if(st) st.classList.toggle("done", t.checked);
  const fc = t.closest(".fc"); if(fc) fc.classList.toggle("known", t.checked);
  document.querySelectorAll(`.cb[data-k="${k}"]`).forEach(c=>{ if(c!==t) c.checked = t.checked; });
  save(); refreshProgress();
  if(t.checked && st){ const n = st.nextElementSibling; if(n && !n.classList.contains("done")) n.scrollIntoView({block:"nearest", behavior:"smooth"}); }
});
document.addEventListener("click", e=>{
  if(e.target.closest("#lightbox")){ document.getElementById("lightbox").classList.remove("on"); return; }
  const sw = e.target.closest(".shot .sw");
  if(sw && (!document.body.classList.contains("memory") || sw.closest(".mem.peek"))){ openShot(sw); return; }
  const lw = e.target.closest(".lawc"); if(lw){ lw.classList.toggle("flip"); return; }
  const mem = e.target.closest(".mem");
  if(document.body.classList.contains("memory") && mem && !mem.classList.contains("peek")){ mem.classList.add("peek"); e.preventDefault(); return; }
  const tog = e.target.closest("[data-tog]");
  if(tog){ const cb = document.querySelector(`.cb[data-k="${tog.dataset.tog}"]`); cb.checked = !cb.checked; cb.dispatchEvent(new Event("change", {bubbles:true})); return; }
  const fc = e.target.closest(".fc");
  if(fc && !e.target.closest(".knew")) fc.classList.toggle("flip");
});
const memT = document.getElementById("memToggle");
function applyMem(){ document.body.classList.toggle("memory", !!S.memory); memT.classList.toggle("on", !!S.memory); memT.setAttribute("aria-checked", !!S.memory); document.querySelectorAll(".mem.peek").forEach(m=>m.classList.remove("peek")); }
memT.onclick = ()=>{ S.memory = !S.memory; applyMem(); save(); };
memT.onkeydown = e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); memT.click(); } };
document.getElementById("menuBtn").onclick = ()=>document.getElementById("side").classList.toggle("open");
document.getElementById("resetBtn").onclick = ()=>{
  if(confirm("Clear every tick, note and best time? This can't be undone.")){ S = {done:{}, notes:{}, memory:S.memory, timers:{}}; save(); route(); }
};
window.addEventListener("hashchange", route);
let rT; window.addEventListener("resize", ()=>{ clearTimeout(rT); rT = setTimeout(redraw, 120); });

/* ===================== REVIEW DECK ===================== */
let deck = [], di = 0;
function openReview(){
  const started = LESSONS.filter(L=>pct(L) > 0);
  const pool = (started.length ? started : [LESSONS[0]]);
  deck = [];
  pool.forEach(L=>L.cards.forEach((c,i)=>deck.push({L, i, q:c[0], a:c[1], k:`${L.id}.c${i}`})));
  // the seven laws are always in the deck: recall each one from its number
  const LL = {num:"★", short:"The seven laws"};
  LAWS.forEach(l=>deck.push({L:LL, i:l.n, q:`Law ${l.n}: what is it called, what's its slogan, and why does it matter?`, a:`<b>${l.t}</b> · “${l.s}”<br><br>${l.p}`, k:`law.${l.n}`}));
  // weakest first: unknown cards ahead of known ones, shuffled within
  deck.sort(()=>Math.random()-.5).sort((a,b)=>(S.done[a.k]?1:0)-(S.done[b.k]?1:0));
  di = 0; showCard(); document.getElementById("modal").classList.add("on");
}
window.openReview = openReview;
function showCard(){
  const box = document.getElementById("mbox"); box.classList.remove("show");
  if(di >= deck.length){
    document.getElementById("mfrom").textContent = "Deck finished";
    document.getElementById("mq").textContent = `Done: ${deck.filter(c=>S.done[c.k]).length} of ${deck.length} marked as known.`;
    document.getElementById("ma").innerHTML = ""; ["mshow","magain","mgot"].forEach(id=>document.getElementById(id).style.display="none");
    document.getElementById("mcnt").textContent = ""; return;
  }
  const c = deck[di];
  document.getElementById("mfrom").textContent = `${c.L.num==="★"?"":"Lesson "+c.L.num+" · "}${c.L.short}${S.done[c.k]?" · known before":""}`;
  document.getElementById("mq").innerHTML = c.q; document.getElementById("ma").innerHTML = c.a;
  document.getElementById("mcnt").textContent = `${di+1} / ${deck.length}`;
  document.getElementById("mshow").style.display = ""; document.getElementById("magain").style.display = "none"; document.getElementById("mgot").style.display = "none";
}
function reveal(){ document.getElementById("mbox").classList.add("show"); document.getElementById("mshow").style.display="none"; document.getElementById("magain").style.display=""; document.getElementById("mgot").style.display=""; }
document.getElementById("mshow").onclick = reveal;
document.getElementById("mgot").onclick = ()=>{ S.done[deck[di].k] = true; save(); refreshProgress(); di++; showCard(); };
document.getElementById("magain").onclick = ()=>{ delete S.done[deck[di].k]; deck.push(deck[di]); save(); refreshProgress(); di++; showCard(); };
document.getElementById("mclose").onclick = ()=>{ document.getElementById("modal").classList.remove("on"); route(); };
document.getElementById("reviewBtn").onclick = openReview;
document.addEventListener("keydown", e=>{
  if(!document.getElementById("modal").classList.contains("on")) return;
  if(e.key===" "){ e.preventDefault(); if(!document.getElementById("mbox").classList.contains("show")) reveal(); else document.getElementById("mgot").click(); }
  if(e.key==="Escape") document.getElementById("mclose").click();
});

/* ===================== BOOT ===================== */
(async()=>{ buildNav(); await load(); applyMem(); route(); })();
</script>
