     cases:[
       {label:"Wrong count", src:"shots/l3-doc-wrong.jpg", q:"This branch has 6 sides, but the hole in the pipe has 8 edges.", spots:[
         {x:44.2, y:63.6, r:6, ar:1.778, name:"Triangles at the joint", why:"8 edges can't meet 6 with quads, so the bridge filled the gap with triangles. Under Subdivision every triangle and odd pole kinks the surface."},
         {x:53.7, y:68.9, r:6, ar:1.778, name:"Pinched stripes", why:"The stripes snake where the triangles change direction. Fix: give the branch 8 sides, or make an 8-edge hole for an 8-sided branch."}]},
       {label:"Not square", src:"shots/l3-doc-rect.jpg", q:"This hole came from a 4 × 2 patch (12 edges) put through To Sphere.", spots:[
         {x:43.3, y:87.1, r:6, ar:1.778, name:"Dent in the pipe", why:"To Sphere dragged the long sides' corner points inward and shoved the short ends out, so the faces around the hole fold and the pipe surface dents."},
         {x:44.4, y:23.2, r:6, ar:1.778, name:"Lumpy rim", why:"The 12 points ended up bunched together along the long sides, leaving wide flat faces between narrow ones. The rim comes out lumpy and the branch is far wider than planned."}]},
       {label:"No support loops", src:"shots/l3-doc-soft.jpg", q:"Same 8-edge hole, but no inset ring and one long extrude.", spots:[
         {x:46.0, y:73.7, r:6, ar:1.778, name:"Melted joint", why:"Nothing holds the joint on either side, so Subdivision averages it into a wide, soft blob."},
         {x:50.0, y:26.9, r:6, ar:1.778, name:"Domed top", why:"The top edge has no loop under it and no inset on the cap, so the flat top turns into a bullet nose."}]}
     ]}
  ],
  steps:[
   {t:"A real-size pipe", goal:"A 16-sided pipe, 0.2 m across and 1.2 m long, lying along X with its rotation applied.", do:[
     `New file: ${M("File","New","General")}. Mouse over the viewport, click the cube, press ${K("Delete")}.`,
     `${K("Shift","A")} and type <code>cyl</code> (the Add menu searches as you type). Press ${K("Enter")} to add the <b>Cylinder</b>.`,
     `Open the redo panel (bottom-left, click <b>Add Cylinder</b>). ${T("Vertices","16","32")}. Then Radius <code>0.1</code> (it shows 1 m), Depth <code>1.2</code> (2 m), Location Z <code>0.1</code>, Rotation Y <code>90</code>.`,
     `${K("Ctrl","A")} → <b>Rotation</b>. The pipe keeps lying along X, but its Rotation now reads 0°, 0°, 0°.`,
     `${K("F2")}, type <code>Pipe</code>, ${K("Enter")}. Switch the viewport to the <b>hard_surface_grey</b> MatCap with Statistics on, as in Lesson 1 step 2.`
   ], shots:[SH("l3-s01a","Shift+A then typing: the Add menu jumps to search results. Cylinder is highlighted; Enter adds it."),
             SH("l3-s01b","The Add Cylinder redo panel with its defaults (32 vertices, 1 m radius, 2 m deep): these are the boxes you type into.",[["VIEW_3D:HUD","3"]]),
             SH("l3-s01","Sidebar (N) → Item: Rotation 0°, Dimensions 1.2 × 0.2 × 0.2 m, Location Z 0.1 m.",[["VIEW_3D:UI","3–4"]])],
   see:`A pipe lying along the red X axis, its bottom touching the grid. Statistics: <b>Faces 18</b> (16 sides plus two round caps).`,
   why:`<b>Why apply the rotation?</b> The pipe's own axes now match the world's, so "along the pipe" is X for every tool, every modifier and the game engine. A pipe that only <i>looks</i> right but carries a 90° rotation trips up arrays and exports later.`},

   {t:"Five loops, squeezed to the middle", goal:"Five loops around the middle of the pipe, 3.9 cm apart, so the faces there are square.", do:[
     `${K("Tab")} into Edit Mode, press ${K("2")} for edge select.`,
     `${K("Ctrl","R")} and hover over one of the long edges that run <b>along</b> the pipe: a yellow ring appears around it.`,
     `Roll the scroll wheel <b>up four times</b>: five yellow rings. Left-click, then right-click so they stay evenly spaced. (Missed the count? Open the redo panel and set <b>Number of Cuts</b> to 5.)`,
     `All five loops are selected. Press ${K("S")} ${K("X")}, type <code>0.195</code>, ${K("Enter")}.`
   ], shots:[SH("l3-s02a","Five evenly spaced loops, all selected, 20 cm apart."),
             SH("l3-s02","S X 0.195: the loops squeeze together around the middle, 3.9 cm apart. The redo panel shows Scale X 0.195.",[["VIEW_3D:HUD","4"]])],
   see:`Five loops bunched in the middle of the pipe, the outer ones about 8 cm either side of the centre.`,
   why:`<b>Where does 0.195 come from?</b> Around the pipe each face is 2π × 0.1 m ÷ 16 = <b>3.9 cm</b> wide. The loops started 20 cm apart; 3.9 ÷ 20 = 0.195. Now the faces in the middle are 3.9 cm along the pipe too: square, which To Sphere needs.`},

   {t:"Pick a square 2 × 2 patch", goal:"Four faces selected on top of the pipe: a square with 8 border edges.", do:[
     `Press ${K("3")} for face select, then ${K("Alt","A")} to clear the selection.`,
     `Numpad ${K("7")} for the top view. Scroll in on the middle of the pipe.`,
     `Click one of the four faces that touch the pipe's centre point (where the middle loop crosses the top line). ${K("Shift")}+click the other three.`,
     `Check the statistics: <b>Faces 4/98</b>.`
   ], shots:[SH("l3-s03","Top view: the 2 × 2 patch on top of the pipe, centred on the middle loop. It looks square because it is square.")],
   see:`A small square of four faces right on top of the pipe.`,
   why:`<b>Law 6: count before you cut.</b> 2 faces wide + 2 faces long = 2 × (2 + 2) = <b>8 border edges</b>. Eight is a multiple of 4, so the hole will line up with the X and Y axes, and it will take an 8-sided branch. Try other patches in the Count lab above.`},

   {t:"Dissolve, then make it round", goal:"One 8-sided face whose corners sit on a perfect circle.", do:[
     `Press ${K("X")} and click <b>Dissolve Faces</b>. The four faces merge into one 8-sided face; the vertex in the middle is gone.`,
     `Press ${K("Shift","Alt","S")} (To Sphere), type <code>1</code>, press ${K("Enter")}.`,
     HUD("To Sphere","<b>Factor 1.000</b>")
   ], shots:[SH("l3-s04a","X in face select opens the Delete menu. Dissolve Faces merges the selection into one face and keeps the border."),
             SH("l3-s04","After Shift+Alt+S, 1: the eight corners now sit on a circle. Redo panel: To Sphere, Factor 1.",[["VIEW_3D:HUD","3"]])],
   see:`From the top, the square has become a circle with eight evenly spaced points.`,
   why:`<b>Why dissolve first?</b> To Sphere moves <i>every</i> selected point to the same distance from their centre. The patch's middle vertex sits almost on the centre, so it would be shoved outward into a spike. With only the 8 border points left, they settle neatly on a circle.`,
   pro:`<b>Why it works at all:</b> To Sphere moves points straight in or out from the centre. The patch's corners are the farthest, so they come in; the edge middles are the nearest, so they go out. Square in, circle out. That's the whole trick.`},

   {t:"A support ring on the pipe", goal:"A thin ring of 8 quads around the hole: the joint's support loop on the pipe side.", do:[
     `With the round face still selected, press ${K("I")}, type <code>0.008</code>, ${K("Enter")}.`,
     HUD("Inset Faces","<b>Thickness 0.008 m</b>")
   ], shots:[SH("l3-s05","I 0.008: a ring of eight quads 8 mm wide around the hole.",[["VIEW_3D:HUD","1–2"]])],
   see:`A thin ring around the circle. Statistics: <b>Faces 103</b>.`,
   why:`<b>Law 5: closer loops, sharper edges.</b> This ring is the support loop on the pipe's side of the joint. 8 mm keeps the joint tight but not razor sharp, like a welded fitting.`},

   {t:"Grow the branch in three pushes", goal:"An 8-sided branch 16 cm tall, held at the bottom and the top.", do:[
     `Press ${K("E")}, type <code>0.012</code>, ${K("Enter")}. A short first push: the support loop on the branch side of the joint.`,
     `${K("E")}, type <code>0.136</code>, ${K("Enter")}. The long push: the body of the branch.`,
     `${K("E")}, type <code>0.012</code>, ${K("Enter")}. Another short push: support under the top edge.`,
     `${K("I")}, type <code>0.006</code>, ${K("Enter")}: support on the top face.`
   ], shots:[SH("l3-s06a","The first, short push: E 0.012. The redo panel shows the move along the face's normal.",[["VIEW_3D:HUD","1"]]),
             SH("l3-s06","The branch after all three pushes and the small inset on its top.")],
   see:`A straight 8-sided branch standing on the pipe. Statistics: <b>Faces 135</b>.`,
   why:`<b>Short, long, short.</b> Each short push leaves a loop near an edge, so Subdivision keeps that edge tight. The 12 mm and 8 mm loops round the joint are what turn it into a crisp weld instead of a blob.`},

   {t:"Hold the ends of the pipe", goal:"Support loops either side of both end rims, made in one move.", do:[
     `Press ${K("2")} (edge select) and ${K("Alt","A")}. Hold ${K("Alt")} and click an edge of the rim at one end of the pipe (where the round end meets the side): the whole rim lights up.`,
     `Orbit to the other end, ${K("Shift","Alt")}+click its rim too.`,
     `Press ${K("Ctrl","B")}, type <code>0.006</code>, then roll the scroll wheel <b>up once</b> (Segments 2) and press ${K("Enter")}.`,
     HUD("Bevel","<b>Width 0.006 m</b>, <b>Segments 2</b>")
   ], shots:[SH("l3-s07","Ctrl+B 0.006 with two segments on both end rims. The redo panel shows Width 0.006 m, Segments 2.",[["VIEW_3D:HUD","3–4"]])],
   see:`Each end rim has become three tight loops. Statistics: <b>Faces 199</b>.`,
   why:`<b>The fastest support loops:</b> a 2-segment bevel puts a loop on each side of the edge and keeps a third on the corner, all at the same small distance. Use it on any edge you want crisp under Subdivision.`},

   {t:"Subdivide and judge it with stripes", goal:"A smooth pipe with a tight, clean joint, checked with the reflection MatCap.", do:[
     `${K("Tab")} back to Object Mode. Press ${K("Ctrl","2")}: a <b>Subdivision</b> modifier appears (Properties → wrench tab), Levels Viewport 2.`,
     `${M("Object","Shade Smooth")}.`,
     `Viewport Shading ▾ → click the MatCap sphere → pick <b>check_reflection_horizontal</b>.`,
     `Orbit round the joint (middle-drag) and watch the stripes.`
   ], shots:[SH("l3-s08","Subdivision level 2 with the reflection stripes: they sweep smoothly round the joint and along the pipe with no kinks.",[["PROPERTIES:WINDOW","1"]])],
   see:`Stripes that bend smoothly round the joint and run straight along the pipe. The joint is a tight, even fillet all the way round.`,
   why:`<b>Stripes don't lie.</b> A kink, a pinch or a wobble in the stripes is a problem in the topology underneath. Compare with the three broken junctions in the Topology Doctor above.`},

   {t:"The flange: its own part", goal:"A 14 cm flange around the top of the branch, with crisp held rims.", do:[
     `${K("Shift","A")} → type <code>cyl</code> → ${K("Enter")}. In the redo panel set <b>Vertices 16</b>, <b>Radius 0.07</b>, <b>Depth 0.03</b>, <b>Location Z 0.355</b>, and make sure Rotation is 0°, 0°, 0°.`,
     `${K("F2")} → <code>Flange</code> → ${K("Enter")}.`,
     `${K("Tab")}, ${K("2")}, ${K("Alt","A")}. ${K("Alt")}+click the top rim, ${K("Shift","Alt")}+click the bottom rim. ${K("Ctrl","B")}, type <code>0.004</code>, wheel up once, ${K("Enter")}.`,
     `${K("Tab")}, ${K("Ctrl","2")}, ${M("Object","Shade Smooth")}.`
   ], shots:[SH("l3-s09","The flange sits around the branch's top; the branch's top hides inside it. Its stack: Subdivision only.")],
   see:`A thick round flange with crisp edges, centred on the branch, its top 1 cm above the branch's top.`,
   why:`<b>One real part = one object.</b> A real flange is made separately and welded or bolted on, so it's its own object that simply overlaps the branch. That keeps the pipe's topology simple and lets you move or swap the flange freely.`},

   {t:"One bolt, origin on the axis", goal:"A hex bolt head at the edge of the flange whose origin stays on the flange's centre line.", do:[
     `With <b>Flange</b> selected, press ${K("Shift","S")} and click <b>Cursor to Selected</b>. The 3D cursor jumps to the flange's centre.`,
     `${K("Shift","A")} → <code>cyl</code> → ${K("Enter")}. Redo panel: <b>Vertices 6</b>, <b>Radius 0.009</b>, <b>Depth 0.008</b>, <b>Location Z 0.374</b> (on top of the flange). ${K("F2")} → <code>Bolts</code>.`,
     `${K("Tab")} (everything is selected), press ${K("G")} ${K("Y")}, type <code>0.055</code>, ${K("Enter")}. ${K("Tab")}. The hex head moved out to the flange's edge, but the small orange origin dot stayed in the centre.`,
     ADDMOD("Generate","Bevel"),
     `${T("Amount","0.001","0.1 m")}, Segments <code>2</code>. Then ${M("Object","Shade Auto Smooth")}.`
   ], shots:[SH("l3-s10","One hex bolt on the flange's edge. Sidebar: its Location is still on the centre line (X 0, Y 0): the origin didn't move.",[["VIEW_3D:UI","3"]])],
   see:`A small hex bolt head near the flange's edge. Its orange origin dot sits in the middle of the flange.`,
   why:`<b>Moving in Edit Mode moves the mesh, not the origin.</b> That's how you choose where an object's pivot is. For the radial array next, the pivot must be the flange's centre.`},

   {t:"Eight bolts with a radial array", goal:"Eight bolts evenly spaced round the flange, made by one Array modifier and an Empty.", do:[
     `${K("Shift","A")} → <b>Empty</b> → <b>Plain Axes</b>. Redo panel: <b>Radius 0.05</b>, <b>Location Z 0.374</b> (exactly the bolt's origin height), <b>Rotation Z 45</b>. ${K("F2")} → <code>BoltPivot</code>.`,
     `Click the bolt to select <b>Bolts</b> again.`,
     ADDMOD("Generate","Array"),
     `In the Array panel: ${T("Count","8","2")}. Untick the checkbox on the <b>Relative Offset</b> header. Tick <b>Object Offset</b>, click its <b>Object</b> field and pick <b>BoltPivot</b>.`
   ], shots:[SH("l3-s11","Array: Count 8, Relative Offset off, Object Offset → BoltPivot. Eight bolts walk round the flange.",[["PROPERTIES:WINDOW","3–4"]])],
   see:`Eight bolts in a perfect circle. Rotate BoltPivot (${K("R")} ${K("Z")}) and watch them fan out or overlap: that's the live link.`,
   why:`<b>How it works:</b> each copy is moved by the Empty's transform measured from the bolt's origin: same place, turned 45°. 8 × 45° = 360°. If the Empty were higher or lower than the origin, every copy would also climb or sink, so the heights must match.`,
   pro:`<b>360 ÷ count.</b> 6 bolts → 60°, 12 vents → 30°. This one trick builds bolt circles, fan blades, turbine vanes and wheel spokes.`},

   {t:"Valve stem and hand wheel", goal:"A steel stem rising from the flange and a ring-shaped hand wheel on top.", do:[
     `${K("Shift","A")} → <code>cyl</code> → ${K("Enter")}. Redo panel: <b>Vertices 16</b>, <b>Radius 0.012</b>, <b>Depth 0.12</b>, <b>Location Z 0.43</b>. ${K("F2")} → <code>ValveStem</code>. Add a <b>Bevel</b> modifier (Amount <code>0.002</code>, Segments <code>2</code>) and ${M("Object","Shade Auto Smooth")}.`,
     `${K("Shift","A")} → type <code>torus</code> → ${K("Enter")}. Redo panel: <b>Major Segments 24</b>, <b>Minor Segments 8</b>, <b>Major Radius 0.08</b>, <b>Minor Radius 0.008</b>, <b>Location Z 0.475</b>.`,
     `${K("F2")} → <code>ValveWheel</code>. ${K("Ctrl","2")}, ${M("Object","Shade Smooth")}.`
   ], shots:[SH("l3-s12","The stem and the 16 cm hand wheel above the flange.")],
   see:`A steel stem and a smooth ring hovering around it, 10.5 cm above the flange.`},

   {t:"Spokes: the same trick again", goal:"Four spokes joining the wheel to the stem, made with a second radial array.", do:[
     `${K("Shift","A")} → <code>cyl</code> → ${K("Enter")}. Redo panel: <b>Vertices 8</b>, <b>Radius 0.005</b>, <b>Depth 0.08</b>, <b>Location Z 0.475</b>, <b>Rotation Y 90</b>. ${K("F2")} → <code>Spokes</code>.`,
     `${K("Ctrl","A")} → <b>Rotation</b>. The spoke still lies along X, but its own axes now match the world's.`,
     `${K("Tab")}, ${K("G")} ${K("X")} <code>0.04</code> ${K("Enter")}, ${K("Tab")}. The spoke now runs from the stem to the rim; its origin stays on the axis.`,
     `${K("Shift","A")} → <b>Empty</b> → <b>Plain Axes</b>: Radius <code>0.05</code>, Location Z <code>0.475</code>, Rotation Z <code>90</code>. ${K("F2")} → <code>SpokePivot</code>.`,
     `Select <b>Spokes</b>. Add an <b>Array</b> modifier: Count <code>4</code>, Relative Offset off, Object Offset → <b>SpokePivot</b>.`,
     `${M("Object","Shade Smooth")}. (No Subdivision here: a thin cylinder with no support loops would taper into a spindle.)`
   ], shots:[SH("l3-s13","Four spokes from one: Array Count 4 round SpokePivot (turned 90°), on a spoke whose rotation was applied first.",[["PROPERTIES:WINDOW","5"]])],
   see:`A hand wheel with four straight spokes meeting the stem, all lying flat in the wheel's plane.`,
   why:`<b>Why apply the rotation first?</b> The Array copies the Empty's turn <i>as seen from the spoke's own axes</i>. With the spoke still rotated 90°, "turn 90° around Z" means a different axis to it, and the copies tumble out of the wheel's plane. Applied rotation = the spoke's axes match the world's, so Z means Z. Same recipe, new numbers: origin on the axis, rotation applied, Empty at the origin turned 360° ÷ count.`},

   {t:"Paint, name and save", goal:"Three materials on six parts and a saved file.", do:[
     `Select <b>Pipe</b>. Material tab → <b>New</b> → rename <code>PipePaint</code>, Base Color Hex <code>2F6E8F</code>.`,
     `Select <b>Flange</b>. Material tab → click the sphere button left of <b>New</b> (Browse Material) → pick <b>PipePaint</b>.`,
     `Select <b>Bolts</b>: New → <code>Steel</code>, Hex <code>9A9EA3</code>, Metallic <code>1</code>, Roughness <code>0.3</code>. Select <b>ValveStem</b>: Browse → <b>Steel</b>.`,
     `Select <b>ValveWheel</b>: New → <code>ValveRed</code>, Hex <code>B3201A</code>. Select <b>Spokes</b>: Browse → <b>ValveRed</b>.`,
     `Click the <b>Material Preview</b> sphere (third shading icon). ${K("Ctrl","S")} → save as <code>pipe_junction.blend</code>.`
   ], shots:[SH("l3-s14","Material Preview: painted pipe and flange, steel bolts and stem, red wheel. The Outliner lists every part by name.",[["OUTLINER:WINDOW","5"]])],
   see:`A finished pipe junction with a bolted flange and a red valve wheel. The Outliner reads Pipe, Flange, Bolts, BoltPivot, ValveStem, ValveWheel, Spokes, SpokePivot.`,
   pro:`<b>Reuse materials, don't duplicate them.</b> Six parts, three materials: the engine draws fewer material slots and a colour change happens in one place.`}
  ],
  check:`<b>You should have:</b> a 16-sided, 1.2 m pipe with rotation applied; a hole made from a square 2 × 2 patch (dissolved, To Sphere 1, inset 8 mm); an 8-sided branch pushed out short / long / short; 2-segment bevels on the pipe's end rims; Subdivision level 2 with stripes flowing cleanly round the joint; a separate flange with eight bolts from one Array + Empty; a stem, a hand wheel and four arrayed spokes; three materials.`,
  cards:[
    ["Law 6 in four words?","<b>Count before you cut.</b> Edges in = edges out."],
    ["How many border edges does a w × h patch have?","<b>2 × (w + h).</b> A 2 × 2 patch has 8, a 3 × 3 has 12."],
    ["Your hole has 8 edges. How many sides does the branch need?","<b>8.</b> Any other count forces triangles or poles into the joint, and Subdivision shows them as pinches."],
    ["Why must the patch be square?","To Sphere moves points straight in or out from the centre. A square spreads them evenly into a round hole; a long patch bunches them, so the branch is lumpy and the pipe dents."],
    ["Why dissolve the patch before To Sphere?","The middle vertex would be pushed out to the same distance as the border: a spike. Dissolve Faces removes it and keeps only the border."],
    ["To Sphere shortcut, and what does Factor 1 mean?","<kbd>Shift</kbd><kbd>Alt</kbd><kbd>S</kbd>. Factor 1 = fully round (0 = unchanged)."],
    ["How do you hold a joint from both sides?","An inset ring on the base surface (support on that side) plus a short first extrude on the branch (support on the other side)."],
    ["The quickest way to put support loops on both sides of an edge?","Select it (or its loop), <kbd>Ctrl</kbd><kbd>B</kbd>, a small width, <b>2 segments</b>."],
    ["Radial array recipe?","Origin on the centre line and rotation applied; an Empty at that exact spot turned 360° ÷ count; Array with Relative Offset <b>off</b>; Object Offset → the Empty."],
    ["Why must the bolt's origin sit on the flange's axis?","Each copy turns around the origin. If the origin is inside the bolt, the copies just spin in place."],
    ["Why is the flange a separate object?","It's a separate part in real life; overlapping parts keep the pipe's topology simple and can be moved or swapped. One real part = one object."],
    ["Which MatCap judges a subdivided surface, and what are you looking for?","<b>check_reflection_horizontal</b>. Stripes that flow evenly; any kink, pinch or wobble is a topology problem."]
  ],
  boss:{
    title:"Boss fight: the junction from memory",
    brief:"Memory mode on, timer running, a fresh General file. Build the junction without the steps. Tick each part only when the stripes look clean.",
    goal:25,
    items:[
      ["16-sided real-size pipe, rotation applied, five loops squeezed to square faces",""],
      ["A 2 × 2 patch dissolved, rounded with To Sphere 1 and inset",""],
      ["An 8-sided branch in three pushes, pipe ends held with 2-segment bevels",""],
      ["Subdivision 2 + Shade Smooth with clean stripes round the joint",""],
      ["A separate flange with eight bolts from one Array + Empty",""],
      ["Stem, hand wheel and four arrayed spokes; three materials",""]
    ],
    stretch:[
      ["A side branch","Add a second, horizontal branch out of the pipe's side: pick a 2 × 2 patch on the side (Y) instead of the top. Same recipe, rotated."],
      ["A wider branch","Use a 3 × 3 patch: 12 edges, so a 12-sided branch. You'll need the loops spaced to match: work out the new S X value yourself."],
      ["End flanges","Put a bolted flange on each end of the main pipe. The pipe lies along X, so the Empty turns 45° around X, not Z."]
    ]
  }
});

/* ============================== L4 · Sci-fi door panel with live booleans ============================== */
LESSONS.push({
  id:"l4", num:4, short:"Door panel with live booleans", laws:[7,3],
  title:"A sci-fi door panel cut with live booleans",
  kick:"Lesson 4 · Cutters, Boolean, Array, Mirror and the modifier stack",
  time:"60–80 min",
  hero:"shots/l4-hero.jpg", thumb:"shots/l4-hero.jpg",
  intro:`A 2.2 m sci-fi door with a vision window, a vent grille, two cable ports and a recessed lower panel, and you never cut its mesh by hand. Every opening is a separate <b>cutter</b> object subtracted by a Boolean modifier, so the whole design stays editable: move a cutter and the hole moves, bevels and shading rebuild themselves. This is how hard-surface artists iterate fast on walls, doors, consoles and weapon receivers.`,
  use:`<b>Used for:</b> doors, wall panels, machinery housings, weapon receivers: anything with lots of openings that the art director will ask you to move "just a bit". In Lesson 5 you dress this same door with bolts, a cable and a warning plate.`,
  learn:["Mirror modifier","Cutter objects","Boolean modifier","Exact vs Float vs Manifold","Wire display","Cutters collection","Array on a cutter","Mirror Object","Bevel after booleans","Weighted Normal","Triangulate","Modifier order"],
  concepts:[
    {h:"Cutters, not edits", p:"A cutter is an ordinary object whose shape the door's Boolean modifier subtracts. The door's own mesh never changes: move, resize or delete a cutter and the opening follows. That's Law 7, <b>keep it live</b>."},
    {h:"Overshoot, never just touch", p:"A cutter should poke out past the surface. In 5.3 the Exact (default) and Manifold solvers cope when a cutter face lies exactly on the surface, but the fast <b>Float</b> solver leaves a skin over the hole and broken edges. Overshooting works with every solver and keeps the cutter easy to see and click."},
    {h:"The order is the technique", p:"<b>M</b>irror, <b>B</b>oolean, <b>B</b>evel, <b>W</b>eighted Normal, <b>T</b>riangulate: My Big Brother Wears Trainers. Mirror builds the full door, Boolean cuts it, Bevel then rounds every edge <i>including the cut ones</i>, Weighted Normal fixes the shading, Triangulate locks the triangles."},
    {h:"Live until export", p:"While the design moves, nothing gets applied. At export the FBX exporter's <b>Apply Modifiers</b> option (on by default) writes the finished stack into the file, and your .blend stays editable."}
  ],
  labs:[
    {type:"stack", title:"Stack Order Lab: put the door's modifiers in order", hint:"use ▲▼, then Check",
     items:[
      {n:"Mirror", ic:"M", col:"#4fb3ff", why:"First: it turns your half door into the whole door, so everything below works on the full shape. Mirror after the Boolean would also mirror cuts you meant to be one-sided."},
      {n:"Boolean", ic:"B", col:"#ef6b6b", why:"Second: cut the openings out of the finished base shape. Everything after this sees the cut edges as ordinary edges."},
      {n:"Bevel", ic:"B", col:"#ffd166", why:"Third: after the Boolean, so the edges round every window, slot and port get a highlight too. Bevel before the Boolean and the cut edges stay razor sharp."},
      {n:"Weighted Normal", ic:"W", col:"#5fd38d", why:"Fourth: it needs the bevel faces to exist, so the big faces can win the normal vote and shade flat."},
      {n:"Triangulate", ic:"T", col:"#a663c7", why:"Last: turns every face into triangles the way <i>you</i> choose, with Keep Normals on so the weighted normals survive. Engines triangulate anyway; doing it yourself means no surprises."}
     ],
     win:"My Big Brother Wears Trainers: Mirror, Boolean, Bevel, Weighted Normal, Triangulate. You'll set it up in steps 2, 5, 11 and 12.",
     hint:"build the shape, cut it, round it, shade it, lock it."},
    {type:"images", title:"Boolean Bugs Lab: the same window five ways", hint:"click the tabs",
     tabs:[
      {label:"Bevel before Boolean", src:"shots/lab4-a.jpg", say:"<b>Bevel above the Boolean:</b> the door's outer edges are rounded, but the window was cut <i>after</i> the bevel, so its edges are razor sharp: no highlight line around the opening."},
      {label:"Bevel after, no fix", src:"shots/lab4-b.jpg", say:"<b>Bevel after the Boolean, Auto Smooth only:</b> the opening now has highlights, but look at the big face: dark and light streaks fan out from the window. The n-gon around the cut is bending its shading toward the bevels."},
      {label:"+ Weighted Normal", src:"shots/lab4-c.jpg", say:"<b>Harden Normals + Weighted Normal (Keep Sharp):</b> the big face is evenly lit again and every cut edge carries a clean highlight. This is the stack you build in this lesson."},
      {label:"Float + touching cutter", src:"shots/lab4-d.jpg", say:"<b>Float solver, cutter face exactly on the surface:</b> the cut fails. A skin is left across the opening with ten broken edges, and the shading goes wild. Exact and Manifold survive this case in 5.3, Float doesn't."},
      {label:"Float + overshooting cutter", src:"shots/lab4-e.jpg", say:"<b>Same Float solver, cutter poking 5 cm out of the surface:</b> a clean cut. Overshooting makes every solver happy, which is why it's the rule."}
     ]}
  ],
  steps:[
   {t:"The door slab at real size", goal:"A 1.2 × 0.12 × 2.2 m slab standing on the floor, scale applied, named Door.", do:[
     `New file: ${M("File","New","General")}. Set up the MatCap and Statistics overlay exactly as in Lesson 1, step 2.`,
     `Click the cube, press ${K("N")} (sidebar, <b>Item</b> tab). Under <b>Dimensions</b>: X ${T("X","1.2","2 m")}, then Y <code>0.12</code>, then Z <code>2.2</code>.`,
     `Mouse over the viewport: ${K("Ctrl","A")} → <b>Scale</b>. Scale reads 1.000 again.`,
     `<b>Location Z</b>: type <code>1.1</code> (half the height) so the door stands on the floor.`,
     `Press ${K("F2")}, type <code>Door</code>, ${K("Enter")}.`
   ], shots:[SH("l4-s01","Sidebar → Item: Dimensions 1.2 / 0.12 / 2.2 m, scale 1, Location Z 1.1 m. The Outliner lists Door.",[["VIEW_3D:UI","2–4"]])],
   see:`A tall thin slab on the grid, <b>Door</b> in the Outliner.`},

   {t:"Keep half: the Mirror modifier", goal:"Only the right half of the mesh exists; a Mirror modifier draws the left half.", do:[
     `${K("Tab")} into Edit Mode. ${K("Ctrl","R")}, hover over the <b>top front edge</b> (the long one running left-right): the yellow preview runs straight down the middle of the door. Click, then <b>right-click</b> so it stays centred.`,
     `Press ${K("1")} (vertex select), numpad ${K("1")} (front view), ${K("Alt","Z")} (X-ray), ${K("Alt","A")}.`,
     `Drag a box around everything <b>left of the new centre line</b>. Statistics: <b>Vertices 4/12</b>.`,
     `Press ${K("X")} → <b>Vertices</b>. The left half is gone. ${K("Alt","Z")} to turn X-ray off, ${K("Tab")} back to Object Mode.`,
     ADDMOD("Generate","Mirror"),
     `The full door is back. In the Mirror panel tick <b>Clipping</b> (vertices on the centre line can't slide across it).`
   ], shots:[SH("l4-s02a","Front view, X-ray: the four vertices left of the centre loop selected (Vertices 4/12), ready to delete."),
             SH("l4-s02","The Mirror modifier: Axis X, Clipping ticked. Only the right half is real geometry.",[["PROPERTIES:WINDOW","5–6"]])],
   see:`The door looks exactly as before, but the modifier list has <b>Mirror</b> in it.`,
   why:`<b>Why mirror?</b> Half the modelling, guaranteed symmetry. Everything you do to the right half now appears on the left too.`},

   {t:"Chamfer the top corners", goal:"Both top corners cut off at 45° by 25 cm, from one bevel.", do:[
     `${K("Tab")} into Edit Mode, press ${K("2")} (edge select), ${K("Alt","A")}.`,
     `Click the short <b>12 cm edge at the top-right corner</b>, the one running from the front of the door to the back.`,
     `${K("Ctrl","B")}, move the mouse a little, type <code>0.25</code>, ${K("Enter")}.`,
     HUD("Bevel","<b>Width 0.25 m</b>, <b>Segments 1</b>"),
     `${K("Tab")} back to Object Mode.`
   ], shots:[SH("l4-s03","One chamfer on the right half; the Mirror modifier draws the matching one on the left.",[["VIEW_3D:HUD","4"]])],
   see:`A door with both top corners cut at 45°: the sci-fi silhouette.`},

   {t:"Your first cutter: the window", goal:"An eight-sided box called Cut_Window poking through the door's front face.", do:[
     `Mouse over the viewport: ${K("Shift","A")} → <b>Mesh</b> → <b>Cube</b>. A 2 m cube appears at the bottom of the door (at the 3D cursor).`,
     `Sidebar → Item → <b>Dimensions</b>: X <code>0.5</code>, Y <code>0.1</code>, Z <code>0.5</code>. Then ${K("Ctrl","A")} → <b>Scale</b>.`,
     `<b>Location</b>: X <code>0</code>, Y <code>-0.06</code>, Z <code>1.6</code>. ${K("F2")} → <code>Cut_Window</code>.`,
     `${K("Tab")}, ${K("2")}, numpad ${K("1")} (front), ${K("Alt","Z")}. The four edges running front-to-back are seen end-on at the corners: box-select them (Statistics: <b>Edges 4/12</b>).`,
     `${K("Ctrl","B")}, type <code>0.1</code>, ${K("Enter")}. ${K("Alt","Z")} off, ${K("Tab")} back to Object Mode.`
   ], shots:[SH("l4-s04a","The cutter sized 0.5 × 0.1 × 0.5 m and placed at Y −0.06, Z 1.6.",[["VIEW_3D:UI","2–3"]]),
             SH("l4-s04","Front view, X-ray: Ctrl+B 0.1 on the cutter's corner edges makes an eight-sided window shape.",[["VIEW_3D:HUD","5"]])],
   see:`An eight-sided block sitting in the upper door, half in front of it and half inside.`,
   why:`<b>Why Y −0.06?</b> The door's front face is at Y −0.06 (half of 12 cm). A 10 cm deep cutter centred there pokes <b>5 cm out</b> (the overshoot) and reaches <b>5 cm in</b> (the depth of the cut). The cutter's own chamfer becomes the window's shape.`},

   {t:"Boolean: subtract the cutter", goal:"A Boolean modifier on the door that uses Cut_Window.", do:[
     `Click the <b>Door</b> to select it (or click its name in the Outliner).`,
     ADDMOD("Generate","Boolean"),
     `It's already set to <b>Difference</b>, Operand Type <b>Object</b>, Solver <b>Exact</b>. Click the empty <b>Object</b> field and choose <b>Cut_Window</b> from the list.`
   ], shots:[SH("l4-s05","Boolean modifier: Difference, Operand Type Object, Object Cut_Window, Solver Exact (Float and Manifold are the other choices).",[["PROPERTIES:WINDOW","2–3"]])],
   see:`Hardly anything changes yet: the solid cutter sits right in front of the hole it's making.`,
   pro:`<b>Solvers in 5.3:</b> <b>Exact</b> (default) is robust and handles awkward cases. <b>Manifold</b> is much faster on heavy meshes but needs closed, clean inputs. <b>Float</b> is the old fast solver that breaks on touching faces (see the Bugs Lab).`},

   {t:"Turn the cutter into a ghost", goal:"Cut_Window drawn as a wireframe and left out of renders, so you see the cut.", do:[
     `Click <b>Cut_Window</b> in the Outliner (top-right) to select it.`,
     `Properties → <b>Object</b> tab (orange square). Click <b>Viewport Display</b> to unfold it and set <b>Display As</b> to <b>Wire</b>.`,
     `Click <b>Visibility</b> to unfold it. Under <b>Show In</b>, untick <b>Renders</b>.`
   ], shots:[SH("l4-s06","The cutter is now an orange wireframe and the recessed window shows through it."),
             SH("l4-s06b","Object tab (shown full-window): Viewport Display › Display As › Wire."),
             SH("l4-s06c","Object tab: Visibility › Show In › Renders unticked, so the cutter never appears in a render.")],
   see:`A sunken eight-sided window in the door with an orange wire box around it.`},

   {t:"Give cutters a home: the Cutters collection", goal:"All cutters live in a Cutters collection, and the Boolean cuts with the whole collection.", do:[
     `With Cut_Window still selected, mouse over the viewport and press ${K("M")}. Click <b>+ New Collection</b>, type <code>Cutters</code>, click <b>OK</b>.`,
     `Click the <b>Door</b>. In its Boolean panel change <b>Operand Type</b> from Object to <b>Collection</b>.`,
     `Click the empty <b>Collection</b> field and choose <b>Cutters</b>.`
   ], shots:[SH("l4-s07a","M opens Move to Collection: + New Collection makes the Cutters collection."),
             SH("l4-s07","Boolean › Operand Type Collection, Collection Cutters. The Outliner shows the new Cutters collection.",[["PROPERTIES:WINDOW","2–3"],["OUTLINER:WINDOW","1"]])],
   see:`The same window cut, now coming from the <b>Cutters</b> collection.`,
   why:`<b>One Boolean, any number of cutters.</b> From now on a new opening is just "make a cutter, press M → Cutters". No new modifier, no picking objects.`},

   {t:"Vent slots: one cutter, six cuts", goal:"A row of six vent slots from a single cutter with an Array modifier.", do:[
     `${K("Shift","A")} → <b>Mesh</b> → <b>Cube</b>. Dimensions X <code>0.6</code>, Y <code>0.1</code>, Z <code>0.03</code>, then ${K("Ctrl","A")} → <b>Scale</b>.`,
     `Location X <code>0</code>, Y <code>-0.06</code>, Z <code>0.35</code>. ${K("F2")} → <code>Cut_Vents</code>.`,
     `Object tab: <b>Display As</b> → <b>Wire</b>, untick Show In <b>Renders</b>. Then ${K("M")} → <b>Cutters</b>.`,
     ADDMOD("Generate","Array"),
     `In the Array panel: ${T("Count","6","2")}. Under <b>Relative Offset</b>: Factor X <code>0</code> (it shows 1), Factor Z <code>2</code>.`
   ], shots:[SH("l4-s08","Array on the cutter: Count 6, Relative Offset Factor 0 / 0 / 2. Six slots, each one slot-height apart.",[["PROPERTIES:WINDOW","4–5"]])],
   see:`Six horizontal slots cut into the lower door, 3 cm tall and 3 cm apart.`,
   why:`<b>Relative Offset</b> is measured in copies of the object's own size: Z 2 = one slot height plus one slot-height gap. Change Count to 8 and two more slots cut themselves.`},

   {t:"Cable ports: mirror the cutter, not the door", goal:"Two round ports from one cylinder cutter, mirrored across the door.", do:[
     `${K("Shift","A")} → <b>Mesh</b> → <b>Cylinder</b>. In the redo panel (bottom-left, <b>Add Cylinder</b>): Vertices <code>16</code>, Radius <code>0.035</code>, Depth <code>0.1</code>.`,
     `${K("R")} ${K("X")} <code>90</code> ${K("Enter")} so it points into the door. Location X <code>0.38</code>, Y <code>-0.06</code>, Z <code>1.0</code>.`,
     `${K("Ctrl","A")} → <b>Rotation &amp; Scale</b>. ${K("F2")} → <code>Cut_Port</code>. Wire, no Renders, ${K("M")} → <b>Cutters</b>.`,
     ADDMOD("Generate","Mirror"),
     `In this cutter's Mirror panel click the <b>Mirror Object</b> field and choose <b>Door</b>.`
   ], shots:[SH("l4-s09","The port cutter's Mirror modifier with Mirror Object = Door: one cutter, two ports.",[["PROPERTIES:WINDOW","4–5"]])],
   see:`A round port on each side of the door, level with each other.`,
   why:`<b>Why mirror the cutter?</b> The door's own Mirror runs <i>before</i> its Boolean, so cuts are never mirrored for you. That's a feature: you can still cut a keypad into one side only. For a symmetric cut, mirror the cutter across the door.`},

   {t:"A shallow panel recess", goal:"A 1.5 cm deep recessed panel around the vents.", do:[
     `${K("Shift","A")} → <b>Mesh</b> → <b>Cube</b>. Dimensions X <code>0.9</code>, Y <code>0.1</code>, Z <code>0.75</code>, ${K("Ctrl","A")} → <b>Scale</b>.`,
     `Location X <code>0</code>, Y <code>-0.095</code>, Z <code>0.55</code>. ${K("F2")} → <code>Cut_Panel</code>. Wire, no Renders, ${K("M")} → <b>Cutters</b>.`
   ], shots:[SH("l4-s10","Cut_Panel at Y −0.095: it reaches only 1.5 cm into the door. The vents, cut 5 cm deep, sit inside it.")],
   see:`A shallow recessed rectangle with the vent grille sunk deeper inside it.`,
   why:`<b>Depth is just position:</b> the cutter spans Y −0.145 to −0.045, and the door's face is at −0.06, so it bites 1.5 cm. Overlapping cutters are fine: the collection cuts them all.`},

   {t:"Bevel after the booleans", goal:"A 4 mm bevel on every edge, including the edges of every opening.", do:[
     `Click the <b>Door</b>.`,
     ADDMOD("Generate","Bevel"),
     `${T("Amount","0.004","0.1 m")}, then ${T("Segments","3","1")}. Leave Limit Method on <b>Angle</b> (30°).`,
     `Viewport header: ${M("Object","Shade Auto Smooth")}.`,
     `Zoom in on the window. Every cut edge has a highlight now, but faint streaks fan out across the big face from the opening.`
   ], shots:[SH("l4-s11","Bevel below the Boolean: highlights around the window. Notice the faint light streak on the big face to the left.",[["PROPERTIES:WINDOW","2–3"]])],
   see:`Thin highlights round the window, vents and ports.`,
   why:`<b>Law 3:</b> the bevel sits under the Boolean in the stack, so it rounds the cut edges too. Above the Boolean they'd stay razor sharp (first tab of the Bugs Lab).`},

   {t:"Finish the stack: Weighted Normal and Triangulate", goal:"Mirror › Boolean › Bevel › Weighted Normal › Triangulate, with clean shading.", do:[
     `In the Bevel panel unfold <b>Shading</b> and tick <b>Harden Normals</b>.`,
     ADDMOD("Normals","Weighted Normal"),
     `Tick <b>Keep Sharp</b>.`,
     ADDMOD("Generate","Triangulate"),
     `Tick <b>Keep Normals</b>. Smooth by Angle stays pinned at the bottom.`
   ], shots:[SH("l4-s12","The finished stack (top panels folded): Weighted Normal with Keep Sharp, Triangulate with Keep Normals. The streaks are gone.",[["PROPERTIES:WINDOW","1–5"]])],
   see:`The big face evenly lit right up to the window. Read the stack top to bottom: <b>M</b>irror, <b>B</b>oolean, <b>B</b>evel, <b>W</b>eighted Normal, <b>T</b>riangulate.`,
   pro:`<b>Why Triangulate yourself?</b> Every game engine renders triangles. If you don't choose how n-gons split, the exporter or engine does it, sometimes differently, and the shading changes. Keep Normals carries your weighted normals through.`},

   {t:"Prove it's live, then save", goal:"Move a cutter and watch the door rebuild, then put it back and save.", do:[
     `Click <b>Cut_Window</b> in the Outliner (inside Cutters).`,
     `Mouse over the viewport: ${K("G")} ${K("Z")} <code>0.15</code> ${K("Enter")}. The window, its bevels and its shading rebuild 15 cm higher.`,
     `${K("Ctrl","Z")} to put it back.`,
     `In the Outliner click the <b>eye</b> icon next to <b>Cutters</b> to hide the wireframes for a clean view.`,
     `${K("Ctrl","S")} and save as <code>door_panel.blend</code>. Lesson 5 starts from this file.`
   ], shots:[SH("l4-s13","G Z 0.15 on the cutter: the window moved up and the door rebuilt itself, bevels and all.")],
   see:`The window jumps up and comes back with ${K("Ctrl","Z")}, no clean-up needed.`,
   pro:`<b>Apply at export, not before.</b> The FBX exporter's <b>Apply Modifiers</b> (on by default) writes the finished stack into the file. Your .blend keeps every cutter, so next week's change is a two-second move.`}
  ],
  check:`<b>You should have:</b> a 1.2 × 0.12 × 2.2 m door with chamfered top corners; four wire cutters in a <b>Cutters</b> collection (window, vents with an Array, ports with a Mirror on Door, panel recess); the door's stack <b>Mirror → Boolean (Collection: Cutters, Exact) → Bevel (4 mm, 3 segments, Angle, Harden Normals) → Weighted Normal (Keep Sharp) → Triangulate (Keep Normals)</b>, plus the pinned Smooth by Angle; no streaks in the MatCap; and moving any cutter rebuilds the door.`,
  cards:[
    ["Law 7 and its mnemonic?","<b>Keep it live.</b> My Big Brother Wears Trainers: <b>M</b>irror, <b>B</b>oolean, <b>B</b>evel, <b>W</b>eighted Normal, <b>T</b>riangulate."],
    ["Why should a cutter overshoot the surface?","A touching face breaks the Float solver (a skin over the hole). Exact and Manifold cope, but overshooting works with every solver and keeps the cutter easy to see and pick."],
    ["Two settings that make a cutter a ghost?","Object tab › Viewport Display › <b>Display As: Wire</b>, and Visibility › Show In › <b>Renders</b> off."],
    ["How do many cutters share one Boolean?","Boolean <b>Operand Type: Collection</b> → Cutters. Any object moved in with <kbd>M</kbd> cuts the door."],
    ["Six vent slots from one cutter?","An <b>Array</b> modifier on the cutter: Count 6, Relative Offset Z 2 (one slot height plus one gap)."],
    ["The door has a Mirror modifier. Why aren't cuts mirrored, and how do you mirror one?","The door's Mirror runs before its Boolean. Put a Mirror modifier on the <b>cutter</b> with <b>Mirror Object = Door</b>."],
    ["Bevel above or below the Boolean, and why?","<b>Below.</b> Then the cut edges get bevelled too. Above, they stay razor sharp."],
    ["Streaks fanning out from an opening on a flat face. The fix?","Bevel <b>Harden Normals</b> + <b>Weighted Normal</b> with Keep Sharp."],
    ["Why Triangulate last, with Keep Normals?","You choose how n-gons split instead of the exporter or engine, and the weighted normals survive."],
    ["How deep does a cutter cut?","As far as it reaches past the surface. Door face at Y −0.06, cutter from −0.145 to −0.045 → 1.5 cm deep."],
    ["When do the Booleans get applied?","At export (FBX <b>Apply Modifiers</b>, on by default) or on a copy, never while the design can still change."]
  ],
  boss:{
    title:"Boss fight: the door from memory",
    brief:"Memory mode on, timer running, fresh General file. Rebuild the door and its cutters without the steps.",
    goal:25,
    items:[
      ["Real-size slab, half deleted, Mirror with Clipping, chamfered top corners",""],
      ["Window cutter with its own chamfer, Boolean on the door, cutter as a wire ghost",""],
      ["Cutters collection driving the Boolean",""],
      ["Vent slots from one cutter with an Array",""],
      ["Ports from one cutter mirrored across the door, plus the shallow panel recess",""],
      ["Full stack in the right order with clean shading; moving a cutter rebuilds the door",""]
    ],
    stretch:[
      ["Metal cut walls","Give every cutter a dark Metal material. On the door's Boolean unfold <b>Solver Options</b> and switch the material setting from Index Based to <b>Transfer</b>: the walls of every opening come out metal."],
      ["A one-sided keypad","Add a small box cutter on the right of the door only (no Mirror on it). Asymmetry on a symmetric base is what makes designs feel real."],
      ["Race the solvers","Switch the Boolean between Exact and Manifold and watch the stats and responsiveness while you drag a cutter. Note which one you'd use on a heavy prop."]
    ]
  }
});

/* ============================== L5 · Detail pass and hero render ============================== */
LESSONS.push({
  id:"l5", num:5, short:"Detail pass + hero render", laws:[2,3],
  title:"The detail pass, and a hero render worth posting",
  kick:"Lesson 5 · Fasteners, snapping, cables, floaters, lighting and EEVEE",
  time:"70–90 min",
  hero:"shots/l5-hero.jpg", thumb:"shots/l5-hero.jpg",
  intro:`Your Lesson 4 door has the right big shapes and openings. Now comes the last 10% that makes people believe it's real: bolts where parts join, a cable plugged in at both ends, a warning plate that's screwed on, grip rails, and then a proper render with a camera, three area lights and EEVEE. Every new part answers one question: <b>what's holding it on?</b>`,
  use:`<b>Used for:</b> the final pass on every hero prop and the portfolio render that sells it. Snapping, Array and Mirror on small parts are how detail gets placed fast and evenly on any hard-surface model.`,
  learn:["70/20/10 detail budget","Real-size fasteners","Pivot on the base","Snapping to faces","Align Rotation to Target","Mirror Object on parts","Array rows","Bezier cable","Bevel Depth","Floaters","Camera to view","Area lights + Track To","EEVEE render"],
  concepts:[
    {h:"Law 2: 70 · 20 · 10", p:"The silhouette (70%) and the openings (20%) are done. Tertiary detail is the last 10%, and it goes where things <i>join or end</i>: round the window, at the ports, along the bottom edge, on the handles. Big calm areas stay calm so the detail has something to contrast with."},
    {h:"What's holding it on?", p:"Every part needs a load path: a bolt touches what it fastens, a plate has screws, a cable ends in a connector at <b>both</b> ends. One floating part is enough to make a viewer distrust the whole model."},
    {h:"Pivot on the base", p:"A bolt's origin sits on its underside, so snapping can put that point on a surface and turn the bolt to face out. Model every insert this way and placing it is one move."},
    {h:"Light like a photographer", p:"Three area lights: a big <b>key</b> from the front-left, a strong <b>rim</b> from behind that outlines the edges (Law 3: the bevels you made catch it), and a weak <b>fill</b> so shadows aren't black."}
  ],
  labs:[
    {type:"images", title:"Detail Budget Lab: the same door in three tiers", hint:"click the tabs",
     tabs:[
      {label:"Primary (70%)", src:"shots/lab5-t1.jpg", say:"<b>Primary forms only:</b> the slab and its chamfered top. From across a room this already says 'sci-fi door'. That's why the silhouette comes first."},
      {label:"+ Secondary (20%)", src:"shots/lab5-t2.jpg", say:"<b>+ Secondary:</b> the window, ports, vents and recessed panel from Lesson 4. Now it has function and depth, but it still looks like a clean CG model."},
      {label:"+ Tertiary (10%)", src:"shots/lab5-t3.jpg", say:"<b>+ Tertiary:</b> bolts, cables with connectors, a screwed-on plate, grip rails. A small amount of geometry, placed only at joints and edges, and now it reads as a real object."}
     ]},
    {type:"doctor", title:"What's Holding It On? find the three faults", hint:"click where something is floating",
     cases:[
      {label:"Door close-up", src:"shots/lab5-doc.jpg", q:"Three kinds of part on this door have nothing holding them on. Find them.",
       spots:[
        {x:59.2, y:23.9, r:3.2, ar:1.778, name:"Floating bolt", why:"it hovers 5 cm in front of the door. A bolt has to touch what it fastens, or it reads as a sticker in mid-air."},
        {x:47.9, y:56.4, r:4.5, ar:1.778, name:"Plate with no fixings", why:"a plate needs screws, rivets or a frame. Nothing holds this one on, so the eye reads it as a decal."},
        {x:61.0, y:73.5, r:3.2, ar:1.778, name:"Cable with no connector", why:"the cable just stops at the port. Real cables end in a plug, gland or sleeve that grips them."},
        {x:35.2, y:77.2, r:3.2, ar:1.778, name:"Cable with no connector (other side)", why:"same problem, mirrored: both cables need a sleeve plugged into the port."}
       ]}
     ]}
  ],
  steps:[
   {t:"Open the door and paint it", goal:"Lesson 4's door with its cutters hidden and a blue-grey paint material.", do:[
     `${K("Ctrl","O")} and open your <code>door_panel.blend</code> from Lesson 4.`,
     `In the Outliner, make sure the <b>eye</b> next to <b>Cutters</b> is closed (cutters hidden).`,
     `Click the <b>Door</b>. Properties → <b>Material</b> tab → <b>New</b>. Rename it <code>DoorPaint</code>, set Base Color Hex <code>4E5A66</code> and ${T("Roughness","0.55","0.500")}.`,
     `Top-right of the viewport, click the third sphere (<b>Material Preview</b>).`
   ], shots:[SH("l5-s01","The door in Material Preview with DoorPaint. Cutters stay hidden in the Outliner.",[["PROPERTIES:WINDOW","3"],["OUTLINER:WINDOW","2"]])],
   see:`A blue-grey door with all its openings, no orange wireframes.`},

   {t:"Look from across the room, then decide where detail goes", goal:"A plan: detail at joints and ends, calm areas left calm.", do:[
     `Mouse over the viewport, numpad ${K("1")} (front view), and scroll out until the door is small.`,
     `Name the places where parts meet or end: <b>beside the window</b>, <b>at each cable port</b>, <b>along the bottom edge</b> (where boots kick it), and <b>where hands grab it</b>.`,
     `Name the calm areas: the big face above the window and the middle of the lower panel. Nothing goes there.`
   ], shots:[SH("l5-s02","From across the room: the primary and secondary forms already read. Tertiary detail will cluster at the window, ports, bottom edge and handles.")],
   why:`<b>Law 2:</b> detail spread evenly reads as noise. Clustered at joints and ends, it tells the story of how the object is built and used.`},

   {t:"Model a real-size hex bolt", goal:"An M12-size hex bolt head with its pivot on its base, bevelled, in Metal.", do:[
     `${K("Shift","A")} → <b>Mesh</b> → <b>Cylinder</b>. In the redo panel (<b>Add Cylinder</b>): Vertices <code>6</code>, Radius <code>0.011</code>, Depth <code>0.008</code>.`,
     `${K("Tab")}, ${K("A")}, then ${K("G")} ${K("Z")} <code>0.004</code> ${K("Enter")}, ${K("Tab")}. The bolt now sits <i>on</i> its origin instead of around it.`,
     `${K("F2")} → <code>Bolt</code>. Material tab → <b>New</b> → rename <code>Metal</code>, Hex <code>2A2B2E</code>, ${T("Metallic","1","0.000")}, Roughness <code>0.35</code>.`,
     ADDMOD("Generate","Bevel"),
     `Amount <code>0.0015</code>, Segments <code>2</code>, and under <b>Shading</b> tick <b>Harden Normals</b>. Then ${M("Object","Shade Auto Smooth")}.`
   ], shots:[SH("l5-s03","The bolt: Dimensions 0.019 × 0.022 × 0.008 m (19 mm across the flats, 22 mm across the corners, 8 mm tall), Bevel 1.5 mm × 2 segments.",[["PROPERTIES:WINDOW","4–5"],["VIEW_3D:UI","1"]])],
   see:`A tiny six-sided bolt head at the bottom of the door, sitting on the grid.`,
   why:`<b>Real sizes (Law 1):</b> an M12 bolt head is 19 mm across its flats and about 22 mm across its corners. Use real fastener sizes and the whole prop reads at the right scale.`},

   {t:"Turn on snapping that sticks things to surfaces", goal:"Snapping set to put an object's pivot on a face and turn it to match.", do:[
     `Click the <b>magnet</b> icon in the middle of the viewport header (or ${K("Shift","Tab")}): it turns blue.`,
     `Click the small <b>▾</b> right of the magnet to open <b>Snapping</b>.`,
     `<b>Snap Base</b>: click <b>Center</b>. <b>Snap Target</b>: click <b>Face</b> (only Face stays highlighted).`,
     `Tick <b>Align Rotation to Target</b>. Move the mouse away to close it.`
   ], shots:[SH("l5-s04","The Snapping popover: Snap Base Center, Snap Target Face, Align Rotation to Target ticked.")],
   why:`<b>Center</b> snaps the object's pivot (on the bolt's base), <b>Face</b> snaps it to the surface under the mouse, and <b>Align Rotation</b> turns the bolt's up-axis to point out of that surface.`},

   {t:"Place the first bolt, mirrored", goal:"A bolt on each side of the window, from one object.", do:[
     ADDMOD("Generate","Mirror"),
     `In its <b>Mirror Object</b> field choose <b>Door</b> (the same trick as the port cutter in Lesson 4).`,
     `Mouse over the viewport, press ${K("G")}, and move the mouse onto the door's front face <b>just right of the window's lower half</b>. The bolt jumps onto the surface and turns to face you.`,
     `Left-click to drop it.`
   ], shots:[SH("l5-s05","G with snapping: the bolt lands flat on the door face, turned outward, and its mirrored twin appears on the left.")],
   see:`Two bolts, one each side of the window, lying flat on the face.`},

   {t:"Shift+D: bolts at the window and the ports", goal:"Four bolts on the right (eight with the mirror) at the window and the cable ports.", do:[
     `With the bolt selected: ${K("Shift","D")}, move the mouse onto the face beside the window's <b>upper</b> half, click.`,
     `${K("Shift","D")} again: just <b>above</b> the right cable port, click.`,
     `${K("Shift","D")} again: just <b>below</b> the right cable port, click.`
   ], shots:[SH("l5-s06","Four bolts on the right, mirrored to the left: two by the window, two clamping each port.")],
   see:`Bolts in pairs: either side of the window and above and below each port.`,
   why:`Snapping stays on, so every duplicate lands on the surface the moment you move it. Each copy keeps the Mirror modifier, so you only ever place the right side.`},

   {t:"A row of bolts with an Array", goal:"Nine evenly spaced bolts along the bottom edge.", do:[
     `${K("Shift","D")} a bolt and drop it on the face near the <b>bottom-left</b> of the door: about 9 cm up and 40 cm left of centre.`,
     `In the modifier list, click the <b>X</b> on its <b>Mirror</b> panel (a row across the whole door needs no mirror).`,
     ADDMOD("Generate","Array"),
     `${T("Count","9","2")}. Relative Offset <b>Factor X</b>: <code>5.2</code> (it shows 1). ${K("F2")} → <code>BoltRow</code>.`
   ], shots:[SH("l5-s07","BoltRow: Bevel then Array (Count 9, Relative Offset X 5.2). Nine bolts 10 cm apart along the kick plate, centred on the door.",[["PROPERTIES:WINDOW","3–4"]])],
   see:`A straight row of nine bolts across the bottom of the door.`,
   why:`<b>Factor X 5.2</b> means each copy moves 5.2 bolt-widths along the bolt's own X axis. The bolt is 19 mm wide in X (across its flats), so 5.2 × 19 mm ≈ 10 cm, and nine bolts run from 40 cm left of centre to 40 cm right.`},

   {t:"A cable from a Bezier curve", goal:"A 24 mm thick cable leaving the right port and dropping to the floor, mirrored.", do:[
     `Press ${K("Shift","Tab")} to turn snapping <b>off</b> for this step.`,
     `${K("Shift","A")} → <b>Curve</b> → <b>Bezier</b>. ${K("F2")} → <code>Cable</code>. ${K("Tab")} into Edit Mode.`,
     `Click the curve's <b>left end point</b> (its handles light up too). In the sidebar (${K("N")}, Item) under <b>Control Point</b> type X <code>0.38</code>, Y <code>-0.11</code>, Z <code>1.0</code>.`,
     `Mouse over the viewport: ${K("R")} ${K("Z")} <code>-135</code> ${K("Enter")}, then ${K("S")} <code>0.35</code> ${K("Enter")}. Its handle now points straight out of the door.`,
     `Click the <b>other end point</b>. Under Control Point type X <code>0.5</code>, Y <code>-0.45</code>, Z <code>0.08</code>. Then ${K("R")} ${K("Y")} <code>90</code> ${K("Enter")} and ${K("S")} <code>0.4</code> ${K("Enter")}. ${K("Tab")} out.`,
     `Properties → <b>Data</b> tab (green curve icon) → <b>Geometry</b> → <b>Bevel</b>: Depth <code>0.012</code>, Resolution <code>4</code>, tick <b>Fill Caps</b>.`,
     `Add a <b>Mirror</b> modifier with Mirror Object <b>Door</b>, and a new material <code>Rubber</code> (Hex <code>161616</code>, Roughness <code>0.8</code>).`
   ], shots:[SH("l5-s08a","Edit Mode with the left end point selected: sidebar › Control Point 0.38 / −0.11 / 1 m, the mouth of the right port.",[["VIEW_3D:UI","3"]]),
             SH("l5-s08","Data tab (shown full-window) › Geometry › Bevel: Round, Depth 0.012 m, Resolution 4, Fill Caps. The curve is now a round cable.")],
   see:`Two black cables leaving the ports, curving down to the floor in front of the door.`},

   {t:"Connectors at both ends", goal:"A metal sleeve plugged into each port and a junction box where each cable meets the floor.", do:[
     `${K("Shift","A")} → <b>Mesh</b> → <b>Cylinder</b> (redo panel: Vertices <code>16</code>, Radius <code>0.03</code>, Depth <code>0.08</code>). ${K("R")} ${K("X")} <code>90</code> ${K("Enter")}. Location <code>0.38</code> / <code>-0.07</code> / <code>1.0</code>. ${K("Ctrl","A")} → <b>Rotation &amp; Scale</b>. ${K("F2")} → <code>Connector</code>.`,
     `Material tab: click the <b>browse</b> button (sphere ▾ left of New) and pick <b>Metal</b>. Add a Bevel (0.002, 2 segments), ${M("Object","Shade Auto Smooth")}, and a Mirror with Mirror Object <b>Door</b>.`,
     `${K("Shift","A")} → <b>Mesh</b> → <b>Cube</b>. Dimensions <code>0.14</code> / <code>0.14</code> / <code>0.09</code>, ${K("Ctrl","A")} → <b>Scale</b>, Location <code>0.5</code> / <code>-0.45</code> / <code>0.045</code>. ${K("F2")} → <code>JunctionBox</code>.`,
     `Same finish: Metal, Bevel (0.006, 3 segments), Shade Auto Smooth, Mirror with Mirror Object <b>Door</b>.`
   ], shots:[SH("l5-s09","The sleeve: 3 cm of it sits inside the port, the cable comes out of its front."),
             SH("l5-s09b","The junction box on the floor: the cable ends inside its top.")],
   see:`Each cable now starts in a metal sleeve and ends in a box. Nothing floats.`,
   why:`<b>Both ends, always.</b> A cable that just touches a surface reads as a noodle lying there. A sleeve or gland at each end says "this carries power".`},

   {t:"A warning plate that's really fixed on", goal:"A yellow plate under the window with four screws.", do:[
     `${K("Shift","A")} → <b>Mesh</b> → <b>Cube</b>. Dimensions <code>0.26</code> / <code>0.004</code> / <code>0.1</code>, ${K("Ctrl","A")} → <b>Scale</b>. Location <code>0</code> / <code>-0.062</code> / <code>1.27</code>. ${K("F2")} → <code>WarningPlate</code>.`,
     `New material <code>Hazard</code>, Hex <code>E0A21B</code>. Bevel 0.001 × 2 segments, Shade Auto Smooth.`,
     `${K("Shift","Tab")} to turn snapping back on. Click any <b>Bolt</b>, ${K("Shift","D")}, move onto the plate near its <b>top-right corner</b>, click. Then ${K("S")} <code>0.5</code> ${K("Enter")}: a screw.`,
     `${K("Shift","D")} that screw onto the plate's <b>bottom-right corner</b>, click. The Mirror adds the left pair.`
   ], shots:[SH("l5-s10","A 4 mm plate lying on the door, held by four half-size screws.")],
   see:`A yellow plate below the window with a screw in each corner.`,
   pro:`<b>Floaters:</b> a plate like this is a separate part lying on the surface, not cut into it. In a game it's usually baked into the normal map, but on the high poly it still needs believable fixings.`},

   {t:"Grip rails", goal:"A metal grip rail each side, bolted on top and bottom.", do:[
     `${K("Shift","A")} → <b>Mesh</b> → <b>Cube</b>. Dimensions <code>0.05</code> / <code>0.06</code> / <code>0.5</code>, ${K("Ctrl","A")} → <b>Scale</b>. Location <code>0.52</code> / <code>-0.09</code> / <code>1.1</code>. ${K("F2")} → <code>GripRail</code>.`,
     `Metal, Bevel <code>0.006</code> × 3 segments with Harden Normals, Shade Auto Smooth, Mirror with Mirror Object <b>Door</b>.`,
     `Click a <b>Bolt</b>, ${K("Shift","D")} onto the rail's front face near its <b>top</b>, click. ${K("Shift","D")} again near its <b>bottom</b>, click.`
   ], shots:[SH("l5-s11","The rail stands 6 cm proud of the door with a bolt at each end.")],
   see:`Two vertical rails beside the ports, each held by two bolts.`},

   {t:"Floor, camera and three area lights", goal:"A camera framing the door, a floor to catch shadows, and key, rim and fill lights aimed at the door.", do:[
     `${K("Shift","A")} → <b>Mesh</b> → <b>Plane</b>, ${K("S")} <code>40</code> ${K("Enter")}, ${K("F2")} → <code>Floor</code>. New material <code>Floor</code>, Hex <code>1E2024</code>, Roughness <code>0.7</code>.`,
     `Orbit to a low three-quarter view of the whole door, then press ${K("Ctrl","Alt","Numpad 0")}: the camera jumps to your view.`,
     `Click the <b>Light</b>. Light tab (green bulb): click <b>Area</b>, set <b>Shape</b> to <b>Square</b> (5.3 starts it as a thin Rectangle), Power <code>250</code> W, Size <code>1.5</code> m. Sidebar Location <code>-2.6</code> / <code>-2.4</code> / <code>3.0</code>.`,
     `Object Constraint tab → <b>Add Object Constraint</b> → <b>Track To</b>. Target: <b>Door</b>. The light now always aims at the door.`,
     `${K("Shift","D")}, right-click (stay in place), Location <code>2.0</code> / <code>1.6</code> / <code>2.6</code>, Power <code>900</code>: the <b>rim</b>. ${K("Shift","D")} again, Location <code>3.0</code> / <code>-2.8</code> / <code>0.8</code>, Power <code>60</code>: the <b>fill</b>.`,
     `World tab (red globe) → Surface → <b>Color</b> Hex <code>0E1013</code>. Click the fourth sphere (<b>Rendered</b>) to preview.`
   ], shots:[SH("l5-s12","Looking through the camera in Rendered mode, the key light selected: Area, Square, 250 W, 1.5 m.",[["PROPERTIES:WINDOW","3"]]),
             SH("l5-s12b","The Track To constraint aiming the light at the door.",[["PROPERTIES:WINDOW","4"]])],
   see:`Through the camera: the door lit from the front-left, its edges outlined by the rim light, the floor fading into a dark background.`,
   why:`<b>Law 3 pays off here:</b> the rim light from behind skims every bevel you made, drawing a bright line round each edge. Without bevels there'd be nothing for it to catch.`},

   {t:"EEVEE, F12, save the image", goal:"A 1920 × 1080 render saved as a PNG.", do:[
     `Render tab (back of a camera): Render Engine <b>EEVEE</b>. Under <b>Sampling › Render</b>, Samples <code>64</code>. Tick the <b>Raytracing</b> panel's checkbox.`,
     `Output tab: Resolution <b>1920 × 1080</b>, 100% (the defaults).`,
     `Mouse over the viewport, press ${K("F12")}. A render window opens and fills in.`,
     `In the render window: ${M("Image","Save As")}, name it <code>door_hero.png</code>, save it next to your .blend.`
   ], shots:[SH("l5-s13a","Render tab: EEVEE, Sampling › Render › Samples 64, Raytracing ticked.",[["PROPERTIES:WINDOW","1"]]),
             SH("l5-s13","F12: the finished render in Blender's render window.")],
   see:`Your door, rendered: soft key light, rim highlights on every bevel, bolts and cables catching the light.`,
   pro:`<b>Portfolio habit:</b> render the hero shot plus a front, a side and a close-up of the busiest area, all from the same lights. Reviewers judge the close-up first.`}
  ],
  check:`<b>You should have:</b> Lesson 4's door painted DoorPaint; a real-size bolt with its pivot on its base, placed by snapping and mirrored across the door (window and ports); a row of nine bolts from an Array; a mirrored Bezier cable with a 12 mm bevel depth, plugged into a metal sleeve at the port and a junction box at the floor; a yellow plate with four screws; two bolted grip rails; a floor, a camera, key/rim/fill area lights aimed with Track To; and a saved EEVEE render.`,
  cards:[
    ["Law 2's three numbers, and what goes in each?","<b>70 · 20 · 10.</b> Primary: silhouette and big forms. Secondary: openings and joints. Tertiary: fasteners, cables, plates, seams."],
    ["Where does tertiary detail go, and where not?","At joints and ends (around openings, ports, edges, handles). Big calm areas stay empty so the detail has contrast."],
    ["Why model a bolt with its pivot on its base?","Snapping places the pivot on the surface: the bolt lands sitting on it, not half buried."],
    ["The three snapping settings that stick an object to a surface?","Snap Base <b>Center</b>, Snap Target <b>Face</b>, <b>Align Rotation to Target</b> (magnet on: <kbd>Shift</kbd><kbd>Tab</kbd>)."],
    ["How do you place symmetric details only once?","A <b>Mirror</b> modifier on the part with <b>Mirror Object = Door</b>; Shift+D copies keep it."],
    ["Nine evenly spaced bolts in a row?","<b>Array</b>: Count 9, Relative Offset X 5.2 (5.2 bolt widths ≈ 10 cm apart). Remove the Mirror first."],
    ["How does a curve become a cable?","Data tab › Geometry › Bevel › <b>Depth</b> (radius), plus Fill Caps."],
    ["The rule for every cable, plate and bolt?","<b>What's holding it on?</b> Fixings at both ends: sleeves and boxes for cables, screws for plates, contact for bolts."],
    ["Ctrl+Alt+Numpad 0 does what?","Moves the camera to your current view."],
    ["How do you keep a light aimed at the subject while you move it?","A <b>Track To</b> constraint with Target = the subject."],
    ["Key, rim, fill: which is strongest and what is each for?","Rim is often strongest (outlines edges from behind), key shapes the form from the front-side, fill is weak and only lifts the shadows."]
  ],
  boss:{
    title:"Boss fight: dress and light it from memory",
    brief:"Start from your Lesson 4 door with no Lesson 5 parts. Memory mode on, timer running. Dress it and render it without the steps.",
    goal:30,
    items:[
      ["Bolt with pivot on its base, snapped and mirrored at the window and ports",""],

      ["Plate with screws, and bolted grip rails",""],
      ["Floor, camera from view, key/rim/fill lights with Track To",""],
      ["EEVEE render saved as a PNG",""]
    ],
    stretch:[
      ["Cable clamps","Make a small U-shaped clamp (a cube with an inset and extrude) and snap two along each cable where it passes the door, bolted to the face."],
      ["A keypad floater","A 12 × 16 cm plate on one side only with a 3 × 4 grid of buttons made from one cube and an Array in X and a second Array in Z."],
      ["Turntable render","Parent the camera to an Empty at the door's base, keyframe the Empty's Z rotation 0° → 360° over 120 frames and render an animation."]
    ]
  }

/* ===================== MINI 3D VIEWER: WebGL + matcap, no libraries ===================== */
function makeMatcap(kind){
  const N = 256, c = document.createElement("canvas"); c.width = c.height = N;
  const g = c.getContext("2d"), im = g.createImageData(N, N);
  const nrm = v => { const l = Math.hypot(...v); return v.map(x=>x/l); };
  const L1 = nrm([-0.55, 0.65, 0.55]), L2 = nrm([0.7, -0.25, 0.5]), H1 = nrm([L1[0], L1[1], L1[2]+1]);
  for(let y=0; y<N; y++) for(let x=0; x<N; x++){
    const nx = (x+.5)/N*2-1, ny = 1-(y+.5)/N*2, r2 = nx*nx+ny*ny, o = (y*N+x)*4;
    let col = [20,21,24];
    if(r2 <= 1){
      const nz = Math.sqrt(1-r2), n = [nx,ny,nz];
      const d1 = Math.max(0, n[0]*L1[0]+n[1]*L1[1]+n[2]*L1[2]), d2 = Math.max(0, n[0]*L2[0]+n[1]*L2[1]+n[2]*L2[2]);
      const sp = Math.pow(Math.max(0, n[0]*H1[0]+n[1]*H1[1]+n[2]*H1[2]), 70);
      const rim = Math.pow(1-nz, 2.5);
      if(kind === "stripes"){
        // reflection check: stripes on the reflected view vector, like Blender's check_reflection matcaps
        const ry = 2*nz*ny, rz = 2*nz*nz-1, ang = Math.atan2(ry, Math.abs(rz)+1e-4);
        const t = 0.5+0.5*Math.tanh(Math.sin(ang*7)*5);
        const v = 0.13 + 0.72*t;
        col = [v*235*(.75+.25*d1), v*238*(.75+.25*d1), v*250*(.8+.2*d1)].map(Math.round);
      } else {
        const v = 0.10 + 0.62*d1 + 0.20*d2 + 0.22*rim;
        col = [v*196 + sp*255, v*200 + sp*255, v*208 + sp*255].map(z=>Math.min(255, Math.round(z)));
      }
    }
    im.data[o]=col[0]; im.data[o+1]=col[1]; im.data[o+2]=col[2]; im.data[o+3]=255;
  }
  g.putImageData(im, 0, 0); return c;
}
const MATCAPS = {};
function matcap(kind){ return MATCAPS[kind] || (MATCAPS[kind] = makeMatcap(kind)); }

function createViewer(stage){
  const cv = document.createElement("canvas"); cv.className = "gl"; stage.appendChild(cv);
  const tip = document.createElement("div"); tip.className = "tip"; tip.textContent = "drag to orbit · scroll or pinch to zoom"; stage.appendChild(tip);
  const stats = document.createElement("div"); stats.className = "stats"; stage.appendChild(stats);
  const gl = cv.getContext("webgl", {antialias:true, alpha:false});
  if(!gl){ stage.innerHTML = `<div class="say" style="margin:14px">This lab needs WebGL, which this browser has switched off.</div>`; return null; }
  const sh = (type, src)=>{ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = (vs, fs)=>{ const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); return p; };
  const P = prog(`attribute vec3 p;attribute vec3 n;uniform mat4 mv,pr;varying vec3 vn;void main(){vn=(mv*vec4(n,0.)).xyz;gl_Position=pr*mv*vec4(p,1.);}`,
                 `precision mediump float;uniform sampler2D mc;uniform vec3 tint;varying vec3 vn;void main(){vec3 n=normalize(vn);vec4 c=texture2D(mc,vec2(.5+n.x*.49,.5-n.y*.49));gl_FragColor=vec4(c.rgb*tint,1.);}`);
  const W = prog(`attribute vec3 p;uniform mat4 mv,pr;void main(){gl_Position=pr*mv*vec4(p,1.);gl_Position.z-=0.0004*gl_Position.w;}`,
                 `precision mediump float;uniform vec4 col;void main(){gl_FragColor=col;}`);
  const tex = gl.createTexture();
  const bufs = {p:gl.createBuffer(), n:gl.createBuffer(), w:gl.createBuffer(), w2:gl.createBuffer()};
  const st = {yaw:0.65, pitch:0.42, dist:3, target:[0,0,0], count:0, wcount:0, w2count:0, mc:"clay", tint:[1,1,1], radius:1};
  function setMatcap(kind){ st.mc = kind; gl.bindTexture(gl.TEXTURE_2D, tex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, matcap(kind)); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); draw(); }
  // mesh: pos/nrm Float32Array (3 per corner, triangles), wire/wire2 Float32Array (3 per line end) or null
  function setMesh(m, frame){
    gl.bindBuffer(gl.ARRAY_BUFFER, bufs.p); gl.bufferData(gl.ARRAY_BUFFER, m.pos, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, bufs.n); gl.bufferData(gl.ARRAY_BUFFER, m.nrm, gl.STATIC_DRAW);
    st.count = m.pos.length/3;
    st.wcount = 0; st.w2count = 0;
    if(m.wire){ gl.bindBuffer(gl.ARRAY_BUFFER, bufs.w); gl.bufferData(gl.ARRAY_BUFFER, m.wire, gl.STATIC_DRAW); st.wcount = m.wire.length/3; }
    if(m.wire2){ gl.bindBuffer(gl.ARRAY_BUFFER, bufs.w2); gl.bufferData(gl.ARRAY_BUFFER, m.wire2, gl.STATIC_DRAW); st.w2count = m.wire2.length/3; }
    if(frame){
      let lo = [1e9,1e9,1e9], hi = [-1e9,-1e9,-1e9];
      for(let i=0; i<m.pos.length; i+=3) for(let k=0; k<3; k++){ lo[k] = Math.min(lo[k], m.pos[i+k]); hi[k] = Math.max(hi[k], m.pos[i+k]); }
      st.target = lo.map((v,k)=>(v+hi[k])/2); st.radius = Math.hypot(hi[0]-lo[0], hi[1]-lo[1], hi[2]-lo[2])/2; st.dist = st.radius*4.2;
    }
    stats.textContent = m.label || `${(st.count/3).toLocaleString()} triangles`;
    draw();
  }
  function mats(){
    const w = cv.clientWidth, h = cv.clientHeight, a = w/h, f = 1/Math.tan(0.6/2), nr = st.radius*0.05, fr = st.dist*8;
    const pr = new Float32Array([f/a,0,0,0, 0,f,0,0, 0,0,(fr+nr)/(nr-fr),-1, 0,0,2*fr*nr/(nr-fr),0]);
    const cy = Math.cos(st.yaw), sy = Math.sin(st.yaw), cp = Math.cos(st.pitch), sp = Math.sin(st.pitch);
    const D = st.dist*Math.max(1, 1.3/a), eye = [st.target[0]+D*cp*sy, st.target[1]+D*sp, st.target[2]+D*cp*cy];
    const zf = [eye[0]-st.target[0], eye[1]-st.target[1], eye[2]-st.target[2]], zl = Math.hypot(...zf), z = zf.map(v=>v/zl);
    let x = [z[2], 0, -z[0]]; const xl = Math.hypot(...x) || 1; x = x.map(v=>v/xl);
    const y = [z[1]*x[2]-z[2]*x[1], z[2]*x[0]-z[0]*x[2], z[0]*x[1]-z[1]*x[0]];
    const d = (u)=>-(u[0]*eye[0]+u[1]*eye[1]+u[2]*eye[2]);
    const mv = new Float32Array([x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0, d(x),d(y),d(z),1]);
    return {pr, mv};
  }
  function draw(){
    const dpr = Math.min(2, window.devicePixelRatio||1), w = Math.round(cv.clientWidth*dpr), h = Math.round(cv.clientHeight*dpr);
    if(!w || !h) return;
    if(cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
    gl.viewport(0, 0, w, h); gl.clearColor(0.078, 0.082, 0.094, 1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT); gl.enable(gl.DEPTH_TEST);
    if(!st.count) return;
    const {pr, mv} = mats();
    gl.useProgram(P);
    gl.uniformMatrix4fv(gl.getUniformLocation(P,"pr"), false, pr); gl.uniformMatrix4fv(gl.getUniformLocation(P,"mv"), false, mv);
    gl.uniform3fv(gl.getUniformLocation(P,"tint"), st.tint);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(gl.getUniformLocation(P,"mc"), 0);
    const ap = gl.getAttribLocation(P,"p"), an = gl.getAttribLocation(P,"n");
    gl.bindBuffer(gl.ARRAY_BUFFER, bufs.p); gl.enableVertexAttribArray(ap); gl.vertexAttribPointer(ap, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, bufs.n); gl.enableVertexAttribArray(an); gl.vertexAttribPointer(an, 3, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, st.count);
    gl.disableVertexAttribArray(an);
    const lines = (buf, n, col)=>{ if(!n) return; gl.useProgram(W);
      gl.uniformMatrix4fv(gl.getUniformLocation(W,"pr"), false, pr); gl.uniformMatrix4fv(gl.getUniformLocation(W,"mv"), false, mv);
      gl.uniform4fv(gl.getUniformLocation(W,"col"), col);
      const wp = gl.getAttribLocation(W,"p"); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.enableVertexAttribArray(wp); gl.vertexAttribPointer(wp, 3, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.LINES, 0, n); };
    lines(bufs.w2, st.w2count, [0.05,0.05,0.06,1]);
    lines(bufs.w, st.wcount, [1.0,0.62,0.18,1]);
  }
  // orbit + zoom (mouse, touch, pinch)
  const pts = new Map(); let pinch0 = 0, dist0 = 0;
  cv.addEventListener("pointerdown", e=>{ cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); if(pts.size===2){ const [a,b] = [...pts.values()]; pinch0 = Math.hypot(a[0]-b[0], a[1]-b[1]); dist0 = st.dist; } });
  cv.addEventListener("pointermove", e=>{
    if(!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    if(pts.size === 2){ const [a,b] = [...pts.values()]; const d = Math.hypot(a[0]-b[0], a[1]-b[1]); if(pinch0) st.dist = Math.max(st.radius*1.2, Math.min(st.radius*8, dist0*pinch0/d)); }
    else { st.yaw -= (e.clientX-prev[0])*0.008; st.pitch = Math.max(-1.45, Math.min(1.45, st.pitch + (e.clientY-prev[1])*0.008)); }
    draw();
  });
  const up = e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch0 = 0; };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("wheel", e=>{ e.preventDefault(); st.dist = Math.max(st.radius*1.2, Math.min(st.radius*8, st.dist*(1+Math.sign(e.deltaY)*0.1))); draw(); }, {passive:false});
  new ResizeObserver(()=>draw()).observe(cv);
  setMatcap("clay");
  return {setMesh, setMatcap, draw, st, stats};
}

/* ===================== LAB UI HELPERS ===================== */
function segCtl(label, opts, cur, on){
  const d = document.createElement("div");
  d.innerHTML = `<div class="lbl">${label}</div><div class="seg">${opts.map(o=>`<button type="button" data-v="${o[0]}" class="${o[0]===cur?"on":""}">${o[1]}</button>`).join("")}</div>`;
  d.querySelectorAll("button").forEach(b=>b.onclick = ()=>{ d.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b)); on(b.dataset.v); });
  return d;
}
function rangeCtl(label, min, max, step, cur, fmtv, on){
  const d = document.createElement("div");
  d.innerHTML = `<div class="lbl">${label} <span class="val">${fmtv(cur)}</span></div><input type="range" min="${min}" max="${max}" step="${step}" value="${cur}">`;
  const r = d.querySelector("input"), v = d.querySelector(".val");
  r.oninput = ()=>{ v.textContent = fmtv(+r.value); on(+r.value); };
  return d;

function labFrame(body){

/* ===================== LAB: SUPPORT LOOPS (live Catmull-Clark with creases) ===================== */
function ccSubdivide(V, F, crease){
  // V: [[x,y,z]], F: [[i,j,k,l]], crease: Map("a_b" -> 0..1). One Catmull-Clark level, semi-sharp creases.
  const ek = (a,b)=> a<b ? a+"_"+b : b+"_"+a;
  const E = new Map(), vFaces = V.map(()=>[]), vEdges = V.map(()=>[]);
  const fp = F.map((f,fi)=>{ f.forEach(i=>vFaces[i].push(fi)); const c=[0,0,0]; f.forEach(i=>{ c[0]+=V[i][0]; c[1]+=V[i][1]; c[2]+=V[i][2]; }); return c.map(x=>x/f.length); });
  F.forEach((f,fi)=>f.forEach((a,j)=>{ const b = f[(j+1)%f.length], k = ek(a,b); if(!E.has(k)){ E.set(k, {a, b, f:[], c: crease.get(k)||0, id: V.length + F.length + E.size}); vEdges[a].push(k); vEdges[b].push(k); } E.get(k).f.push(fi); }));
  const out = new Array(V.length + F.length + E.size);
  E.forEach(e=>{
    const m = [0,1,2].map(k=>(V[e.a][k]+V[e.b][k])/2);
    let p = m;
    if(e.f.length === 2 && e.c < 1){
      const s = [0,1,2].map(k=>(V[e.a][k]+V[e.b][k]+fp[e.f[0]][k]+fp[e.f[1]][k])/4);
      p = [0,1,2].map(k=>s[k]*(1-e.c) + m[k]*e.c);
    }
    out[e.id] = p;
  });
  V.forEach((v,i)=>{
    const n = vFaces[i].length, es = vEdges[i].map(k=>E.get(k));
    const sharp = es.filter(e=>e.c > 0 || e.f.length < 2);
    const Q = [0,1,2].map(k=>vFaces[i].reduce((s,fi)=>s+fp[fi][k],0)/n);
    const R = [0,1,2].map(k=>es.reduce((s,e)=>s+(V[e.a][k]+V[e.b][k])/2,0)/es.length);
    const smooth = [0,1,2].map(k=>(Q[k] + 2*R[k] + (n-3)*v[k])/n);
    let p = smooth;
    if(sharp.length === 2){
      const o = sharp.map(e=> e.a===i ? V[e.b] : V[e.a]);
      const cr = [0,1,2].map(k=>(6*v[k] + o[0][k] + o[1][k])/8);
      const w = Math.min(1, (sharp[0].c + sharp[1].c)/2);
      p = [0,1,2].map(k=>smooth[k]*(1-w) + cr[k]*w);
    } else if(sharp.length > 2){
      const w = Math.min(1, sharp.reduce((s,e)=>s+e.c,0)/sharp.length);
      p = [0,1,2].map(k=>smooth[k]*(1-w) + v[k]*w);
    }
    out[i] = p;
  });
  fp.forEach((p,fi)=>out[V.length+fi] = p);
  const NF = [], NC = new Map();
  F.forEach((f,fi)=>f.forEach((a,j)=>{
    const b = f[(j+1)%f.length], z = f[(j-1+f.length)%f.length];
    const e1 = E.get(ek(a,b)), e0 = E.get(ek(z,a));
    NF.push([a, e1.id, V.length+fi, e0.id]);
    if(e1.c > 1) NC.set(ek(a, e1.id), e1.c-1);
    if(e0.c > 1) NC.set(ek(a, e0.id), e0.c-1);
  }));
  // a crease above 1 keeps sharpening the children; between 0 and 1 it is used up this level
  return {V: out, F: NF, C: NC};
}
function cubeCage(d){
  // unit cube (-0.5..0.5) with holding loops at distance d from every edge: a 3x3 grid on each face
  const t = d > 0 ? [-0.5, -0.5+d, 0.5-d, 0.5] : [-0.5, 0.5];
  const n = t.length, V = [], idx = new Map(), F = [];

  const L = n-1;
  for(let a=0; a<L; a++) for(let b=0; b<L; b++){
    F.push([vid(a,b,0), vid(a,b+1,0), vid(a+1,b+1,0), vid(a+1,b,0)]); // -z
    F.push([vid(a,b,L), vid(a+1,b,L), vid(a+1,b+1,L), vid(a,b+1,L)]); // +z
    F.push([vid(a,0,b), vid(a+1,0,b), vid(a+1,0,b+1), vid(a,0,b+1)]); // -y
    F.push([vid(a,L,b), vid(a,L,b+1), vid(a+1,L,b+1), vid(a+1,L,b)]); // +y
    F.push([vid(0,a,b), vid(0,a,b+1), vid(0,a+1,b+1), vid(0,a+1,b)]); // -x
    F.push([vid(L,a,b), vid(L,a+1,b), vid(L,a+1,b+1), vid(L,a,b+1)]); // +x

function meshArrays(V, F, smooth){

  F.forEach((f,fi)=>f.forEach(i=>{ vn[i][0]+=fn[fi][0]; vn[i][1]+=fn[fi][1]; vn[i][2]+=fn[fi][2]; }));

function wireArrays(V, F){

}
LAB.subd = function(body){
  const {stage, ctl} = labFrame(body); const v = createViewer(stage); if(!v) return;
