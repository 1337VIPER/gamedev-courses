<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hard Surface Fast Track</title>
<meta name="description" content="Interactive, click-by-click hard-surface modelling course for Blender 5.3, built around real props.">
<style>
:root{
  --bg:#17181b;--panel:#1f2125;--card:#25272c;--card2:#2c2f35;--line:#363941;--ink:#e8e9ec;--mut:#9a9ea8;--dim:#6d717b;
  --acc:#00d6a3;--acc2:#4fb3ff;--warn:#f0a35a;--good:#5fd38d;--bad:#ef6b6b;
  --geo:#00d6a3;--float:#a1a1a1;--int:#598c5c;--vec:#6363c7;--bool:#cca6d6;--rot:#a663c7;--menu:#7c7c7c;--obj:#ed9e5c;--str:#70b2ff;--mat:#eb7582;--col:#c7c729;--shd:#63c763;
  --h-input:#83314a;--h-geo:#1d725e;--h-util:#2f4f86;--h-tex:#7a4a1f;--h-group:#3d3f45;--h-shader:#2b652b;--h-curve:#1d725e;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc2)}
kbd{font:600 .78em/1 ui-monospace,Consolas,monospace;background:#0f1012;border:1px solid #444851;border-bottom-width:2px;border-radius:4px;padding:.18em .42em;color:#f1f1f1;white-space:nowrap}
code{font:.88em ui-monospace,Consolas,monospace;background:#0f1012;border:1px solid #33363d;border-radius:4px;padding:.05em .35em;color:#d9f7ee}
b.n{color:var(--acc);font-weight:600}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:20px 16px}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.brand svg{flex:none}
.brand h1{font-size:1.02rem;margin:0;line-height:1.2}
.brand small{display:block;color:var(--mut);font-weight:400;font-size:.78rem}
.ring{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:16px 0}
.ring svg{flex:none}
.ring .t{font-size:.82rem;color:var(--mut);line-height:1.35}
.ring .t b{display:block;color:var(--ink);font-size:1rem}
nav .grp{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:18px 4px 6px}
nav a.l{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);padding:8px 8px;border-radius:8px;font-size:.9rem;line-height:1.25}
nav a.l:hover{background:var(--card)}
nav a.l.on{background:var(--card2);box-shadow:inset 3px 0 0 var(--acc)}
nav a.l .nb{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;background:#2d3036;color:var(--mut)}
nav a.l.done .nb{background:var(--acc);color:#04261d}
nav a.l .bar{height:3px;background:#30333a;border-radius:2px;margin-top:5px;overflow:hidden}
nav a.l .bar i{display:block;height:100%;background:var(--acc);width:0}
nav .lock{display:flex;gap:10px;align-items:center;color:var(--dim);padding:6px 8px;font-size:.85rem;line-height:1.25}
nav .lock .nb{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;border:1px dashed #444851}
.tools{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font:600 .85rem system-ui,sans-serif;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{border-color:#50545e;background:var(--card2)}
a.btn{text-decoration:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04261d}
.btn.pri:hover{filter:brightness(1.08)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.85rem;cursor:pointer;user-select:none}
.toggle .sw{width:34px;height:20px;border-radius:10px;background:#3a3d44;position:relative;flex:none;transition:.2s}
.toggle .sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#cfd2d8;transition:.2s}
.toggle.on .sw{background:var(--acc)}.toggle.on .sw::after{left:17px;background:#04261d}
.save{font-size:.75rem;color:var(--dim);margin-top:10px;display:flex;gap:6px;align-items:center}
.save i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.save.ok i{background:var(--good)}.save.local i{background:var(--warn)}
main{min-width:0;padding:34px 40px 120px;max-width:1180px}
.hero{border:1px solid var(--line);border-radius:14px;padding:26px 28px;background:radial-gradient(1200px 300px at 0% 0%,rgba(0,214,163,.13),transparent 60%),var(--panel);margin-bottom:26px;position:relative;overflow:hidden}
.hero .kick{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:700}
.hero h2{font-size:2rem;line-height:1.15;margin:6px 0 10px}
.hero p{color:#c9ccd3;max-width:760px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:.76rem;border:1px solid #3d4048;border-radius:999px;padding:3px 10px;color:#cdd0d6;background:#1b1d20}
.chip.g{border-color:rgba(0,214,163,.45);color:#9ff3dc}
.use{margin-top:14px;font-size:.88rem;color:var(--mut)}
.use b{color:var(--ink)}
h3.sec{font-size:1.2rem;margin:38px 0 12px;display:flex;align-items:center;gap:10px}
h3.sec .tag{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;background:#2b2e34;color:var(--mut);border-radius:4px;padding:2px 7px}
.concepts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.concept{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.concept h4{margin:0 0 6px;font-size:.95rem;color:#fff}
.concept p{margin:0;color:#c3c6cd;font-size:.9rem}
.cap{font-size:.85rem;color:var(--mut);margin:0 2px 18px}
.steps{counter-reset:st;display:flex;flex-direction:column;gap:10px}
.step{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px 14px 14px;display:grid;grid-template-columns:30px 1fr;gap:10px;transition:border-color .2s,background .2s}
.step.done{border-color:rgba(0,214,163,.4);background:linear-gradient(90deg,rgba(0,214,163,.07),transparent 40%),var(--card)}
.cb{appearance:none;width:22px;height:22px;border-radius:6px;border:2px solid #555963;background:#1a1b1e;cursor:pointer;margin:1px 0 0;display:grid;place-items:center;transition:.15s}
.cb:checked{background:var(--acc);border-color:var(--acc)}
.cb:checked::after{content:"";width:6px;height:11px;border:solid #04261d;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cb:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.step .st{font-weight:650;color:#fff;cursor:pointer}
.step .st small{color:var(--acc);font-weight:700;margin-right:8px}
.step .sd{color:#c6c9d0;font-size:.92rem;margin-top:6px}
.step .sd p{margin:.4em 0}
.step .sd ul{margin:.3em 0;padding-left:20px}
.why{margin-top:8px;border-left:3px solid var(--acc2);background:rgba(79,179,255,.07);padding:7px 10px;border-radius:0 6px 6px 0;font-size:.87rem;color:#c9dcef}
.why b{color:#8fcbff}
.pro{margin-top:8px;border-left:3px solid var(--warn);background:rgba(240,163,90,.07);padding:7px 10px;border-radius:0 6px 6px 0;font-size:.87rem;color:#ecd9c6}
.pro b{color:#ffc58f}
.check{background:linear-gradient(135deg,rgba(0,214,163,.1),rgba(79,179,255,.06));border:1px solid rgba(0,214,163,.3);border-radius:10px;padding:14px 16px;color:#d6efe8;font-size:.92rem}
.check b{color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fc{perspective:900px;min-height:150px;cursor:pointer}
.fc .in{position:relative;width:100%;height:100%;min-height:150px;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;font-size:.9rem}
.fc .front{background:var(--card)}
.fc .back{background:#1d2a27;border-color:rgba(0,214,163,.35);transform:rotateY(180deg);color:#d9f3ec}
.fc .q{font-weight:600;color:#fff}
.fc .lab{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.fc .back .lab{color:#6fcfb4}
.fc .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.76rem;color:var(--dim);padding-top:8px}
.fc .knew{display:flex;gap:6px;align-items:center;color:#9fe9d4;cursor:pointer}
.fc .knew .cb{width:18px;height:18px}
.fc.known .front{border-color:rgba(0,214,163,.45)}
.boss{background:radial-gradient(600px 200px at 100% 0%,rgba(240,163,90,.14),transparent 60%),var(--card);border:1px solid rgba(240,163,90,.4);border-radius:12px;padding:18px 18px 8px}
.boss h4{margin:0 0 4px;color:#ffd2a6;font-size:1.05rem}
.boss .brief{color:#d8cfc6;font-size:.92rem;margin-bottom:10px}
.ck{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:7px 0;border-top:1px solid #3a3530;font-size:.92rem;color:#e8e1da}
.ck:first-of-type{border-top:0}
.ck label{cursor:pointer}
.ck small{display:block;color:#a89e93;font-size:.82rem;margin-top:2px}
.timer{display:flex;align-items:center;gap:10px;margin:6px 0 12px;flex-wrap:wrap}
.timer .clock{font:700 1.3rem ui-monospace,Consolas,monospace;color:#ffd2a6;min-width:84px}
textarea.notes{width:100%;min-height:110px;background:#141518;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:14px/1.5 system-ui,sans-serif;resize:vertical}
textarea.notes:focus{outline:none;border-color:var(--acc)}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.road{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.mod .mk{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);font-weight:700}
.mod.lockd .mk{color:var(--dim)}
.mod h4{margin:4px 0 6px;font-size:1rem}
.mod ul{margin:0;padding-left:18px;color:#c3c6cd;font-size:.88rem}
.mod.lockd{opacity:.78;border-style:dashed}
.mod a{text-decoration:none}
table.keys{width:100%;border-collapse:collapse;font-size:.9rem}
table.keys td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
table.keys td:first-child{white-space:nowrap;width:1%}
table.keys tr:first-child td{border-top:0}
.loop{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.loop div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.88rem;color:#c3c6cd}
.loop b{display:block;color:#fff;margin-bottom:3px}
.loop i{font-style:normal;color:var(--acc);font-weight:800;margin-right:6px}
/* literal steps */
.goal{color:#e9ebef;margin:2px 0 8px}
.goal b{color:var(--acc)}
ol.do{margin:6px 0 4px;padding-left:24px;display:flex;flex-direction:column;gap:7px}
ol.do li{padding-left:4px;line-height:1.55}
ol.do li::marker{color:var(--acc);font-weight:700}
ol.do li > b:first-child{color:#fff}
ol.do u{text-decoration:none;border-bottom:1px dashed #8fcbff;color:#d7ebff}
.so,.si{display:inline-block;border-radius:4px;padding:0 6px;font-size:.86em;font-weight:600;line-height:1.5}
.so{background:#20302c;color:#9ff3dc;border:1px solid #2f5a4f}
.si{background:#262a3a;color:#c3c9ff;border:1px solid #3d4466}
ol.do small{color:var(--dim)}
.see{margin-top:8px;border-left:3px solid var(--good);background:rgba(95,211,141,.07);padding:7px 10px;border-radius:0 6px 6px 0;font-size:.87rem;color:#d3efdd}
.see b{color:#8fe6b0}
details.basics{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 14px;padding:0 14px}
details.basics summary{cursor:pointer;padding:12px 0;font-weight:650;color:#fff}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:0 0 14px}
.bcard{background:#1d1f23;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.88rem;color:#c6c9d0}
.bcard b{display:block;color:#fff;margin-bottom:4px}
.bcard b i{font-style:normal;color:var(--acc);margin-right:6px}
.tscroll{overflow-x:auto;max-width:100%}
.step>div{min-width:0}
@media (max-width:900px){table.keys td:first-child{white-space:normal}}
.step .sd,.concept p{overflow-wrap:anywhere}
/* screenshots */
figure.shot{margin:10px 0 6px}
.shot .sw{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:zoom-in;background:#111;line-height:0}
.shot img{display:block;width:100%;height:auto}
.shot .mk{position:absolute;border:2.5px solid #ffd166;border-radius:5px;box-shadow:0 0 0 2px rgba(0,0,0,.55),0 0 18px rgba(255,209,102,.35);pointer-events:none}
.shot .mk b{position:absolute;top:-11px;left:-11px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#ffd166;color:#1a1400;font:800 12px/22px system-ui,sans-serif;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.shot figcaption{font-size:.8rem;color:var(--mut);margin-top:5px}
#lightbox{position:fixed;inset:0;background:rgba(5,6,8,.9);display:none;align-items:center;justify-content:center;z-index:60;padding:16px;cursor:zoom-out}
#lightbox.on{display:flex}
#lightbox .lbin{width:min(1600px,100%)}
#lightbox .sw{cursor:zoom-out}
/* memory mode */
body.memory .mem{filter:blur(7px) saturate(.4);opacity:.55;cursor:pointer;transition:filter .25s,opacity .25s;user-select:none}
body.memory .mem.peek{filter:none;opacity:1;user-select:auto}
body.memory .graphwrap .mem{pointer-events:auto}
.memnote{display:none;background:#2a2433;border:1px solid #574a6b;color:#dccbf3;border-radius:10px;padding:10px 14px;font-size:.88rem;margin:0 0 18px}
body.memory .memnote{display:block}
/* review modal */
.modal{position:fixed;inset:0;background:rgba(5,6,8,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;padding:22px}
.mbox .from{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.mbox .q{font-size:1.15rem;font-weight:650;margin:8px 0 14px}
.mbox .a{background:#1d2a27;border:1px solid rgba(0,214,163,.35);border-radius:10px;padding:12px 14px;color:#d9f3ec;display:none}
.mbox.show .a{display:block}
.mbox .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.mbox .cnt{font-size:.8rem;color:var(--dim);margin-right:auto;align-self:center}
.mtop{display:none;position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;justify-content:space-between;gap:10px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:290px;z-index:40;transform:translateX(-100%);transition:transform .25s}
  aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  .mtop{display:flex}
  main{padding:20px 16px 100px}
  .hero{padding:20px}.hero h2{font-size:1.55rem}
  .grid2,.loop{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* ---- hard surface additions ---- */
:root{--law:#ffd166}
.laws{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.lawc{perspective:900px;min-height:170px;cursor:pointer}
.lawc .in{position:relative;width:100%;height:100%;min-height:170px;transition:transform .45s;transform-style:preserve-3d}
.lawc.flip .in{transform:rotateY(180deg)}
.lawc .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column}
.lawc .front{background:radial-gradient(260px 120px at 100% 0%,rgba(255,209,102,.13),transparent 70%),var(--card)}
.lawc .back{background:#2a2618;border-color:rgba(255,209,102,.4);transform:rotateY(180deg);color:#f1e7cf;font-size:.86rem;line-height:1.5}
.lawc .num{font:800 2rem/1 system-ui,sans-serif;color:var(--law);opacity:.9}
.lawc h4{margin:6px 0 4px;font-size:1.02rem;color:#fff}
.lawc .sl{color:#e6d6aa;font-style:italic;font-size:.9rem}
.lawc .foot{margin-top:auto;font-size:.72rem;color:var(--dim)}
.chip.lawchip{border-color:rgba(255,209,102,.5);color:#ffe3a1;background:#221f15}
.xlab{background:#1b1c1f;border:1px solid var(--line);border-radius:12px;margin:14px 0 8px;overflow:hidden}
.xlab .lh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.9rem;flex-wrap:wrap}
.xlab .lh b{color:#fff}.xlab .lh .hint{color:var(--dim);font-size:.78rem}
.xlab .lb{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:0}
.xlab .stage{position:relative;min-height:340px;background:#141518;touch-action:none}
.xlab canvas.gl{display:block;width:100%;height:100%;min-height:340px;cursor:grab}
.xlab canvas.gl:active{cursor:grabbing}
.xlab .ctl{padding:12px 14px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:12px;font-size:.85rem}
.xlab .ctl .lbl{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{appearance:none;border:1px solid var(--line);background:var(--card);color:#d4d6db;border-radius:6px;padding:5px 9px;font:600 .78rem system-ui,sans-serif;cursor:pointer}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#04261d}
.xlab input[type=range]{width:100%;accent-color:var(--acc)}
.xlab .val{float:right;color:var(--acc);font-weight:700}
.xlab .say{background:#202228;border-radius:8px;padding:9px 11px;color:#cfd2d8;font-size:.84rem;line-height:1.45}
.xlab .say b{color:#fff}
.xlab .tip{position:absolute;left:10px;bottom:8px;font-size:.72rem;color:#777b85;pointer-events:none}
.xlab .stats{position:absolute;right:10px;top:8px;font:600 .72rem ui-monospace,Consolas,monospace;color:#9a9ea8;pointer-events:none;text-align:right}
.xlab .cap2{padding:8px 14px 12px;font-size:.84rem;color:var(--mut);border-top:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:6px;padding:14px}
.stack .mc{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stack .mc .ic{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-weight:800;color:#0b1a2a;background:#4fb3ff}
.stack .mc.ok{border-color:rgba(95,211,141,.6);background:linear-gradient(90deg,rgba(95,211,141,.1),transparent 50%),var(--card)}
.stack .mc.no{border-color:rgba(239,107,107,.6);background:linear-gradient(90deg,rgba(239,107,107,.1),transparent 50%),var(--card)}
.stack .mc small{display:block;color:var(--mut);font-size:.78rem;line-height:1.35}
.stack .mv{display:flex;gap:4px}.stack .mv button{appearance:none;border:1px solid var(--line);background:#2a2d33;color:#ddd;border-radius:6px;width:30px;height:28px;cursor:pointer}
.imgtabs .seg{padding:10px 14px 0}
.imgtabs img{display:block;width:100%;height:auto}
.doc{position:relative;line-height:0;cursor:crosshair}
.doc img{width:100%;height:auto;display:block}
.doc .hs{position:absolute;border:2px dashed transparent;border-radius:50%}
.doc .hs.found{border-color:#ffd166;background:rgba(255,209,102,.12)}
.doc .miss{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid var(--bad);pointer-events:none;animation:fade 1s forwards}
@keyframes fade{to{opacity:0;transform:scale(1.8)}}
canvas.ec{display:block;width:100%;height:300px;background:#141518}

<body>

      <button class="btn pri" id="mgot" style="display:none">Knew it ✓</button>
      <button class="btn" id="mclose">Close</button>
    </div>
  </div>
</div>

<script>
/* ===================== LITERAL STEP HELPERS ===================== */
const K = (...k)=>k.map(x=>`<kbd>${x}</kbd>`).join("");
const M = (...p)=>`<span class="menu">${p.join(" › ")}</span>`;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
// type a value into a field
function T(field, val, was){ return `click once on <b>${field}</b>${was!==undefined?` (it shows <i>${was}</i>)`:""}, type <code>${val}</code>, press ${K("Enter")}`; }
// add a modifier from the Properties editor
function ADDMOD(cat, name){ return `<b>Add the modifier:</b> in the Properties editor on the right, click the blue <b>wrench</b> tab → <b>Add Modifier</b> ▾ → <b>${cat}</b> → <b>${name}</b>. It appears as a new panel at the bottom of the list.`; }
// read the redo panel
function HUD(name, rows){ return `<b>Check the redo panel:</b> at the bottom-left of the viewport, click its title <b>${name}</b> to open it. It should read ${rows}. If a number is off, fix it right there; no need to redo the step.`; }
// a screenshot: file in shots/ (no extension), caption, optional yellow marks [[x0,y0,x1,y1,"1"],…] in 1600x900 pixels
function SH(file, cap, marks){
  const mk = (marks||[]).map(m=> typeof m[0] === "string" ? ((typeof SHOTBOX !== "undefined" && SHOTBOX[file] && SHOTBOX[file][m[0]]) ? [...SHOTBOX[file][m[0]], m[1]] : null) : m).filter(Boolean);
  return {src:`shots/${file}.jpg`, w:1600, h:900, cap, marks:mk};
}
const TABLE = (head, rows) => `<div class="tscroll"><table class="keys" style="margin:6px 0 2px"><tr>${head.map(h=>`<td><b>${h}</b></td>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;

const COURSE = {title:"Hard Surface Fast Track", blender:"5.3"};

const LAWS = [
  {n:1, t:"Real size first", s:"Measure, then model.", p:"Model in metres at the object's real size, then apply the scale (<kbd>Ctrl</kbd><kbd>A</kbd> → Scale). Bevels, modifiers, physics and game engines all work in real units. On a stretched object a 5 mm bevel comes out 5 mm on one side and 9 mm on another."},
  {n:2, t:"Big, medium, small", s:"70 · 20 · 10", p:"Silhouette first: the big forms carry about 70% of how a prop reads. Then openings and joints (about 20%), then bolts, seams and decals (about 10%). Small detail never rescues a wrong big shape."},
  {n:3, t:"Light lives on edges", s:"Nothing real is razor sharp.", p:"Every real edge is slightly rounded, and that tiny roundness is what catches a highlight. A perfectly sharp edge renders as a dead line. Bevel every edge a hand could touch."},
  {n:4, t:"Flat can be ugly, curved must be clean", s:"N-gons on flats, quads on curves.", p:"On a truly flat face, n-gons and thin triangles shade perfectly (weighted normals keep them flat). On anything curved or subdivided they pinch and wobble. Spend clean quad topology only where the surface bends."},
  {n:5, t:"Closer loops, sharper edges", s:"Loop distance = edge radius.", p:"Subdivision rounds everything off. A support (holding) loop placed near an edge keeps it tight: the closer the loop, the smaller the rounded radius."},
  {n:6, t:"Count before you cut", s:"Edges in = edges out.", p:"Where one shape grows out of another (a pipe out of a pipe, a button out of a cylinder) the edge counts must match. A 2 × 2 patch of faces has 8 border edges, so it takes an 8-sided branch."},
  {n:7, t:"Keep it live", s:"My Big Brother Wears Trainers.", p:"Build with modifiers you can still change and apply them only when the design is final. Their order matters: <b>M</b>irror, <b>B</b>oolean, <b>B</b>evel, <b>W</b>eighted Normal, <b>T</b>riangulate."}
];

const BASICS = [
  ["Mouse first, then key","Blender sends a shortcut to whichever panel the <b>mouse is over</b>. Before pressing a modelling key, move the mouse over the 3D viewport (the big middle area)."],
  ["Look around","Hold the <b>middle mouse button</b> and drag = orbit. "+K("Shift")+" + middle-drag = pan. Scroll wheel = zoom. "+K("Numpad .")+" = zoom to the selection. "+K("Home")+" = fit everything."],
  ["No numpad?","Click the coloured X / Y / Z circles in the top-right gizmo to snap to a view, or turn on <b>Edit › Preferences › Input › Emulate Numpad</b> so the top-row numbers act as a numpad (then select modes move to the header buttons)."],
  ["Front, side, top","Numpad "+K("1")+" front, "+K("3")+" right side, "+K("7")+" top. Add "+K("Ctrl")+" for the opposite side. Numpad "+K("5")+" toggles perspective / orthographic."],
  ["Object vs Edit Mode",K("Tab")+" switches. <b>Object Mode</b> moves whole objects. <b>Edit Mode</b> changes the mesh: its vertices, edges and faces."],
  ["Vertex, edge, face","In Edit Mode press "+K("1")+" (vertex), "+K("2")+" (edge) or "+K("3")+" (face) on the top number row. The three small buttons left of the header's <b>View</b> menu do the same."],
  ["Selecting","Click = select. "+K("Shift")+" + click = add or remove. "+K("A")+" = all, "+K("Alt","A")+" = none. "+K("Alt")+" + click = a whole <b>loop</b> (a ring of edges or faces). "+K("L")+" over a part = that whole connected piece."],
  ["See through: X-ray",K("Alt","Z")+" makes the mesh see-through so a box drag also grabs the back. Press it again to turn it off."],
  ["Move, rotate, scale",K("G")+" / "+K("R")+" / "+K("S")+", then optionally "+K("X")+", "+K("Y")+" or "+K("Z")+" to lock to that axis, then type a number and "+K("Enter")+". Right-click or "+K("Esc")+" cancels."],
  ["Typing exact values","While any tool is running, typed digits set its exact amount: "+K("G")+K("Z")+" <code>0.2</code> "+K("Enter")+" moves up 20 cm. Minus works too: <code>-0.02</code>."],
  ["The redo panel","After most tools a small panel appears at the <b>bottom-left of the viewport</b>. Click its title to open it and change the numbers after the fact."],
  ["Sidebar (N)","Mouse over the viewport, press "+K("N")+". Its <b>Item</b> tab shows Location, Rotation, Scale and Dimensions, and you can type straight into them. "+K("N")+" again hides it."],
  ["Search any tool",K("F3")+", type part of the name (e.g. <code>to sphere</code>), press "+K("Enter")+". Handy when you forget a shortcut."],
  ["Properties editor","The tall panel on the right. Its column of tabs: the orange square = <b>Object</b>, the blue wrench = <b>Modifiers</b>, the red-and-white ball near the bottom = <b>Material</b>."],
  ["Undo",K("Ctrl","Z")+" undo, "+K("Ctrl","Shift","Z")+" redo. It steps back through Edit Mode work too, so experiment freely."]
];

const KEYS = [
  [K("E"),"Extrude (pull new geometry out of the selection)"],
  [K("Alt","E"),"Extrude menu: <b>Extrude Faces Along Normals</b> pushes each face in or out along its own direction"],
  [K("I")+" ("+K("I")+K("I")+")","Inset faces (press I twice: each face on its own)"],
  [K("Ctrl","R"),"Loop cut: hover an edge, click to add, move to slide, right-click to keep it centred"],
  [K("Ctrl","B"),"Bevel edges ("+K("Ctrl","Shift","B")+" bevels vertices). Scroll wheel = more segments"],
  [K("K"),"Knife: click to cut new edges, "+K("Enter")+" to finish"],
  [K("Shift","Alt","S"),"To Sphere: pushes the selection toward a circle or sphere (type 1 = fully round)"],
  [K("Shift","E"),"Edge crease (how sharp Subdivision keeps that edge)"],
  [K("Ctrl","1")+" "+K("Ctrl","2")+" "+K("Ctrl","3"),"Object Mode: add a Subdivision Surface modifier at that level"],
  [K("Ctrl","A"),"Object Mode: Apply menu (Scale, Rotation…)"],
  [K("M"),"Merge vertices (At Center, By Distance…)"],
  [K("X"),"Delete menu (Vertices, Edges, Faces, Dissolve…)"],
  [K("Shift","D"),"Duplicate and move"],
  [K("Alt","Z"),"X-ray on/off"],
  [K("H")+" / "+K("Alt","H"),"Hide selected / show everything"],
  [K("F3"),"Search for any tool by name"]
];

const MODULES = {1:"Foundations by real props"};
const MODULE_INTRO = {1:"Five props, each one teaching a professional technique you will use on every hard-surface model after it: real scale and edge highlights, subdivision with support loops, clean holes in curved surfaces, non-destructive booleans, and the detail pass that makes it read as real. Every step has a real Blender 5.3 screenshot."};
const ROADMAP = [
  {m:"Module 2 · Game-ready + a sellable pack", items:["Low poly from your high poly, with matching silhouettes","UVs and texel density that hold up next to other assets","Baking normal, AO and curvature maps in Blender","Export to Unreal and ship a Fab-ready sci-fi prop pack"]},
  {m:"Module 3 · Hero prop from a concept", items:["Reading a concept: assemblies and part sheets","A sci-fi sidearm from blockout to finished high poly","Mechanical believability: what holds each part on"]},
  {m:"Module 4 · Mechanisms & vehicles", items:["Hinges, pistons and joints that really move","Rigging a mechanism with constraints","A small drivable buggy, built and rigged"]}
];

const SHOTBOX = {"l1-s01": {"VIEW_3D:UI": [1033, 78, 1313, 813]}, "l1-s03": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877]}, "l1-s04": {"VIEW_3D:HUD": [63, 391, 343, 808]}, "l1-s06": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877]}, "l1-s07a": {"VIEW_3D:HUD": [63, 549, 343, 808]}, "l1-s10": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877]}, "l1-s11": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877]}, "l1-s13": {"OUTLINER:WINDOW": [1316, 52, 1598, 182]}, "l2-s01": {"VIEW_3D:HUD": [63, 513, 343, 808]}, "l2-s02": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877]}, "l2-s03": {"VIEW_3D:HUD": [63, 747, 343, 808]}, "l2-s05": {"VIEW_3D:HUD": [63, 571, 343, 808]}, "l2-s06": {"VIEW_3D:HUD": [63, 637, 343, 808]}, "l2-s07a": {"VIEW_3D:HUD": [63, 637, 343, 808]}, "l2-s07": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877]}, "l2-s08a": {"VIEW_3D:HUD": [63, 747, 343, 808]}, "l2-s08": {"VIEW_3D:HUD": [63, 391, 343, 808]}, "l2-s10": {"VIEW_3D:HUD": [63, 597, 343, 808]}, "l2-s11a": {"VIEW_3D:HUD": [63, 571, 343, 808]}, "l2-s11b": {"VIEW_3D:HUD": [63, 549, 343, 808]}, "l2-s12": {"VIEW_3D:HUD": [63, 703, 343, 808]}, "l2-s12b": {"VIEW_3D:HUD": [63, 703, 343, 808]}, "l2-s13": {"OUTLINER:WINDOW": [1316, 52, 1598, 182]}, "l3-s01b": {"VIEW_3D:HUD": [63, 513, 343, 808]}, "l3-s01": {"VIEW_3D:UI": [1033, 78, 1313, 813]}, "l3-s02": {"VIEW_3D:HUD": [63, 641, 343, 808]}, "l3-s04": {"VIEW_3D:HUD": [63, 703, 343, 808]}, "l3-s05": {"VIEW_3D:HUD": [63, 549, 343, 808]}, "l3-s06a": {"VIEW_3D:HUD": [63, 597, 343, 808]}, "l3-s07": {"VIEW_3D:HUD": [63, 391, 343, 808]}, "l3-s08": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877]}, "l3-s10": {"VIEW_3D:UI": [1033, 78, 1313, 813]}, "l3-s11": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877]}, "l3-s13": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877]}, "l3-s14": {"OUTLINER:WINDOW": [1316, 52, 1598, 182]}, "l4-s01": {"VIEW_3D:UI": [1033, 78, 1313, 813]}, "l4-s02": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877]}, "l4-s03": {"VIEW_3D:HUD": [63, 391, 343, 808]}, "l4-s04a": {"VIEW_3D:UI": [1033, 78, 1313, 813]}, "l4-s04": {"VIEW_3D:HUD": [63, 391, 343, 808]}, "l4-s05": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877]}, "l4-s07": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877], "OUTLINER:WINDOW": [1316, 52, 1598, 182]}, "l4-s08": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877]}, "l4-s09": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877]}, "l4-s11": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877]}, "l4-s12": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877]}, "l5-s01": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877], "OUTLINER:WINDOW": [1316, 52, 1598, 182]}, "l5-s03": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877], "VIEW_3D:UI": [1033, 78, 1313, 813]}, "l5-s07": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877]}, "l5-s08a": {"VIEW_3D:UI": [1033, 78, 1313, 813]}, "l5-s08": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877]}, "l5-s12": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877]}, "l5-s12b": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877]}, "l5-s13a": {"PROPERTIES:WINDOW": [1345, 211, 1598, 877]}};
const LESSONS = [];
/* ============================== L1 · Sci-fi supply crate ============================== */
LESSONS.push({
  id:"l1", num:1, short:"Sci-fi supply crate", laws:[1,2,3,4],
  title:"A sci-fi supply crate with edges that catch the light",
  kick:"Lesson 1 · Real scale, edit-mode tools, bevels and weighted normals",
  time:"60–75 min",
  hero:"shots/l1-hero.jpg", thumb:"shots/l1-hero.jpg",
  intro:`You start from Blender's default cube and finish with a game-ready crate: chamfered corners, a lid seam, recessed panels, hand pockets and a skid, then the two modifiers that make hard-surface models look real instead of computer-made. This is the <b>mid-poly</b> workflow many studios use for environment props: the bevels stay in the game mesh and clever normals do the rest, so there's nothing to bake.`,
  use:`<b>Used for:</b> crates, consoles, lockers, wall panels, any prop that's mostly flat faces with hard edges. The same tools (inset, extrude along normals, bevel) build 80% of every hard-surface model you'll ever make.`,
  learn:["Real-size modelling","Apply scale","MatCap + statistics","Edge/face select","Ctrl+B chamfer","Loop cuts","Extrude along normals","Individual inset","Material slots","Bevel modifier","Weighted normals"],
  concepts:[
    {h:"Real size, real units (Law 1)", p:"A crate is about 1.2 m long, so you model it 1.2 m long. Bevel widths, texture density and the size in the game engine all follow from that. The default cube is 2 m, so we resize it and then <i>apply</i> the scale so the mesh itself is 1.2 m."},
    {h:"Big shape first (Law 2)", p:"The chamfered corners and the lid are what you'd recognise from across a room. Grooves and panels come next, small fasteners last (Lesson 5). Get each tier right before starting the next."},
    {h:"Edges catch the light (Law 3)", p:"Nothing real is perfectly sharp. The 8 mm rounded edge you add with the Bevel modifier is what makes a highlight run along every edge, and that highlight is most of what your eye reads as 'solid object'."},
    {h:"Destructive vs live", p:"Ctrl+B, Inset and Extrude change the mesh right now (destructive). The Bevel and Weighted Normal <i>modifiers</i> stay live: you can change the width tomorrow and nothing breaks. Use destructive tools for shape, live ones for finish."}
  ],
  labs:[
    {type:"edgelight", title:"Edge Light Lab: your crate, four ways of shading it", hint:"Bevel on/off × shading mode · drag to orbit",
     cap:"This is the exact crate you'll build, exported from Blender 5.3. Start with Bevel <b>Off</b> + <b>Flat</b>: dead edges. Turn the bevel on, then step through the shading modes and watch the big faces near the edges. Switch to the reflection stripes: wobbly stripes on a flat face mean bad normals."}
  ],
  steps:[
   {t:"Start at real size", goal:"The default cube becomes a 1.2 × 0.8 × 0.7 m crate standing on the floor, with its scale applied.", do:[
     `Open Blender 5.3. In the splash screen click <b>General</b> (or ${M("File","New","General")}). You get the default scene: a cube, a camera and a light.`,
     `Mouse over the viewport and click the cube (orange outline = selected). Press ${K("N")}: the sidebar opens on the right of the viewport. Click its <b>Item</b> tab if another tab is showing.`,
     `Under <b>Dimensions</b>: X: ${T("X","1.2","2 m")}. Then Y: type <code>0.8</code>. Then Z: type <code>0.7</code>.`,
     `Look at <b>Scale</b> just above: it now reads 0.6, 0.4, 0.35. Mouse over the viewport, press ${K("Ctrl","A")} and click <b>Scale</b> in the Apply menu. Scale goes back to 1.000 while Dimensions stay 1.2 / 0.8 / 0.7.`,
     `<b>Location Z:</b> ${T("Z (under Location)","0.38","0 m")}. The crate now stands on the grid: half its height is 0.35 m, plus 3 cm for the skid you add in step 9.`
   ], shots:[SH("l1-s01","Sidebar → Item: Scale is 1.000 again, Dimensions 1.2 / 0.8 / 0.7 m, Location Z 0.38 m.",[["VIEW_3D:UI","3–5"]])],
   see:`Scale <b>1.000</b> on all three axes and Dimensions <b>1.2 m, 0.8 m, 0.7 m</b>. The crate's bottom sits on the red/green grid lines.`,
   why:`<b>Why apply the scale?</b> Modifiers measure in the object's own space. With Scale 0.6 × 0.4 × 0.35, an 8 mm bevel would come out 4.8 mm on X and 2.8 mm on Z: lopsided highlights. Applying the scale writes the size into the mesh, so every tool measures real metres.`,
   pro:`<b>Studio habit:</b> scale 1, rotation 0, real size is the first thing checked in any asset review. An unapplied scale breaks bevels, booleans, physics, texture density and import size in Unreal.`},

   {t:"Switch on the shading microscope (MatCap)", goal:"A studio MatCap that shows every shading flaw, plus a live polygon count.", do:[
     `Top-right of the viewport there are four small sphere icons (the shading modes). Click the little <b>▾</b> to the right of them. The <b>Viewport Shading</b> popover opens.`,
     `Under <b>Lighting</b> click <b>MatCap</b>.`,
     `Click the big sphere picture underneath: a grid of MatCaps opens. Hover over them to read their names and click <b>hard_surface_grey</b>. Move the mouse away to close the popover.`,
     `Click the <b>▾</b> next to the two overlapping circles (Viewport Overlays, a little further left). Tick <b>Statistics</b>.`
   ], shots:[SH("l1-s02","The Viewport Shading popover with Lighting set to MatCap. Statistics are listed top-left of the viewport.")],
   see:`The crate in smooth studio grey. Top-left of the viewport: Objects, Vertices, Edges, <b>Faces 6</b>, <b>Triangles 12</b>.`,
   why:`<b>What is a MatCap?</b> A picture of a lit sphere, wrapped onto your model by which way each bit of surface faces. It ignores lights and materials, so all it shows is your surface's shape and shading. That's why modellers work in one all day.`,
   pro:`Keep a second MatCap for judging smoothness: <b>check_reflection_horizontal</b> paints reflected stripes. On a good surface they flow evenly; any wobble or pinch is a shading problem.`},

   {t:"Make two materials: Paint and Metal", goal:"Two material slots on the crate, so you can colour faces as you model them.", do:[
     `In the Properties editor on the right, click the <b>Material</b> tab (red-and-white ball, near the bottom of the tab column).`,
     `Click <b>New</b>. Double-click the name field that says <i>Material</i>, type <code>Paint</code>, press ${K("Enter")}.`,
     `Under <b>Surface</b>, click the colour bar next to <b>Base Color</b>. In the colour picker, click into the <b>Hex</b> box, type <code>CC5410</code>, press ${K("Enter")}. Move the mouse away to close it.`,
     `Click the <b>+</b> to the right of the slot list (Add Material Slot). An empty slot appears under Paint and is selected. Click <b>New</b>, rename it <code>Metal</code>, set Base Color Hex <code>2A2B2E</code>, then ${T("Metallic","1","0.000")}.`
   ], shots:[SH("l1-s03","Material tab: two slots, Paint and Metal. The viewport stays grey in MatCap mode (MatCaps ignore materials).",[["PROPERTIES:WINDOW","1–4"]])],
   see:`Two slots in the list: <b>Paint</b> and <b>Metal</b>. The whole crate still uses the first slot (Paint) for now.`,
   why:`<b>Why now?</b> Every material slot becomes its own material in a game engine. If the slots exist before you model, you can assign each new set of faces the moment you make it, while they're still selected. Doing it at the end means hunting for faces.`},

   {t:"Chamfer the four corners (big shape first)", goal:"The four upright corners cut by a 10 cm chamfer: the crate's main silhouette.", do:[
     `Mouse over the viewport, press ${K("Tab")}: the header now says <b>Edit Mode</b>. Press ${K("2")} (top row) for edge select, then ${K("Alt","A")} to deselect everything.`,
     `Press numpad ${K("7")} for the top view, then ${K("Alt","Z")} to switch on X-ray (see-through).`,
     `From the top, each upright edge looks like a corner dot. Left-drag a box from empty space around the <b>top-left corner</b>. Hold ${K("Shift")} and drag boxes around the other three corners.`,
     `Check the statistics: <b>Edges 4/12</b>. (More? ${K("Alt","A")} and box them again, keeping each box tight around its corner.)`,
     `Press ${K("Ctrl","B")}, move the mouse a little, type <code>0.1</code>, press ${K("Enter")}.`,
     HUD("Bevel","<b>Width 0.1 m</b> and <b>Segments 1</b>"),
     `Press ${K("Alt","Z")} again to turn X-ray off.`
   ], shots:[SH("l1-s04a","Top view with X-ray on: the four upright edges are seen end-on at the corners (yellow boxes). Drag a small box around each one.",[[367,217,423,273,"3"],[891,217,947,273,"3"],[367,567,423,623,"3"],[891,567,947,623,"3"]]),
             SH("l1-s04","After Ctrl+B 0.1: each corner is cut at 45°. The redo panel (bottom-left) shows Width 0.1 m, Segments 1.",[["VIEW_3D:HUD","6"]])],
   see:`From the top the crate is now eight-sided, with its corners cut off at 45°. Statistics: <b>Faces 10</b>.`,
   why:`<b>Law 2: silhouette first.</b> This chamfer is a primary form: you'd recognise it from across a room. Only once the big shape reads right do you spend time on seams and panels.`},

   {t:"Two loops for the lid seam", goal:"Two horizontal loops all the way round, 3 cm apart, near the top: the lid seam band.", do:[
     `Orbit (middle-drag) so you see a long side. Mouse over the viewport and press ${K("Ctrl","R")}.`,
     `Hover over one of the <b>upright</b> edges of a side: a yellow preview line appears, running <b>horizontally all the way round</b>. Left-click once.`,
     `The new loop now follows your mouse (slide). <b>Right-click</b> to cancel the slide: it stays exactly halfway up, selected.`,
     `Press ${K("G")} ${K("Z")}, type <code>0.21</code>, ${K("Enter")}. The loop moves up 21 cm, 14 cm below the top.`,
     `${K("Ctrl","R")} again, this time hovering an upright edge <b>below</b> the new loop. Left-click, then right-click.`,
     `${K("G")} ${K("Z")} <code>0.25</code> ${K("Enter")}. That loop was born halfway down the lower part (7 cm below the middle), so 25 cm up puts it 3 cm under the first one.`
   ], shots:[SH("l1-s05","Both loops shown selected: a 3 cm band running all the way round, 14 cm below the top.")],
   see:`Two parallel loops 3 cm apart running round all eight sides, about a fifth of the way down from the top.`,
   why:`<b>Loop cuts add edges without changing the shape</b>, which makes them the safe way to make room for detail. The thin band between these loops becomes the groove where a lid meets its body.`},

   {t:"Groove the seam and paint it metal", goal:"A 1.5 cm deep groove all the way round, assigned to Metal.", do:[
     `Press ${K("3")} for face select.`,
     `Hold ${K("Alt")} and click <b>on the thin band, right next to one of its short upright edges</b> (just beside a corner works well). The whole band lights up, all eight faces. If an upright strip lights up instead, you clicked nearer a long edge: ${K("Alt")}+click again closer to the short one.`,
     `Press ${K("Alt","E")} and click <b>Extrude Faces Along Normals</b>. Type <code>-0.015</code>, press ${K("Enter")}.`,
     `With the band still selected: Properties → <b>Material</b> tab → click <b>Metal</b> in the slot list → click <b>Assign</b> (the button under the list, only shown in Edit Mode).`
   ], shots:[SH("l1-s06a","Alt+E with the band selected: the Extrude menu. Pick the second entry, Extrude Faces Along Normals."),
             SH("l1-s06","The sunken band, assigned to Metal (Assign / Select / Deselect only appear in Edit Mode).",[["PROPERTIES:WINDOW","4"]])],
   see:`A groove ring around the whole crate. In Material Preview (later) it will be dark metal.`,
   why:`<b>Why "Along Normals"?</b> Each face moves along its own outward direction, so a ring of faces around corners sinks evenly. A plain ${K("E")} moves every face the same way and would tear the corners.`},

   {t:"Recessed side panels", goal:"Four dark panels sunk 2 cm into the sides, framed by 6 cm of paint.", do:[
     `Click the big face of the long side facing you, <b>below</b> the groove.`,
     `${K("Shift")}+click the end face next to it. Orbit round to the back (middle-drag) and ${K("Shift")}+click the other long side and the other end. Statistics: <b>Faces 4/42</b>.`,
     `Press ${K("I")}, then press ${K("I")} <b>again</b> (Individual: each face insets on its own). Type <code>0.06</code>, press ${K("Enter")}.`,
     HUD("Inset Faces","<b>Thickness 0.06 m</b> with <b>Individual</b> ticked"),
     `${K("Alt","E")} → <b>Extrude Faces Along Normals</b>, type <code>-0.02</code>, ${K("Enter")}.`,
     `Material tab → <b>Metal</b> → <b>Assign</b>.`
   ], shots:[SH("l1-s07a","I, I, 0.06: four separate insets. The redo panel confirms Thickness 0.06 m and Individual.",[["VIEW_3D:HUD","4"]]),
             SH("l1-s07","Pushed in 2 cm and assigned to Metal.")],
   see:`Four recessed panels, each with a 6 cm frame around it.`,
   why:`<b>Inset first, then push.</b> The inset makes the frame's edges, so the push moves only the middle. Without ${K("I")}${K("I")} the four faces would inset as one region and leave no frame on the corners between them.`},

   {t:"Hand pockets in the ends", goal:"A deeper pocket inside each end panel, where hands grab the crate.", do:[
     `Click the dark panel on one short end. Orbit round and ${K("Shift")}+click the panel on the other end.`,
     `${K("I")} ${K("I")}, type <code>0.07</code>, ${K("Enter")}.`,
     `${K("Alt","E")} → <b>Extrude Faces Along Normals</b>, type <code>-0.04</code>, ${K("Enter")}. (The new faces keep the Metal material they came from.)`
   ], shots:[SH("l1-s08","The end of the crate: a 4 cm pocket inside the recessed panel.")],
   see:`Each short end now has a framed panel with a deeper pocket in it.`,
   why:`<b>Law 2, secondary forms:</b> openings and joints give the eye a reason to believe the object works. One pocket says "lift me here".`},

   {t:"Lid plate and skid", goal:"A raised plate on the lid and a metal skid under the crate.", do:[
     `Click the top face. ${K("I")}, type <code>0.08</code>, ${K("Enter")}. Then ${K("E")}, type <code>0.02</code>, ${K("Enter")}. (${K("E")} on a face pulls it straight out along its normal.)`,
     `Orbit underneath (or ${K("Ctrl")} + numpad ${K("7")} for the bottom view). Click the bottom face. ${K("I")} <code>0.04</code> ${K("Enter")}, then ${K("E")} <code>0.03</code> ${K("Enter")}.`,
     `Material tab → <b>Metal</b> → <b>Assign</b> (the skid is metal).`,
     `Press ${K("Tab")} to go back to Object Mode.`
   ], shots:[SH("l1-s09","The raised lid plate."), SH("l1-s09b","From below: the skid, 3 cm deep, now touching the floor.")],
   see:`Statistics in Object Mode: <b>Faces 122</b>, <b>Triangles 252</b>. The crate's skid touches the grid.`},

   {t:"Look at the edges, then bevel them", goal:"An 8 mm rounded edge everywhere, made by a live Bevel modifier.", do:[
     `Zoom in on a corner (scroll wheel). Every edge is a perfect hard line with no highlight. This is the "CG look".`,
     ADDMOD("Generate","Bevel"),
     `In the new Bevel panel: ${T("Amount","0.008","0.1 m")}. Then ${T("Segments","3","1")}.`,
     `Leave <b>Limit Method</b> on <b>Angle</b> (30°).`
   ], shots:[SH("l1-s10a","Before: razor-sharp edges, no highlight anywhere."),
             SH("l1-s10","After: Bevel modifier, Amount 0.008 m, Segments 3, Limit Method Angle 30°. A thin highlight runs along every edge.",[["PROPERTIES:WINDOW","2–4"]])],
   see:`A thin bright line along every edge and round every corner. Statistics jump to about <b>3,000 triangles</b>.`,
   why:`<b>Law 3: light lives on edges.</b> The Angle limit bevels only edges sharper than 30°, so flat faces with lots of edges in them are left alone.`,
   pro:`<b>Bevel tiers:</b> outer edges 5–20 mm, panel edges 1–3 mm, tiny edges 0.5–1 mm. One 8 mm width suits a crate this size; on a hero prop you'd use two or three widths.`},

   {t:"Shade it properly: Auto Smooth + Weighted Normal", goal:"Smooth rounded bevels and perfectly flat big faces, with no dark smears.", do:[
     `Viewport header: ${M("Object","Shade Auto Smooth")}. A <b>Smooth by Angle</b> modifier appears at the bottom of the stack.`,
     `Look closely at a big face next to a bevel: there's a faint dark gradient. That's the big face bending its shading toward the bevel.`,
     `In the <b>Bevel</b> panel, click <b>Shading</b> to unfold it and tick <b>Harden Normals</b>.`,
     ADDMOD("Normals","Weighted Normal"),
     `In the Weighted Normal panel tick <b>Keep Sharp</b>. Smooth by Angle stays at the bottom (it's pinned last, see its pin icon). That's fine.`
   ], shots:[SH("l1-s11a","Shade Auto Smooth on its own: better than flat, but the big faces still darken toward the bevels."),
             SH("l1-s11","Final stack: Bevel (Harden Normals), Weighted Normal (Keep Sharp), Smooth by Angle. Big faces are evenly lit.",[["PROPERTIES:WINDOW","3–5"]])],
   see:`Big faces evenly lit edge to edge, every bevel catching a soft highlight. Try the reflection-stripe MatCap: the stripes stay straight across the panels.`,
   why:`<b>Why it works:</b> each vertex normal is a vote between the faces around it. Weighted Normal gives the vote to the biggest faces, so they point straight out and shade flat, and the thin bevel faces take all the curvature. Play with this in the lab above.`},

   {t:"Check it like a pro", goal:"The crate in colour, and a look at its wireframe.", do:[
     `Click the third sphere icon at the top-right of the viewport (<b>Material Preview</b>). The crate turns orange with dark metal.`,
     `Overlays ▾ (two circles) → tick <b>Wireframe</b>. Look at the lid: one flat eight-sided face (an n-gon) next to thin rows of bevel faces.`,
     `Untick <b>Wireframe</b>.`
   ], shots:[SH("l1-s12","Material Preview with the wireframe overlay: bevel faces along every edge, n-gons only on flat faces.")],
   see:`An orange crate with a dark groove, panels, pockets and skid, and highlights on every edge.`,
   why:`<b>Law 4: flat can be ugly, curved must be clean.</b> The lid is an eight-sided n-gon and that's fine: it's perfectly flat, and weighted normals keep it flat. The same n-gon on a curved surface would pinch. You'll meet that in Lesson 2.`},

   {t:"Name it and save", goal:"An object called SupplyCrate in a saved .blend file.", do:[
     `Mouse over the viewport, press ${K("F2")}, type <code>SupplyCrate</code>, press ${K("Enter")}.`,
     `${K("Ctrl","S")}, pick a folder for your course files, name the file <code>supply_crate.blend</code>, click <b>Save</b>.`
   ], shots:[SH("l1-s13","The Outliner (top-right) now lists SupplyCrate.",[["OUTLINER:WINDOW","1"]])],
   see:`<b>SupplyCrate</b> in the Outliner, and the file name in Blender's title bar.`,
   pro:`<b>Names are for the next person.</b> In a game project with ten thousand assets, "Cube.001" is impossible to find. Name every object for what it is.`}
  ],
  check:`<b>You should have:</b> a 1.2 × 0.8 × 0.7 m crate with scale 1; chamfered corners; a groove ring; four recessed panels and two hand pockets; a lid plate and a skid; a stack of <b>Bevel</b> (8 mm, 3 segments, Angle 30°, Harden Normals) → <b>Weighted Normal</b> (Keep Sharp) → <b>Smooth by Angle</b>; no dark smears in the MatCap; about 3,000 triangles.`,
  cards:[
    ["Law 1 in four words, and the shortcut that goes with it?","<b>Real size first</b> (measure, then model). Set real dimensions, then <kbd>Ctrl</kbd><kbd>A</kbd> → Scale so the scale reads 1."],
    ["Why must the scale be applied before you bevel?","Modifiers work in the object's own space. An unapplied scale stretches them, so a bevel comes out a different width on each axis."],
    ["What does a MatCap show, and why model in one?","Only the surface shape and its shading (a lit-sphere photo mapped by normal direction). It hides lights and materials, so shading flaws can't hide."],
    ["Ctrl+B in Edit Mode or the Bevel modifier: which for what?","<b>Ctrl+B</b> changes the mesh now: good for big shape chamfers. The <b>modifier</b> stays live: use it for the small edge highlights you may want to adjust later."],
    ["How do you sink a ring of faces evenly around corners?","Select the ring, <kbd>Alt</kbd><kbd>E</kbd> → <b>Extrude Faces Along Normals</b>, type a negative value."],
    ["What does pressing I a second time do during an inset?","Toggles <b>Individual</b>: every selected face insets on its own instead of as one region."],
    ["In face select, how do you grab a whole band with one click?","<kbd>Alt</kbd>+click on the band right beside one of its short edges (the loop runs across the edge you click nearest)."],
    ["Bevel modifier Limit Method = Angle 30°. What does that do?","Bevels only edges sharper than 30°, so flat areas full of edges stay untouched."],
    ["Smooth shading left dark smears beside the bevels. The fix?","Bevel <b>Harden Normals</b> + a <b>Weighted Normal</b> modifier with <b>Keep Sharp</b>: big faces win the normal vote and shade flat."],
    ["Why is the eight-sided lid face OK here?","<b>Law 4:</b> it's perfectly flat. N-gons only cause trouble on curved or subdivided surfaces."],
    ["Primary, secondary, tertiary on this crate?","Primary: the box and its chamfered corners, the lid. Secondary: groove, panels, pockets, skid. Tertiary: bolts, decals, scratches (Lesson 5)."]
  ],
  boss:{
    title:"Boss fight: the crate from memory",
    brief:"Memory mode on, timer running, a fresh General file. Rebuild the crate without looking at the steps. Tick each part as it works.",
    goal:20,
    items:[
      ["Real-size box (1.2 × 0.8 × 0.7 m), scale applied, standing on the floor",""],
      ["Corners chamfered with Ctrl+B (0.1 m, one segment)",""],
      ["Lid seam: two loop cuts and a groove pushed in along normals",""],
      ["Four recessed panels and two hand pockets (I I)",""],
      ["Lid plate and skid, Metal assigned to groove, panels and skid",""],
      ["Bevel + Weighted Normal stack with no smears in the MatCap",""]
    ],
    stretch:[
      ["Corner bumpers","Select the four chamfer faces under the groove, inset them individually by 2 cm and push them <i>out</i> 1 cm. Give them a third material, Rubber."],
      ["An ammo box variant","Set the dimensions to 0.5 × 0.25 × 0.3 m on a fresh cube and build it again. Notice how many steps you redid because Ctrl+B and Inset are destructive. Lesson 4 fixes that with live cutters."],
      ["Two bevel widths","Add a second Bevel modifier above the first with 2 mm and Limit Method Angle 60°, so only the sharpest edges get the extra fine edge. Compare in the reflection MatCap."]
    ]
  }
});

/* ============================== L2 · Sci-fi power cell ============================== */
LESSONS.push({
  id:"l2", num:2, short:"Sci-fi power cell", laws:[5,4],
  title:"A sci-fi power cell: subdivision with support loops",
  kick:"Lesson 2 · Subdivision Surface, holding loops, creases and all-quad caps",
  time:"60–75 min",
  hero:"shots/l2-hero.jpg", thumb:"shots/l2-hero.jpg",
  intro:`Subdivision is how studios model smooth, flowing hard surfaces: guns, helmets, vehicle panels, anything that has to look moulded or machined with soft highlights. You model a simple low cage, and the Subdivision Surface modifier turns it into a smooth surface. The catch: it rounds <i>everything</i>. In this lesson you'll watch a can melt into a blob, then learn the three ways to hold an edge and build a glowing power cell whose every edge is exactly as sharp as you decide.`,
  use:`<b>Used for:</b> weapon bodies, helmets, canisters, vehicle panels, sci-fi pods and any high poly you'll later bake onto a game mesh. Support loops are the single most-used hard-surface skill.`,
  learn:["Subdivision Surface","Ctrl+2 levels","Holding loops","Edge crease","Multi-cut loop cuts","Select Sharp Edges","2-segment bevel trick","Grid Fill quad caps","Faces by Sides check","Emissive material"],
  concepts:[
    {h:"Subdivision averages everything", p:"Each level splits every quad into four and moves every point toward the average of its neighbours. Do it twice and a sharp corner becomes a soft round one. On its own, a cylinder turns into a pill."},
    {h:"Closer loops, sharper edges (Law 5)", p:"A holding (support) loop placed near an edge stops the averaging from spreading. The distance to the edge sets the radius: a loop about a tenth of the face away gives a moulded look, closer gives a machined one. You hold an edge with one loop on <i>each</i> side of it."},
    {h:"Curved must be clean (Law 4)", p:"On a subdivided surface every face should be a quad. An n-gon or a triangle becomes a <b>pole</b> (an odd number of edges meeting) that pinches the surface and bends the reflections. On a flat face nobody sees it; on a curve everybody does."},
    {h:"No bevels, no booleans on SubD", p:"The cage is the whole shape. A Bevel modifier under subdivision just gets rounded off and multiplies the polygons, and a boolean cuts n-gons and triangles into your clean quads. Crispness comes from holding loops; a cut-in detail is a separate part pushed into the surface."}
  ],
  labs:[
    {type:"subd", title:"Support Loop Lab: a cube under live subdivision", hint:"slide the loops · switch to crease · drag to orbit",
     cap:"Start on <b>Nothing</b> at level 3: the cube melts. Pick <b>Holding loops</b> and slide the distance from 45% down to 2%: the closer the loop, the tighter the edge (Law 5). Then try <b>Crease</b>: quick and sharp, but at 1.0 the edge has no rounded highlight at all. Turn the result wire on to see what each level costs."},
    {type:"doctor", title:"Topology Doctor: find what's wrong", hint:"click on the problem · three patients",
     cap:"All three are subdivided at level 2 and shown with the reflection-stripe MatCap and their cage. Clean quad topology gives straight, even stripes; every problem shows up as a bend, a pinch or a soft blur.",
     cases:[
       {label:"Patient 1", src:"shots/l2-doc1.jpg", q:"A plain 16-sided cylinder with Subdivision on. Two things are wrong. Find both.",
        spots:[{x:50.0, y:20.19, r:4, ar:1.778, name:"A 16-sided n-gon cap", why:"Under subdivision the 16-sided cap becomes a pole where 16 edges meet in the middle. The stripes twist into a star and the cap domes. Fix: inset rings, then Grid Fill so the cap is all quads (step 12)."},
               {x:58.65, y:19.33, r:4, ar:1.778, name:"No support loop on the rim", why:"Nothing holds the rim, so the averaging rounds it into a pill. Fix: one holding loop on each side of the edge (step 8)."}]},
       {label:"Patient 2", src:"shots/l2-doc2.jpg", q:"The body should reflect perfectly even stripes. Find the two spots where the topology breaks them.",
        spots:[{x:50.88, y:66.72, r:5, ar:1.778, name:"A 6-sided face on a curve", why:"An upright edge was dissolved, leaving a 6-sided face. Its corners become poles and the surface dimples. On a flat face nobody would notice (Law 4)."},
               {x:52.89, y:37.15, r:5, ar:1.778, name:"Two triangles", why:"A quad split corner to corner. Triangles under subdivision make 3- and 5-edge poles that pinch the reflection. Keep curved SubD surfaces all quads."}]},
       {label:"Patient 3", src:"shots/l2-doc3.jpg", q:"The topology is clean, but two edges read wrong next to the crisp top rim and grip bands. Find them.",
        spots:[{x:51.8, y:88.82, r:6, ar:1.778, name:"Support loops too far away", why:"The bottom rim's loops sit 12 mm from the edge, so it rounds off like a toy next to the crisp top rim. Closer loop, sharper edge."},
               {x:53.45, y:52.83, r:6, ar:1.778, name:"No support at all", why:"The window band's edges have no holding loops, so the recess melts into a shallow trough instead of a crisp step."}]}
     ]}
  ],
  steps:[
   {t:"A 16-sided cylinder at real size", goal:"A cylinder 12 cm across and 26 cm tall, made of 16 segments, standing on the floor.", do:[
     `New file: ${M("File","New","General")}. Click the default cube, press ${K("X")} and click <b>Delete</b>.`,
     `Mouse over the viewport: ${K("Shift","A")} → <b>Mesh</b> → <b>Cylinder</b>.`,
     HUD("Add Cylinder","the defaults; change them right there"),
     `In that panel: ${T("Vertices","16","32")}. ${T("Radius","0.06","1 m")}. ${T("Depth","0.26","2 m")}. Under <b>Location</b>: ${T("Z","0.13","0 m")}.`,
     `Press numpad ${K(".")} to zoom in on it. Statistics (from Lesson 1): <b>Vertices 32</b>, <b>Faces 18</b>.`
   ], shots:[SH("l2-s01","Add Cylinder redo panel: Vertices 16, Radius 0.06 m, Depth 0.26 m, Location Z 0.13 m.",[["VIEW_3D:HUD","3–4"]])],
   see:`A slim 16-sided cylinder: 16 tall faces round the side and one 16-sided face (an n-gon) on each end.`,
   why:`<b>Why 16?</b> Every round part of an assembly uses the same segment count so their loops line up where they meet. 16 in the cage becomes 64 round the side after two levels of subdivision: smooth enough for a prop you hold in your hand.`},

   {t:"Subdivide it and watch it melt", goal:"The cylinder smoothed by a Subdivision Surface modifier (level 2) and judged with a reflection MatCap.", do:[
     `Viewport header: ${M("Object","Shade Smooth")}.`,
     `Mouse over the viewport, press ${K("Ctrl","2")}. A <b>Subdivision</b> modifier appears in the Properties editor's blue <b>wrench</b> tab.`,
     `Check the modifier panel: <b>Levels Viewport 2</b> and <b>Render 2</b>. (Ctrl+1 / Ctrl+3 set the viewport level to 1 or 3.)`,
     `Viewport Shading ▾ → <b>MatCap</b> → click the sphere picture → pick <b>check_reflection_horizontal</b> (stripes).`
   ], shots:[SH("l2-s02","Ctrl+2: the can melts into a soft pill, and the stripes twist on the 16-sided cap. Subdivision: Levels Viewport 2, Render 2.",[["PROPERTIES:WINDOW","2–3"]])],
   see:`The whole cylinder has gone soft like a pill. On the top the stripes swirl into a star around the middle of the cap.`,
   why:`<b>This is the problem every hard-surface artist meets first.</b> Nothing tells the subdivision where an edge should stay sharp, so it averages every corner away. The rest of this lesson is about telling it.`},

   {t:"Quick fix #1: crease (then take it off)", goal:"See what a crease does to the two rims, then remove it again.", do:[
     `Press ${K("Tab")} (Edit Mode), ${K("2")} (edge select). Hold ${K("Alt")} and click the <b>top rim</b> edge: the whole ring lights up. ${K("Shift","Alt")}+click the <b>bottom rim</b> to add it.`,
     `Press ${K("Shift","E")}, type <code>1</code>, press ${K("Enter")}.`,
     HUD("Edge Crease","<b>Factor 1.000</b>"),
     `Look: both rims are now razor sharp, with no highlight along them. Now take the crease off: ${K("Shift","E")}, type <code>-1</code>, ${K("Enter")}. The rims go soft again.`
   ], shots:[SH("l2-s03","Shift+E, 1: the rims (pink when creased) go perfectly sharp. Note there is no highlight on them at all.",[["VIEW_3D:HUD","3"]])],
   see:`With the crease: crisp rims, no rounded highlight. After ${K("Shift","E")} <code>-1</code>: the pill is back.`,
   why:`<b>Why do studios prefer loops?</b> A crease is extra data, not geometry. Many exporters and game engines ignore it, a crease of 1 gives an edge with no highlight width (Law 3 again), and you can't shape the radius as precisely. Creases are great for quick blockouts; finished high polys are held with loops.`},

   {t:"Quick fix #2: feel Law 5 with one loop", goal:"Slide one loop toward the top rim and watch the edge tighten. Then undo it.", do:[
     `Press ${K("Ctrl","R")} and hover over one of the <b>upright</b> edges of the side: a yellow loop previews all the way round. Left-click once.`,
     `<b>Don't click again yet.</b> Slowly move the mouse up: the new loop slides toward the top rim, and the top edge gets tighter and tighter as it gets close.`,
     `When the loop is about 3 mm under the top rim, left-click to drop it there. The top's side is now crisp, but the cap is still a pillow: an edge needs a loop on <b>both</b> sides.`,
     `This was an experiment: press ${K("Ctrl","Z")} until Statistics read <b>Vertices 32</b> again. You'll add all the holding loops at once in step 8.`
   ], shots:[SH("l2-s04a","A loop far below the rim (front view): the corner is still a big soft curve."), SH("l2-s04b","The same loop 3 mm under the rim: the corner is tight. Closer loop, sharper edge.")],
   see:`The closer the loop gets to the rim, the smaller the rounded corner. That's <b>Law 5: closer loops, sharper edges</b>.`},

   {t:"Seven loops for the body", goal:"Seven evenly spaced loops round the body: eight rows of 3.25 cm.", do:[
     `Hover over an upright edge of the side and press ${K("Ctrl","R")}.`,
     `Type <code>7</code>: the preview now shows seven yellow loops.`,
     `Left-click, then <b>right-click</b> (so the loops stay evenly spaced instead of sliding).`,
     HUD("Loop Cut and Slide","<b>Number of Cuts 7</b>")
   ], shots:[SH("l2-s05","Ctrl+R, 7: seven even loops. Vertices 144.",[["VIEW_3D:HUD","4"]])],
   see:`Statistics: <b>Vertices 144</b>. Eight rows of faces from bottom to top.`,
   why:`<b>Plan the rows first.</b> Every band you add next sits exactly on these rows: rows 2 and 7 become grip bands, rows 4 and 5 the glowing window.`},

   {t:"Raise the grip bands", goal:"Rows 2 and 7 (counting from the bottom) pushed out 5 mm all the way round.", do:[
     `Press ${K("3")} for face select.`,
     `${K("Alt")}+click the <b>2nd row from the bottom</b>, right next to one of its short upright edges: the whole ring of 16 faces lights up. (A vertical strip instead? Click closer to the upright edge.)`,
     `${K("Shift","Alt")}+click the <b>2nd row from the top</b> the same way. Statistics: <b>Faces 32/130</b>.`,
     `${K("Alt","E")} → <b>Extrude Faces Along Normals</b>, type <code>0.005</code>, press ${K("Enter")}. The redo panel (<b>Extrude Region and Shrink/Fatten</b>) reads <b>Offset 0.005 m</b>.`
   ], shots:[SH("l2-s06","Both rings pushed out 5 mm along their normals. Under subdivision they're still soft: nothing holds them yet.",[["VIEW_3D:HUD","4"]])],
   see:`Two raised rings, soft and rounded for now. Faces: <b>194</b>.`},

   {t:"Materials and a glowing window band", goal:"Two materials, Shell and Glow, and rows 4 and 5 sunk 4 mm as a glowing window.", do:[
     `Material tab (red-and-white ball) → <b>New</b> → rename it <code>Shell</code>: Base Color Hex <code>7A828C</code>, ${T("Metallic","1","0.000")}.`,
     `Click <b>+</b> (Add Material Slot) → <b>New</b> → rename <code>Glow</code>: Base Color Hex <code>0A0C0F</code>. Scroll down to <b>Emission</b>, click it to unfold: <b>Color</b> Hex <code>00B4FF</code>, ${T("Strength","3","0.000")}.`,
     `In the viewport: ${K("Alt")}+click the <b>4th row</b> from the bottom, ${K("Shift","Alt")}+click the <b>5th row</b> (the two middle rows).`,
     `${K("Alt","E")} → <b>Extrude Faces Along Normals</b>, type <code>-0.004</code>, ${K("Enter")}.`,
     `Material tab: click <b>Glow</b> in the list → <b>Assign</b>.`
   ], shots:[SH("l2-s07a","The two middle rows pushed in 4 mm.",[["VIEW_3D:HUD","4"]]), SH("l2-s07","Two slots, Shell and Glow; the window faces assigned to Glow.",[["PROPERTIES:WINDOW","1–2, 5"]])],
   see:`A recessed window band round the middle. Faces: <b>226</b>.`},

   {t:"Support loops the fast way: the 2-segment bevel trick", goal:"Every hard edge held by two loops 1.5 mm away, in one go.", do:[
     `Press ${K("2")} (edge select), then ${K("Alt","A")} to deselect everything.`,
     `Viewport header: ${M("Select","Sharp Edges")} (near the bottom of the Select menu).`,
     HUD("Select Sharp Edges","<b>Sharpness 30°</b>: every edge sharper than 30° is now selected (the rims and the band edges, not the gentle 22.5° turns round the side)"),
     `Press ${K("Ctrl","B")}, move the mouse a little, type <code>0.0015</code>, press ${K("Enter")}.`,
     `In the <b>Bevel</b> redo panel: ${T("Segments","2","1")}, then ${T("Profile Shape","1","0.500")}.`
   ], shots:[SH("l2-s08m","The Select menu: Sharp Edges sits near the bottom. (Select All by Trait, used in step 12, is in the middle.)"),
             SH("l2-s08a","Select › Sharp Edges at 30°: only the edges that turn hard are selected.",[["VIEW_3D:HUD","3"]]),
             SH("l2-s08","Bevel: Width 0.0015 m, Segments 2, Profile Shape 1. Every edge now has a holding loop 1.5 mm away on each side.",[["VIEW_3D:HUD","4–5"]])],
   see:`Rims and bands snap crisp. Statistics: <b>Faces 674</b>.`,
   why:`<b>Why it works:</b> a 2-segment bevel with a square profile (Shape 1) leaves its middle edge exactly on the old corner and adds one new edge on each face beside it. Those two new edges are holding loops, placed precisely, on hundreds of edges at once.`,
   pro:`<b>Keep the width under half the thinnest wall:</b> the grip bands stand 5 mm proud and the window sinks 4 mm, so 1.5 mm from each end never overlaps. Too wide and the two bevels collide and tangle.`},

   {t:"Judge it with the stripes", goal:"Check every edge in Object Mode with the reflection MatCap.", do:[
     `Press ${K("Tab")} for Object Mode (the cage wire disappears).`,
     `Orbit slowly round the cell (middle-drag). Follow the stripes across each band.`
   ], shots:[SH("l2-s09","Object Mode, check_reflection_horizontal: stripes run straight along the body and snap tight round each held edge.")],
   see:`Straight, even stripes on the body, crisp bright lines along every rim and band. Compare with step 2's pill.`},

   {t:"A recessed terminal on top", goal:"A contact ring 6 mm deep in the middle of the top cap.", do:[
     `${K("Tab")} (Edit Mode), ${K("3")} (face select). Click the big middle face of the top cap.`,
     `${K("I")}, type <code>0.018</code>, ${K("Enter")}. Then ${K("I")} again, type <code>0.002</code>, ${K("Enter")}.`,
     `${K("E")}, type <code>-0.006</code>, ${K("Enter")}: the middle sinks 6 mm.`
   ], shots:[SH("l2-s10","Two insets and E −0.006: the redo panel shows Move Z −0.006 m along the Normal. Still soft: the next step holds it.",[["VIEW_3D:HUD","3"]])],
   see:`A round recess in the top cap with a 2 mm ring round its lip. Under subdivision it still looks like a soft dish: its wall and floor aren't held yet. Faces: <b>722</b>.`,
   why:`<b>An inset is a holding loop for caps.</b> The thin 2 mm ring you just made sits right beside the lip, so the lip stays sharp on the cap side. The wall side needs its own loop: next step.`},

   {t:"Hold the terminal by hand", goal:"Two loops round the recess wall and a 2 mm ring on its floor.", do:[
     `Zoom in on the terminal (scroll). Press ${K("Ctrl","R")} and hover over one of the short <b>upright</b> edges of the recess wall (inside the hole, on the far side).`,
     `Type <code>2</code>, left-click, right-click: two loops round the wall, 2 mm apart.`,
     `Press ${K("3")}, click the floor of the recess. ${K("I")}, type <code>0.002</code>, ${K("Enter")}.`
   ], shots:[SH("l2-s11a","Ctrl+R, 2 on the 6 mm wall: loops at 2 mm and 4 mm, one beside the lip and one beside the floor.",[["VIEW_3D:HUD","2"]]),
             SH("l2-s11b","Inset 0.002 on the floor (Thickness 0.002 m): the floor edge's holding loop on the floor side.",[["VIEW_3D:HUD","3"]])],
   see:`The lip and the floor edge both stay crisp under subdivision. Faces: <b>770</b>.`},

   {t:"Quad caps with Grid Fill, then prove it", goal:"No n-gons anywhere: both 16-sided faces replaced by quad grids.", do:[
     `The recess floor's middle face is still selected (a 16-sided n-gon). Press ${K("X")} and click <b>Only Faces</b>: it becomes a hole.`,
     `Viewport header: ${M("Face","Grid Fill")}. The hole fills with a grid of quads.`,
     HUD("Grid Fill",`<b>Span</b> and <b>Offset</b>. Set ${T("Span","4","1")}: a 4 × 4 grid of quads. (Offset rotates the grid; leave it at 0.)`),
     `Orbit underneath, click the bottom cap's middle face, and do the same: ${K("X")} → <b>Only Faces</b>, then ${M("Face","Grid Fill")}.`,
     `Prove it: ${K("Alt","A")} to deselect, then ${M("Select","Select All by Trait","Faces by Sides")}. In its redo panel set <b>Type</b> to <b>Not Equal To</b> (Number of Vertices stays 4). Statistics: <b>Faces 0/768</b> selected = every face is a quad.`
   ], shots:[SH("l2-s12a","X with the floor selected: pick Only Faces (it keeps the edges, so Grid Fill has a ring to fill)."),
             SH("l2-s12","Face › Grid Fill with Span 4: the hole is filled with a 4 × 4 grid of quads.",[["VIEW_3D:HUD","3"]]),
             SH("l2-s12b","Faces by Sides, Not Equal To 4: nothing selected, so the whole cage is quads.",[["VIEW_3D:HUD","5"]])],
   see:`Both caps are quad grids. Faces by Sides ≠ 4 selects <b>0</b> faces out of 768.`,
   why:`<b>Law 4: curved must be clean.</b> The caps are flat now, but the grid keeps the subdivision even right up to the rim, and a quad cage bakes, unwraps and deforms predictably.`},

   {t:"Name it and see it glow", goal:"PowerCell, in colour, saved.", do:[
     `${K("Tab")} to Object Mode. ${K("F2")}, type <code>PowerCell</code>, ${K("Enter")}.`,
     `Click the <b>Material Preview</b> sphere (third of the four) at the top-right of the viewport. The window glows cyan.`,
     `${K("Ctrl","S")}, save as <code>power_cell.blend</code> in your course folder.`
   ], shots:[SH("l2-s13","PowerCell in Material Preview: gunmetal shell, glowing window, crisp bands.",[["OUTLINER:WINDOW","1"]])],
   see:`A 12 × 26 cm power cell: dark metal shell, two grip bands, a cyan window, a recessed terminal, all from one quad cage.`,
   pro:`<b>Dimensions read 0.13 × 0.13 × 0.26 m</b> because the grip bands stand 5 mm proud of the 12 cm body. That's right.`}
  ],
  check:`<b>You should have:</b> one object, PowerCell, 0.13 × 0.13 × 0.26 m; a Subdivision modifier at Levels Viewport 2 / Render 2 and nothing else in the stack; 768 quads and zero n-gons or triangles in the cage; crisp rims, grip bands, window and terminal; straight stripes in check_reflection_horizontal; Shell and Glow materials.`,
  cards:[
    ["Law 5 in five words?","<b>Closer loops, sharper edges.</b> The loop's distance from the edge sets the radius."],
    ["What does Ctrl+2 do in Object Mode?","Adds a Subdivision Surface modifier with Levels Viewport 2 (Render is 2 by default)."],
    ["Why does a plain cylinder melt under subdivision?","Each level moves every point toward the average of its neighbours. Nothing near the edges stops the rounding."],
    ["How many holding loops does one hard edge need?","One on <b>each</b> side of it. One loop alone leaves the other face soft."],
    ["Crease or holding loops for a finished high poly? Why?","Loops. A crease (Shift+E) is extra data many tools ignore, and at 1.0 the edge has no highlight. Loops are plain geometry and look the same everywhere."],
    ["The fastest way to hold every hard edge?","Select › Sharp Edges, then Ctrl+B with <b>Segments 2</b> and <b>Profile Shape 1</b>."],
    ["Why Profile Shape 1 in that bevel?","A square profile keeps the middle edge on the old corner, so the two new edges become holding loops without changing the shape."],
    ["How do you make a 16-sided cap into quads?","Delete the n-gon with X › <b>Only Faces</b>, then Face › <b>Grid Fill</b>."],
    ["How do you prove a cage is all quads?","Select › Select All by Trait › Faces by Sides, Type <b>Not Equal To</b> 4: nothing should be selected."],
    ["Why no Bevel modifier or booleans on a SubD part?","Subdivision rounds a bevel away and multiplies polygons; a boolean leaves n-gons and triangles that pinch. Hold edges with loops; cut-in details are separate parts."],
    ["Which MatCap judges smooth surfaces, and what does trouble look like?","check_reflection_horizontal. Stripes that bend, pinch or blur where the surface should be clean."]
  ],
  boss:{
    title:"Boss fight: the power cell from memory",
    brief:"Memory mode on, timer running, a fresh General file. Build the cell again without looking at the steps.",
    goal:25,
    items:[
      ["A 16-sided cylinder at real size (0.12 × 0.26 m) with Subdivision level 2, shaded smooth",""],
      ["Seven even body loops, two raised grip bands and a recessed window band",""],
      ["Shell and Glow materials, the window glowing",""],
      ["Every hard edge held with the 2-segment bevel trick",""],
      ["A recessed terminal held by insets and two wall loops",""],
      ["Quad caps with Grid Fill; Faces by Sides ≠ 4 selects nothing",""]
    ],
    stretch:[
      ["Moulded vs machined","Duplicate the finished cell (Shift+D, then X to slide it aside) and repeat the bevel trick on a fresh copy with 0.004 instead of 0.0015. Same shape, softer plastic look. Which reads as heavier?"],
      ["A carry bail","Add a Torus with 16 major segments, scale it into a handle and push it into the terminal. Intersect it, never merge it: separate parts touching is how real products are built."],
      ["Game cost","Set Levels Viewport to 1 and compare the triangle count with level 2. For a game you'd keep this cage and bake the level-2 detail into a normal map (Module 2)."]
    ]
  }
});

/* ============================== L3 · Pipe junction with a valve ============================== */
LESSONS.push({
  id:"l3", num:3, short:"Pipe junction + valve", laws:[6,5],
  title:"A pipe junction with a valve: clean holes in curved surfaces",
  kick:"Lesson 3 · Edge counts, To Sphere, support loops on both sides, radial arrays",
  time:"70–90 min",
  hero:"shots/l3-hero.jpg", thumb:"shots/l3-hero.jpg",
  intro:`A branch growing out of a pipe is the classic hard-surface test: get it wrong and the joint pinches, dents or melts. You'll cut a perfectly round hole into a curved 16-sided pipe with nothing but a square patch of faces and <b>To Sphere</b>, grow an 8-sided branch out of it, hold the joint with support loops on both sides, then bolt a flange on with a radial array and top it with a hand-wheel valve. The same recipe makes nozzles, ports, exhausts, sockets and every "tube out of a tube" you'll ever model.`,
  use:`<b>Used for:</b> pipework, engine intakes, gun barrels with ports, sci-fi nozzles, buttons on a round grip, any round thing growing out of a curved surface. Radial arrays build bolt circles, vents, fan blades and wheel spokes.`,
  learn:["Edge-count matching","Loop cuts with several cuts","Square patches","Dissolve Faces","To Sphere","Support loops both sides","Bevel for holding loops","Subdivision + stripes check","3D cursor","Origins","Radial Array + Empty","Torus"],
  concepts:[
    {h:"Count before you cut (Law 6)", p:"A patch of faces that is <i>w</i> wide and <i>h</i> tall has <b>2 × (w + h)</b> border edges. A 2 × 2 patch has 8, so the branch that grows out of it has 8 sides. Matching counts is what lets every face stay a quad, and quads are what Subdivision needs."},
    {h:"Square patch, round hole", p:"To Sphere pushes each selected point straight toward or away from their centre until they're all the same distance away. If the patch is square, its 8 points are spread evenly and you get a clean round hole. A long patch bunches the points and the branch comes out lumpy."},
    {h:"Hold the joint from both sides (Law 5)", p:"A sharp-ish joint needs a support loop on the pipe side (the inset ring) <i>and</i> one on the branch side (a short first extrude). Leave either out and Subdivision melts the joint into a soft blob."},
    {h:"The origin is the hinge", p:"An Array modifier set to <b>Object Offset</b> copies the Empty's position and rotation, measured from the object's origin, onto every next copy. Put the bolt's origin on the flange's centre line and an Empty turned 45° there, and 8 copies walk round in a perfect circle."}
  ],
  labs:[
    {type:"edgecount", title:"Count Before You Cut: patch → branch", hint:"pick the pipe and the patch, then press To Sphere",
     cap:"Set the main pipe to 16 segments and the patch to 2 × 2: 8 edges, a square, a clean circle. Now try 3 × 2 and watch the points crowd along the long sides when you press To Sphere. Try a 1 × 1 patch: 4 edges is too few to make anything round."},
    {type:"doctor", title:"Topology Doctor: three junctions that went wrong", hint:"click where the problem is",
     cap:"Each picture is a real Blender 5.3 viewport with the reflection-stripe MatCap. Good surfaces make stripes that flow evenly; every kink, dent or pinch is a topology problem underneath. Find the problems, then read why they happened.",
