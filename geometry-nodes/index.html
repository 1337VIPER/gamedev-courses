<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geometry Nodes Fast Track</title>
<style>
:root{
  --bg:#17181b;--panel:#1f2125;--card:#25272c;--card2:#2c2f35;--line:#363941;--ink:#e8e9ec;--mut:#9a9ea8;--dim:#6d717b;
  --acc:#00d6a3;--acc2:#4fb3ff;--warn:#f0a35a;--good:#5fd38d;--bad:#ef6b6b;
  --geo:#00d6a3;--float:#a1a1a1;--int:#598c5c;--vec:#6363c7;--bool:#cca6d6;--rot:#a663c7;--menu:#7c7c7c;--obj:#ed9e5c;--str:#70b2ff;--mat:#eb7582;--col:#c7c729;--shd:#63c763;
  --h-input:#83314a;--h-geo:#1d725e;--h-util:#2f4f86;--h-tex:#7a4a1f;--h-group:#3d3f45;--h-shader:#2b652b;--h-curve:#1d725e;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc2)}
kbd{font:600 .78em/1 ui-monospace,Consolas,monospace;background:#0f1012;border:1px solid #444851;border-bottom-width:2px;border-radius:4px;padding:.18em .42em;color:#f1f1f1;white-space:nowrap}
code{font:.88em ui-monospace,Consolas,monospace;background:#0f1012;border:1px solid #33363d;border-radius:4px;padding:.05em .35em;color:#d9f7ee}
b.n{color:var(--acc);font-weight:600}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:20px 16px}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.brand svg{flex:none}
.brand h1{font-size:1.02rem;margin:0;line-height:1.2}
.brand small{display:block;color:var(--mut);font-weight:400;font-size:.78rem}
.ring{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:16px 0}
.ring svg{flex:none}
.ring .t{font-size:.82rem;color:var(--mut);line-height:1.35}
.ring .t b{display:block;color:var(--ink);font-size:1rem}
nav .grp{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:18px 4px 6px}
nav a.l{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);padding:8px 8px;border-radius:8px;font-size:.9rem;line-height:1.25}
nav a.l:hover{background:var(--card)}
nav a.l.on{background:var(--card2);box-shadow:inset 3px 0 0 var(--acc)}
nav a.l .nb{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;background:#2d3036;color:var(--mut)}
nav a.l.done .nb{background:var(--acc);color:#04261d}
nav a.l .bar{height:3px;background:#30333a;border-radius:2px;margin-top:5px;overflow:hidden}
nav a.l .bar i{display:block;height:100%;background:var(--acc);width:0}
nav .lock{display:flex;gap:10px;align-items:center;color:var(--dim);padding:6px 8px;font-size:.85rem;line-height:1.25}
nav .lock .nb{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;border:1px dashed #444851}
.tools{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font:600 .85rem system-ui,sans-serif;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{border-color:#50545e;background:var(--card2)}
a.btn{text-decoration:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04261d}
.btn.pri:hover{filter:brightness(1.08)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.85rem;cursor:pointer;user-select:none}
.toggle .sw{width:34px;height:20px;border-radius:10px;background:#3a3d44;position:relative;flex:none;transition:.2s}
.toggle .sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#cfd2d8;transition:.2s}
.toggle.on .sw{background:var(--acc)}.toggle.on .sw::after{left:17px;background:#04261d}
.save{font-size:.75rem;color:var(--dim);margin-top:10px;display:flex;gap:6px;align-items:center}
.save i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.save.ok i{background:var(--good)}.save.local i{background:var(--warn)}
main{min-width:0;padding:34px 40px 120px;max-width:1180px}
.hero{border:1px solid var(--line);border-radius:14px;padding:26px 28px;background:radial-gradient(1200px 300px at 0% 0%,rgba(0,214,163,.13),transparent 60%),var(--panel);margin-bottom:26px;position:relative;overflow:hidden}
.hero .kick{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:700}
.hero h2{font-size:2rem;line-height:1.15;margin:6px 0 10px}
.hero p{color:#c9ccd3;max-width:760px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:.76rem;border:1px solid #3d4048;border-radius:999px;padding:3px 10px;color:#cdd0d6;background:#1b1d20}
.chip.g{border-color:rgba(0,214,163,.45);color:#9ff3dc}
.use{margin-top:14px;font-size:.88rem;color:var(--mut)}
.use b{color:var(--ink)}
h3.sec{font-size:1.2rem;margin:38px 0 12px;display:flex;align-items:center;gap:10px}
h3.sec .tag{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;background:#2b2e34;color:var(--mut);border-radius:4px;padding:2px 7px}
.concepts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.concept{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.concept h4{margin:0 0 6px;font-size:.95rem;color:#fff}
.concept p{margin:0;color:#c3c6cd;font-size:.9rem}
.graphwrap{background:#1d1e21;border:1px solid var(--line);border-radius:12px;margin:14px 0 6px;overflow:hidden}
.graphhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.88rem}
.graphhead b{color:#fff}
.graphhead .hint{color:var(--dim);font-size:.78rem}
.graphscroll{overflow:auto;position:relative}
.graph{position:relative;background-color:#1d1e21;background-image:radial-gradient(#2a2c31 1px,transparent 1px);background-size:22px 22px}
.graph svg.links{position:absolute;inset:0;pointer-events:none;overflow:visible}
.node{position:absolute;background:#303236;border:1px solid #17181a;border-radius:7px;box-shadow:0 6px 18px rgba(0,0,0,.35);font-size:12px;line-height:1;color:#e6e6e6}
.node .nh{padding:6px 10px;border-radius:6px 6px 0 0;font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.node .nb{padding:4px 0 6px}
.node .prop{margin:3px 10px 4px;background:#222326;border:1px solid #3c3e43;border-radius:4px;padding:3px 7px;font-size:11px;color:#d7d7d7;display:flex;justify-content:space-between}
.node .prop::after{content:"▾";color:#888;margin-left:6px}
.node .row{position:relative;height:22px;display:flex;align-items:center;padding:0 12px;gap:6px}
.node .row.out{justify-content:flex-end}
.node .row span{white-space:nowrap}
.node .row em{font-style:normal;margin-left:auto;background:#545659;border-radius:4px;padding:2px 6px;font-size:11px;color:#f2f2f2;white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.node .row em.ok{background:#4772b3}
.node .s{position:absolute;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;border:1px solid #111;background:var(--c)}
.node .row.in .s{left:-6px}.node .row.out .s{right:-6px}
.node .s.f{border-radius:2px;transform:rotate(45deg) scale(.88)}
.node .s.m{height:20px;margin-top:-10px;border-radius:6px}
.node.note{background:transparent;border:1px dashed #4a4d55;box-shadow:none;color:var(--mut);font-size:11.5px;line-height:1.35;padding:8px 10px;white-space:normal}
.cap{font-size:.85rem;color:var(--mut);margin:0 2px 18px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--mut);padding:8px 14px;border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid #111}
.legend i.f{border-radius:1px;transform:rotate(45deg)}
.steps{counter-reset:st;display:flex;flex-direction:column;gap:10px}
.step{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px 14px 14px;display:grid;grid-template-columns:30px 1fr;gap:10px;transition:border-color .2s,background .2s}
.step.done{border-color:rgba(0,214,163,.4);background:linear-gradient(90deg,rgba(0,214,163,.07),transparent 40%),var(--card)}
.cb{appearance:none;width:22px;height:22px;border-radius:6px;border:2px solid #555963;background:#1a1b1e;cursor:pointer;margin:1px 0 0;display:grid;place-items:center;transition:.15s}
.cb:checked{background:var(--acc);border-color:var(--acc)}
.cb:checked::after{content:"";width:6px;height:11px;border:solid #04261d;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cb:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.step .st{font-weight:650;color:#fff;cursor:pointer}
.step .st small{color:var(--acc);font-weight:700;margin-right:8px}
.step .sd{color:#c6c9d0;font-size:.92rem;margin-top:6px}
.step .sd p{margin:.4em 0}
.step .sd ul{margin:.3em 0;padding-left:20px}
.why{margin-top:8px;border-left:3px solid var(--acc2);background:rgba(79,179,255,.07);padding:7px 10px;border-radius:0 6px 6px 0;font-size:.87rem;color:#c9dcef}
.why b{color:#8fcbff}
.pro{margin-top:8px;border-left:3px solid var(--warn);background:rgba(240,163,90,.07);padding:7px 10px;border-radius:0 6px 6px 0;font-size:.87rem;color:#ecd9c6}
.pro b{color:#ffc58f}
.check{background:linear-gradient(135deg,rgba(0,214,163,.1),rgba(79,179,255,.06));border:1px solid rgba(0,214,163,.3);border-radius:10px;padding:14px 16px;color:#d6efe8;font-size:.92rem}
.check b{color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fc{perspective:900px;min-height:150px;cursor:pointer}
.fc .in{position:relative;width:100%;height:100%;min-height:150px;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;font-size:.9rem}
.fc .front{background:var(--card)}
.fc .back{background:#1d2a27;border-color:rgba(0,214,163,.35);transform:rotateY(180deg);color:#d9f3ec}
.fc .q{font-weight:600;color:#fff}
.fc .lab{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.fc .back .lab{color:#6fcfb4}
.fc .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.76rem;color:var(--dim);padding-top:8px}
.fc .knew{display:flex;gap:6px;align-items:center;color:#9fe9d4;cursor:pointer}
.fc .knew .cb{width:18px;height:18px}
.fc.known .front{border-color:rgba(0,214,163,.45)}
.boss{background:radial-gradient(600px 200px at 100% 0%,rgba(240,163,90,.14),transparent 60%),var(--card);border:1px solid rgba(240,163,90,.4);border-radius:12px;padding:18px 18px 8px}
.boss h4{margin:0 0 4px;color:#ffd2a6;font-size:1.05rem}
.boss .brief{color:#d8cfc6;font-size:.92rem;margin-bottom:10px}
.ck{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:7px 0;border-top:1px solid #3a3530;font-size:.92rem;color:#e8e1da}
.ck:first-of-type{border-top:0}
.ck label{cursor:pointer}
.ck small{display:block;color:#a89e93;font-size:.82rem;margin-top:2px}
.timer{display:flex;align-items:center;gap:10px;margin:6px 0 12px;flex-wrap:wrap}
.timer .clock{font:700 1.3rem ui-monospace,Consolas,monospace;color:#ffd2a6;min-width:84px}
textarea.notes{width:100%;min-height:110px;background:#141518;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:14px/1.5 system-ui,sans-serif;resize:vertical}
textarea.notes:focus{outline:none;border-color:var(--acc)}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.road{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.mod .mk{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);font-weight:700}
.mod.lockd .mk{color:var(--dim)}
.mod h4{margin:4px 0 6px;font-size:1rem}
.mod ul{margin:0;padding-left:18px;color:#c3c6cd;font-size:.88rem}
.mod.lockd{opacity:.78;border-style:dashed}
.mod a{text-decoration:none}
table.keys{width:100%;border-collapse:collapse;font-size:.9rem}
table.keys td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
table.keys td:first-child{white-space:nowrap;width:1%}
table.keys tr:first-child td{border-top:0}
.loop{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.loop div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.88rem;color:#c3c6cd}
.loop b{display:block;color:#fff;margin-bottom:3px}
.loop i{font-style:normal;color:var(--acc);font-weight:800;margin-right:6px}
/* literal steps */
.goal{color:#e9ebef;margin:2px 0 8px}
.goal b{color:var(--acc)}
ol.do{margin:6px 0 4px;padding-left:24px;display:flex;flex-direction:column;gap:7px}
ol.do li{padding-left:4px;line-height:1.55}
ol.do li::marker{color:var(--acc);font-weight:700}
ol.do li > b:first-child{color:#fff}
ol.do u{text-decoration:none;border-bottom:1px dashed #8fcbff;color:#d7ebff}
.so,.si{display:inline-block;border-radius:4px;padding:0 6px;font-size:.86em;font-weight:600;line-height:1.5}
.so{background:#20302c;color:#9ff3dc;border:1px solid #2f5a4f}
.si{background:#262a3a;color:#c3c9ff;border:1px solid #3d4466}
ol.do small{color:var(--dim)}
.see{margin-top:8px;border-left:3px solid var(--good);background:rgba(95,211,141,.07);padding:7px 10px;border-radius:0 6px 6px 0;font-size:.87rem;color:#d3efdd}
.see b{color:#8fe6b0}
.btn.where{font-size:.78rem;padding:5px 10px;margin:2px 0 6px;font-weight:600}
.node.hl{outline:3px solid #ffd166;outline-offset:2px;box-shadow:0 0 0 8px rgba(255,209,102,.18),0 6px 18px rgba(0,0,0,.35);z-index:3;animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(255,209,102,.05),0 6px 18px rgba(0,0,0,.35)}}
.backbtn{position:fixed;right:20px;bottom:20px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.4)}
details.basics{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 14px;padding:0 14px}
details.basics summary{cursor:pointer;padding:12px 0;font-weight:650;color:#fff}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:0 0 14px}
.bcard{background:#1d1f23;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.88rem;color:#c6c9d0}
.bcard b{display:block;color:#fff;margin-bottom:4px}
.bcard b i{font-style:normal;color:var(--acc);margin-right:6px}
.tscroll{overflow-x:auto;max-width:100%}
.step>div{min-width:0}
@media (max-width:900px){table.keys td:first-child{white-space:normal}}
.step .sd,.concept p{overflow-wrap:anywhere}
/* screenshots */
figure.shot{margin:10px 0 6px}
.shot .sw{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:zoom-in;background:#111;line-height:0}
.shot img{display:block;width:100%;height:auto}
.shot .mk{position:absolute;border:2.5px solid #ffd166;border-radius:5px;box-shadow:0 0 0 2px rgba(0,0,0,.55),0 0 18px rgba(255,209,102,.35);pointer-events:none}
.shot .mk b{position:absolute;top:-11px;left:-11px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#ffd166;color:#1a1400;font:800 12px/22px system-ui,sans-serif;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.shot figcaption{font-size:.8rem;color:var(--mut);margin-top:5px}
#lightbox{position:fixed;inset:0;background:rgba(5,6,8,.9);display:none;align-items:center;justify-content:center;z-index:60;padding:16px;cursor:zoom-out}
#lightbox.on{display:flex}
#lightbox .lbin{width:min(1600px,100%)}
#lightbox .sw{cursor:zoom-out}
/* memory mode */
body.memory .mem{filter:blur(7px) saturate(.4);opacity:.55;cursor:pointer;transition:filter .25s,opacity .25s;user-select:none}
body.memory .mem.peek{filter:none;opacity:1;user-select:auto}
body.memory .graphwrap .mem{pointer-events:auto}
.memnote{display:none;background:#2a2433;border:1px solid #574a6b;color:#dccbf3;border-radius:10px;padding:10px 14px;font-size:.88rem;margin:0 0 18px}
body.memory .memnote{display:block}
/* review modal */
.modal{position:fixed;inset:0;background:rgba(5,6,8,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;padding:22px}
.mbox .from{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.mbox .q{font-size:1.15rem;font-weight:650;margin:8px 0 14px}
.mbox .a{background:#1d2a27;border:1px solid rgba(0,214,163,.35);border-radius:10px;padding:12px 14px;color:#d9f3ec;display:none}
.mbox.show .a{display:block}
.mbox .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.mbox .cnt{font-size:.8rem;color:var(--dim);margin-right:auto;align-self:center}
.mtop{display:none;position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;justify-content:space-between;gap:10px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:290px;z-index:40;transform:translateX(-100%);transition:transform .25s}
  aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  .mtop{display:flex}
  main{padding:20px 16px 100px}
  .hero{padding:20px}.hero h2{font-size:1.55rem}
  .grid2,.loop{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="mtop"><button class="btn" id="menuBtn">☰ Lessons</button><span id="mtopPct" style="font-size:.85rem;color:var(--mut)"></span></div>
<div class="app">
<aside id="side">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="8" fill="#1d725e"/><circle cx="9" cy="11" r="3" fill="#00d6a3"/><rect x="21.5" y="18.5" width="5" height="5" transform="rotate(45 24 21)" fill="#a663c7"/><path d="M12 11 C18 11 16 21 22 21" stroke="#00d6a3" stroke-width="2" fill="none"/></svg>
    <h1>Geometry Nodes<small>Fast Track · Blender 5.3</small></h1>
  </div>
  <div class="ring">
    <svg width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="27" r="22" stroke="#30333a" stroke-width="6" fill="none"/><circle id="ringArc" cx="27" cy="27" r="22" stroke="#00d6a3" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="138.2" transform="rotate(-90 27 27)"/><text id="ringTxt" x="27" y="31" text-anchor="middle" fill="#e8e9ec" font-size="12" font-weight="700">0%</text></svg>
    <div class="t"><b id="ringCount">0 / 0</b>tasks, cards and challenges ticked</div>
  </div>
  <nav id="nav"></nav>
  <div class="tools">
    <div class="toggle" id="memToggle" role="switch" aria-checked="false" tabindex="0"><span>🧠 Memory mode<br><small style="color:var(--dim)">blur the answers, recall first</small></span><span class="sw"></span></div>
    <button class="btn pri" id="reviewBtn">⟳ Review deck</button>
    <button class="btn" id="resetBtn" style="color:var(--mut)">Reset progress…</button>
  </div>
  <div class="save" id="save"><i></i><span>connecting…</span></div>
</aside>
<main id="main"></main>
</div>

<div id="lightbox" aria-hidden="true"><div class="lbin"></div></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mq">
  <div class="mbox" id="mbox">
    <div class="from" id="mfrom"></div>
    <div class="q" id="mq"></div>
    <div class="a" id="ma"></div>
    <div class="row">
      <span class="cnt" id="mcnt"></span>
      <button class="btn" id="mshow">Show answer <kbd>Space</kbd></button>
      <button class="btn" id="magain" style="display:none">Again</button>
      <button class="btn pri" id="mgot" style="display:none">Knew it ✓</button>
      <button class="btn" id="mclose">Close</button>
    </div>
  </div>
</div>

<script>
/* ===================== DATA ===================== */
/* ===================== LITERAL STEP HELPERS ===================== */
const K = (...k)=>k.map(x=>`<kbd>${x}</kbd>`).join("");
// Add a node
function A(name, search, where){
  return `<b>Add ${name}:</b> mouse over the node editor → ${K("Shift","A")} → type <code>${search}</code> → click <b>${name}</b> in the list. The node now follows your mouse: move it <u>${where}</u> and left-click to drop it.`;
}
// Connect two sockets
function C(fn, fs, tn, ts){
  return `<b>Wire:</b> press and hold on <b>${fn}</b> › <span class="so">${fs}</span> <small>(dot on its right edge)</small>, drag to <b>${tn}</b> › <span class="si">${ts}</span> <small>(dot on its left edge)</small>, let go.`;
}
// Type a value
function V(node, field, val, was){
  return `<b>Type:</b> on <b>${node}</b>, click once on the <b>${field}</b> number${was!==undefined?` (it shows <i>${was}</i>)`:""}, type <code>${val}</code>, press ${K("Enter")}.`;
}
// Change a dropdown
function D(node, cur, pick){
  return `<b>Dropdown:</b> on <b>${node}</b>, click the box that says <i>${cur}</i> and choose <b>${pick}</b>.`;
}
// View a node
function VW(node){
  return `<b>Look:</b> hold ${K("Ctrl","Shift")} and left-click the coloured title bar of <b>${node}</b>. The viewport and Spreadsheet now show that node's result.`;
}

const BASICS = [
  ["Mouse first, then key","Blender sends a shortcut to whichever panel the <b>mouse is over</b>. Before pressing a key for the nodes, move the mouse over the node editor (the big bottom panel)."],
  ["Find your way around","Scroll wheel = zoom. Hold the <b>middle mouse button</b> and drag = pan. "+K("Home")+" = fit all nodes on screen."],
  ["Add a node",K("Shift","A")+" → start typing the name → click the node in the list → it follows your mouse → move it where you want → <b>left-click</b> to drop it."],
  ["Move a node","Press and drag its coloured <b>title bar</b>. Or click the node once, press "+K("G")+", move, click."],
  ["Wire two nodes","<b>Outputs</b> are dots on a node's <b>right</b> edge, <b>inputs</b> are dots on the <b>left</b> edge. Press and hold on an output dot, drag to an input dot, let go. An input takes one wire (a new one replaces the old one). An output can feed as many inputs as you like."],
  ["Remove a wire","Hold "+K("Ctrl")+" and drag with the <b>right</b> mouse button across the wire (a dashed knife line appears). Or grab the wire's end at the input dot and drop it on empty space."],
  ["Type a value","Click <b>once</b> on the number without dragging. It turns into a text box with the number selected. Type the new value, press "+K("Enter")+". Dragging left/right slides the value instead, so press "+K("Ctrl","Z")+" if that happens."],
  ["XYZ fields","Vectors (Size, Offset, Translation…) show three stacked boxes: X on top, then Y, then Z. Each one is typed separately."],
  ["Dropdowns","A box with a small ▾ (like <i>Add</i> on a Math node) is a dropdown. Click it and pick the option."],
  ["Splice into a wire","Drag a node over an existing wire until the wire lights up, then let go. It plugs itself in between."],
  ["Delete / copy a node","Click its title bar, press "+K("X")+" (delete) or "+K("Ctrl","X")+" (delete and keep the wire joined through). "+K("Shift","D")+" copies it: move the copy and click to drop."],
  ["See a node's result","Hold "+K("Ctrl","Shift")+" and click the node's title bar. A <b>Viewer</b> node appears and the viewport + Spreadsheet show that node's output. <b>For a field node</b> (diamond output, like Noise, Math or Compare): Ctrl+Shift+click a <i>geometry</i> node instead (e.g. Set Position), then drag the field's output onto the Viewer's empty dot. In 5.3 a field only shows on a geometry above it in the Viewer. Click the Viewer and press "+K("X")+" when you're done."],
  ["The Geometry Nodes workspace","Click the <b>Geometry Nodes</b> tab at the very top of Blender (scroll the tab row if it's hidden). Default layout: <b>Spreadsheet</b> (table of numbers) top-left, <b>3D Viewport</b> top-right, <b>node editor</b> along the bottom, <b>Properties</b> editor on the far right (the blue wrench tab holds the modifier and its sliders)."],
  ["Side panel (N)","With the mouse over the node editor press "+K("N")+". Its <b>Group</b> tab lists the tree's inputs and outputs (names, types, defaults). Its <b>Node</b> tab shows the selected node's name, label and extra options."]
];

const STEPS = {
/* ============================== L1 ============================== */
l1:[
 {t:"Set up the host object", goal:"A plane with an empty Geometry Nodes tree on it.", do:[
   `Open Blender. In the splash screen click <b>General</b> (or top menu <b>File → New → General</b>).`,
   `Mouse over the 3D viewport. Left-click the cube, press ${K("Delete")}.`,
   `Still over the viewport: ${K("Shift","A")} → <b>Mesh</b> → <b>Plane</b>.`,
   `At the very top of the window, click the workspace tab <b>Geometry Nodes</b>.`,
   `In the node editor (bottom panel), click the <b>New</b> button in its top bar.`
 ], see:`Two nodes, <b>Group Input</b> on the left and <b>Group Output</b> on the right, joined by a teal wire. The plane looks the same. Properties (far right) → blue wrench tab now lists a <i>GeometryNodes</i> modifier.`,
 why:`<b>Why a plane?</b> Geometry Nodes is a modifier, so it has to sit on an object. We'll ignore the plane's own shape and make our own.`},

 {t:"Make room, then add a 20 m Grid", goal:"A big flat 20 × 20 m grid replacing the plane.", hl:{g:0,n:["grid","out"]}, do:[
   `Press and drag the title bar of <b>Group Output</b> to the right, about four node-widths away. You'll build everything in that gap.`,
   A("Grid","grid","to just below Group Input"),
   V("Grid","Size X","20","1 m"),
   V("Grid","Size Y","20","1 m"),
   V("Grid","Vertices X","200","3"),
   V("Grid","Vertices Y","200","3"),
   C("Grid","Mesh","Group Output","Geometry") + ` The old wire from Group Input disappears, because an input only takes one wire.`
 ], see:`A large flat grid in the viewport (mouse over the viewport, press ${K("Home")} if you can't see all of it). The Spreadsheet (top-left) says <b>40,000</b> vertices.`},

 {t:"Splice in a Set Position node", goal:"Grid → Set Position → Group Output.", hl:{g:0,n:["setp"]}, do:[
   `${K("Shift","A")} → type <code>set position</code> → click <b>Set Position</b>. <b>Don't click to drop yet.</b>`,
   `Move it so it sits <u>on top of the teal wire</u> between Grid and Group Output. When the wire lights up, left-click.`,
   `Check: there should now be a wire Grid › Mesh → Set Position › Geometry, and Set Position › Geometry → Group Output › Geometry. If not, make those two wires by hand.`
 ], see:`Nothing changes yet. That's correct, because the Offset is still 0, 0, 0.`},

 {t:"Raise hills with noise", goal:"Four nodes in a row <u>under</u> the Grid / Set Position line: Noise Texture → Math (Subtract) → Math (Multiply) → Combine XYZ → Set Position's Offset.", hl:{g:0,n:["noise","sub","mul","cxyz"]}, do:[
   A("Noise Texture","noise","to directly under the Grid node, leaving a small gap"),
   V("Noise Texture","Scale","0.15","5.000"),
   V("Noise Texture","Detail","4","2.000") + ` Leave the two dropdowns (<i>3D</i>, <i>fBM</i>) as they are.`,
   A("Math","math","to the right of Noise Texture") + ` Pick <b>Math</b> exactly, not Vector Math or Integer Math.`,
   D("Math","Add","Subtract") + ` It now reads <i>Subtract</i> and has two <b>Value</b> inputs, both showing 0.500.`,
   C("Noise Texture","Factor","Subtract","Value (the top one)") + ` Leave the <b>bottom</b> Value at <code>0.5</code>.`,
   A("Math","math","to the right of the Subtract node"),
   D("that second Math node","Add","Multiply"),
   C("Subtract","Value","Multiply","Value (the top one)"),
   V("Multiply","bottom Value","8","0.500") + ` This is the hill height in metres.`,
   A("Combine XYZ","combine xyz","to the right of Multiply, so it ends up below and a little left of Set Position"),
   C("Multiply","Value","Combine XYZ","Z") + ` (the third input). Leave X and Y at 0.`,
   C("Combine XYZ","Vector","Set Position","Offset") + ` (the <b>bottom</b> input, not Position).`
 ], see:`The grid turns into rolling hills about 2 m up and down. All spikes = Scale is too big (should be 0.15). Still flat = the wire went into <b>Position</b> instead of <b>Offset</b>, or into the wrong Combine XYZ socket.`,
 why:`<b>Offset vs Position:</b> Offset <i>adds</i> to where each vertex already is. Position <i>replaces</i> it. <b>Why subtract 0.5?</b> Noise gives values around 0.5. Centring them on 0 lets the hills go down into valleys as well as up.`},

 {t:"Look inside a field with the Viewer", goal:"See the noise numbers that drive the hills.", hl:{g:0,n:["noise"]}, do:[
   `Hold ${K("Ctrl","Shift")} and left-click the coloured title bar of <b>Set Position</b> (not the noise). A <b>Viewer</b> node appears near it, with a <b>Geometry</b> input wired from Set Position. The viewport shows the hills in plain grey.`,
   C("Noise Texture","Factor","Viewer","the empty hollow dot at its bottom") + ` A <b>Factor</b> input appears under Geometry.`,
   `Now the hills show the noise as light and dark patches, and the Spreadsheet (top-left) gets a <b>Viewer</b> column with one number per vertex.`,
   `Done looking? Click the Viewer node's title bar and press ${K("X")}.`
 ], see:`Light and dark patches painted over the hills, like the picture.`,
 why:`<b>Why not Ctrl+Shift+click the noise itself?</b> In Blender 5.3 a Viewer paints a field only onto a geometry listed <i>above</i> it in the Viewer node. A noise or maths node has no geometry of its own, so viewing it directly gives a Viewer with nothing to show (checked in 5.3). So view the geometry first, then add the field. <b>This is your debugger:</b> whenever something looks wrong, view the step before the problem.`,
 shots:[{src:"shots/m1-l1-s05-noise.jpg", w:1600, h:900, cap:"Viewer = Set Position's Geometry, then the noise Factor. The hills show the noise as light and dark patches.", marks:[]}]},

 {t:"Build the slope mask", goal:"A yes/no answer per face: is this ground flat?", hl:{g:1,n:["nrm","sep","cf"]}, do:[
   `Pan down (hold the middle mouse button and drag up) so you have empty space <u>below the noise row</u>.`,
   A("Normal","normal","into that empty space, on the left") + ` Pick <b>Normal</b> (the input, not <i>Set Mesh Normal</i>).`,
   A("Separate XYZ","separate xyz","to the right of Normal"),
   C("Normal","Normal","Separate XYZ","Vector"),
   A("Compare","compare","to the right of Separate XYZ"),
   `Check the Compare node's two dropdowns read <i>Float</i> and <i>Greater Than</i> (they do by default).`,
   C("Separate XYZ","Z","Compare","A"),
   V("Compare","B","0.92","0.000"),
   `<b>Look at the mask:</b> hold ${K("Ctrl","Shift")} and click the title bar of <b>Set Position</b> (a Viewer appears with a Geometry input), then drag <b>Compare › Result</b> onto the Viewer's empty hollow dot. White = flat enough, black = too steep.`,
   `If you already Ctrl+Shift+clicked Compare and see nothing: click that Viewer, press ${K("X")}, then do the line above.`
 ], see:`The hills painted in white (flat) and black (steep) patches; the Spreadsheet's Viewer column shows ticked and unticked boxes.`,
 why:`<b>Normal Z</b> is 1 on flat ground and 0 on a vertical wall (it's the cosine of the slope). 0.92 ≈ 23°, 0.85 ≈ 32°. <b>Why the Viewer needs Set Position first:</b> Compare is a field with no geometry of its own; in 5.3 the Viewer paints it only onto a geometry listed above it.`,
 shots:[{src:"shots/m1-l1-s06-mask.jpg", w:1600, h:900, cap:"Right: Viewer with Geometry first, then Result. White = flat, black = steep.", marks:[]},
        {src:"shots/m1-l1-s06-wrong.jpg", w:1600, h:900, cap:"Wrong: Ctrl+Shift+click on Compare alone. The Viewer has only Result, so the viewport is empty and the Spreadsheet says Rows: 0.", marks:[]}]},

 {t:"Scatter grass points on the flat", goal:"Points only where Compare says yes.", hl:{g:1,n:["df","cf","terr"]}, do:[
   A("Distribute Points on Faces","distribute","to the right of Compare and a bit higher"),
   C("Set Position","Geometry","Distribute Points on Faces","Mesh") + ` Set Position keeps its wire to Group Output too. Outputs can feed many inputs.`,
   C("Compare","Result","Distribute Points on Faces","Selection"),
   V("Distribute Points on Faces","Density","15","10.000"),
   VW("Distribute Points on Faces")
 ], see:`Tiny dots only on the flatter parts of the hills.`},

 {t:"Scatter rock points on the steep parts", goal:"A second point set, spaced out, only on steep ground.", hl:{g:1,n:["cs","ds"]}, do:[
   `Click the <b>Compare</b> title bar, press ${K("Shift","D")}, move the copy <u>straight down below the first Compare</u>, left-click.`,
   D("the copied Compare","Greater Than","Less Than"),
   V("the copied Compare","B","0.85","0.920"),
   C("Separate XYZ","Z","copied Compare","A"),
   A("Distribute Points on Faces","distribute","below the first Distribute node"),
   D("the new Distribute","Random","Poisson Disk") + ` Its inputs change to Distance Min, Density Max, Density Factor.`,
   C("Set Position","Geometry","new Distribute","Mesh"),
   C("copied Compare","Result","new Distribute","Selection"),
   V("the new Distribute","Distance Min","0.8"),
   V("the new Distribute","Density Max","3","10.000")
 ], why:`<b>Poisson Disk</b> keeps every point at least <i>Distance Min</i> away from the others, so the rocks never overlap. Random can clump.`},

 {t:"Model a rock with nodes", goal:"A lumpy rock made from a sphere, in its own little group of nodes.", hl:{g:2,n:["ico","rnoise","rmul","rn","vs","rsp"]}, do:[
   `Pan to empty space <u>below everything you've built so far</u>. The rock gets its own area.`,
   A("Ico Sphere","ico sphere","to the left side of that empty space"),
   V("Ico Sphere","Radius","0.5","1 m"),
   V("Ico Sphere","Subdivisions","3","1"),
   A("Set Position","set position","to the right of Ico Sphere, leaving room for three nodes between them"),
   C("Ico Sphere","Mesh","this new Set Position","Geometry"),
   A("Noise Texture","noise","to under the Ico Sphere"),
   V("this Noise Texture","Scale","2.5","5.000"),
   V("this Noise Texture","Detail","6","2.000"),
   A("Math","math","to the right of this Noise Texture"),
   D("this Math","Add","Multiply"),
   C("Noise Texture","Factor","Multiply","Value (top)"),
   V("Multiply","bottom Value","0.35","0.500"),
   A("Normal","normal","to under the Multiply"),
   A("Vector Math","vector math","to the right of Multiply and Normal"),
   D("Vector Math","Add","Scale") + ` Its inputs become <b>Vector</b> and <b>Scale</b>.`,
   C("Normal","Normal","Vector Math","Vector"),
   C("Multiply","Value","Vector Math","Scale"),
   C("Vector Math","Vector","rock Set Position","Offset"),
   VW("the rock Set Position") + ` A single lumpy rock appears at the centre.`
 ], why:`<b>Field context:</b> these Normal and Noise nodes are worked out on the <i>sphere's</i> vertices, because the Set Position they feed is working on the sphere and not the terrain.`},

 {t:"Put rocks on the rock points", goal:"Hundreds of rocks, leaning with the slope, in random sizes.", hl:{g:2,n:["iop","rpts","rv","rsp"]}, do:[
   A("Instance on Points","instance on points","to the right of the rock Set Position"),
   C("Poisson Distribute (the lower one)","Points","Instance on Points","Points") + ` This wire will be long. That's fine.`,
   C("rock Set Position","Geometry","Instance on Points","Instance"),
   C("Poisson Distribute","Rotation","Instance on Points","Rotation") + ` (purple diamond, its third output).`,
   A("Random Value","random value","to under Instance on Points") + ` It says <i>Float</i>, which is what we want.`,
   V("Random Value","Min","0.4","0.000"),
   V("Random Value","Max","1.3","1.000"),
   C("Random Value","Value","Instance on Points","Scale"),
   VW("Instance on Points")
 ], why:`<b>The Rotation output</b> tilts each rock to match the ground under it, so rocks lean into the slope instead of standing straight up.`},

 {t:"Grass blades on the flat points", goal:"A thin three-sided cone, copied onto every grass point with a random spin.", hl:{g:2,n:["grass"]}, do:[
   A("Cone","cone","to empty space below the rock nodes"),
   V("Cone","Vertices","3","32"),
   V("Cone","Radius Bottom","0.03","1 m") + ` (Radius Top already shows 0.)`,
   V("Cone","Depth","0.35","2 m"),
   A("Transform Geometry","transform geometry","to the right of Cone"),
   C("Cone","Mesh","Transform Geometry","Geometry"),
   V("Transform Geometry","Translation <b>Z</b> (third box)","0.175","0 m") + ` This lifts the blade so it stands on the ground.`,
   A("Instance on Points","instance on points","to the right of Transform Geometry"),
   C("Random Distribute (the upper one)","Points","this Instance on Points","Points"),
   C("Transform Geometry","Geometry","this Instance on Points","Instance"),
   A("Random Value","random value","to under this Instance on Points"),
   D("Random Value","Float","Vector") + ` Min and Max now each have X, Y, Z boxes.`,
   `<b>Type</b> Max: X <code>0.3</code>, Y <code>0.3</code>, Z <code>6.28</code> (one box at a time, ${K("Enter")} after each). Leave Min at 0, 0, 0.`,
   C("Random Value","Value","this Instance on Points","Rotation")
 ]},

 {t:"Join everything", goal:"Terrain + rocks + grass all in the final output.", hl:{g:2,n:["join","out","terr"]}, do:[
   A("Join Geometry","join","to just left of Group Output (drag Group Output further right if there's no room)"),
   C("terrain Set Position (the first one you made)","Geometry","Join Geometry","Geometry (the tall socket)"),
   C("rocks Instance on Points","Instances","Join Geometry","the same tall socket") + ` It accepts many wires.`,
   C("grass Instance on Points","Instances","Join Geometry","the same tall socket"),
   C("Join Geometry","Geometry","Group Output","Geometry") + ` This replaces the old wire.`,
   `If a Viewer node is still in the tree, click it and press ${K("X")}.`,
   `Play: change <b>Seed</b> on either Distribute node, or the Multiply's 8.0, and watch it all rebuild.`
 ], see:`Hills with grass on the gentle parts and separated rocks on the steep parts.`},

 {t:"Turn your numbers into modifier sliders", goal:"Hill height, both slope limits and both seeds on the modifier panel.", hl:{g:0,n:["mul"]}, do:[
   `Find <b>Group Input</b> (far left). Its last output is an <b>empty hollow dot</b>.`,
   `On the <b>Multiply</b> node (the ×8 one), press and hold on the dot <u>left of its bottom Value (8.000)</u>, drag it to Group Input's <b>empty hollow dot</b>, let go. Group Input gains an output called <i>Value</i>, wired to it.`,
   `Mouse over the node editor → ${K("N")} → click the <b>Group</b> tab. In the list, double-click <i>Value</i>, type <code>Hill Height</code>, ${K("Enter")}.`,
   `Do the same for: the first Compare's <b>B</b> → name it <code>Grass Flatness</code>, the copied Compare's <b>B</b> → <code>Rock Steepness</code>, and the <b>Seed</b> of each Distribute → <code>Grass Seed</code>, <code>Rock Seed</code>.`,
   `Open Properties (far right) → blue wrench tab. Your five sliders are on the modifier. Change them there.`
 ], pro:`<b>Long wires?</b> Add a second Group Input node anywhere (${K("Shift","A")} → <code>group input</code>). Every copy has the same outputs, so you can drop one right next to the node that needs it.`,
 why:`<b>This is the whole point:</b> someone who never opens the node tree now has a terrain-dressing tool.`}
],

/* ============================== L2 ============================== */
l2:[
 {t:"Host object and an empty tree", goal:"A plane with a tree whose Group Input and Group Output are NOT wired together.", do:[
   `<b>File → New → General</b>. Click the cube in the viewport, press ${K("Delete")}. ${K("Shift","A")} → <b>Mesh → Plane</b>.`,
   `Click the <b>Geometry Nodes</b> workspace tab at the top, then <b>New</b> in the node editor's top bar.`,
   `Cut the wire between Group Input and Group Output: hold ${K("Ctrl")}, then with the <b>right</b> mouse button drag a line across the teal wire, let go.`,
   `Drag Group Output's title bar far to the right (about six node-widths).`
 ], see:`The plane disappears from the viewport. Nothing reaches the output yet.`},

 {t:"Create the four inputs", goal:"Group Input shows Steps, Rise, Turn, Width.", hl:{g:0,n:["gi"]}, do:[
   `Mouse over the node editor → ${K("N")} → <b>Group</b> tab. You'll see a list holding <i>Geometry</i> (output) and <i>Geometry</i> (input).`,
   `Click the <b>+</b> button next to the list → choose <b>Input</b>. A new item appears and is selected.`,
   `Double-click the new item's name in the list, type <code>Steps</code>, ${K("Enter")}. Below the list set the <b>Type</b> dropdown to <b>Integer</b>. <b>Default</b> <code>24</code>, <b>Min</b> <code>3</code>.`,
   `<b>+ → Input</b> again: name <code>Rise</code>, Type <b>Float</b>, <b>Subtype</b> <b>Distance</b>, Default <code>0.18</code>.`,
   `<b>+ → Input</b>: name <code>Turn</code>, Type <b>Float</b>, Subtype <b>Angle</b>, Default <code>15</code> (it shows 15°).`,
   `<b>+ → Input</b>: name <code>Width</code>, Type <b>Float</b>, Subtype <b>Distance</b>, Default <code>1.2</code>.`,
   `You can delete the <i>Geometry</i> input from the list (select it, click <b>−</b>), because this tool makes its own geometry.`,
   `<b>Important:</b> open Properties (far right) → blue <b>wrench</b> tab. The modifier shows Steps <i>0</i>, Rise <i>0 m</i>, Turn <i>0°</i>, Width <i>0 m</i>. A Default only applies to modifiers added later; this one keeps the value it had when the input was made. Click each field and type the same values: <code>24</code>, <code>0.18</code>, <code>15</code>, <code>1.2</code>.`
 ], why:`<b>Angle subtype</b> lets you type degrees while the nodes receive radians, which is what rotation maths expects.`},

 {t:"One point per step", goal:"A vertical line of points, 0.18 m apart.", hl:{g:0,n:["c1","ml"]}, do:[
   A("Mesh Line","mesh line","about two node-widths right of Group Input, near the top"),
   A("Combine XYZ","combine xyz","between Group Input and Mesh Line"),
   C("Group Input","Rise","Combine XYZ","Z"),
   C("Combine XYZ","Vector","Mesh Line","Offset"),
   C("Group Input","Steps","Mesh Line","Count"),
   VW("Mesh Line")
 ], see:`A vertical line of 24 points. Spreadsheet → Position Z column reads 0, 0.18, 0.36…`},

 {t:"Build the tread and move its pivot", goal:"One tread, shifted out from the centre so it can swing around a column.", hl:{g:0,n:["csz","cube","ma","ct","tg"]}, do:[
   A("Cube","cube","to below Mesh Line"),
   A("Combine XYZ","combine xyz","to the left of the Cube"),
   C("Group Input","Width","this Combine XYZ","X"),
   V("this Combine XYZ","Y","0.35","0.000"),
   V("this Combine XYZ","Z","0.05","0.000"),
   C("Combine XYZ","Vector","Cube","Size"),
   A("Math","math","to below that Combine XYZ"),
   D("Math","Add","Multiply Add") + ` Its inputs become <b>Value</b>, <b>Multiplier</b>, <b>Addend</b>.`,
   C("Group Input","Width","Multiply Add","Value"),
   V("Multiply Add","Multiplier","0.5"),
   V("Multiply Add","Addend","0.15"),
   A("Combine XYZ","combine xyz","to the right of Multiply Add"),
   C("Multiply Add","Value","this Combine XYZ","X"),
   A("Transform Geometry","transform geometry","to the right of the Cube"),
   C("Cube","Mesh","Transform Geometry","Geometry"),
   C("the X Combine XYZ","Vector","Transform Geometry","Translation")
 ], why:`<b>Pivot trick:</b> copies turn around their own centre. Moving the tread out by Width/2 + 0.15 makes its inner end start at the column surface, so it swings around the column instead of spinning in place.`},

 {t:"Copy the tread onto every point", goal:"A straight stack of treads.", hl:{g:0,n:["iop"]}, do:[
   A("Instance on Points","instance on points","to the right of Mesh Line"),
   C("Mesh Line","Mesh","Instance on Points","Points"),
   C("Transform Geometry","Geometry","Instance on Points","Instance"),
   C("Instance on Points","Instances","Group Output","Geometry")
 ], see:`A tall, straight stack of treads all pointing the same way.`},

 {t:"Index × Turn = spiral", goal:"Each tread turned 15° more than the one below.", hl:{g:0,n:["idx","im","cr"]}, do:[
   A("Index","index","to below Transform Geometry"),
   A("Math","math","to the right of Index"),
   D("Math","Add","Multiply"),
   C("Index","Index","Multiply","Value (top)"),
   C("Group Input","Turn","Multiply","Value (bottom)"),
   A("Combine XYZ","combine xyz","to the right of Multiply"),
   C("Multiply","Value","Combine XYZ","Z"),
   C("Combine XYZ","Vector","Instance on Points","Rotation")
 ], see:`The stack fans out into a spiral.`, why:`<b>Vector → Rotation</b> converts by itself (read as X, Y, Z angles). The wire stays a normal colour, which means it's allowed.`},

 {t:"The central column", goal:"A pole exactly as tall as the stair, standing on the floor.", hl:{g:1,n:["tot","cyl","tgc"]}, do:[
   A("Math","math","to empty space below the spiral nodes"),
   D("Math","Add","Multiply"),
   C("Group Input","Steps","Multiply","Value (top)"),
   C("Group Input","Rise","Multiply","Value (bottom)") + ` This is the <b>total height</b>. Optional: N → Node tab → Label → <code>total height</code>.`,
   A("Cylinder","cylinder","to the right of total height"),
   V("Cylinder","Radius","0.15","1 m"),
   C("total height","Value","Cylinder","Depth"),
   A("Math","math","to below total height"),
   D("this Math","Add","Multiply"),
   C("total height","Value","this Multiply","Value (top)") + ` Leave the bottom Value at 0.5.`,
   A("Combine XYZ","combine xyz","to the right of it"),
   C("Multiply (× 0.5)","Value","Combine XYZ","Z"),
   A("Transform Geometry","transform geometry","to the right of Cylinder"),
   C("Cylinder","Mesh","Transform Geometry","Geometry"),
   C("Combine XYZ","Vector","Transform Geometry","Translation")
 ], why:`<b>Why lift by half?</b> Cylinder is built centred on its middle, so half of it would be under the floor.`},

 {t:"The handrail curve", goal:"A spiral curve that winds with the steps.", hl:{g:1,n:["m2","div","rr","sp"]}, do:[
   A("Math","math","to empty space below the column nodes"),
   D("Math","Add","Multiply") + ` Label it <code>total turn</code>.`,
   C("Group Input","Steps","total turn","Value (top)"),
   C("Group Input","Turn","total turn","Value (bottom)"),
   A("Math","math","to the right of total turn"),
   D("this Math","Add","Divide"),
   C("total turn","Value","Divide","Value (top)"),
   V("Divide","bottom Value","6.2832","0.500") + ` (that's 2π, one full circle in radians).`,
   A("Math","math","to below total turn") + ` Leave it on <i>Add</i>. Label it <code>rail radius</code>.`,
   C("Group Input","Width","rail radius","Value (top)"),
   V("rail radius","bottom Value","0.15","0.500"),
   A("Spiral","spiral","to the right of Divide"),
   V("Spiral","Resolution","64","32"),
   C("Divide","Value","Spiral","Rotations"),
   C("rail radius","Value","Spiral","Start Radius"),
   C("rail radius","Value","Spiral","End Radius"),
   C("total height","Value","Spiral","Height"),
   `Tick the <b>Reverse</b> checkbox on Spiral.`
 ], why:`<b>Reverse:</b> checked in 5.3, Spiral winds clockwise by default while the steps turn anticlockwise. Reverse makes them match.`},

 {t:"Give the rail thickness", goal:"A round tube 0.9 m above the treads.", hl:{g:1,n:["tu","cc","c2m"]}, do:[
   A("Transform Geometry","transform geometry","to the right of Spiral"),
   C("Spiral","Curve","Transform Geometry","Geometry"),
   V("Transform Geometry","Translation Z (third box)","0.9","0 m"),
   A("Curve Circle","curve circle","to below that Transform"),
   V("Curve Circle","Resolution","12","32"),
   V("Curve Circle","Radius","0.03","1 m"),
   A("Curve to Mesh","curve to mesh","to the right of both"),
   C("Transform Geometry","Geometry","Curve to Mesh","Curve"),
   C("Curve Circle","Curve","Curve to Mesh","Profile Curve"),
   `Tick <b>Fill Caps</b> on Curve to Mesh.`,
   A("Set Shade Smooth","shade smooth","to the right of Curve to Mesh"),
   C("Curve to Mesh","Mesh","Set Shade Smooth","Mesh")
 ]},

 {t:"Balusters reusing the same rotation", goal:"One thin post per step, at the outer edge.", do:[
   A("Cylinder","cylinder","to empty space below everything"),
   V("Cylinder","Vertices","8","32"), V("Cylinder","Radius","0.015","1 m"), V("Cylinder","Depth","0.9","2 m"),
   A("Combine XYZ","combine xyz","to under that Cylinder"),
   C("rail radius","Value","Combine XYZ","X"),
   V("Combine XYZ","Z","0.47"),
   A("Transform Geometry","transform geometry","to the right of the Cylinder"),
   C("Cylinder","Mesh","Transform Geometry","Geometry"),
   C("Combine XYZ","Vector","Transform Geometry","Translation"),
   A("Instance on Points","instance on points","to the right of it"),
   C("Mesh Line","Mesh","this Instance on Points","Points") + ` (a second wire from the same output).`,
   C("Transform Geometry","Geometry","this Instance on Points","Instance"),
   C("the Combine XYZ from the spiral step","Vector","this Instance on Points","Rotation")
 ], why:`<b>Reuse:</b> a field is a recipe, so the same rotation can drive as many nodes as you like.`},

 {t:"Join and stress-test", goal:"The full stair in the output, driven by four sliders.", do:[
   A("Join Geometry","join","to just left of Group Output"),
   `Wire into Join Geometry's tall socket, one after the other: <b>treads</b> Instance on Points › Instances, <b>balusters</b> Instance on Points › Instances, <b>column</b> Transform Geometry › Geometry, <b>rail</b> Set Shade Smooth › Mesh.`,
   C("Join Geometry","Geometry","Group Output","Geometry"),
   `Properties → wrench: set Steps <code>40</code>, Turn <code>9</code> (grand atrium stair). Then Steps <code>16</code>, Turn <code>30</code> (tight tower stair).`
 ], see:`The treads, column, rail and balusters all move together.`}
],

/* ============================== L3 ============================== */
l3:[
 {t:"Draw a path", goal:"A winding Bezier curve about 20 m long.", do:[
   `<b>File → New → General</b>. Click the cube, ${K("Delete")}.`,
   `Mouse over the viewport: ${K("Shift","A")} → <b>Curve → Bezier</b>.`,
   `Press ${K("S")}, type <code>6</code>, press ${K("Enter")} (6× bigger).`,
   `Press ${K("Ctrl","A")} → <b>Scale</b>. This makes 1 unit = 1 metre again.`,
   `Press ${K("Tab")} for Edit Mode. Click the <b>dot at one end</b> of the curve (the middle dot of that end's handle, not the handle tips).`,
   `Press ${K("E")}, move the mouse to pull out a new point, left-click. Repeat 3–4 times, turning a bit each time, to make a winding path.`,
   `Press ${K("Tab")} to go back to Object Mode.`
 ], why:`<b>Apply scale</b> so a spacing of 1.5 in the nodes really means 1.5 m between posts.`},

 {t:"Geometry Nodes on the curve", goal:"A tree whose Group Input Geometry is your curve.", do:[
   `With the curve still selected, click the <b>Geometry Nodes</b> tab → <b>New</b>.`,
   `Drag Group Output far to the right.`
 ], see:`The curve looks the same. Group Input › Geometry <i>is</i> the curve, so the tool will work on any curve you put it on.`},

 {t:"Points along the curve", goal:"A point every 1.5 m, with a direction.", hl:{g:0,n:["gi","c2p"]}, do:[
   `${K("Shift","A")} → type <code>curve to points</code> → click <b>Curve to Points</b>, and drop it <u>onto the wire</u> between Group Input and Group Output so it splices in.`,
   D("Curve to Points","Count","Length"),
   `Press and hold on the dot left of Curve to Points' <b>Length</b> input, drag to Group Input's <b>empty hollow dot</b>, let go.`,
   `${K("N")} → Group tab → double-click the new item, rename it <code>Post Spacing</code>, Default <code>1.5</code>, Min <code>0.3</code>.`,
   `Properties → <b>wrench</b> tab: the modifier's Post Spacing still shows <i>0.1 m</i> (the value it had when you dragged it out; a new Default doesn't change an existing modifier). Click it, type <code>1.5</code>, ${K("Enter")}.`,
   VW("Curve to Points") + ` In the Spreadsheet note the <b>rotation</b> column.`
 ]},

 {t:"A post that stands on its point", goal:"A 12 cm square post with its pivot at the bottom.", hl:{g:0,n:["pz","cube","hh","hz","tg"]}, do:[
   `N → Group tab → <b>+ → Input</b>, name <code>Height</code>, Type <b>Float</b>, Default <code>1.2</code>. Then Properties → <b>wrench</b> tab → type <code>1.2</code> into the modifier's Height too (it starts at 0; a Default only applies to modifiers added later).`,
   A("Cube","cube","to below Curve to Points"),
   A("Combine XYZ","combine xyz","to the left of the Cube"),
   V("Combine XYZ","X","0.12"), V("Combine XYZ","Y","0.12"),
   C("Group Input","Height","Combine XYZ","Z"),
   C("Combine XYZ","Vector","Cube","Size"),
   A("Math","math","to below that Combine XYZ"),
   D("Math","Add","Multiply"),
   C("Group Input","Height","Multiply","Value (top)") + ` Bottom stays 0.5.`,
   A("Combine XYZ","combine xyz","to the right of Multiply"),
   C("Multiply","Value","this Combine XYZ","Z"),
   A("Transform Geometry","transform geometry","to the right of the Cube"),
   C("Cube","Mesh","Transform Geometry","Geometry"),
   C("the Z-only Combine XYZ","Vector","Transform Geometry","Translation")
 ]},

 {t:"Posts follow the path", goal:"Posts on every point, facing along the curve.", hl:{g:0,n:["iop"]}, do:[
   A("Instance on Points","instance on points","to the right of Curve to Points"),
   C("Curve to Points","Points","Instance on Points","Points"),
   C("Transform Geometry","Geometry","Instance on Points","Instance"),
   C("Curve to Points","Rotation","Instance on Points","Rotation") + ` (Curve to Points' fourth output).`,
   C("Instance on Points","Instances","Group Output","Geometry"),
   `Test: select the curve, ${K("Tab")}, move a point with ${K("G")}, ${K("Tab")} back. The posts follow.`
 ]},

 {t:"Weathered lean", goal:"Each post tilted a tiny random amount.", hl:{g:0,n:["rvv","rr"]}, do:[
   A("Random Value","random value","to above Instance on Points"),
   D("Random Value","Float","Vector"),
   `<b>Type</b> Min: X <code>-0.06</code>, Y <code>-0.06</code>, Z <code>0</code>.`,
   `<b>Type</b> Max: X <code>0.06</code>, Y <code>0.06</code>, Z <code>0</code>.`,
   A("Rotate Rotation","rotate rotation","between Random Value and Instance on Points"),
   C("Curve to Points","Rotation","Rotate Rotation","Rotation (top)"),
   C("Random Value","Value","Rotate Rotation","Rotate By"),
   C("Rotate Rotation","Rotation","Instance on Points","Rotation") + ` This replaces the direct wire from Curve to Points.`
 ], why:`<b>Rotate Rotation</b> stacks one rotation on another: the curve direction plus a small random tilt.`},

 {t:"Rails", goal:"Two flat rails swept along the curve.", hl:{g:1,n:["rs","q","c2m","t1","t2","j"]}, do:[
   A("Resample Curve","resample","to empty space below everything, near Group Input"),
   C("Group Input","Geometry","Resample Curve","Curve") + ` (a second wire from the same output).`,
   D("Resample Curve","Count","Length"),
   V("Resample Curve","Length","0.25","0.1 m"),
   A("Quadrilateral","quadrilateral","to below Resample Curve"),
   V("Quadrilateral","Width","0.04","2 m"), V("Quadrilateral","Height","0.12","2 m"),
   A("Curve to Mesh","curve to mesh","to the right of both"),
   C("Resample Curve","Curve","Curve to Mesh","Curve"),
   C("Quadrilateral","Curve","Curve to Mesh","Profile Curve"),
   `Tick <b>Fill Caps</b>.`,
   A("Transform Geometry","transform geometry","to the right of Curve to Mesh, upper"),
   A("Transform Geometry","transform geometry","to below the first one"),
   C("Curve to Mesh","Mesh","first Transform","Geometry"), C("Curve to Mesh","Mesh","second Transform","Geometry"),
   V("first Transform","Translation Z","0.95"), V("second Transform","Translation Z","0.45"),
   A("Join Geometry","join","to just left of Group Output"),
   `Wire into Join Geometry's tall socket: Instance on Points › Instances, first Transform › Geometry, second Transform › Geometry.`,
   C("Join Geometry","Geometry","Group Output","Geometry")
 ], pro:`<b>Rail lying flat?</b> Swap the Width and Height numbers on the Quadrilateral. The profile turns with the curve.`},

 {t:"Make some ground (with what you learned in Lesson 1)", goal:"A hilly Ground object.", do:[
   `Mouse over the viewport: ${K("Shift","A")} → <b>Mesh → Grid</b>.`,
   `A small <b>Add Grid</b> panel appears at the bottom-left of the viewport. Click it to open, set X Subdivisions <code>60</code>, Y Subdivisions <code>60</code>, Size <code>30</code>.`,
   `Press ${K("F2")}, type <code>Ground</code>, ${K("Enter")}.`,
   `With Ground selected, in the node editor click <b>New</b> (Ground gets its own tree).`,
   `Splice in <b>Set Position</b> between Group Input and Group Output, then build the hills exactly as in Lesson 1 step 4: Noise Texture (Scale 0.15) → Math Subtract 0.5 → Math Multiply 3 → Combine XYZ Z → Set Position Offset.`,
   `Click the fence curve in the viewport again. The node editor switches back to the fence tree.`
 ]},

 {t:"Bring the ground into the fence tree", goal:"A Ground picker on the fence's modifier.", hl:{g:2,n:["gi","oi"]}, do:[
   A("Object Info","object info","to empty space above Curve to Points"),
   `On Object Info click the two-way switch <b>Original | Relative</b> → choose <b>Relative</b>.`,
   `Press and hold on the dot left of Object Info's <b>Object</b> input, drag to Group Input's empty hollow dot. Rename it <code>Ground</code> in N → Group.`,
   `Properties → wrench → on the fence modifier click the <b>Ground</b> field → pick <b>Ground</b>.`
 ], why:`<b>Relative</b> brings the ground into the fence's own space, so the positions line up even if the two objects sit in different places.`},

 {t:"Fire rays down at the ground", goal:"A Raycast that knows where the ground is under every point.", hl:{g:2,n:["pos","add","rc"]}, do:[
   A("Raycast","raycast","to the right of Object Info"),
   C("Object Info","Geometry","Raycast","Target Geometry"),
   A("Position","position","to below Object Info"),
   A("Vector Math","vector math","to the right of Position") + ` It stays on <i>Add</i>.`,
   C("Position","Position","Vector Math","Vector (top)"),
   V("Vector Math","bottom Vector's Z box","50"),
   C("Vector Math","Vector","Raycast","Source Position"),
   `Ray Direction already shows 0, 0, −1 (straight down). Leave it.`,
   V("Raycast","Ray Length","200","100 m")
 ]},

 {t:"Snap posts and rails to the ground", goal:"The fence drapes over the hills.", hl:{g:2,n:["sp","pts"]}, do:[
   `${K("Shift","A")} → <code>set position</code> → drop it <u>onto the wire</u> Curve to Points › Points → Instance on Points › Points.`,
   C("Raycast","Is Hit","that Set Position","Selection"),
   C("Raycast","Hit Position","that Set Position","Position"),
   `${K("Shift","A")} → <code>set position</code> again → drop it <u>onto the wire</u> Resample Curve → Curve to Mesh.`,
   C("Raycast","Is Hit","second Set Position","Selection"),
   C("Raycast","Hit Position","second Set Position","Position"),
   `Mouse over the viewport, click the fence curve, press ${K("G")} and move it around. The fence re-drapes as it moves.`
 ], why:`<b>One Raycast, two jobs:</b> it's a field, so each Set Position works it out on its own points.`}
],

/* ============================== L4 ============================== */
l4:[
 {t:"Open the fence and save a copy", goal:"A safe file to polish.", do:[
   `Open your Lesson 3 file. <b>File → Save As</b> → name <code>fence_tool.blend</code> → <b>Save As</b>.`,
   `Click the fence curve so its tree shows in the node editor.`
 ]},

 {t:"Tidy the graph", goal:"Labelled frames around Posts, Rails and Snap.", do:[
   `Left-drag a box over empty space around all the post nodes (Cube, Combine XYZs, Transform, Instance on Points) to select them.`,
   `Press ${K("Ctrl","J")}. A frame wraps them.`,
   `With the frame selected: ${K("N")} → <b>Node</b> tab → <b>Label</b> → type <code>Posts</code>.`,
   `Repeat for the rail nodes (<code>Rails</code>) and the Raycast nodes (<code>Snap</code>).`,
   `Messy long wire? Hold ${K("Shift")} and right-drag across it. A small dot (reroute) appears that you can drag to bend the wire.`
 ], why:`<b>Future you</b> opens this in six months. Frames are free documentation.`},

 {t:"Polish the inputs", goal:"Limits, tooltips and a Rails panel.", do:[
   `${K("N")} → <b>Group</b> tab. Click <i>Post Spacing</i> in the list. Below: <b>Min</b> <code>0.3</code>, <b>Max</b> <code>10</code>, <b>Description</b> <code>Distance between posts in metres</code> (this becomes the tooltip).`,
   `Click <i>Height</i>: Min <code>0.3</code>, Max <code>3</code>.`,
   A("Combine XYZ","combine xyz","to the left of the top rail's Transform Geometry"),
   C("Combine XYZ","Vector","top rail Transform","Translation"),
   V("this Combine XYZ","Z","0.95") + ` Type it <i>before</i> the next line: the new input copies this value onto the modifier.`,
   `Drag from the dot left of this Combine XYZ's <b>Z</b> to Group Input's empty dot. Rename it <code>Top Rail Height</code>.`,
   `Same for the low rail: new Combine XYZ → its Translation, type Z <code>0.45</code> first, then expose Z as <code>Low Rail Height</code>.`,
   `Check Properties → <b>wrench</b>: the two rail heights read 0.95 and 0.45. If one says 0, type the value there. A Default changed later doesn't update an existing modifier.`,
   `In the Group tab click <b>+ → Panel</b>, rename it <code>Rails</code>. Drag the two rail inputs in the list onto the Rails panel.`
 ], see:`On the modifier the rail sliders sit inside a folding <b>Rails</b> section.`},

 {t:"A post style dropdown", goal:"Square or Round posts, picked on the modifier.", hl:{g:0,n:["ms","cyl","cube","tg","gi"]}, do:[
   A("Menu Switch","menu switch","to between the post Cube and its Transform Geometry") + ` Its type already says <i>Geometry</i>.`,
   `With Menu Switch selected: ${K("N")} → <b>Node</b> tab → the item list shows <i>A</i> and <i>B</i>. Double-click A → <code>Square</code>, double-click B → <code>Round</code>.`,
   C("Cube","Mesh","Menu Switch","Square"),
   A("Cylinder","cylinder","to below the Cube"),
   V("Cylinder","Vertices","10","32"), V("Cylinder","Radius","0.07","1 m"),
   C("Group Input","Height","Cylinder","Depth"),
   C("Cylinder","Mesh","Menu Switch","Round"),
   C("Menu Switch","Output","post Transform Geometry","Geometry") + ` This replaces the Cube's direct wire.`,
   `Drag from the dot left of Menu Switch's <b>Menu</b> input to Group Input's empty dot. Rename it <code>Post Style</code>.`
 ], see:`Properties → wrench now has a <b>Post Style</b> dropdown: Square / Round.`},

 {t:"Store a 'wear' value on every post", goal:"Each post carries its own random number.", hl:{g:1,n:["st","rv","iop"]}, do:[
   `${K("Shift","A")} → <code>store named attribute</code> → drop it <u>onto the wire</u> posts' Instance on Points › Instances → Join Geometry.`,
   `Its first dropdown says <i>Float</i>, so leave it. Second dropdown <i>Point</i> → choose <b>Instance</b>.`,
   `Click the empty <b>Name</b> box, type <code>wear</code>, ${K("Enter")}.`,
   A("Random Value","random value","to below Store Named Attribute") + ` Leave Float, Min 0, Max 1.`,
   C("Random Value","Value","Store Named Attribute","Value"),
   `Check: ${K("Ctrl","Shift")}-click Store Named Attribute. In the Spreadsheet's left column click <b>Instances</b>. A <code>wear</code> column is there.`
 ]},

 {t:"A material that reads 'wear'", goal:"Every post a slightly different wood colour.", hl:{g:2,n:["at","ramp","bsdf","mo"]}, do:[
   `Properties → the red-sphere <b>Material</b> tab → <b>New</b>. Double-click the name and type <code>FenceWood</code>.`,
   `${K("Shift","A")} → <code>set material</code> → drop it <u>onto the wire</u> Join Geometry → Group Output. Click its Material box → pick <b>FenceWood</b>.`,
   `Click the <b>Shading</b> workspace tab at the top. The bottom panel shows Principled BSDF → Material Output.`,
   `Mouse over that bottom panel: ${K("Shift","A")} → <code>attribute</code> → click <b>Attribute</b> → drop it on the left.`,
   `On Attribute: <b>Type</b> dropdown <i>Geometry</i> → <b>Instancer</b>. Click <b>Name</b> → type <code>wear</code>.`,
   `${K("Shift","A")} → <code>color ramp</code> → drop it between Attribute and Principled BSDF.`,
   C("Attribute","Factor","Color Ramp","Factor"),
   C("Color Ramp","Color","Principled BSDF","Base Color"),
   `On the Color Ramp click the <b>left</b> marker under the colour bar, then the colour box below → pick a fresh brown. Click the <b>right</b> marker → pick a weathered grey.`,
   `Mouse over the viewport, press ${K("Z")} → <b>Material Preview</b>.`
 ], pro:`<b>All posts the same colour?</b> In the fence tree add <b>Realize Instances</b> just before Set Material, and switch the Attribute node's Type to <b>Geometry</b>.`},

 {t:"A drag handle for Height", goal:"An arrow in the viewport that changes the fence height.", do:[
   `Back to the <b>Geometry Nodes</b> tab, fence curve selected.`,
   A("Linear Gizmo","linear gizmo","to next to Group Input"),
   C("Group Input","Height","Linear Gizmo","Value") + ` Direction already shows 0, 0, 1 (up). Leave its Transform output unwired.`,
   `In the viewport, with the fence selected, drag the arrow that appears.`
 ], pro:`<b>No arrow?</b> In the viewport's top-right header, make sure the <b>Show Gizmo</b> toggle (arrow icon) is on.`},

 {t:"Make it an asset", goal:"Fence Tool in the Add Modifier menu of any file.", do:[
   `In the node editor's top bar, double-click the tree name (e.g. <i>Geometry Nodes</i>) → type <code>Fence Tool</code> ${K("Enter")}.`,
   `${K("N")} → <b>Group</b> tab → <b>Usage</b>: make sure <b>Modifier</b> is ticked.`,
   `In the Outliner (top-right panel) click the <b>Display Mode</b> dropdown at its top → <b>Blender File</b>. Open <b>Node Groups</b> → right-click <b>Fence Tool</b> → <b>Mark as Asset</b>.`,
   `<b>Edit → Preferences → File Paths → Asset Libraries</b> → <b>+</b> → choose a folder (e.g. <code>Documents\\BlenderAssets</code>). Close Preferences.`,
   `<b>File → Save As</b> into that folder.`,
   `Test: <b>File → New → General</b>, add a Bezier curve, Properties → wrench → <b>Add Modifier</b> → find <b>Fence Tool</b> (under its catalog, or <i>Unassigned</i>).`
 ]},

 {t:"Get it into Unreal", goal:"A plain mesh copy exported as FBX.", do:[
   `Object Mode, click the fence curve. Press ${K("Shift","D")}, then right-click once (the copy stays in place).`,
   `Top menu <b>Object → Convert → Mesh</b>. The copy is now an ordinary mesh with everything baked in.`,
   `<b>File → Export → FBX (.fbx)</b>. On the right tick <b>Limit to: Selected Objects</b>. Click <b>Export FBX</b>.`,
   `In Unreal: Content Browser → <b>Import</b> → pick the .fbx → Import. Drag it into the level.`
 ], why:`<b>Keep the live original.</b> The converted copy is a bake. Change the curve later, convert again, export again. Unreal never runs Blender's nodes.`}
]
};

const COURSE = {
  title: "Geometry Nodes Fast Track",
  blender: "5.3"
};

const LESSONS = [
/* ---------------------------------------------------------------- L1 */
{
  id:"l1", num:1, short:"Slope-aware scatter",
  title:"Build a terrain that dresses itself",
  kick:"Lesson 1 · Fields, points and instances",
  time:"45–60 min",
  intro:`From an empty plane you'll grow a 20 m hillside, then make Blender decide by itself where grass grows (flat ground) and where rocks pile up (steep slopes). The rocks are modelled by nodes too, so no outside assets. This is the same idea that drives foliage and debris placement on big open-world maps.`,
  use:`<b>Used for:</b> open-world foliage and debris scatter, cliff-face rubble, set dressing that updates the moment the terrain changes.`,
  learn:["Geometry flow","Fields (diamond sockets)","Viewer + Spreadsheet","Normal-based masks","Distribute Points on Faces","Poisson Disk","Instance on Points","Exposing parameters"],
  concepts:[
    {h:"Geometry flows left → right", p:"Teal sockets carry whole geometry (a mesh, curves, points or instances). Every node takes geometry in, changes it, and passes it on. The Group Output is what the modifier puts in the viewport."},
    {h:"Fields are recipes, not values", p:"A diamond socket holds a <i>field</i>: a little formula that gets worked out once per element (vertex, face, point…). <code>Normal</code> has no value on its own. It gets one for each face of whatever geometry the node it feeds is working on."},
    {h:"Context decides the answer", p:"The same Noise Texture gives hills when it feeds the terrain's Set Position, and bumpy rocks when it feeds the rock's Set Position. The geometry socket of the node that <i>uses</i> the field decides what it is evaluated on."},
    {h:"Instances are cheap copies", p:"Instance on Points doesn't copy meshes. It stores 'put rock #1 here, rotated like this'. Ten thousand rocks cost almost nothing until you Realize them."}
  ],
  graphs:[
    {title:"Graph A: terrain from a Grid", hint:"Set Position + noise = hills", w:1090, h:330,

  steps:STEPS.l1,
  check:`<b>You should have:</b> a 20 m hilly terrain, grass only on gentle ground, separated rocks only on steep ground that lean with the slope, and modifier sliders that rebuild it instantly. Spreadsheet → <b>Instances</b> shows thousands of instances while the file stays light.`,
  cards:[
    ["What does a diamond-shaped socket mean?","It carries a <b>field</b>: a formula worked out once per element (vertex, face, point…) on the geometry of the node it plugs into."],
    ["The same Noise node makes hills on the terrain and lumps on the rock. Why?","Field context: a field is evaluated on the geometry of the node that <b>uses</b> it. Terrain Set Position → terrain vertices. Rock Set Position → sphere vertices."],
    ["How do you preview the output of any node?","<kbd>Ctrl</kbd><kbd>Shift</kbd> + click it (Viewer node), then read the Spreadsheet. For a <b>field</b> node, Ctrl+Shift+click the geometry node first, then drag the field onto the Viewer's empty dot (5.3 shows a field only on a geometry above it)."],
    ["Which output of Distribute Points on Faces lines instances up with the surface?","<b>Rotation</b> (it's built from the face normal)."],
    ["Random vs Poisson Disk distribution?","Random only uses density and can clump. Poisson Disk keeps a <b>minimum distance</b> (Distance Min) between points, with Density Max as a cap. Use it for anything that must not overlap."],
    ["What does Normal Z ≈ 1 mean? And 0.85?","1 = facing straight up (flat ground). It's the cosine of the slope: 0.85 ≈ 32°, 0.92 ≈ 23°."],
    ["How do you turn a node's value into a modifier slider?","Drag its input socket onto the <b>empty socket</b> of the Group Input node, then rename it in N → Group."],
    ["Instances vs Realize Instances?","Instances = many references to one mesh (cheap). <b>Realize Instances</b> turns them into real, separate geometry (needed before editing their vertices; costs memory)."],
    ["Why subtract 0.5 from the noise before scaling?","Noise Factor sits around 0.5. Centring it on 0 makes Height go both up and down around Z = 0."],
    ["Fastest way to put a node in the middle of a chain?","Drop it onto the existing link (it highlights) and it splices itself in."]
  ],
